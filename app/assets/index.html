 *   · 明暗           → 由这个系数统一控制（深度滑块）
 *
 * ---- 系数怎么算 ----
 * 取"该材质的主色（前 25% 最饱和像素均值）"当作代表色，
 * 套一遍纯色方案里的完整变换（压暗 + 亮度上限），
 * 再取"变换后 / 变换前"的亮度比当系数。
 * 这样深度滑块的行为和纯色模式**完全一致**（同样压暗同样的比例），
 * 只是作用对象从"一个颜色"变成"一整张贴图"。
 */
function outlineTextureTintFor() {
  /* ★★★ 贴图模式下的深度 = 纯参数，不需要任何取色（2026-10-17 卡死修复）★★★
     ---- 事故复盘（实测"你写 HANDOVER 的时候模型突然又冻结了"）----
     上一版为了"让深度滑块在贴图模式下也按同样比例压暗"，
     先算该材质的**主色**，再套 toOutlineShade，取亮度比。
     可是算主色要：uvCoverageOf（逐三角形光栅化 128×128）+ canvas getImageData
     （每材质 16384 像素）+ 排序。13 个材质就是几十万次运算，
     **全都跑在渲染主线程上、同步执行**。
     而拖滑块时 `refreshAutoOutlineColors` 会被连续调用（每次 input 一次），
     每次都 clearTextureColorCache 重算 → 主线程被长时间占满
     → 心跳（setInterval）和渲染循环一起停摆 → **画面冻结**，
     而且连"看门狗"自己也是 setInterval，一起停了，救不了自己。
     ---- 结论 ----
     **方案 A 根本不需要取色**：描边显示的就是贴图本身，颜色由贴图提供。
     我们只需要一个"整体染色倍数"控制明暗，而它完全由深度参数决定：
         f = 1 - 0.75 × 深度/100
     与"主色"毫无关系（乘法的性质：无论原色多亮，乘同一个 f 都是等比压暗）。
     → 现在这个函数是 **O(1) 纯算术**，不再读任何像素。
     ★ 这是本轮最重要的教训：**改方案后要回头删掉为旧方案服务的昂贵计算**，
       否则它会变成"没人需要但仍然每帧/每次拖动都在跑"的性能黑洞。 */
  const k = outlineDepthFactor(OUTLINE_DEPTH);
  return Math.max(0.15, Math.min(1.0, 1 - 0.75 * k));
}

/** 计算某个源材质的"跟随模型"描边色（含回退链）。 */
function autoOutlineColorOf(srcMat, fallback, geo) {
  try {
    const dbg = window.__outlineDump && ((autoOutlineColorOf._d = (autoOutlineColorOf._d || 0) + 1) <= 16);
    const hasMap = !!(srcMat && srcMat.map);
    let uvinfo = null, shade = null, why = '';
    if (hasMap) {
      uvinfo = geo ? uvBoundsOf(geo) : null;
      shade = toOutlineShade(averageTextureColor(srcMat.map, uvinfo));
      if (!shade) why = '取色NULL';
    } else why = '无map';
    if (dbg) nlog('autoColor: map=' + (hasMap ? 'y' : 'N') + ' geo=' + (geo ? 'y' : 'n')
      + ' uv=' + (uvinfo ? ('hits' + uvinfo.hits + (uvinfo.hit ? '/grid' : '/bb')) : 'null')
      + ' -> ' + (shade ? toHexColor(shade) : 'FALLBACK') + (why ? ' (' + why + ')' : ''));
    if (shade) return shade;
  } catch (e) {
    if (window.__outlineDump) nerr('autoColor 异常: ' + (e && e.message));
  }
  return fallback || [0, 0, 0];
}

/* ---------------------------------------------------------------- 颜色工具 */

/** '#abc' / '#aabbcc' / 'aabbcc' → [r,g,b]（0~1）；非法返回 null。 */
function parseHexColor(h) {
  const s = String(h == null ? '' : h).trim().replace(/^#/, '');
  const hx = c => parseInt(c, 16) / 255;
  if (/^[0-9a-f]{3}$/i.test(s)) {
    return [hx(s[0] + s[0]), hx(s[1] + s[1]), hx(s[2] + s[2])];
  }
  if (/^[0-9a-f]{6}$/i.test(s)) {
    return [hx(s.slice(0, 2)), hx(s.slice(2, 4)), hx(s.slice(4, 6))];
  }
  return null;
}

/** [r,g,b]（0~1）→ '#aabbcc'。 */
function toHexColor(c) {
  let out = '#';
  for (let i = 0; i < 3; i++) {
    let v = Math.max(0, Math.min(255, Math.round((c ? c[i] : 0) * 255))).toString(16);
    if (v.length < 2) v = '0' + v;
    out += v;
  }
  return out;
}

/**
 * 设置描边颜色。
 * @param hex '#rrggbb' / '#rgb'；传 'auto' / 空 → 回到"跟随模型自带颜色"。
 * @return 生效的十六进制字符串，或 'auto'；参数非法时返回 null（调用方据此提示）。
 */
window.__setOutlineColor = function (hex) {
  const raw = String(hex == null ? '' : hex).trim();
  const isAuto = (raw === '' || /^auto$/i.test(raw) || /^默认$/.test(raw));
  if (isAuto) {
    OUTLINE_COLOR = null;
  } else {
    const c = parseHexColor(raw);
    if (!c) return null;                     // 非法 → 不改变现状
    OUTLINE_COLOR = c;
  }
  /* ★★★ auto 时【必须重新计算贴图取色】，不能只还原 __baseColor ★★★
     ---- 事故复盘（实测"还是灰色""初始化时似乎看见有（正确颜色）"）----
     启动时序是：
         1) buildOutlines()            → 材质先用 fallback/初值
         2) applySettings → __setOutlineColor('auto')
         3) refreshAutoOutlineColors('late') → 算出真正的贴图色（#feedcb / #da5745 …）
     而第 2 步走的是 `const c = OUTLINE_COLOR ? OUTLINE_COLOR : base;`
     —— 它拿 `m.userData.__baseColor` 还原，可是那时 `__baseColor` 还是
     **构建时的旧值**（还没被第 3 步更新）→ 把刚算好的彩色又刷回灰色。
     用户看到的"初始化时有一瞬间是对的，然后变灰"就是这个。
     （实测抓包：`★outline色被改 setRGB(0.53,0.47,0.43) @ __setOutlineColor`
        —— 那次写入的来源就是这里。）
     ---- 修法 ----
     auto 时直接调用 autoOutlineColorOf() 现算（内部有缓存，开销极小），
     并把结果写回 __autoColor / __baseColor，保证两个字段永远是同一份真值。 */
  for (const o of outlineMats) {
    try {
      const m = o.mat;
      let c;
      if (OUTLINE_COLOR) {
        c = OUTLINE_COLOR;
      } else {
        const op = (o.src && o.src.userData) ? o.src.userData.outlineParameters : null;
        c = autoOutlineColorOf(o.src, (op && op.color) ? op.color : [0, 0, 0], o.geo);
        m.userData.__baseColor = c.slice();
        m.userData.__autoColor = c.slice();
      }
      /* ★ 必须声明 SRGBColorSpace（见 toOutlineShade 顶部的长注释）：
         我们算出来的是 **sRGB** 像素值，而 Color.setRGB 默认按 **linear** 解释。 */
      m.color.setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
      m.needsUpdate = true;
    } catch (e) {}
  }
  /* 同步输入框与色块 */
  try {
    const inp = $('cOutlineColor'), sw = $('swOutline');
    const shown = OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto';
    if (inp && document.activeElement !== inp) inp.value = shown;
    if (sw) sw.style.background = OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : '#9a9aa2';
  } catch (e) {}
  nlog('outline 颜色 -> ' + (OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto(跟随模型)'));
  return OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto';
};


/** 开关描边。 */
window.__setOutline = function (on) {
  OUTLINE_ON = !!on;
  nlog('outline -> ' + OUTLINE_ON);
  buildOutlines();
  return OUTLINE_ON;
};

/** 设置描边宽度 0~100。 */
let _ocRebuildTimer = null;
window.__setOutlineWidth = function (w) {
  const x = parseFloat(w);
  if (!isFinite(x)) return OUTLINE_W;
  OUTLINE_W = Math.max(0, Math.min(100, Math.round(x)));
  const t = outlineLocalThickness();
  if (!isGltfModel) {
    /* ★ MMD：外扩在 shader 里，改 uniform 即可 —— 实时、零重建（与旧版完全一致） */
    for (const o of outlineMats) {
      try { if (o.mat.userData.__u) o.mat.userData.__u.value = t * o.k; } catch (e) {}
    }
    nlog('outline 宽度 -> ' + OUTLINE_W + '（局部厚度 ' + t.toFixed(4) + '，uniform 实时）');
    return OUTLINE_W;
  }
  nlog('outline 宽度 -> ' + OUTLINE_W + '（局部厚度 ' + t.toFixed(4) + '）');
  /* ★ glTF：烘焙方案下"改宽度"= 重新生成顶点数组 → 必须重建。
     滑块会连续触发（实测一次拖动发出几十次），所以做 150ms 防抖：
     拖动过程中不动，停手后重建一次。 */
  if (_ocRebuildTimer) clearTimeout(_ocRebuildTimer);
  _ocRebuildTimer = setTimeout(function () {
    _ocRebuildTimer = null;
    try { buildOutlines(); } catch (e) {}
  }, 150);
  return OUTLINE_W;
};

/**
 * 每帧同步描边与源网格。
 *
 * ★ 描边 mesh 挂在【独立 outlineRoot】（恒等变换）下、matrixAutoUpdate=false，
 *   用自己的 matrix 直接存【世界矩阵】→ 源网格怎么动，描边就怎么跟。
 *   （曾经挂在源网格父级下靠局部变换跟随，但那样就把描边塞进了 model，
 *     会被 model 上的多处 traverse 误处理 —— 见 buildOutlines 里的说明。）
 * ★ 【表情权重】必须手动复制：morphTargetInfluences 挂在 mesh 上而不是
 *   geometry 上，不复制的话"表情动、描边不动"。
 */
function updateOutlineTransform() {
  if (!outlineRoot || !model) return;
  try {
    for (const o of outlineRoot.children) {
      if (!o.userData || !o.userData.__outline) continue;
      const src = o.userData.__src;
      if (!src) continue;
      /* ① 表情权重 —— glTF 的 morph 是顶点形变，权重挂在 mesh 上 */
      if (o.morphTargetInfluences && src.morphTargetInfluences) {
        const a = src.morphTargetInfluences, b = o.morphTargetInfluences;
        const nn = Math.min(a.length, b.length);
        for (let i = 0; i < nn; i++) b[i] = a[i];
      }
      /* ② 每帧同步【世界矩阵】——
         描边 mesh 挂在 outlineRoot（恒等变换）下且 matrixAutoUpdate=false，
         所以它的 matrixWorld 就等于这里写的 matrix。
         源网格的世界矩阵会随模型自转 / 朝向 / 漫游转身 / 归一化缩放而变，
         不同步的话描边会脱开（表现是"描边留在原地、模型走了"）。 */
      o.matrix.copy(src.matrixWorld);
      o.matrixWorldNeedsUpdate = true;
    }
  } catch (e) {}
}

/* ============================================================
   VMD 动作系统
   ------------------------------------------------------------
   把导入的 .vmd 动作绑定到各种触发时机：
     idle(待机循环) / walk(走路循环) / touchHead / touchBody / touchFeet / greet
   另外支持「待机随机表演」（原生定时触发，页面从动作池里随机抽一个播一次）。

   ★ 为什么要借 MMDAnimationHelper（而不是自己写）：
     VMD 的走路/跑步动作大量依赖【足ＩＫ】—— 腿骨是由 IK 解算出来的；
     不跑 CCDIKSolver 的话上半身在动、下半身僵着。PMX 还有「付与(grant)」
     （腕捩等）。这两块 MMDAnimationHelper 里是现成且久经考验的，
     所以借它的 IK + grant；**物理仍旧由我们自己管**
     （传 physics:false，不创建它的 MMDPhysics，避免和 §14.2 那套顺序打架）。

   ★★ 三个"踩过才知道"的关键点 ★★

   ① 动作剪辑必须【按模型】拟合。
      loadAnimation(url, model) 会按模型的骨骼/表情字典过滤轨道；
      换模型后必须重建，否则一条轨道都绑不上。

   ② ★★★ 建剪辑之前必须把骨骼复位到 rest pose ★★★
      MMDLoader.buildSkeletalAnimation 里这么算位置：
          const basePosition = mesh.skeleton.getBoneByName(key).position.toArray();
          positions.push(basePosition[j] + position[j]);
      ——它用的是【模型当前的骨骼位置】当基准！
      如果建剪辑时骨骼还被上一个动作扭着，那份歪掉的姿态就会被
      **永久烘进新剪辑**。表现：试播了 A 再去试播 B，B 也是歪的；
      甚至换成一个正常的动作还是歪的（2026-10-06）。
      修法：建剪辑前 `model.pose()`（从 boneInverses 反推回绑定姿态）。

   ③ 一个插槽里选多个动作时，不能把它们的轨道【合并】成一个剪辑。
      同一个骨骼的轨道被两个动作各写一遍、再按帧号排序 → 关键帧互相穿插
      → 姿态彻底乱掉。正确做法是【每个动作各建一个 Action 同时播放】：
        · 动作 + 表情（Motion + Morph）→ 各管各的轨道，互不干扰，完美
        · 两个全身动作 → 权重各 1，被 AnimationMixer 归一化成各 50% 混合
      （导入时 <名字>_Motion.vmd + <名字>_Morph.vmd 已自动合并，所以
        平常一个插槽只放一个文件就够。）

   ★ 轨道名形态（实测 three r150）：`.bones[上半身].position` /
     `.morphTargetInfluences[3]`。锁根骨骼位移时要按这个形态解析骨骼名。
   ============================================================ */

const VMD_SLOT_KEYS = ['idle', 'walk', 'touchHead', 'touchBody', 'touchFeet', 'greet', 'drag',
                        'preview'];   // 'preview' 只给"试播某个 GLB 动作"用，不出现在配置界面
/** 一次性播放（播完回待机）的插槽。 */
/**
 * 一次性（点一次播一次）的槽位。
 * ★ drag 也在里面 —— 它同样用 LoopOnce + clampWhenFinished：
 *   "拿起"类动作（如蔚蓝档案的 Formation_Pickup）末帧就是"悬在半空"的姿态，
 *   clampWhenFinished 正好让模型在【整个拖拽期间】保持那个姿态，
 *   松手时再由 __vmdDragEnd() 淡出回待机 —— 这是最自然的"被拎起来"手感。
 */
const VMD_ONESHOT_SLOTS = { touchHead: 1, touchBody: 1, touchFeet: 1, greet: 1, drag: 1 };
/** 根骨骼候选：只有这些骨骼的位移才算「整体位移」。 */
const VMD_ROOT_BONES = ['全ての親', 'センター', 'グルーブ', 'ルート',
                        'root', 'Root', 'center', 'Center', 'Center2'];

const VMD_FADE_S = 0.32;          // 层与层之间的交叉过渡
const VMD_ONESHOT_IN_S = 0.16;    // 一次性动作淡入（要快，否则"点了半天没反应"）

const vmd = {
  cfg: null,
  cfgKey: '',              // 配置指纹，避免重复重建
  seq: 0,                  // 构建序号（并发守卫）
  model: null,             // 本轮剪辑是为哪个模型构建的
  helper: null,
  mixer: null,
  /** slot -> [AnimationAction...]（一个插槽可以有多个动作同时播放）。 */
  acts: {},
  /** slot -> 时长（取最长的那个，用于保险丝计时/界面显示）。 */
  durs: {},
  layer: 'idle',           // 当前主层：idle / walk / oneshot
  oneShotSlot: null,
  oneShotBackup: null,
  oneShotTimer: null,
  /** 顺序播放状态（overlay=false 且插槽里选了多个动作时用）。 */
  chain: null,
  /** 待恢复的骨骼姿态 + 恢复时间点（见 vmdDeferRestore 的说明）。 */
  restoreBuf: null,
  restoreAt: 0,
  walking: false,
  /** 走动方向：+1 往右 / -1 往左 / 0 不转（见 __setVmdWalking 的说明）。 */
  walkDir: 0,
  /** 目标朝向（-1 / 0 / +1），实际角度由 vmdApplyYaw 平滑插值过去。 */
  yawTarget: 0,
  /** 已经上报过"转向完成"的目标值（避免重复打日志）。 */
  yawApplied: 99,
  appliedYaw: 0,
  spinForced: false,
  spinPrev: null,
  lastErr: '',
  /** 请求去重（防"点一下播两次"）+ 诊断序号。 */
  lastReqSlot: '',
  lastReqAt: 0,
  reqSeq: 0,
};

function vmdLog(m) { nlog('[vmd] ' + m); }
function vmdErr(m) { nerr('[vmd] ' + m); }

/** 某个插槽是否配了动作。 */
function vmdSlotReady(slot) {
  const l = vmd.acts[slot];
  return !!(l && l.length);
}

function vmdSlotActions(slot) {
  const l = vmd.acts[slot];
  return l ? l : [];
}

function vmdAnyRunning(slot) {
  for (const a of vmdSlotActions(slot)) if (a.isRunning()) return true;
  return false;
}

/* ---------------------------------------------------------------- 配置 */

/**
 * 原生下发配置。
 * ★ 这里必须做「指纹去重」：原生会在 页面就绪 / 模型就绪 / 设置改动 三个时机
 *   都会推一次，不去重就会反复重建剪辑（白解码几 MB 动作文件）。
 */
window.__setVmdConfig = function (json) {
  let cfg;
  try {
    cfg = (typeof json === 'string') ? JSON.parse(json) : json;
  } catch (e) {
    vmdErr('config parse failed: ' + e.message);
    return;
  }
  if (!cfg || typeof cfg !== 'object') return;
  const key = JSON.stringify(cfg);
  if (key === vmd.cfgKey && vmd.model === model) {
    vmdLog('config unchanged, skip rebuild');
    return;
  }
  vmd.cfgKey = key;
  vmd.cfg = cfg;
  vmdLog('config: enabled=' + !!cfg.enabled
    + ' slots=' + VMD_SLOT_KEYS.map(k => k + ':' + ((cfg.slots && cfg.slots[k]) || []).length).join(' ')
    + ' rootLock=' + !!cfg.rootLock + ' pool=' + ((cfg.pool || []).length));
  vmdRebuild('config');
};

/* ---------------------------------------------------------------- 复位 */

/**
 * 把骨骼恢复到绑定姿态（rest pose）。
 * ★ 为什么必须做：见文件头 ② 的说明 —— 否则 MMDLoader 会把"当前歪掉的
 *   骨骼位置"当成基准烘进新剪辑，导致后续所有动作都是歪的。
 */
function vmdResetPose() {
  try {
    if (!model) return;
    /* ★★★ glTF：必须用加载时采集的 glbRestPose 复位，【绝不能】用 Skeleton.pose() ★★★
       ---- 为什么（2026-10-07 实测，这就是"头发横向炸开 / 身后东西乱飘"的根因）----
       `SkinnedMesh.pose()` 走的是 `Skeleton.pose()`：它用 `boneInverses`
       （= glTF 的 inverseBindMatrices）反推【绑定姿态】，然后**全量覆盖**
       bone 的 position / quaternion / scale。

       但这个 GLB（蔚蓝档案导出的）的 inverseBindMatrices 与 node 默认 TRS
       **根本不是同一套姿态**（实测 boneMatrix 与单位阵最大偏差 = 2.0，即差 90°）：
         · bind pose      = Z-up 的建模姿态（Bip001 Head 在 z = 0.652）
         · node 默认 TRS  = 导出后"应当显示"的姿态（Y-up）
       `boneMatrix = nodeWorld × IBM` 那个 90° 旋转就是"把模型立起来"用的。

       更致命的是：47 根 hair/skirt 骨骼里有 **22 根在所有 32 个动作里都只有
       rotation 轨道、没有 translation 轨道**（导出器把静止的位移省掉了）——
       它们的 `position` 永远不会被动画写，于是永远停在 `pose()` 写下的那个
       【Z-up 的 bind pose 位置】→ 相对头骨的方向整个错掉
       → 表现就是"头发横向炸开成两片、身后有东西乱飘"。

       正解：glTF 用 `glbRestPose`（加载时、任何动画播放之前采集的 node TRS）复位。
       这也解释了为什么用户勾"冻结为绑定姿态"反而看起来正常 ——
       `applyGlbRestPose()` 写的正是 node TRS，不是 Skeleton.pose() 的 bind pose。 */
    if (isGltfModel) {
      applyGlbRestPose();
      return;
    }
    /* ★★★ 2026-10-17：这里原来调 `model.pose()` —— 那是震荡的第二个来源 ★★★
       ---- 为什么不能再用 pose() ----
       本函数是在**物理已经建好之后**才跑的（日志时序：
         12:45:24.739 物理初始化
         12:45:25.183 骨骼已复位到绑定姿态 ← 就是这里）
       而 `SkinnedMesh.pose()` 是**从 skeleton.boneInverses 反解**骨骼世界矩阵，
       不是"恢复 PMX 的绑定姿态"。boneInverses 是在归一化缩放之后算的，
       反解出的矩阵会把骨骼挪离原位（实测把它甩到 |pos|=126~233），
       还会 decompose 出非 1 的 bone.scale。
       于是：刚体仍停在自己该在的位置，骨骼被搬走 → **两者瞬间脱节**
       → 碰撞求解每帧猛推 → 自激震荡（真机 Δq = 43，单根跳 3.2）。
       ★ 离线复现台实测：有 pose() → Δq 114.5；去掉 → 1.25。

       ---- 正确做法 ----
       用 MMD 数据本身复位（本地位置 = mmd.bones[i].pos，旋转单位、缩放 1），
       确定、幂等、不依赖 boneInverses，且与物理刚体始终保持一致。
       （glTF 在上面的 isGltfModel 分支里已经 return，不会走到这。） */
    const nReset = resetBonesToBindPose(model);
    /* ★★★ 复位后必须让刚体跟着走（2026-10-17）★★★
       ---- 事故复盘 ----
       本函数在**物理已经建好并 warmup 过之后**才会跑（启动时序实测：
           24.530 建物理#1 → 24.739 建物理#2 → 25.183 本函数复位骨骼）
       此时物理里的骨头已经按 warmup 后的姿态收敛（头发已下垂），
       而这里把**骨骼**硬拉回绑定姿态 → 刚体与骨骼瞬间错开一大截
       → 下一帧碰撞/约束猛拽 → 姿态被甩到 180° 外（实测"头发飞到脸上，偏了180度"）。
       而"随便做一个动作就好"：VMD 重写骨骼，物理重新收敛。
       → 正解：复位骨骼后立刻 `physics.reset()`，把刚体也摆到骨骼位置，
         两者从同一个姿态重新开始；同时清掉累积器，别补算这段时间。 */
    if (physics && nReset >= 0) {
      try {
        physics.reset();
        _physAccum = 0;
        vmdLog('骨骼复位后已同步刚体（physics.reset），避免刚体/骨骼错位');
      } catch (e) { nerr('复位后 reset 物理失败: ' + (e && e.message)); }
    }
    if (nReset >= 0) {
      vmdLog('骨骼已复位到 MMD 绑定姿态：' + nReset + ' 根（用数据复位，不用 pose()）');
    } else {
      if (typeof model.pose === 'function') model.pose();
      model.updateMatrixWorld(true);
      vmdLog('骨骼已复位到绑定姿态（非 MMD，退回 pose()）');
    }
  } catch (e) {
    vmdErr('pose reset failed: ' + (e && e.message));
  }
}

/* ---------------------------------------------------------------- 构建 */

/**
 * 取 GLB 自带动作（id 形如 `glb:<clipName>`）。
 *
 * ★ 必须 clone：后面 vmdLockRootMotion / vmdTrimToFirstLoop 会【直接改
 *   clip.tracks[].values 和 clip.duration】—— 不 clone 的话原动作会被永久改掉，
 *   第二次用到同一个动作时数据已经不对了（而且下次加载模型也是坏的）。
 */
/**
 * 给 GLB 动作补上"缺失骨骼"的静止姿态轨道。
 *
 * ★★ 为什么必须（实测"头发乱飞，东西乱飘"）★★
 *   AnimationMixer 只写"轨道里有的"骨骼；一个动作没覆盖的骨骼会
 *   保留上一个动作的姿态。这个模型 151 根骨骼，而每个动作只覆盖
 *   ~115 根 → 剩下 36 根会累积残留 → 切几次动作就乱飞。
 *
 * 做法：对"被某个动作动过（glbAnimTargets）但本动作没覆盖"的节点，
 *      加一条单关键帧轨道（值为静止姿态）。
 *      单帧轨道在整段时间内恒定 → 每次切动作都会被拉回静止姿态。
 */
function glbAddMissingTracks(clip) {
  try {
    if (!clip || !clip.tracks) return 0;
    const has = new Set();
    for (const t of clip.tracks) {
      const i = t.name.lastIndexOf('.');
      if (i > 0) has.add(t.name.slice(0, i));
    }
    const add = [];
    for (const nm of glbAnimTargets) {
      if (has.has(nm)) continue;
      const rest = glbRestPose[nm];
      if (!rest) continue;
      /* ★★ 位置 / 旋转 / 缩放【三个都要补】★★
         ---- 曾经只补 position+quaternion，注释还写着"scale 基本不动" —— 那是错的：
         实测各动作的 scale 通道数差异极大（Cafe_Reaction 有 50 条，Cafe_Idle 只有 14 条），
         也就是说"某个动作有 scale 轨道、另一个动作没有"是常态 → 后者会把前者的 scale
         残留下来（蔚蓝档案用 scale=0 隐藏部件，一旦残留就是"该藏的东西突然出现"）。
         三者都补才会每次切动作都回到静止值。 */
      add.push(new THREE.VectorKeyframeTrack(nm + '.position', [0], rest.p.slice()));
      add.push(new THREE.QuaternionKeyframeTrack(nm + '.quaternion', [0], rest.q.slice()));
      add.push(new THREE.VectorKeyframeTrack(nm + '.scale', [0], rest.s.slice()));
    }
    if (add.length) {
      for (const t of add) clip.tracks.push(t);
      vmdLog('GLB 补静止轨道: ' + (add.length / 3) + ' 根缺失骨骼（位置+旋转+缩放）');
    }
    return add.length;
  } catch (e) {
    nerr('glbAddMissingTracks failed: ' + (e && e.message));
    return 0;
  }
}

function vmdResolveGlbClip(id) {
  const nm = glbClipNameOf(id);
  if (!nm) return null;
  const c = glbClips[nm];
  if (!c) return null;
  try { return c.clone(); } catch (e) { return c; }
}

/**
 * 把 slot 的 id 列表变成 URL 数组（原生已编码好，这里只兜底）。
 *
 * ★★ MMD 与 glTF 的动作【分开存】，这里按模型类型取对应那一套 ★★
 * ---- 曾出现"我之前配置 mmd 的动作，用完 glb 再切回 mmd 就会消失" ----
 * 根因：两边共用同一份 slots，而选动作对话框确定时是 `clear() + addAll()`
 * （整个插槽被替换），GLB 模式下动作库只列 GLB 动作 → 一点确定就把
 * 该插槽里原来的 VMD 动作全删了。
 * → 后端拆成 `slots`（MMD）与 `slotsGlb`（glTF）两份，这里按 isGltfModel 选。
 * 再按前缀兜底过滤一次，保证不会去加载"不属于当前模型类型"的 id。
 */
function vmdSlotUrls(slot) {
  if (!vmd.cfg) return [];
  const table = isGltfModel ? (vmd.cfg.slotsGlb || {}) : (vmd.cfg.slots || {});
  const s = table[slot];
  if (!Array.isArray(s)) return [];
  return s.filter(u => typeof u === 'string' && u.length > 0
                    && (isGltfModel ? isGlbActionId(u) : !isGlbActionId(u)));
}

function vmdTeardown() {
  try {
    if (vmd.mixer) vmd.mixer.stopAllAction();
  } catch (e) {}
  vmd.mixer = null;
  vmd.helper = null;
  vmd.acts = {};
  vmd.durs = {};
  vmd.model = null;
  vmd.layer = 'idle';
  vmd.oneShotSlot = null;
  vmd.oneShotBackup = null;
  vmd.chain = null;
  vmd.layer = 'idle';
  vmd.restoreBuf = null;
  vmd.restoreAt = 0;
  vmd.walking = false;
  vmd.walkDir = 0;
  vmd.yawTarget = 0;
  vmd.yawApplied = 99;
  vmd.appliedYaw = 0;
  if (vmd.oneShotTimer) { clearTimeout(vmd.oneShotTimer); vmd.oneShotTimer = null; }
  if (model) { try { model.rotation.y = 0; } catch (e) {} }
}

/**
 * 重新构建全部动作剪辑。
 * 触发时机：收到配置 / 模型加载完成 / 换模型。
 */
async function vmdRebuild(reason) {
  const mySeq = ++vmd.seq;
  try {
    if (!model) { vmdLog('rebuild(' + reason + '): 模型还没好，等模型就绪后再建'); return; }
    /* ★★ 建剪辑前先复位骨骼（文件头 ② 的核心修复）。
       必须在 vmdTeardown 之后、loadAnimation 之前。 */
    vmdTeardown();
    vmdResetPose();
    if (!vmd.cfg || !vmd.cfg.enabled) {
      vmdLog('rebuild(' + reason + '): VMD 总开关关闭 -> 已复位到绑定姿态');
      return;
    }
    vmd.model = model;

    const loader = new MMDLoader();
    const loaded = {};                 // slot -> [clip...]
    let built = 0, failed = 0;

    for (const slot of VMD_SLOT_KEYS) {
      let urls = vmdSlotUrls(slot);
      if (!urls.length) continue;
      /* ★★ glTF 模型：VMD 文件对它无效，必须跳过 ★★
         ---- 为什么（实测堆栈）----
         切到 GLB 后，插槽里若还留着 VMD 路径，
         vmdRebuild 会拿 MMDLoader 去给 glTF 的 Group 建剪辑，
         在 `buildSkeletalAnimation` 里读 `mesh.skeleton.bones` → undefined → 崩。
         正确行为：glTF 只认 `glb:` 前缀的 id（模型自带动作）。 */
      if (isGltfModel) {
        const before = urls.length;
        urls = urls.filter(u => isGlbActionId(u));
        if (urls.length < before) {
          vmdLog('slot ' + slot + '：跳过 ' + (before - urls.length)
            + ' 个 VMD 动作（glTF 模型用自带动作，VMD 无效）');
        }
        if (!urls.length) continue;
      }
      const list = [];
      for (const url of urls) {
        let label = url;
        try {
          let clip = null;
          if (isGlbActionId(url)) {
            /* ---- GLB 自带动作（兼容 glb:xxx 与 /vmd/glb%3Axxx 两种写法）---- */
            label = 'GLB:' + (glbClipNameOf(url) || '?');
            clip = vmdResolveGlbClip(url);
            /* ★ 补上本动作没覆盖的骨骼（否则会保留上一个动作的姿态 → 乱飞） */
            if (clip) glbAddMissingTracks(clip);
            if (!clip) {
              vmdErr('GLB 里没有这个动作：' + url.slice(4));
              failed++;
              continue;
            }
          } else {
            /* ---- VMD 文件 ----
               ★ 每个文件【单独】建剪辑（不能传数组：数组会合并轨道，
                 同一个骨骼被两个动作各写一遍再按帧排序 → 姿态全乱，见文件头 ③）。 */
            label = decodeURIComponent(url.split('/').pop());
            clip = await new Promise((res, rej) => {
              loader.loadAnimation(url, model, res, undefined,
                e => rej(e instanceof Error ? e : new Error(String((e && e.message) || e))));
            });
          }
          if (mySeq !== vmd.seq) { vmdLog('rebuild(' + reason + '): 已被取代，放弃'); return; }
          if (!clip || !clip.tracks || clip.tracks.length === 0) {
            vmdErr('slot ' + slot + ' 的 ' + label + ' 轨道为空（动作没绑定到本模型？）');
            failed++;
            continue;
          }
          /* ★ 注意：下面两步会【改 clip 的 track 数据】（锁位移 / 裁时长），
             GLB 的 clip 是 clone 出来的副本，所以不会污染原动作。 */
          if (vmd.cfg.rootLock !== false) vmdLockRootMotion(clip);
          /* 一次性动作：可选裁到一圈（循环类动作里常有多圈） */
          if (VMD_ONESHOT_SLOTS[slot] && vmd.cfg.trimLoop !== false) {
            vmdTrimToFirstLoop(clip, 'slot ' + slot);
          }
          list.push({ url: url, clip: clip });
          built++;
          vmdLog('slot ' + slot + ' + ' + label
            + '：' + clip.tracks.length + ' 轨 ' + clip.duration.toFixed(2) + 's');
        } catch (e) {
          failed++;
          vmdErr('slot ' + slot + ' 加载失败（' + label + '）: ' + (e && e.message));
        }
      }
      if (list.length) loaded[slot] = list;
    }

    if (mySeq !== vmd.seq) return;
    if (built === 0) {
      vmdLog('rebuild(' + reason + '): 没有可用的动作' + (failed ? ('（失败 ' + failed + '）') : ''));
      return;
    }

    /* ---- 混合器 ---- */
    if (isGltfModel) {
      /* ★ glTF：用标准 AnimationMixer。
         MMDAnimationHelper 会在 _createCCDIKSolver 里读
         `geometry.userData.MMD.iks`（glTF 没有）→ TypeError，所以不能用。
         好在 GLB 的动作本来就是标准 clip，不需要 IK / 付与。 */
      vmd.helper = null;
      vmd.mixer = new THREE.AnimationMixer(model);
      vmdLog('glTF 模式：使用标准 AnimationMixer（无 IK / 付与 / MMD 物理）');
    } else {
      vmd.helper = new MMDAnimationHelper({
        sync: false,
        afterglow: 0,
        resetPhysicsOnLoop: false,
      });
      /* 物理归我们自己管（见 §14.2 的执行顺序），这里只要 IK + grant。
         ★ 必须传 animation 数组（哪怕是空的）—— 否则 helper 不会创建 mixer，
           而它内部的 IK/grant 解算恰好被包在 `if (mixer)` 里，等于不跑。 */
      vmd.helper.enabled.physics = false;
      vmd.helper.add(model, { animation: [], physics: false });
      vmd.mixer = vmd.helper.objects.get(model).mixer;
      vmdOptimizeIK();

      /* ★★★ 诊断：剪辑里有多少轨道在驱动【被物理回写的骨骼】★★★
         ---- 为什么要查（曾出现"外套/裙子直接炸了，看起来非常乱"）----
         MMD 的规则：被刚体绑定（rigidBodyType = 1 动态 / 2 动态+骨骼）的骨骼
         **不应该再被动画驱动** —— 它们归物理管。
         而 MMDLoader 建剪辑时【不过滤】这类骨骼（只用 rigidBodyType 去禁 IK 链接），
         一旦 VMD 带了它们的轨道，就是"动画与物理每帧互抢同一根骨骼"
         → 刚体被瞬移式反复拉扯 → 裙子/外套被甩飞。
         这里统计出来：数字明显 > 0 就是根因。 */
      try {
        const mmd0 = (model.geometry && model.geometry.userData && model.geometry.userData.MMD);
        if (mmd0 && mmd0.bones) {
          const physNames2 = new Set();
          for (const b of mmd0.bones) {
            if (b.rigidBodyType === 1 || b.rigidBodyType === 2) physNames2.add(b.name);
          }
          let hitTracks = 0;
          const hitBones = new Set();
          for (const slotX of VMD_SLOT_KEYS) {
            const arrX = vmdSlotActions(slotX);
            if (!arrX.length) continue;
            for (const t of (arrX[0].getClip().tracks || [])) {
              const m2 = /^\.bones\[(.+?)\]\./.exec(t.name);
              if (m2 && physNames2.has(m2[1])) { hitTracks++; hitBones.add(m2[1]); }
            }
          }
          vmdLog('★物理冲突检查: 被物理回写的骨骼共 ' + physNames2.size + ' 根；'
            + '动画里有 ' + hitTracks + ' 条轨道在驱动它们'
            + '（涉及 ' + hitBones.size + ' 根：' + [...hitBones].slice(0, 10).join(',') + '）'
            + (hitTracks > 0 ? '  ← 会互抢，需过滤' : '  ✓ 无冲突'));
        }
      } catch (e) { nerr('物理冲突检查失败: ' + (e && e.message)); }

      const mmd = (model.geometry && model.geometry.userData && model.geometry.userData.MMD) || {};
      vmdLog('helper ready: iks=' + ((mmd.iks || []).length)
        + ' grants=' + ((mmd.grants || []).length)
        + ' rigidBodies=' + ((mmd.rigidBodies || []).length));
    }

    /* ---- 建 action（一个插槽可以多个） ---- */
    for (const slot of VMD_SLOT_KEYS) {
      const list = loaded[slot];
      if (!list || !list.length) continue;
      const arr = [];
      let maxDur = 0;
      for (const it of list) {
        const act = vmd.mixer.clipAction(it.clip);
        /* ★ 顺序播放的槽：即使本来是循环槽，也要按"一段一段播"处理，
           所以统一设成 LoopOnce（vmdPlayChainStep 里还会再确认一次）。 */
        if (VMD_ONESHOT_SLOTS[slot] || vmdIsChain(slot)) {
          act.setLoop(THREE.LoopOnce, 1);
          /* ★ 叠加模式下要保持最后一帧（否则它一跳到结尾就弹回绑定姿态）；
             顺序模式下也保持，这样上一个动作的收尾姿态能顺滑接给下一个。 */
          act.clampWhenFinished = true;
        } else {
          act.setLoop(THREE.LoopRepeat, Infinity);
        }
        arr.push(act);
        if (it.clip.duration > maxDur) maxDur = it.clip.duration;
      }
      vmd.acts[slot] = arr;
      vmd.durs[slot] = maxDur;
      if (arr.length > 1) {
        vmdLog('注意：' + slot + ' 配了 ' + arr.length
          + ' 个动作，会【同时播放并按权重混合】（只适合 动作+表情 这类互补组合）');
      }
    }

    vmd.mixer.addEventListener('finished', vmdOnActionFinished);

    /* ---- 起播 ---- */
    vmd.layer = 'idle';
    if (vmdSlotReady('idle')) {
      /* ★ 待机槽如果配了多个动作、且是顺序模式，也要走链 */
      if (vmdIsChain('idle')) {
        vmdStartChain('idle', 0);
        vmdLog('idle 顺序播放开始（' + vmdSlotActions('idle').length + ' 个）');
      } else {
        vmdPlayList('idle', 0, true);
        vmdLog('idle 动作开始循环播放（' + vmdSlotActions('idle').length + ' 个）');
      }
    }
    if (vmd.walking && vmd.acts.walk) vmdSwitchLayer('walk', 0);
    vmdCheckWalkSmoothness();
    vmdLog('rebuild(' + reason + ') 完成: ' + built + ' 个动作就绪');
  } catch (e) {
    vmdErr('rebuild(' + reason + ') 异常: ' + (e && e.message));
  }
}

/** 播放（或淡入）某个插槽的全部 action。 */
function vmdPlayList(slot, fade, isFirst) {
  const f = (fade === undefined) ? VMD_FADE_S : fade;
  for (const a of vmdSlotActions(slot)) {
    a.reset().setEffectiveWeight(1);
    if (f > 0) a.fadeIn(f);
    a.play();
  }
}

/** 淡出某个插槽的全部 action。 */
function vmdFadeOutList(slot, fade) {
  const f = (fade === undefined) ? VMD_FADE_S : fade;
  for (const a of vmdSlotActions(slot)) {
    try { a.fadeOut(f); } catch (e) {}
  }
}

/**
 * 锁住根骨骼的水平位移 → 原地播放。
 *
 * ★ 走路动作的文件名里那个「前移動20」就是烘焙进去的位移；
 *   不锁的话模型会在窗口里一路走偏（窗口本身也在移动，等于双倍位移）。
 * ★ 保留 Y（上下起伏/跳跃），只把 X/Z 压成第 0 帧的值。
 */
function vmdLockRootMotion(clip) {
  let locked = 0;
  for (const t of clip.tracks) {
    const m = /^\.bones\[(.+?)\]\.position$/.exec(t.name);
    if (!m) continue;
    if (VMD_ROOT_BONES.indexOf(m[1]) < 0) continue;
    const v = t.values;
    if (!v || v.length < 3) continue;
    const x0 = v[0], z0 = v[2];
    for (let i = 0; i < v.length; i += 3) {
      v[i] = x0;
      v[i + 2] = z0;
    }
    locked++;
  }
  if (locked) vmdLog('锁定根骨骼位移: ' + locked + ' 条轨道（原地播放）');
}

/**
 * 把剪辑裁到「第一圈」。
 *
 * ★★ 为什么（2026-10-06 实测）★★
 *   很多动作文件本身就是循环动作，里面烘焙了多圈。实测 emote_cheer.vmd
 *   第 81 帧与第 162 帧都回到起始姿态 → 179 帧 = 2 圈，
 *   当成"点一次播一次"的反应时，看起来就是"重复了两次"。
 *
 * 做法（不重建轨道，零风险）：
 *   1) 取所有"确实在动"的四元数轨道，各自找第一个"回到起始姿态"的时刻
 *   2) 取这些时刻的【中位数】当一圈长度（比最小值稳，避免个别骨骼抖动误判）
 *   3) 直接改 clip.duration —— AnimationMixer 播到 duration 就结束，
 *      不需要重建轨道，也不会丢 MMD 的自定义插值
 *
 * @return 裁掉之后的时长（0 = 没检测到，保持原样）
 */
function vmdTrimToFirstLoop(clip, tag) {
  try {
    if (!clip || clip.duration <= 0.5) return 0;
    const cuts = [];
    for (const t of clip.tracks) {
      if (!t.name.endsWith('.quaternion')) continue;
      const times = t.times, v = t.values;
      const n = times.length;
      if (n < 12 || !v || v.length < n * 4) continue;
      const q0 = [v[0], v[1], v[2], v[3]];
      let maxDev = 0;
      const dev = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const d = 1 - Math.abs(v[i * 4] * q0[0] + v[i * 4 + 1] * q0[1]
                             + v[i * 4 + 2] * q0[2] + v[i * 4 + 3] * q0[3]);
        dev[i] = d;
        if (d > maxDev) maxDev = d;
      }
      if (maxDev < 0.05) continue;                 // 这根骨骼基本没动，跳过
      /* 找第一个"回到起点"的位置（要求落在时长的 25% 之后） */
      for (let i = 1; i < n; i++) {
        if (times[i] < clip.duration * 0.25) continue;
        if (dev[i] < maxDev * 0.06) { cuts.push(times[i]); break; }
      }
    }
    if (cuts.length < 2) return 0;
    cuts.sort((a, b) => a - b);
    const cut = cuts[Math.floor(cuts.length / 2)];   // 中位数
    if (!(cut > 0.4) || cut > clip.duration * 0.95) return 0;
    const old = clip.duration;
    clip.duration = cut;
    vmdLog(tag + ' 检测到循环：' + old.toFixed(2) + 's -> ' + cut.toFixed(2)
      + 's（裁到一圈，避免"重复两次"）');
    return cut;
  } catch (e) {
    vmdErr('trimLoop failed: ' + (e && e.message));
    return 0;
  }
}

/** IK 链接里被物理驱动的骨骼要禁用（否则 IK 和物理互相抢）。 */
function vmdOptimizeIK() {
  try {
    /* glTF 没有 userData.MMD，_optimizeIK 会读它 → 跳过 */
    if (isGltfModel) return;
    if (vmd.helper && model) vmd.helper._optimizeIK(model, !!physics);
  } catch (e) {
    vmdLog('optimizeIK skipped: ' + (e && e.message));
  }
}

/* ---------------------------------------------------------------- 播放 */

/** 切主层（idle <-> walk），带交叉过渡。 */
function vmdSwitchLayer(slot, fade) {
  if (vmd.layer === slot && vmdAnyRunning(slot)) return;
  const from = (vmd.layer === 'oneshot') ? vmd.oneShotSlot : vmd.layer;
  /* ★ 从一次性动作切走（比如漫游开始了）→ 它的姿态必须登记恢复，
     否则骨骼会永久停在那个动作的中间帧（实测的"奇怪的动作"）。 */
  if (vmd.layer === 'oneshot' && vmd.oneShotBackup) {
    vmdDeferRestore(vmd.oneShotBackup, (VMD_FADE_S + 0.05) * 1000);
    vmd.oneShotBackup = null;
    vmd.oneShotSlot = null;
    if (vmd.oneShotTimer) { clearTimeout(vmd.oneShotTimer); vmd.oneShotTimer = null; }
  }
  vmd.layer = slot;
  /* ★ 走路动画是 30fps 录的：帧率上限低于 30 时会跳帧播放（一卡一卡）。
     这里通知原生在走动期间临时放宽，走完恢复。 */
  if (slot === 'walk') vmdNotifyWalkFps(true);
  else if (from === 'walk') vmdNotifyWalkFps(false);

  const f = (fade === undefined) ? VMD_FADE_S : fade;
  if (from && from !== slot) {
    /* ★ 离开正在顺序播放的槽 → 停掉链（而不是简单淡出整个列表） */
    if (vmd.chain && vmd.chain.slot === from) vmdStopChain(f);
    else vmdFadeOutList(from, f);
  }
  if (!vmdSlotReady(slot)) {
    /* 目标层没配动作 → 退回待机（没有就什么都不播） */
    vmdLog('切层 ' + from + ' -> ' + slot + '（该插槽没配动作，退回待机）');
    vmd.layer = 'idle';
    if (vmdSlotReady('idle')) {
      if (vmdIsChain('idle')) vmdStartChain('idle', VMD_FADE_S);
      else vmdPlayList('idle', VMD_FADE_S);
    }
    return;
  }
  /* ★ 顺序播放 or 叠加播放 */
  if (vmdIsChain(slot)) vmdStartChain(slot, f);
  else {
    if (vmd.chain && vmd.chain.slot === slot) vmdStopChain(0);
    vmdPlayList(slot, f);
  }
  const n = vmdSlotActions(slot).length;
  vmdLog('切层 ' + from + ' -> ' + slot + '（' + (vmd.durs[slot] || 0).toFixed(2) + 's'
    + (n > 1 ? ('，' + n + ' 个' + (vmdIsChain(slot) ? '顺序播放' : '混合')) : '') + '）');
}

/**
 * 这个插槽是否应该「顺序播放」。
 * 条件：一次性插槽 + 用户关掉了"叠加"开关 + 实际选了 2 个以上动作。
 */
function vmdIsChain(slot) {
  if (!vmd.cfg || vmd.cfg.overlay !== false) return false;
  /* ★ 循环槽（走路/待机）也支持顺序播放：依次播、播完回到第一个、无限循环。
     （用户把 3 个跑步动作放进 walk 槽，之前一直是"全部同时循环"= 看起来像叠加） */
  return vmdSlotActions(slot).length > 1;
}

/** 停止顺序播放（把链上所有动作淡出，必要时登记骨骼恢复）。 */
function vmdStopChain(fade) {
  const c = vmd.chain;
  if (!c) return;
  const f = (fade === undefined) ? VMD_FADE_S : fade;
  for (const a of c.list) { try { a.fadeOut(f); } catch (e) {} }
  if (c.oneShot) {
    if (vmd.oneShotBackup) {
      vmdDeferRestore(vmd.oneShotBackup, (VMD_FADE_S + 0.05) * 1000);
      vmd.oneShotBackup = null;
    }
    vmd.oneShotSlot = null;
    if (vmd.oneShotTimer) { clearTimeout(vmd.oneShotTimer); vmd.oneShotTimer = null; }
  }
  vmd.chain = null;
  vmdLog('顺序播放结束（' + c.slot + '）');
}

/** 开始顺序播放某个槽。 */
function vmdStartChain(slot, fade) {
  const list = vmdSlotActions(slot).slice();
  const oneShot = !!VMD_ONESHOT_SLOTS[slot];
  vmd.chain = { slot: slot, list: list, index: 0, oneShot: oneShot, loop: !oneShot };
  if (oneShot) vmd.oneShotSlot = slot;
  vmdPlayChainStep(fade);
}

/** 顺序播放的总时长（各段相加）。 */
function vmdChainTotal(list) {
  let t = 0;
  for (const a of list) {
    try { t += a.getClip().duration || 0; } catch (e) {}
  }
  return t > 0 ? t : 3;
}

/** 播顺序播放的第 index 段。 */
function vmdPlayChainStep(fade) {
  const c = vmd.chain;
  if (!c) return;
  const a = c.list[c.index];
  if (!a) {
    if (c.oneShot) vmdEndOneShot(c.slot); else vmdStopChain();
    return;
  }
  /* ★ 顺序播放时每一段都只播一次（原来是循环槽，得改成 LoopOnce），
     并且保留收尾姿态，让下一段顺接得上。 */
  try { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; } catch (e) {}
  a.reset().setEffectiveWeight(1);
  if (fade > 0) a.fadeIn(fade);
  a.play();
  let d = 0;
  try { d = a.getClip().duration || 0; } catch (e) {}
  vmdLog('顺序播放 ' + c.slot + '：第 ' + (c.index + 1) + '/' + c.list.length
    + ' 段（' + d.toFixed(2) + 's）');
}

/** 播一次性动作（摸头/摸身/摸脚/见面）。 */
function vmdPlayOneShot(slot) {
  const list = vmdSlotActions(slot);
  if (!list.length) {
    vmdLog('一次性动作 ' + slot + ' 没配，跳过');
    return false;
  }
  /* ★ 先把上一轮遗留的待恢复姿态处理掉（否则两个动作的残留会叠在一起）。 */
  if (vmd.restoreBuf) {
    vmdRestoreBones(vmd.restoreBuf);
    vmd.restoreBuf = null;
  }
  /* ★ 播放前备份全身骨骼。
     原因：MMD 的剪辑只包含它用到的那几根骨骼，动作结束后
     那些「只有它才动」的骨骼会停在最后一帧（比如土下座就一直跪着）。
     备份 + 播完复位可以干净地回到待机姿态。 */
  vmd.oneShotBackup = vmdSnapshotBones();

  /* 上一个一次性动作可能还在跑（连点两下）→ 先让它淡出 */
  const prevOneShot = (vmd.layer === 'oneshot') ? vmd.oneShotSlot : null;
  if (prevOneShot && prevOneShot !== slot) vmdFadeOutList(prevOneShot, VMD_ONESHOT_IN_S);
  /* 当前层让位（idle 或 walk） */
  const from = (vmd.layer === 'oneshot') ? null : vmd.layer;
  if (from) vmdFadeOutList(from, VMD_ONESHOT_IN_S);

  vmd.oneShotSlot = slot;
  vmd.layer = 'oneshot';
  const chain = vmdIsChain(slot);
  if (chain) {
    /* ★ 顺序播放：先播第一段，后面的等 'finished' 事件再依次接上。
       这样"跳起来 + 落地"就能按选择顺序演一遍。 */
    vmdStartChain(slot, VMD_ONESHOT_IN_S);
  } else {
    vmd.chain = null;
    vmdPlayList(slot, VMD_ONESHOT_IN_S);
  }

  const dur = chain ? vmdChainTotal(vmd.chain.list) : (vmd.durs[slot] || 3);
  /* 保险丝：万一 'finished' 没来（被 fadeOut 打断等），也要能回到待机 */
  if (vmd.oneShotTimer) clearTimeout(vmd.oneShotTimer);
  vmd.oneShotTimer = setTimeout(() => vmdEndOneShot(slot), (dur + 1.2) * 1000);
  vmdLog('播放一次性动作 ' + slot + '（' + dur.toFixed(2) + 's，'
    + list.length + ' 段）');
  return true;
}

function vmdOnActionFinished(e) {
  const a = e && e.action;
  if (!a) return;
  for (const slot of VMD_SLOT_KEYS) {
    if (vmdSlotActions(slot).indexOf(a) < 0) continue;

    /* ★ 顺序播放：这一段结束就接下一段 */
    if (vmd.chain && vmd.chain.slot === slot) {
      try { a.fadeOut(0.12); } catch (e) {}
      vmd.chain.index++;
      if (vmd.chain.index >= vmd.chain.list.length) {
        if (vmd.chain.loop) vmd.chain.index = 0;      // 循环槽：回到第一段
        else { vmdEndOneShot(slot); return; }          // 一次性槽：收尾
      }
      vmdPlayChainStep(0.12);
      return;
    }

    /* 非顺序播放的一次性动作：播完就收尾 */
    if (VMD_ONESHOT_SLOTS[slot]) { vmdEndOneShot(slot); return; }
  }
  if (vmdSlotActions('__random').indexOf(a) >= 0) vmdEndOneShot('__random');
}

/**
 * 结束一次性动作并回到小层（walk / idle）。
 *
 * ★ 注意本函数【只负责切层 + 登记恢复】，不直接恢复骨骼 ——
 *   直接恢复会被随后的 mixer/saveBones 覆盖，而且打断场景下会漏掉。
 *   恢复统一交给 vmdDeferRestore（见那里的说明）。
 */
function vmdEndOneShot(slot) {
  /* 已经被别的动作接管了 → 仍然要登记恢复（旧实现直接 return 就是漏恢复的根源） */
  if (vmd.oneShotSlot !== slot) {
    if (vmd.oneShotBackup) {
      vmdDeferRestore(vmd.oneShotBackup, (VMD_FADE_S + 0.05) * 1000);
      vmd.oneShotBackup = null;
    }
    /* ★★★ 骨骼恢复了，但【层】也必须恢复！★★★
       ---- 事故复盘（2026-10-07 曾出现"为什么嘴巴又不见了"）----
       真机诊断（★嘴部权重 日志）抓到的：
           idleAct=1/n idleW=0.00 t=2.77   ← 待机动画【停了】、有效权重 0、时间冻结
       权重序列 1.00 → 0.52 → 0.00 正是 `fadeOut` 的曲线 ——
       说明 idle 被淡出后**再没被播回来**，`vmd.layer` 永久留在 `'oneshot'`。
       为什么嘴会因此消失：这个 GLB 的 morph 语义是
         **权重 1 = 塌缩不可见、权重 0 = 可见**，14 个嘴里恰好要有一个是 0。
       而"谁该是 0"**完全由动画每帧写入** —— 动画一停，权重就冻结在最后一刻；
       冻在"全 1"那一瞬 → 14 个嘴全部塌缩 → **嘴巴整体消失**（所以症状是"有时"）。
       ★ 这条 early-return 正是"层没恢复"的漏网之鱼：
         它只登记了骨骼恢复，就直接 return 了。 */
    if (vmd.layer === 'oneshot') {
      const back0 = (vmd.walking && vmdSlotReady('walk')) ? 'walk' : 'idle';
      vmdLog('一次性动作 ' + slot + ' 已被接管 → 补做【层】恢复：-> ' + back0);
      vmd.layer = back0;
      vmd.oneShotSlot = null;
      if (vmdSlotReady(back0)) vmdPlayList(back0, VMD_FADE_S);
      else if (vmdSlotReady('idle')) { vmd.layer = 'idle'; vmdPlayList('idle', VMD_FADE_S); }
    }
    return;
  }
  if (vmd.oneShotTimer) { clearTimeout(vmd.oneShotTimer); vmd.oneShotTimer = null; }
  /* 顺序播放中途结束：把队列里剩余的段也淡出（否则它们会残留权重） */
  if (vmd.chain) {
    for (const a of vmd.chain.list) { try { a.fadeOut(VMD_FADE_S); } catch (e) {} }
    vmd.chain = null;
  }
  vmdFadeOutList(slot, VMD_FADE_S);
  vmd.oneShotSlot = null;

  /* 回到小层：走路中回走路，否则回待机 */
  const back = (vmd.walking && vmdSlotReady('walk')) ? 'walk' : 'idle';
  vmd.layer = back;
  if (vmdSlotReady(back)) vmdPlayList(back, VMD_FADE_S);

  /* ★ 等淡出结束再恢复姿态，避免看到"啪"地弹一下 */
  if (vmd.oneShotBackup) {
    vmdDeferRestore(vmd.oneShotBackup, (VMD_FADE_S + 0.05) * 1000);
    vmd.oneShotBackup = null;
  }
  vmdLog('一次性动作 ' + slot + ' 结束 -> ' + back);
}

/* ---------------------------------------------------------------- 骨骼快照 */

/** 从模型（含子级）里找第一个 skeleton —— GLB 的根是 Group，骨骼在子级。 */
function findSkeletonOf(root) {
  try {
    if (!root) return null;
    if (root.skeleton) return root.skeleton;
    let found = null;
    root.traverse(o => { if (!found && o.skeleton) found = o.skeleton; });
    return found;
  } catch (e) { return null; }
}

function vmdSnapshotBones() {
  try {
    /* ★★ GLB 的 model 是 Group，没有 .skeleton（骨骼在子级 SkinnedMesh 上）★★
       不兜住的话点触摸动作会在 vmdSnapshotBones 里抛
       "Cannot read properties of undefined (reading 'bones')"，
       导致动作根本播不出来。 */
    const sk = model.skeleton || findSkeletonOf(model);
    if (!sk || !sk.bones) { vmdLog('快照跳过：该模型没有 skeleton（glTF 常见）'); return null; }
    const bones = sk.bones;
    const buf = new Float32Array(bones.length * 7);
    for (let i = 0; i < bones.length; i++) {
      const b = bones[i];
      b.position.toArray(buf, i * 7);
      b.quaternion.toArray(buf, i * 7 + 3);
    }
    return buf;
  } catch (e) {
    return null;
  }
}

function vmdRestoreBones(buf) {
  try {
    if (!buf || !model) return;
    const sk = model.skeleton || findSkeletonOf(model);
    if (!sk || !sk.bones) return;
    const bones = sk.bones;
    if (buf.length < bones.length * 7) return;
    for (let i = 0; i < bones.length; i++) {
      const b = bones[i];
      b.position.fromArray(buf, i * 7);
      b.quaternion.fromArray(buf, i * 7 + 3);
    }
  } catch (e) {}
}

/**
 * 延迟恢复骨骼姿态（一次性动作播完后回到待机姿态）。
 *
 * ★★ 为什么不用"结束事件里直接恢复"（踩过的坑，2026-10-06）★★
 *   旧实现把恢复绑在 `vmdEndOneShot(slot)` 里，而那个函数开头是
 *   `if (vmd.oneShotSlot !== slot) return;` —— 于是：
 *     · 动作被【打断】（漫游开始 / 又播了另一个动作）→ 前一个的恢复被跳过
 *     · 新动作会【覆盖】`vmd.oneShotBackup` → 旧备份直接丢了
 *   结果：骨骼永久停在那个动作的最后一帧（用户看到"奇怪的动作"）。
 *
 * 现在改成"挂起式恢复"：无论从哪条路径离开 oneshot 层，
 * 都只是登记一次待恢复；真正的恢复在 vmdUpdate 里做，
 * 条件是【已过淡出时间】且【当前不在 oneshot 层】（否则会打断新动作）。
 */
function vmdDeferRestore(buf, delayMs) {
  if (!buf) return;
  /* 已经有一个待恢复的更早姿态 → 保留更早的那个（那才是"干净"的原始姿态） */
  if (vmd.restoreBuf) return;
  vmd.restoreBuf = buf;
  vmd.restoreAt = performance.now() + Math.max(0, delayMs);
}

/* ---------------------------------------------------------------- 每帧 */

function vmdUpdate(dt) {
  /* 待恢复的骨骼：到点了、且当前不在一次性动作里，就恢复。 */
  if (vmd.restoreBuf && vmd.layer !== 'oneshot'
      && performance.now() >= vmd.restoreAt) {
    vmdRestoreBones(vmd.restoreBuf);
    vmd.restoreBuf = null;
  }
  if (!vmd.mixer) return;
  try {
    if (isGltfModel) {
      /* glTF：标准 mixer，没有 IK / 付与 / MMD 物理 */
      vmd.mixer.update(dt);
    } else if (vmd.helper) {
      /* ★ helper.update 内部就是 MMD 标准顺序：
           restoreBones → mixer.update → saveBones → IK → grant
         物理不归它管（已 physics:false），我们照旧在它之后自己跑。 */
      vmd.helper.update(dt);
    }
  } catch (e) {
    vmd.lastErr = String(e && e.message);
    vmdErr('update failed: ' + vmd.lastErr);
  }
  vmdApplyYaw(dt);   // ★ 必须传 dt：转身是平滑插值的，不传就永远转不过去
}

/**
 * 转身（侧身朝行进方向）。
 *
 * ★ 用 Y 轴旋转，不用 scale.x = -1 —— 镜像会翻法线/贴图，
 *   模型会变成"反面朝外"的怪异样子。
 * ★ 自转开着时不抢 rotation.y（那是自转在管；漫游开启时自转已被强制关闭）。
 * ★ 平滑过渡：直接跳到 90° 会"啪"地闪一下，改成按速度插值过去。
 */
function vmdApplyYaw(dt) {
  if (!model) return;
  const want = (vmd.yawTarget || 0) * (Math.PI / 2);   // ±90° 或 0
  const cur = model.rotation.y;

  if (Math.abs(cur - want) < 0.002) {
    if (vmd.yawApplied !== want) {
      model.rotation.y = want;
      vmd.appliedYaw = want;
      /* ★ 注意这里用独立的 yawApplied 做"是否已上报"的标记。
         以前用 appliedYaw 判断，而插值分支里每帧都会更新它 ——
         最后一步正好落在目标值时 appliedYaw === want，
         于是这条"转向完成"的日志永远打不出来（排查时被误导过一次）。 */
      vmd.yawApplied = want;
      vmdLog('模型朝向 -> ' + yawText(vmd.yawTarget || 0)
        + '（rotation.y=' + want.toFixed(3) + '）');
    }
    return;
  }
  /* 自转在跑就别插手（否则两边抢 rotation.y，模型会乱转） */
  if (SPIN_SPEED > 0 && vmd.yawTarget === 0) { vmd.appliedYaw = cur; return; }
  if (!(dt > 0)) return;

  /* 角速度约 450°/秒 —— 转 90° 大约 0.2 秒，够快又不突兀 */
  const speed = Math.PI * 2.5;
  const delta = want - cur;
  const step = Math.sign(delta) * Math.min(Math.abs(delta), speed * dt);
  model.rotation.y = cur + step;
  vmd.appliedYaw = model.rotation.y;
}

function yawText(d) {
  if (d > 0) return '朝右(+90°)';
  if (d < 0) return '朝左(-90°)';
  return '正向(0°)';
}

/* ---------------------------------------------------------------- 诊断 */

/**
 * 通知原生：走动期间需要高帧率。
 *
 * ★ 为什么要这么做（实测"走路一卡一卡的"）：
 *   走路动作是 30fps 录制的（40 帧 = 1.33 秒一圈）。
 *   如果用户的「帧率上限」设得比 30 低，渲染循环会跳帧 ——
 *   动画按 dt 走但渲染不连续，看起来就是一顿一顿。
 *   走动只有几秒，临时抬高到 30 的代价可以接受，走完立刻恢复。
 *   （帧率上限现在是 20~90 的滑块，所以"低于 30"很常见 ——
 *     原生的 applyWalkFps 会在走动时把上限抬到 max(用户值, 30)。）
 */
function vmdNotifyWalkFps(walking) {
  try {
    if (B && B.setWalkFps) B.setWalkFps(walking);
  } catch (e) {}
}

/**
 * 走路"一卡一卡"的成因排查（2026-10-06）。
 *
 * 已知成因有两类，判别方法不同：
 *  ① 帧率上限 < 30：走路动画是 30fps 录的，帧率被限到 20 就会跳帧播放。
 *     → 原生侧会在走动期间临时放宽上限（见 vmdNotifyWalkFps）。
 *  ② 循环点姿态不一致：VMD 首帧和末帧姿态不同，LoopRepeat 回到 0 时会"抽一下"。
 *     → 这里算出首末帧的骨骼位移/旋转差，超过阈值就打警告。
 */
function vmdCheckWalkSmoothness() {
  try {
    const acts = vmdSlotActions('walk');
    if (!acts.length) return;
    let maxPosDiff = 0, maxRotDiff = 0;
    for (const a of acts) {
      const clip = a.getClip();
      for (const t of clip.tracks) {
        const v = t.values;
        if (!v || v.length < 3) continue;
        if (t.name.endsWith('.position')) {
          const n = v.length - 3;
          const d = Math.abs(v[0] - v[n]) + Math.abs(v[1] - v[n + 1]) + Math.abs(v[2] - v[n + 2]);
          if (d > maxPosDiff) maxPosDiff = d;
        } else if (t.name.endsWith('.quaternion')) {
          const n = v.length - 4;
          const d = Math.abs(v[0] - v[n]) + Math.abs(v[1] - v[n + 1])
                  + Math.abs(v[2] - v[n + 2]) + Math.abs(v[3] - v[n + 3]);
          if (d > maxRotDiff) maxRotDiff = d;
        }
      }
    }
    vmdLog('walk 循环点差异: 位移=' + maxPosDiff.toFixed(3)
      + ' 旋转=' + maxRotDiff.toFixed(3)
      + (maxPosDiff > 0.05 || maxRotDiff > 0.05
         ? '  ← 偏大，循环处会"抽一下"（该动作首末帧姿态不一致）' : '  ← 正常'));
  } catch (e) {}
}

/**
 * 手工复位：把骨骼恢复到绑定姿态。
 * 万一遇到残留的怪异姿态，试播页/调试可以用它一键救回来。
 */
window.__vmdResetPose = function () {
  vmdResetPose();
  return true;
};

/**
 * ★ 试播一个 glTF 自带动作（按名字，一次性，播完回待机）。
 *
 * ---- 为什么需要（2026-10-07 实测发现）----
 * 这个 GLB 里 14 个 morph target **全部是嘴型**（Mouth_200..Mouth_607），
 * 没有任何眼/眉/脸的表情 —— 也就是说对 glTF 模型而言，
 * 「表情」这个概念对应的应该是**自带动画**（Cafe_Idle / Exs / Formation_Pickup…），
 * 嘴型本来就由动画自动驱动，不该让用户/AI 去挑。
 * 所以「表情映射」页与 MCP 的表情工具在 glTF 下都改指【动画】，
 * 这里提供按名字试播单个动画的能力。
 *
 * @return true = 已开始播
 */
window.__playGlbClip = function (name) {
  try {
    if (!isGltfModel || !vmd.mixer) return false;
    const src = glbClips[name];
    if (!src) { vmdErr('试播：模型里没有这个动作 —— ' + name); return false; }
    /* 复用一次性动作那套（LoopOnce + clampWhenFinished + 淡入 + 播完回待机）。
       ★ 必须 clone：vmdLockRootMotion 会直接改 tracks 的数据。 */
    const clip = src.clone();
    glbAddMissingTracks(clip);
    if (vmd.cfg && vmd.cfg.rootLock !== false) vmdLockRootMotion(clip);
    try { if (vmd.acts['preview']) for (const a of vmd.acts['preview']) a.stop(); } catch (e) {}
    const act = vmd.mixer.clipAction(clip);
    act.setLoop(THREE.LoopOnce, 1);
    act.clampWhenFinished = true;
    vmd.acts['preview'] = [act];
    vmd.durs['preview'] = clip.duration;
    vmdLog('试播 GLB 动作：' + name + '（' + clip.duration.toFixed(2) + 's）');
    vmdPlayOneShot('preview');
    return true;
  } catch (e) {
    vmdErr('playGlbClip failed: ' + (e && e.message));
    return false;
  }
};

/**
 * 拖动结束（原生：手指从桌宠上松开）。
 *
 * ★ 为什么需要单独一个接口（2026-10-07 需求：拖放时播 Formation_Pickup）：
 *   drag 槽用的是一次性动作 + clampWhenFinished —— 它会**停在"被拿起"的末帧**，
 *   这在【拖拽期间】正是想要的效果（模型一直悬着跟着手走）。
 *   但松手后必须主动收尾，否则模型会永远悬在那里。
 *   这里直接走 vmdEndOneShot（淡出 + 回待机/走路层），
 *   不等动作自然播完 —— 用户把模型放下时希望它立刻站好，
 *   而不是继续做完"被拿起"的整套动画。
 *
 * @return true = 确实收尾了；false = 当前没在播拖动动作（无害，原生不用管）
 */
window.__vmdDragEnd = function () {
  if (!vmd.mixer) return false;
  if (vmd.oneShotSlot !== 'drag') return false;
  vmdEndOneShot('drag');
  vmdLog('拖动结束 -> 淡出回待机');
  return true;
};

/* ---------------------------------------------------------------- 对外接口 */

/** 播某个插槽（原生：摸头/摸身/摸脚/见面/试播按钮）。 */
/**
 * 播某个插槽（原生：摸头/摸身/摸脚/见面/试播按钮）。
 *
 * ★★ 重复请求去重（实测"点一下身体，动画还是会播两次"）★★
 *   800ms 内对【同一个插槽】的重复请求只认第一次。
 *   不管理由是「原生重发」还是「事件被投递两次」，这道闸都能挡住。
 *   同时打一条带序号的日志 + 调用栈摘要，方便定位到底是谁发的
 *   （只靠猜是查不出来的，一定要有证据）。
 */
window.__playVmdSlot = function (slot) {
  if (VMD_SLOT_KEYS.indexOf(slot) < 0) return false;
  const now = performance.now();
  if (vmd.lastReqSlot === slot && (now - vmd.lastReqAt) < 800) {
    vmdLog('忽略重复请求 ' + slot
      + '（距上次 ' + (now - vmd.lastReqAt).toFixed(0) + 'ms）');
    return false;
  }
  vmd.reqSeq++;
  vmd.lastReqSlot = slot;
  vmd.lastReqAt = now;
  vmdLog('请求#' + vmd.reqSeq + ' ' + slot + '  ' + vmdStackHint());

  if (!vmd.mixer) {
    vmdLog('__playVmdSlot(' + slot + ')：VMD 未就绪（没配动作 / 模型还没加载完）');
    return false;
  }
  if (slot === 'idle') { vmdSwitchLayer('idle', 0); return true; }
  if (slot === 'walk') { vmdSwitchLayer('walk', 0); return true; }
  return vmdPlayOneShot(slot);
};

/** 调用栈摘要（只取前几层文件名:行号），用于定位重复请求的来源。 */
function vmdStackHint() {
  try {
    const e = new Error();
    const lines = String(e.stack || '').split('\n').slice(2, 5);
    return '\u2190 ' + lines.map(l => l.trim().replace(/^at\s+/, '')
      .replace(/https:\/\/appassets\.androidplatform\.net\/assets\//, '')).join(' | ');
  } catch (err) { return ''; }
}

/**
 * 漫游状态：走路时切走路循环 + 侧身朝向。
 *
 * ★★ 朝向到底该转多少度 —— 两次搞错后的结论（2026-10-06）★
 *   模型 rotation.y = 0 时是【面向镜头】的（这是 MMD 观看器的通常摆法）。
 *   用户要的是「侧身朝行进方向走」，不是 180° 掉头：
 *     · 往右走 → rotation.y = +90°（正面朝屏幕右）
 *     · 往左走 → rotation.y = -90°（正面朝屏幕左）
 *     · 待机   → 0°（正面对着镜头）
 *   历史弯路：先做成「往左转 180°」（结果往左走背对屏幕），
 *   又改成「往右转 180°」（结果往右走背对屏幕）——
 *   两次都不对，因为用户要的本来就是 90° 侧身。
 *
 * @param walking 是否在走
 * @param dir     +1 = 往右走，-1 = 往左走，0 = 不转身
 */
window.__setVmdWalking = function (walking, dir) {
  vmd.walking = !!walking;
  const d = (dir === 1 || dir === -1) ? dir : 0;
  vmd.walkDir = d;
  /* 用户在设置里关掉"走动时自动转身"就一律不转 */
  const allowed = !(vmd.cfg && vmd.cfg.faceLeft === false);
  const want = (vmd.walking && allowed) ? d : 0;
  if (vmd.yawTarget !== want) {
    vmd.yawTarget = want;
    vmdLog('漫游朝向: ' + yawText(want)
      + (want ? '（侧身朝行进方向）' : ''));
  }
  if (!vmd.mixer) return;
  if (vmd.layer === 'oneshot') return;      // 一次性动作播放期间不打断
  vmdSwitchLayer(vmd.walking ? 'walk' : 'idle', VMD_FADE_S);
};

/** 单独设置朝向（走完一段 / 漫游停止时复位成 0 = 正面对着镜头）。 */
window.__setVmdFacing = function (dir) {
  const d = (dir === 1 || dir === -1) ? dir : 0;
  if (vmd.yawTarget === d && vmd.walkDir === d) return;   // ★ 去重，别刷屏
  vmd.walkDir = d;
  vmd.yawTarget = d;
  vmdLog('朝向复位 -> ' + yawText(d));
};

/**
 * 待机随机表演：从原生给的候选池里随机抽一个播一次。
 * ★ 抽签放在页面（页面才知道每个动作多长、加载成没成），
 *   但【什么时候该播】由原生决定（拖拽/对话/互动/漫游中不播）。
 */
window.__playVmdRandom = function () {
  try {
    let pool = (vmd.cfg && Array.isArray(vmd.cfg.pool)) ? vmd.cfg.pool : [];
    /* ★ glTF：随机池里的 VMD 也不能用（同上的崩溃原因） */
    /* ★ 按模型类型过滤候选池（与 vmdSlotUrls 同一套规则）：
       glTF 只留 `glb:` 的，MMD 只留非 `glb:` 的。
       MMD 侧原来没过滤 → 池里混着 glb: 的 id 时会用 MMDLoader 去加载它，白报错。 */
    pool = isGltfModel ? pool.filter(u => isGlbActionId(u))
                       : pool.filter(u => !isGlbActionId(u));
    if (!pool.length) {
      vmdLog('随机表演：候选池为空（' + (isGltfModel ? 'glTF 只用自带动作' : '没有可用的 VMD 动作') + '）');
      return false;
    }
    if (!vmd.mixer || !model) { vmdLog('随机表演：VMD 未就绪'); return false; }

    /* 优先复用"已经配好、能直接播"的插槽（省一次解码） */
    const candidates = [];
    for (const slot of VMD_SLOT_KEYS) {
      if (!VMD_ONESHOT_SLOTS[slot]) continue;
      const urls = vmdSlotUrls(slot);
      if (urls.length && urls.some(u => pool.indexOf(u) >= 0) && vmdSlotReady(slot)) {
        candidates.push(slot);
      }
    }
    if (candidates.length) {
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      vmdLog('随机表演(复用已加载动作): ' + pick);
      return vmdPlayOneShot(pick);
    }

    /* 否则现场加载一个（随机池里但没绑到任何插槽的动作） */
    const url = pool[Math.floor(Math.random() * pool.length)];
    vmdLog('随机表演(临时加载): ' + decodeURIComponent(url.split('/').pop()));
    const loader = new MMDLoader();
    loader.loadAnimation(url, model,
      clip => {
        try {
          if (vmd.cfg && vmd.cfg.rootLock !== false) vmdLockRootMotion(clip);
          const a = vmd.mixer.clipAction(clip);
          a.setLoop(THREE.LoopOnce, 1);
          a.clampWhenFinished = true;
          vmd.acts.__random = [a];
          vmd.durs.__random = clip.duration;
          vmdPlayOneShot('__random');
        } catch (e) {
          vmdErr('随机表演播放失败: ' + (e && e.message));
        }
      },
      undefined,
      e => vmdErr('随机表演加载失败: ' + (e && e.message)));
    return true;
  } catch (e) {
    vmdErr('随机表演异常: ' + (e && e.message));
    return false;
  }
};

/**
 * 漫游开启/关闭时由原生调用。
 * ★ 开启漫游必须强制关掉自转：自转在写 model.rotation.y，
 *   而漫游的「往右/往左转身」也在写同一个值 —— 两者会互相打架。
 */
window.__setSpinForRoam = function (on) {
  if (on) {
    if (vmd.spinPrev === null) vmd.spinPrev = SPIN_SPEED;
    SPIN_SPEED = 0;
    SPIN = false;
    vmd.spinForced = true;
    vmdLog('漫游开启 -> 强制关闭自转（原速度 ' + vmd.spinPrev + '，关闭漫游后恢复）');
    /* 面板上的滑块也跟着归零，避免界面与实际不一致
       （纯设置 value 不会触发 input 事件，所以文本要手动写） */
    const sp = document.getElementById('sSpin');
    const spv = document.getElementById('vSpin');
    if (sp) sp.value = '0';
    if (spv) spv.textContent = '0.00';
  } else if (vmd.spinForced) {
    SPIN_SPEED = (vmd.spinPrev === null) ? 0 : vmd.spinPrev;
    SPIN = SPIN_SPEED > 0;
    const sp = document.getElementById('sSpin');
    const spv = document.getElementById('vSpin');
    if (sp) sp.value = String(SPIN_SPEED);
    if (spv) spv.textContent = SPIN_SPEED.toFixed(2);
    vmd.spinPrev = null;
    vmd.spinForced = false;
    vmdLog('漫游关闭 -> 恢复自转速度 ' + SPIN_SPEED);
  }
};

/** 诊断信息（供原生/日志排查）。 */
window.__vmdInfo = function () {
  try {
    const o = {
      enabled: !!(vmd.cfg && vmd.cfg.enabled),
      ready: !!vmd.mixer,
      model: vmd.model ? 'yes' : 'no',
      layer: vmd.layer,
      walking: vmd.walking,
      walkDir: vmd.walkDir,
      yawTarget: vmd.yawTarget,
      overlay: !(vmd.cfg && vmd.cfg.overlay === false),
      chain: vmd.chain ? (vmd.chain.slot + ' ' + (vmd.chain.index + 1)
             + '/' + vmd.chain.list.length) : '-',
      slots: {},
      err: vmd.lastErr,
    };
    for (const slot of VMD_SLOT_KEYS) {
      const arr = vmdSlotActions(slot);
      o.slots[slot] = arr.length
        ? (arr.length + '段/' + (vmd.durs[slot] || 0).toFixed(2) + 's'
           + (vmdAnyRunning(slot) ? ' [运行]' : ''))
        : '-';
    }
    return JSON.stringify(o);
  } catch (e) {
    return '{"err":"' + String(e && e.message) + '"}';
  }
};

/**
 * ★★ 渲染循环必须在【模块顶层】启动，绝不能放在 boot() 里！
 *
 * ---- 事故复盘（2026-10-05，悬浮窗全透明、只有设置页能看见）----
 * 原来这句写在 boot() 末尾。而 boot() 里有多处提前 return
 * （加载失败、"本次加载已被取代"等并发守卫）。
 * 一旦 boot 提前返回，渲染循环【永远不会启动】：
 *   · heartbeat frames=0/20s（但 errCount=0，因为根本没在渲染）
 *   · 画面永不更新 → 悬浮窗看起来全透明
 * 而设置页的加载没被取代、正常走完 boot，所以那边能看见模型 ——
 * 完全解释了"只有 MMD 设置里能看见"。
 * ★ 现在把循环提到顶层：无论模型加载成功与否都在跑。
 *   renderInner 内部对 model 为空的情况都有保护，空场景渲染也不会出错。
 */
renderer.setAnimationLoop(render);

/* ============================================================
   ★★★ 渲染看门狗：自动救活"莫名其妙定格"（2026-10-07）
   ------------------------------------------------------------
   ---- 症状（实测）----
   "模型有的时候会莫名其妙定格，播动画也没用" ——
   播动画没用 = 画布根本没在重绘，即**渲染循环停了**，不是动画数据的问题。

   ---- 两条已知成因 ----
   ① `renderer.setAnimationLoop` 的回调抛一次异常，下一帧就不再被调度
      （three.js 内部实现：animationLoop(time) 之后才 requestAnimationFrame，
        上面那句抛了就到不了下面）。render() 已经包了 try/catch 兜住这条。
   ② **WebView 被系统/别的 Activity 暂停**：Android 的 `WebView.onPause()`
      会暂停 WebView 的处理，`requestAnimationFrame` 随之不再回调。
      本 App 有两个 WebView（桌宠 + MMD 参数调整页），
      设置页 onPause 时会调它自己的 `webView.onPause()`；
      而 Chromium 的可见性/定时器处理在多个 WebView 并存时并不总是对称恢复 →
      桌宠那边可能醒来后 rAF 仍然不回调，且**永远不会自己恢复**。

   ---- 对策 ----
   每 3 秒检查一次"距上次真的渲染到帧"过了多久：
   · < 8s  → 正常，什么都不做
   · ≥ 8s  → 判为定格：打详细诊断 → 请原生把 WebView 唤醒 → 重启渲染循环 → 强制重绘一次
   ※ 用 setInterval 而不是 rAF 做检测：rAF 正是可能被暂停的那一个，用它检测自己没意义。
   ※ 诊断里带上 document.hidden / visibilityState / _ctxLost / _glbFrozen / errCount，
     下次再出问题，一眼就能看出是"被暂停"还是"上下文丢了"还是"每帧抛异常"。
   ============================================================ */
setInterval(function () {
  try {
    if (!_lastFrameAt) return;                      // 还没开始渲染，不误判
    const now = Date.now();
    const gap = now - _lastFrameAt;
    if (gap < 8000) return;
    _wdHits++;
    nerr('★★ 渲染看门狗 #' + _wdHits + '：' + (gap / 1000).toFixed(1)
      + 's 没有任何帧回调 -> 判定为定格，正在救活'
      + ' | hidden=' + document.hidden
      + ' vis=' + document.visibilityState
      + ' ctxLost=' + _ctxLost
      + ' frozen=' + _glbFrozen
      + ' model=' + (model ? 'y' : 'n')
      + ' err=' + _renderErrCount + '/' + (_lastRenderErrMsg || '-'));
    /* ① 请原生把 WebView 从暂停状态叫醒（对应上面成因 ②） */
    try { if (B && B.requestResume) B.requestResume(); } catch (e) {}
    /* ② 重启渲染循环（对应成因 ①） */
    try { renderer.setAnimationLoop(null); } catch (e) {}
    try { renderer.setAnimationLoop(render); } catch (e) {}
    /* ③ 立刻强制重绘一次 —— 即使 rAF 还暂时被节流，画面也先更新一帧 */
    try { renderer.render(scene, camera); } catch (e) {}
    /* ④ 上下文丢了就请 three.js 主动恢复（不恢复的话画面永远不更新） */
    if (_ctxLost) {
      try { renderer.forceContextRestore(); nlog('看门狗：已请求 forceContextRestore'); } catch (e) {}
    }
    _lastFrameAt = now;                             // 重置基准，避免每 3 秒刷屏
  } catch (e) {}
}, 3000);

mark('boot: start');
boot();
</script>
</body>
</html>
