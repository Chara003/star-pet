    } else if (!_distCustom) {
      nlog('跳过 resetFit(restore-scale)：缩放为默认值 1，没有"新缩放"需要生效');
    }
    /* ★ 恢复描边（先设宽度再建，避免多余的两次重建） */
    if (st.outlineW !== undefined) {
      const w = parseFloat(st.outlineW);
      if (isFinite(w)) OUTLINE_W = Math.max(0, Math.min(100, Math.round(w)));
      const so = $('sOutline'), vo = $('vOutline');
      if (so) so.value = String(OUTLINE_W);
      if (vo) vo.textContent = String(Math.round(OUTLINE_W));
    }
    /* ★ 透明度与颜色必须【先设变量】再 buildOutlines ——
       因为材质是在 buildOutlines 里按这两个变量创建的。
       （若材质已存在，__setOutlineAlpha/Color 会就地更新，双保险。） */
    if (st.toon2dlv !== undefined) {
      /* ★ 必须在 applyToon2D 之前设好程度 —— 它决定色阶的档位。
         ★★ 必须走 __setToon2DLevel()，不能直接赋值 ★★
         ---- 事故复盘（曾出现"三渲二没被正确保存"）----
         原来这里是【直接给变量赋值】：
           · 不打日志 → 排查时**完全看不到它恢复了什么**（我的第一次验证
             就是因为看不到而误判"没保存"）
           · 不同步滑块 DOM → 界面显示与实际不一致
         __setToon2DLevel 会一并做：clamp + 更新渐变贴图 + 同步滑块 + 打日志。 */
      const v2 = parseFloat(st.toon2dlv);
      if (isFinite(v2)) window.__setToon2DLevel(v2);
    }
    if (st.toon2d !== undefined) {
      const c2 = $('cToon2D');
      if (c2) c2.checked = !!st.toon2d;
      TOON2D_ON = !!st.toon2d;
      /* ★★★ 必须真的应用一次！★★★
         ---- 事故复盘（曾出现"三渲二关闭设置页后又变回去了"）----
         这里原来【只设了变量和勾选框】，没有调用 applyToon2D()
         → 材质从来没有被转换过。而启动时序是：
             boot() 先加载模型（此刻 TOON2D_ON 还是默认 false → 不转换）
             700ms 后 applySettings 把 TOON2D_ON 设成 true，但**不应用**
             → 材质仍是 PBR → 用户看到的就是"设置没保存 / 被还原了"。
         本来 __loadModel 里有"若 TOON2D_ON 则应用"，但它只在
         【模型加载那一刻】判断，那时 flag 还没恢复，所以也没触发。
         → 这里直接调用（applyToon2D 内部对 model 为空有保护，
           模型还没就绪时它会在加载完成后由 __loadModel 再补一次）。 */
      try { applyToon2D(TOON2D_ON); } catch (e) {}
    }
    /* ★ 用新键 outlineD2：旧的 outlineD 是"坏公式"时期存的（多半是 100=全黑），
       不能继承，否则用户升级后描边仍然是黑的。 */
    if (st.outlineD2 !== undefined) {
      const d = parseFloat(st.outlineD2);
      if (isFinite(d)) OUTLINE_DEPTH = Math.max(0, Math.min(100, Math.round(d)));
      /* ★★★ 不要再"纠正"用户的值（2026-10-17 第二次事故）★★★
         ---- 事故复盘（实测"我把描边颜色调到 11，但下次打开又变成 55 了"）----
         我上一版为了防止"旧存档里的坏值（4 / 22）让滑块看起来没效果"，
         写了 `if (OUTLINE_DEPTH < 15) OUTLINE_DEPTH = 55;`。
         但这行所在的 applySettings **每次启动都会跑** ——
         于是用户主动设成 11 也会被当成坏值改回 55，看起来就像"不保存"。
         ★ 教训：**迁移逻辑只能执行一次**，或者用"存在即信任"的规则。
           这里改成：只要存档里有 outlineD2 就完全尊重，绝不改；
           老存档没有 outlineD2 时才用默认 55（因为旧键 outlineD 是坏公式时期的）。
         ---- 顺手修好"对比度保底" ----
         "看起来没效果"的真正解法在 toOutlineShade 里的对比度保底，
         不需要靠强制抬高深度值。 */
      if (OUTLINE_DEPTH < 0) OUTLINE_DEPTH = 0;
      const sd = $('sOutlineD'), vd = $('vOutlineD');
      if (sd) sd.value = String(OUTLINE_DEPTH);
      if (vd) vd.textContent = String(OUTLINE_DEPTH);
    }
    if (st.outlineA !== undefined) {
      const a = parseFloat(st.outlineA);
      if (isFinite(a)) {
        OUTLINE_ALPHA = Math.max(0, Math.min(1, a / 100));
        const sa = $('sOutlineA'), va = $('vOutlineA');
        if (sa) sa.value = String(Math.round(OUTLINE_ALPHA * 100));
        if (va) va.textContent = Math.round(OUTLINE_ALPHA * 100) + '%';
      }
    }
    if (st.outlineC !== undefined) {
      const got = window.__setOutlineColor(st.outlineC);
      if (got === null) window.__setOutlineColor('auto');   // 存档里的非法值 → 回 auto
    }
    if (st.outline !== undefined) {
      OUTLINE_ON = !!st.outline;
      const co = $('cOutline');
      if (co) co.checked = OUTLINE_ON;
      nlog('恢复描边 = ' + OUTLINE_ON + '，宽度 ' + OUTLINE_W
        + '，透明度 ' + Math.round(OUTLINE_ALPHA * 100) + '%'
        + '，颜色 ' + (OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto'));
      buildOutlines();
    }

    /* ★ 恢复"取景填充度"（含 UI 滑块位置，否则界面与实际不一致） */
    if (st.fitRatio !== undefined) {
      try {
        const x = parseFloat(st.fitRatio);
        if (isFinite(x) && x >= 0.5 && x <= 1.0) {
          FIT_RATIO = x;
          const sf = $('sFit'), vf = $('vFit');
          if (sf) sf.value = String(x);
          if (vf) vf.textContent = x.toFixed(2);
          nlog('恢复取景填充度 = ' + x.toFixed(2));
        }
      } catch (e) {}
    }
    /* ★ 绝对不要在启动时恢复上次的表情！
       ---- 事故复盘（2026-10-05，实测"模型一出来就是闭眼"）----
       原来这里会把存档里的表情重新应用一次：
         if (st.morph) { sel.value = st.morph; dispatchEvent('change') }
       而材质表情（Close / Off / なごみ / はぅ）是"藏起睁眼材质、亮出另一张脸"，
       一旦在启动时被应用，模型一出现就是闭眼，用户完全不知道为什么。
       以前这些表情是死代码（改了没反应）所以无害；实现之后立刻变成了 bug。
       ★ 结论：表情是【瞬时表演】，不是【设置】。存档里只保留强度/轮播这类设置，
         表情本身每次启动都从"无表情"开始。 */
    if (st.morph) {
      nlog('applySettings: 跳过恢复上次表情（瞬时表演，不重放）: ' + st.morph);
    }
    const sel = $('selMorph');
    if (sel) {
      sel.value = '';                                        // 复位成"— 无表情 —"
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }, 400);
}

/** 只读全局那份（boot 需要它来知道"上次用的是哪个模型"）。 */
function loadSettingsGlobal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

/**
 * 读"当前模型该用的"设置。
 * · MMD 模型且有自己的存档 → 用自己那份
 * · 其它情况（glTF / MMD 首次使用）→ 用全局
 *
 * ★ boot() 里第一次取 st0（为了知道上次用的是哪个模型）应当用 loadSettingsGlobal()，
 *   因为那一刻还不知道最终要加载哪个模型。
 */
function loadSettingsForModel(url) {
  if (isMmdModelUrl(url)) {
    const all = loadPerModelStore();
    if (all && all[url]) {
      _loadedFromOwnStore = true;      // 用的是自己那份
      return all[url];
    }
    /* ★ 首次使用这个模型：回落到全局。
       ---- 但要标记出来（曾出现"配置没同步：我自转都没开过，怎么开始转起来了"）----
       回落本身是合理的（避免"配置突然全变默认"），问题在下一步：
       回落来的配置会被当成这个模型【自己的】存下来 ——
       于是别的模型（或被 glb 污染）的自转/光照就永久写进了这个模型。
       → 用 _loadedFromOwnStore 标记，让 saveSettings 在"从没编辑过"时
         不要凭空生成一份。 */
    _loadedFromOwnStore = false;
  } else {
    _loadedFromOwnStore = true;        // glTF 本来就用全局，不算回落
  }
  return loadSettingsGlobal();
}

/** 当前这份设置是"该模型自己的"还是"从全局回落的"（见 loadSettingsForModel）。 */
let _loadedFromOwnStore = true;
/** 用户在这次会话里是否真的改过设置（改过之后才允许为模型落盘）。 */
let _userTouchedSettings = false;

/** 向后兼容：老代码里的 loadSettings() 等同"全局"。 */
function loadSettings() { return loadSettingsGlobal(); }

/* ==================================================================
   调试控制面板 —— 交给你手动调参用。
   集成到正式 App 时可以整块删掉，或只保留 Gaze + 诊断部分。
   ================================================================== */
const $ = id => document.getElementById(id);
let _toonStops = TOON_STOPS.slice();
let _specScale = SPECULAR_SCALE;
let _userScale = 1;
let _userDist = null;
/** 用户是否【主动调过】相机距离（只有这种才在自动取景后重新应用）。 */
let _distCustom = false;

/**
 * 各模型各自的相机/缩放设置。
 *
 * ★★ 为什么必须按模型分（用户实测：切到 GLB 后模型上下被切）★★
 *   `_userDist` / `_userScale` / `_distCustom` 原来是【全局】的：
 *   用户为 MMD 模型调好的相机构图，会被无条件套到 GLB 上。
 *   而两个模型尺寸差很多 → 必然框错（日志 bounds y=-0.17..1.08 超出窗口）。
 *   和配件/表情别名一样，这类"视觉参数"天然应该按模型存。
 *
 * 结构：{ [modelUrl]: { scale, dist, distCustom } }
 */
let _perModelView = {};
/** 当前模型 key（空模型时用 ''）。 */
function _vmKey() { return currentModelUrl || ''; }

/** 把当前内存值存进"按模型"的表（切模型前调用）。 */
function saveViewForModel() {
  const k = _vmKey();
  if (!k) return;
  _perModelView[k] = {
    scale: _userScale,
    dist: _userDist,
    distCustom: _distCustom,
  };
}

/** 切到新模型时，取出它自己的相机设置（没有则用默认）。 */
function loadViewForModel(url) {
  const v = _perModelView[url || ''];
  if (v) {
    _userScale = (typeof v.scale === 'number' && isFinite(v.scale)) ? v.scale : 1;
    _userDist = (typeof v.dist === 'number' && isFinite(v.dist)) ? v.dist : null;
    _distCustom = !!v.distCustom;
    nlog('按模型恢复相机: scale=' + _userScale + ' dist=' + _userDist
      + ' custom=' + _distCustom);
  } else {
    /* 这个模型没记录过 → 用默认（缩放 1、距离交给自动取景） */
    _userScale = 1;
    _userDist = null;
    _distCustom = false;
    nlog('该模型没有相机记录 → 用默认（自动取景）');
  }
  /* 同步 UI */
  try {
    const ss = $('sScale'), vs = $('vScale');
    if (ss) { ss.value = String(_userScale); if (vs) vs.textContent = _userScale.toFixed(2); }
    const sd = $('sDist'), vd = $('vDist');
    if (sd && _userDist != null) {
      sd.value = String(_userDist);
      if (vd) vd.textContent = _userDist.toFixed(2);
    }
  } catch (e) {}
}

/* ---------------------------------------------------- 眼动追踪（Gaze）
   MMD 模型的眼球一般叫 左目/右目 或 両目，也可以是英文 '左目'。
   这里按优先级探测，探测不到就如实报告，而不是静默不生效。 */
let gazeBones = { left: null, right: null, all: [] };
let GAZE_AMP = 1.0;
/* 眼动方向翻转开关。
   ★ 必须在这里声明：之前只在事件回调里赋值，没有 let/var 声明，
     一勾选就抛 "Uncaught ReferenceError: GAZE_INVERT_X is not defined"，
     updateGaze 里的引用同样会炸 —— 表现为"翻转没用 + 报错"。 */
let lidBones = [];          // 眼睑骨骼（眨眼模式用）
let GAZE_INVERT_X = false;   // 翻转左右
let GAZE_INVERT_Y = false;   // 翻转上下
/* PMX 里眨眼表情通常叫「ウィンク」，用于 blink 模式 */
const WINK_NAME = 'ウィンク';
let MORPH_HAS_WINK = false;
let GAZE_ALL = true;   // 驱动全部 Eye* 骨骼（只动一根常常不是控制眼球的）

/* ------------------------------------------------------------------
   眼球骨骼探测。
   MMD 模型的眼球命名非常混乱，常见：
     日文：左目 / 右目 / 両目 / 目
     英文：EyeLU / EyeRU / LeftEye / RightEye / eye_L
     变形：EyeLU1 / EyeRU1（本模型实测就是 EyeLU1 / EyeLU2）
   而且很多模型会额外挂 EyeLA/EyeRA 之类的"眨眼用"辅助骨骼。
   → 最稳的做法是【全部 Eye 骨骼一起转】，总有一根是对的；
     同时保留精确匹配到的左右眼，供诊断显示。
   ------------------------------------------------------------------ */
function findEyeBones(mesh) {
  const all = [];
  mesh.traverse(o => {
    if (o.isBone && o.name && /eye|目|眼|pupil|iris/i.test(o.name)) all.push(o);
  });

  /* ★ 眼球 vs 睫毛/眼皮（很重要）
     本模型 21 根眼骨里只有 5 根是【眼球】，其余是眼睑/睫毛：
       眼球    : 両目, 左目, 右目, EyeL, EyeR
       上眼睑  : EyeLU1-3 / EyeRU1-3      (U = Upper)
       下眼睑  : EyeLD1-3 / EyeRD1-3      (D = Down)
       瞳孔辅助: EyePL1-2 / EyePR1-2
     若把眼睑也算进去，转眼球会拖着睫毛一起动，观感很怪（已实测）。
     策略：优先取"纯眼球"名；取不到再退回过滤掉眼睑的集合。 */
  const isLid = /L[UD]\d|R[UD]\d|lash|まつげ|まばたき|eyelid|P[LR]\d/i;
  const isEyeball = /^(両目|左目|右目|EyeL|EyeR)$/i;

  let eyeballs = all.filter(b => isEyeball.test(b.name));
  if (eyeballs.length === 0) eyeballs = all.filter(b => !isLid.test(b.name));
  if (eyeballs.length === 0) eyeballs = all;

  const l = eyeballs.filter(b => /左|Left|^EyeL$/i.test(b.name));
  const r = eyeballs.filter(b => /右|Right|^EyeR$/i.test(b.name));

  return {
    left:  l[0] || eyeballs[0] || null,
    right: r[0] || eyeballs[1] || null,
    all:   eyeballs,
    lids:  all.filter(b => isLid.test(b.name)),   // 眨眼模式要用眼睑
    lidCount: all.length - eyeballs.length
  };
}

let gazeMode = 'touch';   // 桌宠默认开启眼动（跟随手指）
let gazeT = 0;
let _blinkT = 0;
let _origLids = null;

function gazeTargets() {
  // 勾选"驱动全部"就用全部 Eye 骨骼，否则只用精确匹配的左右眼
  return GAZE_ALL && gazeBones.all.length
    ? gazeBones.all
    : [gazeBones.left, gazeBones.right].filter(Boolean);
}

function applyGaze(mode) {
  gazeMode = mode;
  if (!model) return;
  if (mode === 'off') {
    for (const b of gazeBones.all) b.rotation.set(0, 0, 0);
    nlog('gaze off (reset ' + gazeBones.all.length + ' bones)');
    return;
  }
  nlog('gaze=' + mode + ' on ' + gazeTargets().length + ' bone(s)');
}

function updateGaze(dt) {
  if (!model || gazeMode === 'off') return;

  /* ★★ 眨眼模式必须放在【眼球骨骼数量检查】之前！
     ---- 事故复盘 ----
     原来这条 if (!bones.length) return; 在前面，而眨眼用的是【表情骨骼】
     （PMX 的 ウィンク），跟眼球骨骼毫无关系。
     本模型 gazeTargets() 返回 0 根眼球骨骼（日志实测 "0 bone(s)"），
     于是 updateGaze 每次直接 return —— 眨眼分支永远执行不到，
     表现就是"切到眨眼测试也完全不眨"。 */
  if (gazeMode === 'blink') {
    /* 眨眼测试：用 PMX 真实眼睑骨骼。
       ★ 必须【双眼一起】——ウィンク 只是单眼，单独用会变成"只眨一只眼"。
       ★ 走 blinkWeightAt 同一条曲线（快闭→微停→慢睁），
         原来直接 0/1 瞬开瞬关，看起来像抽搐。 */
    _blinkT += dt;
    const period = 4.0, ph = _blinkT % period;
    const t0 = period - (BLINK_CLOSE_DUR + BLINK_HOLD_DUR + BLINK_OPEN_DUR);
    const closing = ph > t0;
    const bw = closing ? blinkWeightAt(ph - t0) : 0;
    if (!applyBlink(bw)) {
      /* ★ 没有闭眼表情时的正确退路：转【眼睑骨骼】。
         ---- 为什么不能转眼球（实测"眨眼时眼睛往下动"）----
         旧代码在 lidBones 为空时退化去转 gazeTargets()（眼球），
         现象就是眼珠往下沉，完全不像眨眼。
         ★ 实测 Kei 的 5 根眼部骨骼（両目/左目/左目戻/右目/右目戻）全是【眼球】、
           没有任何眼睑骨骼 —— 所以这类模型会走到"什么都不做"，
           那是正确的（宁可不眨，也不做错误动作）。
           而 Kei 本身有 まばたき 顶点表情，正常路径会用那个，不会走到这里。 */
      if (lidBones.length) {
        const v = 0.5 * GAZE_AMP * bw;
        for (const b of lidBones) b.rotation.set(v, 0, 0);
      } else if (!_blinkNoExprWarned) {
        _blinkNoExprWarned = true;
        nlog('眨眼：该模型既无闭眼表情、也无眼睑骨骼 → 跳过（不再转动眼球）');
      }
    }
    /* ★ 眨眼处理完就返回 —— 绝不能落到下面的眼球旋转逻辑
       （那正是"眼睛往下动"的元凶）。 */
    return;
  }

  const bones = gazeTargets();
  if (!bones.length) return;
  const A = GAZE_AMP;

  /* ★ 轴映射（很重要，实测接过一次）
     眼球骨骼的 rotation.x = 俯仰(上下)，rotation.y = 偏航(左右)。
     曾经把 ndc.x 喂给 rotation.x、ndc.y 喂给 rotation.y —— 正好交叉，
     现象就是"手指左右移眼睛上下动、手指上下移眼睛左右动"。
     正确做法：
       rotation.x (上下) <- ndc.y，取负让眼睛朝手指方向
       rotation.y (左右) <- ndc.x
     两个 GAZE_INVERT_* 开关用于模型朝向不一致时一键翻转。 */
  const sx = GAZE_INVERT_X ? -1 : 1;
  const sy = GAZE_INVERT_Y ? -1 : 1;

  if (gazeMode === 'auto') {
    gazeT += dt * 0.6;
    const pitch = Math.sin(gazeT * 1.7) * 0.22 * A * sy;   // 上下（幅度小）
    const yaw   = Math.sin(gazeT * 0.9 + 1.2) * 0.60 * A * sx; // 左右
    for (const b of bones) b.rotation.set(pitch, yaw, 0);
    _gazeNoBoneLogged = false;

  } else if (gazeMode === 'touch') {
    const pitch = THREE.MathUtils.clamp(-pointerNdc.y * 0.32 * A * sy, -0.45, 0.45);
    const yaw   = THREE.MathUtils.clamp( pointerNdc.x * 0.50 * A * sx, -0.70, 0.70);
    for (const b of bones) b.rotation.set(pitch, yaw, 0);
    _gazeNoBoneLogged = false;
  }
}

/** 眨眼无可用表情时只提示一次。 */
let _blinkNoExprWarned = false;

/** 眼球骨骼为 0 时提示一次（方便判断"眼动没反应"是骨骼找不到还是别的原因）。 */
let _gazeNoBoneLogged = false;

/* ============================================================
   外部视线输入（供原生喂入全屏触摸坐标）
   ------------------------------------------------------------
   桌宠悬浮窗里，外层容器拦截了触摸（为了拖拽），WebView 收不到
   pointermove，导致 gaze=touch 时 pointerNdc 恒为 (0,0)、眼球不动。
   这里开放 setLook(x, y) 供 Java 侧传入【全屏】归一化坐标。
   ============================================================ */
let _lookLogCount = 0;
window.setLook = function (nx, ny) {
  /* nx, ny 为全屏归一化 0..1（左上原点）；转成 NDC -1..1 */
  const cx = Math.max(0, Math.min(1, nx));
  const cy = Math.max(0, Math.min(1, ny));
  pointerNdc.x = cx * 2 - 1;
  pointerNdc.y = -(cy * 2 - 1);
  window.__lastLookAt = Date.now();
  /* 前几次打日志，确认原生确实喂进来了 */
  if (_lookLogCount < 5) {
    _lookLogCount++;
    nlog('setLook ' + cx.toFixed(2) + ',' + cy.toFixed(2)
      + ' -> ndc ' + pointerNdc.x.toFixed(2) + ',' + pointerNdc.y.toFixed(2));
  }
};

/* 长时间没有新的视线输入时，视线缓缓回正（避免一直盯着一个角落） */
/**
 * 视线回正：手指抬起后，眼睛缓缓转回正前方。
 * 滑动过程中保持跟手；松手即开始回正（带缓动，不是瞬变）。
 */
window.__lookIdleReset = function () {
  // 有新的输入就不回正（跟手阶段）
  if (window.__lookHeld) return;
  if (Math.abs(pointerNdc.x) < 0.01 && Math.abs(pointerNdc.y) < 0.01) {
    pointerNdc.x = 0;
    pointerNdc.y = 0;
    return;
  }
  pointerNdc.x *= 0.93;
  pointerNdc.y *= 0.93;
};

/* 原生在手指按下/抬起时调用，控制"跟手 / 回正"的切换 */
window.__setLookHeld = function (held) {
  window.__lookHeld = !!held;
};

/* 触摸坐标（供 gaze=touch 用） */
const pointerNdc = { x: 0, y: 0 };
/* ★ 必须归一化到 -1..1。之前直接存了像素坐标(0~1200)，
   乘系数后得到几百弧度的旋转，骨骼被甩飞 -> 看起来"没反应"。 */
function setPointer(e) {
  pointerNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNdc.y = -((e.clientY / window.innerHeight) * 2 - 1);
}
window.addEventListener('pointerdown', setPointer, { passive: true });
window.addEventListener('pointermove', setPointer, { passive: true });

/* ---------------------------------------------------------- 诊断信息 */
function collectDiag() {
  if (!model) return 'model 未加载';
  let bones = 0, meshes = 0, mats = new Set(), verts = 0;
  model.traverse(o => {
    if (o.isBone) bones++;
    if (o.isMesh) {
      meshes++;
      verts += o.geometry.attributes.position ? o.geometry.attributes.position.count : 0;
      (Array.isArray(o.material) ? o.material : [o.material])
        .forEach(m => { if (m) mats.add(m.type); });
    }
  });
  const g = model.geometry || {};
  const rb = g.rigidBody || [];
  const cs = g.constraint || [];
  let rbType = {};
  rb.forEach(b => { const t = (b.type || 0); rbType[t] = (rbType[t] || 0) + 1; });
  // 0=box 1=sphere 2=capsule ... MMDPhysics 里 shape 由 size 决定
  let hasSpring = false;
  rb.forEach(b => { if (b.type === 2) hasSpring = true; });

  return [
    '骨骼 bones     : ' + bones,
    '网格 meshes     : ' + meshes + '  (' + verts.toLocaleString() + ' 顶点)',
    '材质类型        : ' + [...mats].join(', '),
    '刚体 rigidBody  : ' + rb.length + (rb.length ? '  ' + JSON.stringify(rbType) : '  ← 无，裙子不会飘'),
    '关节 constraint : ' + cs.length + (cs.length ? '  ← 物理可用' : '  ← 无物理'),
    '软体(头发/裙摆) : ' + (hasSpring ? '有' : '无'),
    '表情 morph      : ' + morphNames.length
        + (morphNames.length ? '\n   └ ' + morphNames.join(', ') : '  ← 该模型无表情'),
    '眼球骨骼        : ' + gazeBones.all.length + ' 根'
        + (gazeBones.all.length ? '\n   └ ' + gazeBones.all.map(b => b.name).join(', ') : '  ← 未找到'),
    '眨眼表情        : ' + (MORPH_HAS_WINK ? '有(=' + WINK_NAME + ')' : '无(退回转眼球)'),
    '物理运行中      : ' + (physics ? '是' : '否'),
    'VMD 动画        : ' + (mixer ? '播放中' : '无'),
    '三角形(约)     : ' + Math.round(verts / 3).toLocaleString()
  ].join('\n');
}

function refreshDiag() {
  const el = $('diag');
  if (!el) return;
  const g = findEyeBones(model);
  el.textContent = collectDiag();
}

/* ------------------------------------------------------------ 绑定 UI */
/* ★ 幂等：bindPanel 会被 boot() 和 __loadModel() 各调用一次，
     如果每次都 addEventListener，事件会叠加 N 份，
     表现为"点一下重载 N 次" -> 出现多个模型、面板开关失灵。
     这里用 _panelBound 标记，只绑定一次。 */
let _panelBound = false;
function bindPanel() {
  if (_panelBound) { refreshModelList(); return; }
  _panelBound = true;

  const btn = $('panelBtn'), panel = $('panel');
  if (btn) btn.addEventListener('click', () => {
    const on = panel.style.display === 'block';
    panel.style.display = on ? 'none' : 'block';
    if (!on) refreshDiag();
  });

  /**
   * 绑定滑块。
   * ★★ 回调第二参数 isUser = "是不是用户真的在拖" ★★
   *   用 ev.isTrusted 区分：程序赋值（恢复设置 / 初始化 dispatchEvent）是 false。
   * ---- 为什么要这个（实测"设置里看着刚刚好，保存后模型被裁掉一块"）----
   *   原来对"程序填值"也一视同仁地动相机，于是：
   *     ① hook 注册时的初始 upd() 把相机拉到 HTML 默认值 3.7，
   *        覆盖掉刚算好的自动取景；
   *     ② 恢复存档时 setV('sDist') 也会触发（靠 _suppressCamDist 挡，
   *        但那个标志只覆盖 dispatch 的一瞬，覆盖面太窄）。
   */
  const hook = (id, vid, fmt, fn) => {
    const el = $(id), v = $(vid);
    if (!el) return;
    const upd = (ev) => {
      const n = parseFloat(el.value);
      if (v) v.textContent = fmt(n);
      fn(n, !!(ev && ev.isTrusted === true));
    };
    el.addEventListener('input', upd);
    upd(null);                       // 初始化同步（isUser = false）
  };

  hook('sKey',  'vKey',  n => n.toFixed(2),        (n, isUser) => { key.intensity = n; if (isUser) syncAppearance('key', n); });
  hook('sRim',  'vRim',  n => n.toFixed(2),        (n, isUser) => { rim.intensity = n; if (isUser) syncAppearance('rim', n); });
  hook('sAmb',  'vAmb',  n => n.toFixed(2),        (n, isUser) => { scene.children.find(o => o.isAmbientLight).intensity = n; if (isUser) syncAppearance('amb', n); });
  hook('sExp',  'vExp',  n => n.toFixed(2),        (n, isUser) => { renderer.toneMappingExposure = n; if (isUser) syncAppearance('exp', n); });
  hook('sSat',  'vSat',  n => n.toFixed(2),        n => {
    SAT_VALUE = n;
    if (model) applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);
    /* ★ 上报原生，好让桌宠悬浮窗同步（两个 WebView 是独立的） */
    try { if (window.MmdBridge && MmdBridge.colorGrade) MmdBridge.colorGrade(SAT_VALUE, HUE_VALUE); } catch (e) {}
  });
  hook('sHue',  'vHue',  n => n.toFixed(3),        n => {
    HUE_VALUE = n;
    if (model) applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);
    try { if (window.MmdBridge && MmdBridge.colorGrade) MmdBridge.colorGrade(SAT_VALUE, HUE_VALUE); } catch (e) {}
  });
  hook('sSpec', 'vSpec', n => n.toFixed(2),        (n, isUser) => {
    _specScale = n;
    if (model) model.traverse(o => {
      const ms = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      ms.forEach(m => { if (m && m.specular && m.specular.isColor) m.specular.setScalar(n); });
    });
    if (isUser) syncAppearance('spec', n);
  });
  hook('sToon', 'vToon', n => String(Math.round(n)), (n, isUser) => {
    _toonStops = [n, Math.min(255, n + 57), Math.min(255, n + 97), 252].sort((a, b) => a - b);
    if (model) applyToonGradient(model, _toonStops);
    if (isUser) syncAppearance('toon', n);
  });
  /* ---- 描边 ---- */
  hook('sOutline', 'vOutline', n => String(Math.round(n)), (n, isUser) => {
    window.__setOutlineWidth(n);
    /* ★ 上报原生 → 转发给桌宠（两个 WebView 各有一份模型，不同步就"调了没反应"）
       ★ 只在用户拖动时上报：初始化/恢复会以默认值 50 触发一次，
         以前无条件上报 → 一打开本页就把桌宠的描边宽度改成 50（实测的历史问题） */
    if (isUser) syncAppearance('outlineW', String(n));
  });
  /* ---- 描边透明度 ---- */
  hook('sOutlineA', 'vOutlineA', n => Math.round(n) + '%', (n, isUser) => {
    window.__setOutlineAlpha(n);
    if (isUser) syncAppearance('outlineA', Math.round(n));
  });
  /* ---- 描边颜色深度（跟随模型时的压暗程度）---- */
  hook('sOutlineD', 'vOutlineD', n => String(Math.round(n)), (n, isUser) => {
    OUTLINE_DEPTH = Math.max(0, Math.min(100, Math.round(n)));
    /* ★ 深度只对"跟随模型（贴图取色）"有意义。
       若当前是用户自定义色，颜色是统一覆盖的 → 拖了不会有变化。
       这里明确提示一次，避免"滑块没反应"的困惑。 */
    if (OUTLINE_COLOR && isUser && !hook._depthHinted) {
      hook._depthHinted = 1;
      nlog('★描边深度不影响自定义色（当前 ' + toHexColor(OUTLINE_COLOR)
        + '）；点「跟随模型」预设后深度才生效');
    }
    /* 只重算颜色，不重建 mesh（描边几何/宽度都不动） */
    refreshAutoOutlineColors('depth');
    if (isUser) syncAppearance('outlineD2', String(OUTLINE_DEPTH));
  });
  /* ---- 描边颜色 ---- */
  (function wireOutlineColor() {
    const inp = $('cOutlineColor'), sw = $('swOutline');
    const apply = (val, sync) => {
      const got = window.__setOutlineColor(val);
      if (got === null) { if (sw) sw.style.background = '#c0392b'; return; }   // 非法 → 红框提示
      if (inp && document.activeElement !== inp) inp.value = got;
      if (sw) sw.style.background = (got === 'auto') ? '#9a9aa2' : got;
      if (sync) syncAppearance('outlineC', got);
    };
    if (inp) {
      /* ★ 用 input（不是 change）→ 边打字边预览；非法的中间态直接忽略 */
      inp.addEventListener('input', () => apply(inp.value, false));
      /* 失焦/回车时再同步一次（这时值已经稳定，避免同步非法中间态） */
      inp.addEventListener('change', () => apply(inp.value, true));
    }
    /* 预设色块：纯 DOM，不依赖任何原生弹窗 */
    const box = $('outlinePresets');
    if (box) {
      const presets = [
        ['auto', '跟随模型'], ['#000000', '黑'], ['#ffffff', '白'],
        ['#3a2a1c', '深棕'], ['#1b2a4a', '藏蓝'], ['#5a1020', '酒红'],
        ['#2b2b2b', '深灰'], ['#7a5c3a', '浅棕'],
      ];
      for (const [val, label] of presets) {
        const chip = document.createElement('span');
        chip.textContent = label;
        chip.title = (val === 'auto' ? '跟随模型自带颜色' : val);
        chip.style.cssText = 'cursor:pointer;font-size:11px;padding:3px 8px;border-radius:999px;'
          + 'border:1px solid ' + (val === 'auto' ? '#9a9aa2' : val) + ';'
          + 'background:' + (val === 'auto' ? '#f0f0f4' : val) + ';'
          + 'color:' + (val === 'auto' ? '#333' : (val === '#ffffff' || val === '#7a5c3a' ? '#222' : '#fff')) + ';';
        chip.addEventListener('click', () => {
          if (inp) inp.value = val;
          apply(val, true);
        });
        box.appendChild(chip);
      }
    }
  })();
  const _cRest = $('cRestPose');
  if (_cRest) {
    _cRest.addEventListener('change', () => {
      window.__glbFreezeRestPose(_cRest.checked);
    });
  }

  /* ---- 三渲二 ---- */
  const _cToon2D = $('cToon2D');
  if (_cToon2D) {
    _cToon2D.checked = TOON2D_ON;
    _cToon2D.addEventListener('change', () => {
      applyToon2D(_cToon2D.checked);
      try { if (window.MmdBridge && MmdBridge.appearance) MmdBridge.appearance('toon2d', _cToon2D.checked ? '1' : '0'); } catch (e) {}
    });
  }
  /* ---- 三渲二程度（实时改色阶，不重建材质）---- */
  hook('sToon2DLv', 'vToon2DLv', n => String(Math.round(n)), (n, isUser) => {
    window.__setToon2DLevel(n);
    /* ★ 只有用户真的拖了才跨 WebView 同步（程序初始化时会调用一次，不必上报） */
    if (isUser) syncAppearance('toon2dlv', String(Math.round(TOON2D_LV)));
  });

  const _cOutline = $('cOutline');
  if (_cOutline) {
    OUTLINE_ON = _cOutline.checked;
    _cOutline.addEventListener('change', () => {
      window.__setOutline(_cOutline.checked);
      try { if (window.MmdBridge && MmdBridge.appearance) MmdBridge.appearance('outline', _cOutline.checked ? '1' : '0'); } catch (e) {}
    });
  }

  hook('sScale','vScale',n => n.toFixed(2),        n => {
    if (VIEW_LOCKED) return;
    _userScale = n; if (model) { model.scale.setScalar(n * baseModelScale); } });
  hook('sDist', 'vDist', n => n.toFixed(2), (n, isUser) => {
    if (VIEW_LOCKED) return;
    _userDist = n;                       // 记值（恢复时也要记，供取景后重新应用）
    if (!isUser) return;                 // ★ 程序填值：绝不动相机
    _distCustom = true;                  // ★ 用户真的调过 → 之后的自动取景要给他让路
    if (!_suppressCamDist && model) applyCamDist(n);
  });
  /* ★ 相机距离下限必须跟着模型改：applyCamDist 会按模型包围盒夹住最小距离，
     如果滑块还能拖到更小，界面显示和实际会不一致（用户以为能贴脸看）。
     这里在模型就绪后把滑块的 min 同步成实际下限。 */
  const _syncDistMin = () => {
    const el = $('sDist');
    if (!el || !model) return;
    try {
      /* ★★ 只同步滑块的【下限】，绝对不能调用 applyCamDist！
         ---- 事故复盘（实测"加载后模型缩水、留下大片空白，一调显示大小就恢复正常"）----
         这里原来调了 applyCamDist(滑块值)，而它会把相机【重置成滑块距离】(默认 3.7)，
         直接覆盖掉自动取景算出的距离。
         而本函数是在模型加载后 1500ms 触发的 ——
         正好在取景收敛之后 → 用户看到"先是正确的，1.5 秒后突然缩水"。
         调一下显示大小会触发 resize→重新取景，于是又恢复正常
         （这正是用户观察到的"一调显示大小就变回正确大小"）。
         ★ 相机距离只应由两种东西决定：
           ① 自动取景（fitCameraToBox + correctCameraFromMask）
           ② 用户【主动】拖动"相机距离"滑块
           同步下限属于 UI 辅助，不该碰相机。 */
      const mn = computeCamDistMin();
      if (Math.abs(parseFloat(el.min) - mn) > 0.01) {
        el.min = String(mn);
        if (parseFloat(el.value) < mn) {
          el.value = String(mn);
        }
        const lbl = $('vDist');
        if (lbl) lbl.textContent = parseFloat(el.value).toFixed(2);
        nlog('相机距离下限 -> ' + mn.toFixed(2) + '（不动相机）');
      }
    } catch (e) {}
  };
  window.__syncDistMin = _syncDistMin;
  setTimeout(_syncDistMin, 1500);
  /* ★ 自转只由这个滑块控制。
     曾经的 bug：主开关是独立的 let SPIN，而滑块只改 SPIN_SPEED，
     拖滑块完全没反应（主开关还是 false）—— 表现为"自转功能消失了"。
     现在滑块 >0 即开启，=0 即停止，不需要第二个开关。 */
  hook('sSpin', 'vSpin', n => n.toFixed(2), n => {
    SPIN_SPEED = n;
    SPIN = n > 0;
  });
  /* ★ 环境风：只改目标值，力的施加在物理步进里（与物理步长同步） */
  hook('sWind', 'vWind', n => String(Math.round(n)), (n, isUser) => {
    WIND_STRENGTH = n;
    if (isUser) syncAppearance('wind', String(Math.round(n)));
  });

  const sel = $('selGaze');
  if (sel) sel.addEventListener('change', () => applyGaze(sel.value));
  hook('sGaze', 'vGaze', n => n.toFixed(2), (n, isUser) => { GAZE_AMP = n; if (isUser) syncAppearance('gazeAmp', n); });
  const cg = $('cGazeAll');
  if (cg) cg.addEventListener('change', () => { GAZE_ALL = cg.checked; });

  const cp = $('cPhysics'), csp = $('cSpinPhys');
  /* ★★ 这个 checkbox 之前【根本没绑事件】—— 拨它完全没反应（实测）★★ */
  if (cp) {
    cp.checked = !!PHYSICS;
    /* ★ glTF 模型：头发/裙子是烘焙动画驱动的，物理开关无意义（且硬套会破坏姿态）
       → 直接置灰并改文案，避免用户去拨它。 */
    if (isGltfModel) {
      cp.checked = false;
      cp.disabled = true;
      try {
        const lb = cp.closest('label');
        if (lb) {
          lb.style.opacity = '0.5';
          lb.title = 'glTF 模型自带烘焙动画，不需要 MMD 物理';
        }
      } catch (e) {}
      PHYSICS = false;
    }
    cp.addEventListener('change', () => {
      window.__setPhysics(cp.checked);
      /* 上报原生 → 转发给桌宠（两个 WebView 各有一份模型，必须同步） */
      try { if (window.MmdBridge && MmdBridge.appearance) MmdBridge.appearance('physics', cp.checked ? '1' : '0'); } catch (e) {}
    });
  }
  if (csp) csp.addEventListener('change', () => { SPIN_WITH_PHYSICS = csp.checked; });

  /* ★ 锁定缩放与相机距离。
     自动取景已经算好最佳相机距离，手动一调就会覆盖它、破坏取景。
     勾上后这两个滑块会置灰并拒绝输入。 */
  /* ★ 取景填充度：控制模型占视窗的比例（默认 0.96 = 几乎填满）。
     调大更"满"，调小留更多余量（防裁切）。 */
  const sf = $('sFit'), vf = $('vFit');
  if (sf) {
    sf.value = String(FIT_RATIO);
    if (vf) vf.textContent = FIT_RATIO.toFixed(2);
    sf.addEventListener('input', () => {
      const v = parseFloat(sf.value) || 0.96;
      if (vf) vf.textContent = v.toFixed(2);
      window.__setFitRatio(v);
    });
  }

  const clv = $('cLockView');
  if (clv) {
    clv.addEventListener('change', () => {
      window.__setViewLock(clv.checked);
      /* ★ 走统一的保存路径（lockView 已加入 collectSettings）。
         之前是"读旧存档 + 只改 lockView"的特殊写法，
         会和自动保存互相覆盖，导致这个开关存不下来。 */
      saveSettings(false);
    });
  }

  /* 纹理镂空修复（修头发缺口）。
     ★ 改阈值要重扫材质：先把已有的 alphaTest 清零再按新值重设，
       否则旧值会残留（alphaTest 是绝对值，不是相对量）。 */
  const cat = $('cAlphaTest'), sat = $('sAlphaTest'), vat = $('vAlphaTest');
  const applyAt = () => {
    if (vat) vat.textContent = ALPHA_TEST_VALUE.toFixed(2);
    if (model) {
      model.traverse(o => {
        const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
        for (const m of mats) if (m && m.alphaTest) { m.alphaTest = 0; m.needsUpdate = true; }
      });
    }
    window.__setAlphaTest(cat ? cat.checked : true, ALPHA_TEST_VALUE);
  };
  if (cat) cat.addEventListener('change', applyAt);
  if (sat) {
    sat.addEventListener('input', () => {
      ALPHA_TEST_VALUE = parseFloat(sat.value) || 0.5;
      applyAt();
    });
  }
  if (vat) vat.textContent = ALPHA_TEST_VALUE.toFixed(2);
  const bd = $('btnDiag');
  if (bd) bd.addEventListener('click', refreshDiag);

  // 保存 / 恢复
  const bs = $('btnSave');
  if (bs) bs.addEventListener('click', () => {
    if (saveSettings(false)) {
      bs.textContent = '✅ 已保存';
      setTimeout(() => { bs.textContent = '💾 保存当前设置'; }, 1200);
    }
  });
  const br2 = $('btnReset');
  if (br2) br2.addEventListener('click', () => {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    nlog('settings reset, reloading');
    location.reload();
  });

  const cix = $('cInvX'), ciy = $('cInvY');
  if (cix) cix.addEventListener('change', () => { GAZE_INVERT_X = cix.checked; });
  if (ciy) ciy.addEventListener('change', () => { GAZE_INVERT_Y = ciy.checked; });

  const gd = $('selGradeDbg');
  if (gd) gd.addEventListener('change', () => {
    GRADE_DEBUG = parseInt(gd.value, 10);
    _gradeUniforms.dbg.value = GRADE_DEBUG;
    nlog('GRADE_DEBUG=' + GRADE_DEBUG);
  });

  /* 表情 */
  const selMo = $('selMorph'), sMo = $('sMorph'), vMo = $('vMorph'), cMo = $('cMorphLoop');
  if (selMo) selMo.addEventListener('change', () => {
    morphCur = selMo.value;
    setMorph(morphCur, sMo ? parseFloat(sMo.value) : 1);
  });
  if (sMo) {
    const upd = () => {
      const n = parseFloat(sMo.value);
      if (vMo) vMo.textContent = n.toFixed(2);
      if (!morphLoop) setMorph(morphCur, n);
    };
    sMo.addEventListener('input', upd); upd();
  }
  if (cMo) cMo.addEventListener('change', () => {
    morphLoop = cMo.checked;
    if (!morphLoop) { morphLoopT = 0; setMorph(morphCur, sMo ? parseFloat(sMo.value) : 1); }
  });

  const selM = $('selModel');
  if (selM) selM.addEventListener('change', () => {
    const v = selM.value;
    if (!v) { __loadModel(MODEL_URL); return; }
    if (v.indexOf('dir:') === 0) {
      // 兼容旧格式：只剩目录名时去猜 pmx 位置
      probeDir(v.substring(4));
    } else {
      __loadModel(v);       // 新格式：value 就是完整 URL
    }
  });

  const bp = $('btnPick');
  if (bp) bp.addEventListener('click', () => {
    try { window.MmdBridge.pickModelZip(); }
    catch (e) { nerr('pickModelZip 失败: ' + e.message); }
  });

  const br = $('btnReload');
  if (br) br.addEventListener('click', () => {
    /* 重载的"当前模型"要以下拉框实际选中项为准。
       之前只用 currentModelUrl：一旦 probeDir 失败（路径没猜中），
       这个变量还停留在默认模型，于是点重载就"变回默认模型"。
       现在优先读下拉的 value，它是我们真正加载过的地址。 */
    const v = selM ? selM.value : '';
    const target = (v && v.indexOf('dir:') !== 0)
      ? v                                   // 有确切 URL，直接用
      : (currentModelUrl || MODEL_URL);
    nlog('reload model -> ' + target + ' (下拉=' + v + ')');
    refreshModelList();
    __loadModel(target);
  });}

/* 导入目录里可能有多层，用 index 探测常见的 pmx 相对位置 */
async function probeDir(dirName) {
  const cands = [
    '/models/' + dirName + '/' + dirName + '.pmx',
    '/models/' + dirName + '/' + dirName + '.pmd',
    '/models/' + dirName + '/model.pmx',
    '/models/' + dirName + '/untitled.pmx'
  ];
  for (const u of cands) {
    try {
      const r = await fetch(u, { method: 'GET', cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      if (r.ok && !/text\/html/.test(ct)) {
        nlog('probe hit ' + u);
        // 把探测到的真实 URL 写进下拉，这样"重载"能拿到正确地址
        const sel = $('selModel');
        if (sel) {
          let opt = Array.from(sel.options).find(o => o.value === u);
          if (!opt) {
            opt = document.createElement('option');
            opt.value = u; opt.textContent = '📦 ' + u.split('/').pop();
            sel.appendChild(opt);
          }
          sel.value = u;
        }
        __loadModel(u);
        return;
      }
    } catch (e) { /* 继续试下一个 */ }
  }
  nerr('该目录下没找到 pmx/pmd：' + dirName);
}

/* 调试入口：供原生 MmdBridge.eval() 调用（见 HANDOVER_MMD.md）
   例：MmdBridge.eval("window.__mmdDebug('lights','0.1,0,0')")
        -> 灯光几乎全关，用来判断"过曝"来自光照还是贴图本身
       MmdBridge.eval("window.__mmdDebug('spin','false')")
       MmdBridge.eval("window.__mmdDebug('cam','0,1,3')")  */
window.__mmdDebug = function (what, arg) {
  const P = arg.split(',').map(Number);
  switch (what) {
    case 'lights':
      key.intensity = P[0]; rim.intensity = P[1]; scene.children.find(o=>o.isAmbientLight).intensity = P[2];
      nlog('debug lights -> ' + arg);
      break;
    case 'spin':  SPIN = (arg === 'true');  nlog('debug spin -> ' + SPIN); break;
    case 'cam':   camera.position.set(P[0], P[1], P[2]); camera.lookAt(0, 0.8, 0); break;
    case 'frame': resetFit('debug'); break;
    case 'exposure': renderer.toneMappingExposure = P[0]; nlog('exposure=' + P[0]); break;
    default: nlog('unknown debug cmd ' + what);
  }
  return true;
};

/* ============================================================
   MMD 描边（outline）
   ------------------------------------------------------------
   原理：MMD 的描边 = 把模型【背面】沿法线向外膨胀一圈再画一遍。
     · 复制一份 mesh（共享 geometry + skeleton → 骨骼动画自动同步）
     · 材质换成 BackSide 纯色
     · 顶点着色器里 `transformed += objectNormal * 厚度`
       ★ 注入点必须在 `skinning_vertex` 之后 —— 这时 objectNormal
         已经被骨骼变换过了；在它之前注入会让描边跟着【绑定姿态】走错。

   ★★ 为什么放在【独立的 outlineRoot】而不是挂到 model 下 ★★
     model 下有 20 多处 `model.traverse()` 在处理材质
     （alphaTest / 色彩 / 材质表情 / 配件…），多出来的 mesh 会被误处理。
     放到 scene 下的独立 Group 就完全绕开了这些遍历，
     代价只是每帧同步一次模型的位置/旋转/缩放。

   ★ 宽度不另起炉灶，直接用 PMX 自带的描边数据
     （material.userData.outlineParameters.thickness / color / visible）
     换算成本项目的世界单位 —— MMDLoader 给的 thickness 是
     `edgeSize / 300`（约 0.003），直接拿来用会看不见，
     因为它是在【原始模型尺度】下的偏移量，而我们把模型归一化成了 1.6 高。
   ============================================================ */

/** 描边开关。 */

let OUTLINE_ON = true;
/** 描边透明度 0~1（1 = 完全不透明）。会乘到模型声明的 alpha 之上。 */
let OUTLINE_ALPHA = 1;
/**
 * 用户自定义的描边颜色 [r,g,b]（0~1）；**null = 用模型自带的颜色**。
 *
 * ★ MMD 的 PMX 有 per-material 的 `edgeColor`（MMDLoader 已映射到
 *   `userData.outlineParameters.color`），所以默认要尊重它；
 * ★ glTF 规范里没有描边概念（实测 extensionsUsed=[]），颜色只能由我们定（黑）。
 * 用户显式改了颜色就统一覆盖所有材质 —— 这是"自定义"应有的语义。
 */
let OUTLINE_COLOR = null;
/** 描边宽度 0~100（50 = 手感基准，100 = 两倍粗）。 */
let OUTLINE_W = 50;

/**
 * ★ 描边颜色深度 0~100（2026-10-17 需求）
 *
 * ---- 为什么需要 ----
 * "跟随模型"是**从贴图取平均色**再压暗。但压暗多少是个权衡：
 *   · 压得少 → 描边色和贴图几乎一样 → 边界糊掉、看不清（用户担心的情况）
 *   · 压得多 → 一律近黑 → 就退化成"黑描边"，失去了取色的意义
 * 这个滑块把这个权衡交给用户。
 *   0   = 完全不压暗（用贴图平均色本身）
 *   60  = 默认（明度约 ×0.31，MMD/BA 的常见观感）
 *   100 = 压到很暗（≈ 黑）
 * ★ 即使滑块给 0，也保证明度至少降一点点（见 toOutlineShade 的 hi 夹取），
 *   否则"描边和贴图一模一样"这件事一发生用户又要调回来。
 */
let OUTLINE_DEPTH = 55;



/**
 * ★★★ 描边"按像素上色"开关（2026-10-17，方案 A）★★★
 *
 * ---- 为什么需要它 ----
 * 之前描边是"一个材质一个纯色"。实测这个模型把**紫花、眼睛、嘴**放在同一个材质里
 * （`Azusa_Original_EyeMouth` 9692 px，紫花只占 19%），
 * 于是无论怎么取平均/取主色，只能得到一个颜色 —— 紫花描边永远是灰紫，
 * 而"每个部位颜色不同"这个需求**在纯色方案下物理上做不到**。
 *
 * ---- 现在的做法 ----
 * 描边材质改成 `MeshBasicMaterial + map = 共享贴图 + vertexColors?=false`，
 * 也就是**描边 mesh 直接显示源贴图**（因为描边 mesh 与源 mesh 共享 UV）。
 * 于是紫花那圈描边自然就是紫的、头发那圈就是白的，
 * 真正的"每个部位按自己的贴图取色"。
 *
 * ---- 性能 ----
 * 零额外开销：不新增贴图（共享同一份 Texture）、不新增采样器、
 * 不改 shader、drawcall 数量不变（还是每个源 mesh 一个描边 mesh）。
 * 原本就有一个纯色 MeshBasicMaterial，现在只是给它挂上 map（texture 已在显存里）。
 *
 * ---- 回滚 ----
 * 设成 false 即回到旧的"单色描边"路径（`__setOutline` 或重开描边时生效）。
 * 备份：backup/index.html.before-perpixel-outline
 */
let OUTLINE_TEXTURED = true;

let outlineRoot = null;
/** [{ mat, k, visible }] —— k = 该材质的相对粗细系数。 */
let outlineMats = [];

/** 把 0~100 换算成"局部空间的膨胀量"。
 *  ★ 必须除以 baseModelScale：偏移是在顶点局部空间做的，
 *    之后会被 model.scale 缩放，所以要先折算回局部空间。 */
function outlineLocalThickness() {
  const sc = (typeof baseModelScale === 'number' && baseModelScale > 0.0001)
    ? baseModelScale : 1;
  /* w=100 → 世界宽度 0.016（约等于归一化模型高度的 1%） */
  const worldW = (OUTLINE_W / 100) * 0.016;
  return worldW / sc;
}

/** 删除已有描边（换模型 / 关开关时用）。 */
function disposeOutlines() {
  try {
    /* ★ 描边 mesh 挂在【源 mesh 的父级】下（不是统一挂 root），
       所以必须按 __outline 标记查找，不能只遍历 root。 */
    (outlineRoot ? [outlineRoot] : []).forEach(r => {
      if (r.parent) r.parent.remove(r);
    });
    const toRemove = [];
    scene.traverse(o => { if (o.userData && o.userData.__outline) toRemove.push(o); });
    for (const o of toRemove) {
      try {
        if (o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of ms) { try { m.dispose(); } catch (e) {} }
        }
        /* ★ 只释放"我们新建的"geometry（glTF 的烘焙几何）。
           MMD 的描边与模型【共享】同一份 geometry，dispose 它会把模型本体弄坏。 */
        if (o.userData && o.userData.__ownGeo && o.geometry) {
          try { o.geometry.dispose(); } catch (e) {}
        }
        if (o.parent) o.parent.remove(o);
      } catch (e) {}
    }
    if (toRemove.length) nlog('outline: 移除 ' + toRemove.length + ' 个描边 mesh');
  } catch (e) {}
  outlineRoot = null;
  outlineMats = [];
}

/**
 * 为当前模型建立描边。
 * 建议在模型材质全部处理完之后调用（alphaTest / toon 之后）。
 */
function buildOutlines() {
  disposeOutlines();
  if (!OUTLINE_ON || !model) return;
  try {
    /* ★★ 兼容两种模型结构 ★★
       · MMD：model 本身就是 SkinnedMesh（有 .material / .geometry）
       · glTF：model 是 Group（gltf.scene），材质在各个子 SkinnedMesh 上
       所以这里先收集"待描边的 mesh 列表"，再统一处理。 */
    let meshes = [];
    if (model.material && model.geometry) {
      meshes = [model];
    } else {
      model.traverse(o => { if (o.isMesh && o.geometry && o.material) meshes.push(o); });
    }
    meshes = meshes.filter(m => {
      const ms = Array.isArray(m.material) ? m.material : [m.material];
      return ms.some(x => x && !x.userData.__outline);
    });
    if (!meshes.length) { nlog('outline: 没找到可描边的 mesh，跳过'); return; }
    nlog('outline: 待处理 mesh ' + meshes.length + ' 个');

    const root = new THREE.Group();
    root.name = '__outlineRoot';

    /* 每个 mesh 一份描边 mesh；每个原材质一份描边材质
       （各自持有自己的厚度 uniform，粗细差异保留） */
    let totalMats = 0;
    for (const srcMesh of meshes) {
    const src0 = srcMesh.material;
    const srcMats = Array.isArray(src0) ? src0 : [src0];
    const mats = [];
    for (let i = 0; i < srcMats.length; i++) {
      const sm = srcMats[i];
      if (!sm) { mats.push(null); continue; }
      const op = (sm && sm.userData) ? sm.userData.outlineParameters : null;
      /* ★ 默认可见性：
         · MMD：看 PMX 的 edgeFlag（op.visible）—— 没有该字段说明这材质本来就不描边
         · glTF：材质没有 outlineParameters，**默认给描边**（否则整只模型一个描边都没有，
                 实测 visible=0 就是这个原因） */
      const visible = op ? !!op.visible : isGltfModel;
      /* 相对系数：模型自带 thickness 越小（如 0.003），这里越小 */
      const k = op ? Math.max(0.25, Math.min(3.0, (op.thickness || 0.003) / 0.003)) : 1;
      /* ★ 颜色优先级：用户自定义 > 贴图取色 > 模型自带(MMD edgeColor) > 黑 */
      const hasOwnColor = !!(op && op.color);
      const modelCol = hasOwnColor ? op.color : [0, 0, 0];
      /* ★★★ "跟随模型" = 从这张贴图上取色（见 averageTextureColor 的长注释）★★★
         每个材质/每个部位各取各的 → 不同部位描边颜色不同（需求） */
      /* ★ 贴图模式不需要取色（颜色来自贴图）→ 跳过昂贵的 canvas 采样
         （见 outlineTextureTintFor 里"卡死事故"的复盘） */
      const useTex0 = OUTLINE_TEXTURED && !!(sm && sm.map);
      const autoCol = useTex0 ? modelCol : autoOutlineColorOf(sm, modelCol, srcMesh.geometry);
      const col = OUTLINE_COLOR ? OUTLINE_COLOR : autoCol;
      /* ★ 模型声明的 alpha（MMD 的 edgeColor[3]）× 用户滑块 */
      const alpha = ((op && op.alpha !== undefined) ? op.alpha : 1) * OUTLINE_ALPHA;

      /* ★★★ 方案 A：描边直接显示源贴图（按像素上色）★★★
         ---- 原理 ----
         描边 mesh 与源 mesh **共享 UV**（MMD 共享 geometry；
         glTF 的 makeOutlineGeometry 会把除 position 外的属性全部共享引用）。
         所以给描边材质挂上同一张 `map`，每个像素就会取到它自己那块贴图颜色
         → 紫花描边是紫的、头发描边是白的，天然"按部位"。
         ---- 为什么性能没问题 ----
         贴图已在显存里（同一个 Texture 对象，不复制）；
         drawcall / 顶点数 / uniform 数量都不变。
         ---- 颜色怎么压暗 ----
         纯色方案靠改 material.color 压暗；这里改为
         `material.color = 压暗倍数`（乘法着色，three 的 map 与 color 是相乘的），
         所以深度/饱和度滑块**照旧生效**，只是作用在整张贴图上。
         ---- 例外 ----
         若该材质没有 map（少数 MMD 用纯色材质），退回原来的单色方案。 */
      const useTexture = useTex0;
      const shadeK = useTexture ? outlineTextureTintFor() : 1;
      const m = new THREE.MeshBasicMaterial({
        /* ★ 同上：PMX edgeColor / 贴图取色都是 sRGB 值 */
        color: new THREE.Color().setRGB(
          useTexture ? shadeK : col[0],
          useTexture ? shadeK : col[1],
          useTexture ? shadeK : col[2],
          THREE.SRGBColorSpace),
        side: THREE.BackSide,
        transparent: alpha < 0.999,
        opacity: alpha,
        /* ★ 半透明描边【不能写深度】——
           否则那圈"看不见但挡光"的背面会遮住它后面的东西
           （和 §14.1/§16.3 半透明材质写深度是同一个坑）。
           depthTest 保持开启，所以模型本体照常遮住描边，不会穿帮。 */
        depthWrite: alpha >= 0.999,
        fog: false,
      });
      if (useTexture) {
        try {
          m.map = sm.map;                     // ★ 共享引用，不复制贴图
          /* ★ 描边是"背面外扩"，贴图上的透明区（头发镂空）必须剔除，
             否则整圈会变成不透明色块。 */
          m.alphaTest = (sm.alphaTest && sm.alphaTest > 0) ? sm.alphaTest : 0.3;
        } catch (e) { nerr('outline 挂贴图失败: ' + (e && e.message)); }
      }
      m.userData.__useTexture = useTexture;
      m.visible = visible;                    // ★ 模型自带的 edgeFlag 要尊重
      m.userData.__want = visible;            // 自检用：被别人改掉时能发现并装回
      m.userData.__outline = true;
      m.userData.__k = k;
      /* 模型声明的 alpha / 颜色（MMD 才有；glTF 恒为 1 / 黑）——
         __setOutlineAlpha / __setOutlineColor 要用它们当基数，
         这样"调淡/调色"不会把模型声明的信息丢掉（auto 时也才能还原）。 */
      m.userData.__baseAlpha = (op && op.alpha !== undefined) ? op.alpha : 1;
      /* ★ __baseColor 现在存的是"跟随模型时该用的颜色"（= 贴图取色 / edgeColor），
         __setOutlineColor('auto') 用它还原。 */
      m.userData.__baseColor = autoCol.slice();
      m.userData.__autoColor = autoCol.slice();
      m.userData.__edgeColor = modelCol.slice();

      /* ★★★ 两种实现按模型类型分叉（2026-10-07 设计上要求）★★★
         ---- MMD：沿用【原来的 shader 注入】----
         顶点着色器里 `transformed += objectNormal * uOutlineW`。
         它对这个项目里那些 PMX（含 PMX 的骨骼/材质型表情、MMD 多材质分组）
         已经验证过效果，**不要动**。宽度靠 uniform 实时改，调滑块很顺。
         ---- glTF：用【几何烘焙】----
         原因：glTF 的单 primitive mesh 只有 1 个材质且**没有 geometry.groups**，
         而 three.js 在 `Array.isArray(material)` 时会按 groups 遍历生成渲染项
         → 一个 drawcall 都不产生（静默不可见，真机 A/B 实测差值=0）。
         烘焙法不依赖任何自定义 shader，渲染路径与模型本体完全一致。
         （另外 glTF 材质走的是 MMD 没有的 alphaMode/MASK、且我们不该碰它的
           onBeforeCompile —— 见 applyAlphaTest 里的说明。） */
      if (isGltfModel) {
        /* glTF：什么都不注入，外扩在 geometry 里 */
        m.userData.__isMmd = false;
      } else {
        m.userData.__isMmd = true;
        m.userData.__u = { value: outlineLocalThickness() * k };
        m.onBeforeCompile = (shader) => {
          shader.uniforms.uOutlineW = m.userData.__u;
          shader.vertexShader =
            'uniform float uOutlineW;\n' + shader.vertexShader;
          shader.vertexShader = shader.vertexShader.replace(
            '#include <skinning_vertex>',
            '#include <skinning_vertex>\n\ttransformed += objectNormal * uOutlineW;'
          );
        };
        /* 自检标记：万一有别的 traverse 又给它设了 onBeforeCompile，
           外扩代码就没了（描边会与源网格完全重合 → 看不见）。 */
        m.userData.__ocMine = m.onBeforeCompile;
      }
      mats.push(m);
      outlineMats.push({ mat: m, k: k, visible: visible, src: sm, geo: srcMesh.geometry });
      /* ★ 诊断：拦截 color 的写入，记录"谁最终改掉了描边色"（曾出现"初始化时看见有，之后变灰"） */
      if (window.__traceOutlineColor) {
        try {
          const col = m.color;
          const wrap = (name) => {
            const orig = col[name] && col[name].bind(col);
            if (!orig) return;
            col[name] = function () {
              const st = (new Error()).stack || '';
              const line = (st.split('\n')[2] || '').trim().slice(0, 90);
              nlog('★outline色被改 ' + name + '(' + Array.from(arguments).map(x => typeof x === 'number' ? x.toFixed(2) : x).join(',') + ') @ ' + line);
              return orig.apply(null, arguments);
            };
          };
          ['setRGB', 'set', 'setHex', 'setStyle', 'copy'].forEach(wrap);
        } catch (e) {}
      }
    }

    /* 空的槽位补成不可见材质（保持材质下标与原网格一一对应） */
    for (let i = 0; i < mats.length; i++) {
      if (!mats[i]) {
        const dummy = new THREE.MeshBasicMaterial({ visible: false });
        dummy.userData.__outline = true;
        mats[i] = dummy;
      }
    }
    totalMats += mats.length;
    /* ★ geometry 也按类型分叉：
       · glTF → 新建一份"烘焙了外扩"的（并把原 geometry 设为自有，可释放）
       · MMD  → 共享原 geometry（外扩在 shader 里做）★ 绝不能修改共享几何！ */
    let G, ownGeo = false;
    if (isGltfModel) {
      G = makeOutlineGeometry(srcMesh.geometry, outlineLocalThickness());
      ownGeo = true;
    } else {
      G = srcMesh.geometry;
    }
    if (!G) { nerr('outline: ' + (srcMesh.name || '?') + ' 没有可用 geometry，跳过'); continue; }
    /* ★★★ 只有一个材质时必须传【单个材质】，不能传数组 ★★★
       ---- 这就是"GLB 描边看不见"的真正根因（2026-10-07，真机 A/B 定位）----
       真机诊断：`带描边 drawcall=9 / 隐藏描边 drawcall=9 / 差值=0`
       —— 24 个描边 mesh 一个都没进绘制，而它们 visible=true、材质也正常。
       原因：传数组时 three.js 走 `Array.isArray(material)` 分支，
            它**按 `geometry.groups` 遍历**来 push 渲染项：
                const groups = geometry.groups;
                for (...) { const groupMaterial = material[group.materialIndex]; ... push }
       glTF 的单 primitive mesh **没有 groups**（groups 是 []）→ 循环零次
       → 一个渲染项都不产生 → 完全不可见。
       （MMD 那边之所以正常：MMDLoader 的材质本来就是多材质数组、
         geometry 也带 groups，所以躲过了这个坑。）
       修法：长度 1 → 传单材质（走 `material.visible` 那条正常分支）；
             长度 >1 → 传数组，并确保 geometry 带 groups（见 makeOutlineGeometry）。 */
    const matArg = (mats.length === 1) ? mats[0] : mats;
    const om = srcMesh.isSkinnedMesh
      ? new THREE.SkinnedMesh(G, matArg)
      : new THREE.Mesh(G, matArg);
    om.name = '__outlineMesh';
    om.frustumCulled = false;                 // 膨胀后包围盒会略大，别被裁
    om.castShadow = false;
    om.receiveShadow = false;
    om.userData.__outline = true;
    om.userData.__src = srcMesh;      // 每帧从这个源网格复制表情权重
    /* ★ 只有我们自己新建的 geometry 才能 dispose；
       MMD 用的是共享的原 geometry，释放它会把模型本体一起弄坏。 */
    om.userData.__ownGeo = ownGeo;
    /* ★ 共享同一个 skeleton / bindMatrix → 骨骼动画与表情完全同步 */
    if (srcMesh.isSkinnedMesh) {
      try { om.bind(srcMesh.skeleton, srcMesh.bindMatrix); } catch (e) {
        nerr('outline bind failed: ' + (e && e.message));
      }
    }
    /* ★★★ 必须挂在【独立 outlineRoot】，绝不能挂到 model 下面 ★★★
       ---- 事故复盘（2026-10-07，曾出现"GLB 描边看不见"）----
       文档 §22 就明确写过这一条（"model 下有 20 多处 model.traverse() 在处理材质，
       多出来的 mesh 会被全部误处理"）。
       可 §23.10 做 glTF 支持时改成了 `srcMesh.parent.add(om)`，而 glTF 的
       mesh 节点恰好都是 gltf.scene 的直接子级 → 等于把描边 mesh 挂进了 model，
       §22 特意避开的坑又被踩回来了（描边材质会被各种 traverse 当成"模型材质"
       去处理，比如重新设 onBeforeCompile / 改 visible / 改 opacity）。
       现在统一挂到 outlineRoot，并用【世界矩阵】保持与源网格完全一致的位置。 */
    om.matrixAutoUpdate = false;
    om.matrix.copy(srcMesh.matrixWorld);
    om.userData.__srcMtx = srcMesh.matrixWorld;   // 引用，每帧比对用
    root.add(om);
    }   /* end for (const srcMesh of meshes) */
    /* outlineRoot 自身保持恒等变换：描边 mesh 存的就是世界矩阵 */
    root.matrixAutoUpdate = false;
    root.matrix.identity();
    scene.add(root);
    outlineRoot = root;

    const vis = outlineMats.filter(o => o.visible).length;
    nlog('outline: 建立完成，' + meshes.length + ' 个 mesh / 材质 '
      + outlineMats.length + ' 个（可见 ' + vis + '），宽度 '
      + OUTLINE_W + '（局部厚度 ' + (outlineLocalThickness()).toFixed(4) + '）');
    window.__outlineInfo = function () {
      return JSON.stringify({
        on: OUTLINE_ON, width: OUTLINE_W,
        mats: outlineMats.length,
        visible: outlineMats.filter(o => o.visible).length,
        localThickness: +outlineLocalThickness().toFixed(5),
      });
    };
    /* ★ 贴图可能还没解码完（构建描边时 averageTextureColor 拿到 null）。
       一次性的补取色：1.2 秒后重算一遍颜色（只改 color，不重建 mesh，开销可忽略）。 */
    setTimeout(function () {
      try {
        clearTextureColorCache();
        refreshAutoOutlineColors('late');
        if (!window.__satTested) {
          window.__satTested = 1;
          try { window.__auditPart(''); } catch (e) {}
          try { window.__auditAll(); } catch (e) {}
        }
        /* 三档自检默认不跑（要验时手动 window.__outlineDepthTest()） */
        /* （诊断残留已移除：以前这里会自动 __outlineForceRed 把描边刷成纯红，
           每 1.2s 覆盖一次正常取色 —— 用户看到的"变红一下"就是它。
           需要手动验证时调用 window.__outlineSceneDump() / __outlineForceRed()） */
      } catch (e) {}
      /* ★ 诊断：即使用户自定义了颜色，也算一遍"如果跟随模型会是什么色"，
         这样日志里能直接确认贴图取色到底成不成功（不改变任何实际渲染）。 */
      if (OUTLINE_COLOR) {
        try {
          const s2 = [];
          for (let i = 0; i < Math.min(outlineMats.length, 6); i++) {
            const o = outlineMats[i];
            if (!o || !o.src) continue;
            const op = o.src.userData ? o.src.userData.outlineParameters : null;
            const c = autoOutlineColorOf(o.src, (op && op.color) ? op.color : [0, 0, 0], o.geo);
            s2.push('#' + toHexColor(c).slice(1));
          }
          nlog('描边取色自检（当前是自定义色，未应用）: ' + s2.join(' '));
        } catch (e) {}
      }
    }, 1200);
  } catch (e) {
    nerr('buildOutlines failed: ' + (e && e.message));
    disposeOutlines();
  }
}

/**
 * 重算"跟随模型"的描边颜色（贴图刚加载完 / 换模型时用）。
 * ★ 只改材质 color，不重建 mesh —— 描边宽度/几何都不动，用户看不出闪烁。
 */
function refreshAutoOutlineColors(tag) {
  if (OUTLINE_COLOR) return 0;          // 用户自定义了颜色 → 不覆盖
  let n = 0;
  const used = [];
  for (const o of outlineMats) {
    try {
      if (!o || !o.mat || !o.src) continue;
      if (o.mat.userData.__useTexture) {
        /* ★★★ 贴图模式：**完全不取色**，只更新整体染色倍数 ★★★
           ---- 为什么（卡死事故，2026-10-17）----
           原来这里对每个材质调 autoOutlineColorOf()（逐三角形 UV 光栅化 +
           canvas 读 16384 像素 + 排序）。13 个材质、拖滑块时每次 input 都重跑，
           主线程被占满 → 心跳与渲染循环一起停 → **画面冻结**；
           而且连看门狗自己也是 setInterval，一起停了，救不了自己。
           而贴图模式下这些计算**完全没用** —— 颜色来自贴图，只需一个倍数。
           现在这里是 O(材质数) 的纯赋值，开销可忽略。 */
        const k2 = outlineTextureTintFor();
        o.mat.color.setRGB(k2, k2, k2, THREE.SRGBColorSpace);
        o.mat.needsUpdate = true;
        n++;
        if (used.length < 4) used.push('×' + k2.toFixed(2));
        continue;
      }
      const op = (o.src.userData) ? o.src.userData.outlineParameters : null;
      const edge = (op && op.color) ? op.color : [0, 0, 0];
      const c = autoOutlineColorOf(o.src, edge, o.geo);
      o.mat.userData.__baseColor = c.slice();
      o.mat.userData.__autoColor = c.slice();
      o.mat.color.setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
      o.mat.needsUpdate = true;
      n++;
      if (used.length < 4) used.push('#' + toHexColor(c).slice(1));
    } catch (e) {}
  }
  if (n) nlog('描边取色(' + tag + '): 已更新 ' + n + ' 个材质，样例 ' + used.join(' '));
  /* ★ 对照诊断：贴图原色（sRGB）→ 描边色（sRGB），一眼看出取色是不是"像" */
  try {
    if (window.__outlineDump) {
      const rows = [];
      for (let i = 0; i < Math.min(outlineMats.length, 13); i++) {
        const o = outlineMats[i];
        if (!o || !o.src || !o.src.map) continue;
        const ui = o.geo ? uvBoundsOf(o.geo) : null;
        const rawC = averageTextureColor(o.src.map, ui);
        if (!rawC) continue;
        const sh = toOutlineShade(rawC);
        rows.push('#' + i + ' 贴图' + toHexColor(rawC) + ' → 描边' + toHexColor(sh));
      }
      nlog('描边取色对照(深度=' + OUTLINE_DEPTH + '):\n    ' + rows.join('\n    '));
    }
  } catch (e) {}
  /* ★ 详细清单（排查"看起来都一个颜色"用）：每个材质的最终色 + 是否有贴图 + 贴图名 */
  try {
    if (window.__outlineDump) {
      const lines = outlineMats.map((o, i) => {
        const c = o.mat && o.mat.color ? toHexColor([o.mat.color.r, o.mat.color.g, o.mat.color.b]) : '?';
        let sv = '';
        try {
          const mc = o.mat.color;
          const mx = Math.max(mc.r, mc.g, mc.b), mn = Math.min(mc.r, mc.g, mc.b);
          sv = ' S=' + (mx > 0 ? ((mx - mn) / mx).toFixed(2) : '0');
        } catch (e) {}
        const tex = (o.src && o.src.map && o.src.map.image)
          ? (o.src.map.image.src || '').split('/').pop() : '无贴图';
        return '#' + i + ' ' + c + sv + ' ' + tex;
      });
      nlog('描边清单(' + tag + ') 深度=' + OUTLINE_DEPTH + ' 自定义='
        + (OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto') + '\n    ' + lines.join('\n    '));
    }
  } catch (e) {}
  return n;
}

/* ============================================================
   ★★★ 动画层看门狗（2026-10-07）：防"整层停摆 → 嘴消失" ★★★
   ------------------------------------------------------------
   症状：曾出现"嘴巴又不见了"，而嘴的可见性**完全依赖待机动画在跑**
   （见 vmdEndOneShot 里的长注释：morph 权重 1=塌缩、0=可见，
     14 个嘴里恰好要有一个是 0，而这个 0 是动画每帧写的）。
   任何一条把某层淡出后没播回来的路径，都会让权重冻结
   → 冻在"全 1"那一瞬就是嘴巴消失。

   已经修掉了已知的那条漏恢复路径（vmdEndOneShot 的 early-return），
   但这个类别的 bug 太容易再冒出来（历史上有 2 次漏恢复），
   所以再加一道兜底：**每秒检查"当前层有没有动作真的在跑"**，
   没有就把它重新播起来（不行就退回 idle）。
   ★ 只在本层"应该有动画"时才介入：
     · 没配动作的层不管（本来就不该跑）
     · 在 'oneshot' 层时不管（一次性动作由它自己的超时/结束事件负责）
     · 正在顺序播放（chain）时不管
   ============================================================ */
setInterval(function () {
  try {
    if (!vmd.mixer || !model) return;
    const L = vmd.layer;
    if (L === 'oneshot') return;
    if (!vmdSlotReady(L)) return;
    if (vmd.chain && vmd.chain.slot === L) return;
    if (vmdAnyRunning(L)) return;                       // 有在跑 → 正常
    vmdLog('★动画层看门狗：层 ' + L + ' 没有任何动作在跑（权重被淡出后没恢复？）→ 重新播');
    vmdPlayList(L, 0.12);
    if (!vmdAnyRunning(L) && L !== 'idle' && vmdSlotReady('idle')) {
      vmd.layer = 'idle';
      vmdPlayList('idle', 0.12);
      vmdLog('★动画层看门狗：层 ' + L + ' 仍播不起来，退回 idle');
    }
  } catch (e) {}
}, 1000);

/* ============================================================
   ★ 描边自检（2026-10-07）
   ------------------------------------------------------------
   曾出现"GLB 描边看不见"。已定位的主因是【描边 mesh 被挂在了 model 下面】
   （违背文档 §22 的明确结论），会被 model 上的二十多处 traverse 当成
   "模型自己的材质"去处理。
   这段自检的意义：把"静默失效"变成**看得见的日志**，并顺手自动修复。
   跑前 6 次（约 18 秒）就能覆盖"模型加载 + 材质处理"的全部时机。
   ============================================================ */
let _ocChecks = 0;
setInterval(function () {
  try {
    if (!OUTLINE_ON || !outlineRoot || !model) return;
    if (_ocChecks >= 6) return;
    _ocChecks++;
    let hid = 0, fixedVis = 0, arrMat = 0, noGroup = 0, ocOverwritten = 0;
    for (const o of outlineRoot.children) {
      if (!o.userData || !o.userData.__outline) continue;
      const arr = Array.isArray(o.material);
      if (arr) arrMat++;
      const groups = (o.geometry && o.geometry.groups) ? o.geometry.groups.length : 0;
      /* ★★ 数组材质 + 空 groups = three.js 一个渲染项都不产生（静默不渲染）★★
         这就是 2026-10-07 "GLB 描边看不见"的根因：
         传数组时 three.js 按 `geometry.groups` 遍历，而 glTF 单 primitive 的
         mesh 没有 groups → 循环零次 → 完全不可见。
         写成日志，免得以后再栽。 */
      if (arr && groups === 0) noGroup++;
      const ms = arr ? o.material : [o.material];
      for (const m of ms) {
        if (!m || !m.userData || !m.userData.__outline) continue;
        /* ★ MMD 走 shader 注入 → 检查注入有没有被别人覆盖
           （glTF 走几何烘焙，没有 onBeforeCompile，跳过这项） */
        if (m.userData.__isMmd && m.onBeforeCompile !== m.userData.__ocMine) {
          ocOverwritten++;
          m.onBeforeCompile = m.userData.__ocMine;
          m.needsUpdate = true;
        }
        if (m.userData.__want !== undefined && m.visible !== m.userData.__want) {
          hid++;
          m.visible = m.userData.__want;
          fixedVis++;
        }
      }
    }
    /* ★ 一锤定音：描边到底有没有被【画出来】★
       手动渲染两帧 —— 一帧带描边、一帧把 outlineRoot 隐藏，
       比较 renderer.info.render.calls 的差值 = 描边的 drawcall 数。
       差值 ≈ 描边 mesh 数 → 确实在画（那么"看不见"就只能是太细/被挡）；
       差值 = 0        → 根本没进绘制（材质没编译成功 / 被 cull / visible=false）。
       ★ 这个诊断只在自检第 3 次跑一次，避免干扰主循环。 */
    if (_ocChecks === 3) {
      try {
        const same = (a, b) => a && b && a.every((v, i) => Math.abs(v - b[i]) < 1e-4);
        let mtxOk = 0, mtxBad = 0;
        for (const o of outlineRoot.children) {
          const src = o.userData.__src;
          if (src && same(o.matrixWorld.elements, src.matrixWorld.elements)) mtxOk++; else mtxBad++;
        }
        renderer.render(scene, camera);
        const withOutline = renderer.info.render.calls;
        outlineRoot.visible = false;
        renderer.render(scene, camera);
        const without = renderer.info.render.calls;
        outlineRoot.visible = true;
        nlog('outline A/B: 带描边 drawcall=' + withOutline
          + ' 隐藏后=' + without + ' 差值=' + (withOutline - without)
          + ' (描边 mesh 数=' + outlineRoot.children.length + ')'
          + ' | 矩阵同步 ok=' + mtxOk + ' bad=' + mtxBad);
      } catch (e) { nerr('outline A/B failed: ' + (e && e.message)); }
    }
    nlog('outline 自检#' + _ocChecks
      + ' meshes=' + outlineRoot.children.length
      + ' visible被改=' + hid + '(已修' + fixedVis + ')'
      + ' 注入被覆盖=' + ocOverwritten
      + ' 数组材质=' + arrMat + ' 空groups=' + noGroup
      + ' rootInScene=' + (outlineRoot.parent ? 'y' : 'n')
      + ' 厚度=' + outlineLocalThickness().toFixed(4)
      + ' tri=' + (renderer.info.render.triangles | 0));
  } catch (e) {}
}, 3000);

/**
 * 生成"描边用"的 geometry：把顶点沿法线向外推 thickness。
 *
 * ★★ 为什么用几何烘焙而不是 shader 注入（2026-10-07，真机 A/B 实测后改）★★
 *   注入版实测 `带描边 drawcall=9 / 隐藏后=9 / 差值=0` —— 一个描边 mesh 都没画。
 *   而烘焙法的渲染路径与模型本体**完全一致**（普通 MeshBasicMaterial +
 *   普通 BufferGeometry），不存在"因为自定义 shader 而静默不渲染"的可能。
 *
 * ★ 只新建 position 一份数据，其余属性（normal / uv / skinIndex / skinWeight /
 *   index / morphAttributes）全部【共享引用】—— 显存只多几百 KB。
 * ★ morphAttributes 共享是安全的：three.js 的 morph 是
 *   `transformed = base * influence + Σ w_i * morphAttr_i`，属于【累加】，
 *   我们把外扩加进 base position 后它依然保留 → 表情动、描边跟着动。
 * ★ 必须重算 boundingSphere：外扩后包围球变大，不重算可能被视锥剔除。
 */
function makeOutlineGeometry(srcGeo, thickness) {
  try {
    if (!srcGeo || !srcGeo.attributes || !srcGeo.attributes.position) return null;
    const pos = srcGeo.attributes.position;
    const nor = srcGeo.attributes.normal;
    const n = pos.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      if (nor) {
        x += nor.getX(i) * thickness;
        y += nor.getY(i) * thickness;
        z += nor.getZ(i) * thickness;
      }
      arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = z;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    for (const k in srcGeo.attributes) {
      if (k === 'position') continue;
      g.setAttribute(k, srcGeo.attributes[k]);      // 共享引用，不复制
    }
    if (srcGeo.index) g.setIndex(srcGeo.index);
    if (srcGeo.morphAttributes) g.morphAttributes = srcGeo.morphAttributes;
    g.morphTargetsRelative = srcGeo.morphTargetsRelative;
    /* ★★ 必须复制 groups ★★
       three.js 在 `Array.isArray(material)` 时**按 geometry.groups 遍历**来生成渲染项；
       groups 为空 = 一条都不 push = **一个 drawcall 都没有**（mesh 完全不见）。
       这里手写的 geometry 默认 groups 是 [] —— 所以一定要带上源 geometry 的 groups。 */
    if (srcGeo.groups && srcGeo.groups.length) g.groups = srcGeo.groups;
    g.computeBoundingSphere();
    return g;
  } catch (e) {
    nerr('makeOutlineGeometry failed: ' + (e && e.message));
    return null;
  }
}

/**
 * 设置描边透明度 0~100（100 = 完全不透明）。
 *
 * ★ 不需要重建几何/材质 —— opacity 是普通材质属性，直接改就实时生效
 *   （MMD 与 glTF 两条路径都一样）。
 * ★ 从"不透明 → 半透明"时必须同步打开 transparent，并关掉 depthWrite；
 *   反过来则要恢复，否则会留下"半透明挡板"（历史上踩过）。
 */
window.__setOutlineAlpha = function (a) {
  const x = parseFloat(a);
  if (!isFinite(x)) return Math.round(OUTLINE_ALPHA * 100);
  OUTLINE_ALPHA = Math.max(0, Math.min(1, x > 1 ? x / 100 : x));
  for (const o of outlineMats) {
    try {
      const m = o.mat;
      /* 模型自带 alpha 也要一起乘（MMD 的 edgeColor[3]） */
      const base = (m.userData.__baseAlpha !== undefined) ? m.userData.__baseAlpha : 1;
      const alpha = base * OUTLINE_ALPHA;
      m.opacity = alpha;
      m.transparent = alpha < 0.999;
      m.depthWrite = alpha >= 0.999;
      m.needsUpdate = true;
    } catch (e) {}
  }
  nlog('outline 透明度 -> ' + Math.round(OUTLINE_ALPHA * 100) + '%'
    + '（影响 ' + outlineMats.length + ' 个材质）');
  return Math.round(OUTLINE_ALPHA * 100);
};

/* ============================================================
   ★★★ 描边「跟随模型」= 从贴图取色（2026-10-17 需求）★★★
   ------------------------------------------------------------
   ---- 需求 ----
   "描边颜色选择跟随模型时，描边颜色就应该从模型当前的贴图上取色，
     每一个不同部位的描边颜色都不同。"
   ---- 为什么能做 ----
   资源全部走 WebViewAssetLoader（https://appassets.androidplatform.net），
   是**同源**的 → canvas drawImage + getImageData **不会被判污染**。
   （如果哪天改成 file:// 加载，getImageData 会抛 SecurityError，
     这里已经 catch 住并退回"模型自带 edgeColor"，不会崩。）
   ---- 做法 ----
   ① 每个材质取它的 `map`（MMD/glTF 都是标准贴图字段）
   ② 把贴图画进 24×24 的小 canvas，读像素
   ③ **按 alpha 加权**求平均：头发贴图有大片透明区，不剔除会把颜色冲淡成白色
   ④ 转成"同色相、压暗"的描边色（MMD 描边的传统做法），
      压暗到 L≈0.30 保证在任何背景上都看得见
   ⑤ 结果按 texture.uuid 缓存 —— 57 个材质、一张贴图可能被多个材质共用，
      不缓存会重复读几十次像素
   ---- 优先级 ----
   用户自定义色 > 贴图取色 > 模型自带 edgeColor（PMX）> 黑
   ============================================================ */

/**
 * ★★★ 按【UV 区域】取色（2026-10-17，解决"全部描边同一个颜色"）★★★
 *
 * ---- 事故复盘（实测"全部描边看起来都是同一个颜色"）----
 * 第一版是**整张贴图求平均**。对 MMD（每个材质往往有自己的贴图）还凑合，
 * 但对这个 GLB 完全失效：蔚蓝档案这类模型普遍是 **一张 atlas 贴图**覆盖全部部件，
 * 13 个材质都指向同一张图 → 平均色当然一模一样
 * （日志实测：`#74b508 #ad1d10 #963e27 #8f3e2d` 看起来不同，
 *   但那只是因为 MMD 模型贴图不同；换成单 atlas 的 GLB 就全一致了）。
 *
 * ---- 正解 ----
 * 每个材质在 atlas 上只占**一块 UV 矩形**，按那个矩形取色才有区分度。
 *   ① 读该 mesh 的 `geometry.attributes.uv`
 *   ② 求 UV 包围盒（clamp 到 [0,1]，UV 可能因 tiling 超出）
 *   ③ 把贴图画进 128×128 canvas，**只统计落在该矩形内**的像素
 *   ④ 按 alpha 加权（头发镂空区不参与）
 * 对 MMD 也适用：PMX 材质的 UV 通常铺满整张图 → 等价于整图取色，不会变差。
 *
 * ★ 缓存 key 必须包含 UV 矩形：同一张 atlas 的不同区域也是不同颜色。
 */
window.__outlineDump = false;  // 排查用：打印 贴图原色→描边色 对照
window.__traceOutlineColor = false;  // 记录描边色写入来源（排查用，默认关）
const _texAvgCache = new Map();      // key → [r,g,b] 0~1 或 null
function clearTextureColorCache() { _texAvgCache.clear(); }

/**
 * ★ 描边深度自检：把同一批材质在 0 / 60 / 100 三档下的颜色打出来。
 * 用来回答"深度滑块到底有没有生效"（曾出现"一点用都没有"）。
 * 只算不应用 —— 打印完恢复原来的 OUTLINE_DEPTH，不影响渲染。
 */
/**
 * ★★★ 场景真值 dump（2026-10-17）★★★
 * ---- 为什么要它 ----
 * 实测"紫色的花描边是黑色，肉色的腿描边也是黑色"，
 * 但 `refreshAutoOutlineColors` 的日志显示 13 个材质都是彩色的
 * （#f9cc66 / #b73724 / #dd3c2a …）。
 * → 说明**我们改的那批材质 ≠ 实际在渲染的那批**。
 * 可能的原因（都要靠这份 dump 排除）：
 *   · buildOutlines 被跑第二次，旧的 outlineMats 被清空/替换，而新材质停在构建时的兜底色
 *   · 实际渲染的 mesh 材质被别的流程（三渲二 / alphaTest / 色阶注入）换掉或改了 vertexColors
 *   · 材质 visible=false（被当成"空槽位 dummy"），真正画的是另一个 mesh
 * 这个函数**不看 outlineMats**，直接遍历 scene 里带 __outline 标记的 mesh，
 * 读它的 material.color / visible / vertexColors —— 也就是眼睛看到的那一份。
 */
window.__outlineSceneDump = function (tag) {
  const arr = [];
  try {
    scene.traverse(o => {
      if (!o || !o.userData || !o.userData.__outline) return;
      if (!o.isMesh && !o.isSkinnedMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) {
        if (!m) { arr.push('(null材质)'); continue; }
        const c = m.color ? ('#' + toHexColor([m.color.r, m.color.g, m.color.b]).slice(1)) : '无color';
        arr.push((o.name || '?') + (o.isSkinnedMesh ? '[skin]' : '[mesh]')
          + ' vis=' + (m.visible ? 1 : 0)
          + ' op=' + (m.opacity !== undefined ? m.opacity.toFixed(2) : '?')
          + ' ' + c
          + (m.map ? ' map' : '')
          + (m.vertexColors ? ' ★顶点色' : '')
          + ' type=' + (m.type || '?'));
      }
    });
  } catch (e) { nerr('场景 dump 失败: ' + (e && e.message)); }
  nlog('★场景描边真值(' + tag + '): ' + arr.length + ' 个\n    ' + arr.join('\n    '));
};

/** 决定性 A/B：把场景里所有描边材质强制成纯红。若画面不变红，说明我们改的不是渲染用的材质。 */
window.__outlineForceRed = function () {
  let n = 0;
  try {
    scene.traverse(o => {
      if (!o || !o.userData || !o.userData.__outline) return;
      if (!o.isMesh && !o.isSkinnedMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) {
        if (!m || !m.color) continue;
        m.color.setRGB(1, 0, 0);
        m.needsUpdate = true;
        n++;
      }
    });
  } catch (e) {}
  nlog('★已强制 ' + n + ' 个【场景内】描边材质为纯红（画面应明显变红）');
  return n;
};

window.__outlineDepthTest = function () {
  const keep = OUTLINE_DEPTH;
  const out = [];
  for (const dv of [0, 60, 100]) {
    OUTLINE_DEPTH = dv;
    const cols = [];
    for (let i = 0; i < Math.min(outlineMats.length, 5); i++) {
      const o = outlineMats[i];
      if (!o || !o.src) continue;
      const op = o.src.userData ? o.src.userData.outlineParameters : null;
      const c = autoOutlineColorOf(o.src, (op && op.color) ? op.color : [0, 0, 0], o.geo);
      cols.push(toHexColor(c));
    }
    out.push('深度' + dv + '=[' + cols.join(' ') + ']');
  }
  OUTLINE_DEPTH = keep;
  nlog('★描边深度自检: ' + out.join('  |  ') + '  （三档应该明显不同）');
};

/**
 * ★★★ 精确光栅化：算出"这个材质真正用到的贴图像素"（2026-10-17 第五次返工）★★★
 *
 * ---- 事故复盘（实测"紫花的描边一点都没变"）----
 * 之前用「UV 顶点网格 + 三角形包围盒覆盖」来近似。实测审计结果：
 *     Azusa_Original_Halo      bbox=[0.03,0.04 .. 0.97,0.99]
 *     Azusa_Original_Mouth_401 bbox=[0.03,0.17 .. 0.97,0.83]
 * → **每个材质都覆盖了整张 atlas**，等于又退回"整图求平均"。
 * 原因有两层：
 *   ① 顶点标记：一个材质的 UV 顶点本身就散布在多个 island 上（这是 atlas 的常态），
 *      只标顶点就已经铺满整图；
 *   ② 三角形"包围盒"覆盖：**包围盒不是三角形**！
 *      一个斜着的细三角形，它的包围盒可能覆盖大片无关区域，
 *      几千个三角形叠加后必然填满整张图。
 * → 所以"网格"这条路从根上就是错的，必须做**真正的三角形光栅化**。
 *
 * ---- 现在的做法 ----
 * 对每个三角形，在 128×128 的 UV 栅格上做**重心坐标测试**，
 * 只标"真的落在三角形内部"的格子。这样得到的就是这个材质精确的贴图占用，
 * 紫花的 island 是紫的、皮肤 island 是肉色的，互不污染。
 *
 * 开销控制：
 *   · 最多采样 2000 个三角形（足够覆盖所有 island，GPU 侧也是这么做的）
 *   · 每个三角形只在其包围盒内逐格测试，包围盒先夹到 64×64 的 range
 *   · 结果按 geometry.uuid 缓存 —— 13 个材质只会算 13 次
 */
const _uvMaskCache = new Map();

/**
 * @return { mask: Uint8Array(128*128), hit:number, u0,v0,u1,v1 } 或 null
 */
function uvCoverageOf(geo) {
  if (!geo) return null;
  if (_uvMaskCache.has(geo.uuid)) return _uvMaskCache.get(geo.uuid);
  let out = null;
  try {
    const uv = geo.attributes && geo.attributes.uv;
    if (!uv || !uv.count) { _uvMaskCache.set(geo.uuid, null); return null; }
    const N = 128;
    const mask = new Uint8Array(N * N);
    const idx = geo.index;
    const triCount = idx ? (idx.count / 3) : (uv.count / 3);
    if (!(triCount >= 1)) { _uvMaskCache.set(geo.uuid, null); return null; }
    /* ★ 采样上限 800（原 2000）：UV 光栅化是同步阻塞主线程的，
       更大的值只会让"看起来一样的结果"付出十倍代价。
       ---- 卡死事故（2026-10-17）----
       模型换大之后，13 个材质 × 2000 三角形 × 每三角形包围盒内逐像素，
       一次 refresh 就能占满主线程，导致渲染循环与心跳一起停（画面冻结）。
       现在：采样 800 + 全局格子预算 60000（见下面的 budget），
       最坏情况也被钉死在几万次加法内。 */
    const step = Math.max(1, Math.floor(triCount / 800));
    let budget = 60000;          // 全局格子检查预算（防止病态几何）
    let hit = 0;
    let u0 = 1, v0 = 1, u1 = 0, v1 = 0;
    const getUV = (k) => {
      const u = uv.getX(k), v = uv.getY(k);
      /* UV 的 wrap 用 mod 处理（tiling 贴图也能正确落到 0~1） */
      return [u - Math.floor(u), v - Math.floor(v)];
    };
    for (let t = 0; t < triCount; t += step) {
      let a, b, c;
      if (idx) { a = idx.getX(t * 3); b = idx.getX(t * 3 + 1); c = idx.getX(t * 3 + 2); }
      else { a = t * 3; b = t * 3 + 1; c = t * 3 + 2; }
      if (a >= uv.count || b >= uv.count || c >= uv.count) continue;
      const p0 = getUV(a), p1 = getUV(b), p2 = getUV(c);
      if (!isFinite(p0[0]) || !isFinite(p1[0]) || !isFinite(p2[0])) continue;
      /* 跨 wrap 的三角形跳过（极少，会引入噪点） */
      const du = Math.max(p0[0], p1[0], p2[0]) - Math.min(p0[0], p1[0], p2[0]);
      const dv = Math.max(p0[1], p1[1], p2[1]) - Math.min(p0[1], p1[1], p2[1]);
      if (du > 0.5 || dv > 0.5) continue;
      /* 三角形包围盒 → 只在盒内做重心测试（这才是"面"，不是"盒"） */
      const bx0 = Math.max(0, Math.floor(Math.min(p0[0], p1[0], p2[0]) * N));
      const bx1 = Math.min(N - 1, Math.ceil(Math.max(p0[0], p1[0], p2[0]) * N));
      const by0 = Math.max(0, Math.floor(Math.min(p0[1], p1[1], p2[1]) * N));
      const by1 = Math.min(N - 1, Math.ceil(Math.max(p0[1], p1[1], p2[1]) * N));
      const d = (p1[1] - p2[1]) * (p0[0] - p2[0]) + (p2[0] - p1[0]) * (p0[1] - p2[1]);
      if (Math.abs(d) < 1e-12) continue;
      for (let gy = by0; gy <= by1; gy++) {
        for (let gx = bx0; gx <= bx1; gx++) {
          if (--budget <= 0) { gy = by1 + 1; break; }   // ★ 预算耗尽 → 收工
          if (mask[gy * N + gx]) continue;
          const px = (gx + 0.5) / N, py = (gy + 0.5) / N;
          /* 重心坐标 */
          const w0 = ((p1[1] - p2[1]) * (px - p2[0]) + (p2[0] - p1[0]) * (py - p2[1])) / d;
          const w1 = ((p2[1] - p0[1]) * (px - p2[0]) + (p0[0] - p2[0]) * (py - p2[1])) / d;
          const w2 = 1 - w0 - w1;
          if (w0 < -1e-6 || w1 < -1e-6 || w2 < -1e-6) continue;   // 不在三角形内
          mask[gy * N + gx] = 1;
          hit++;
          if (px < u0) u0 = px; if (px > u1) u1 = px;
          if (py < v0) v0 = py; if (py > v1) v1 = py;
        }
      }
    }
    if (hit > 0) out = { mask: mask, N: N, hit: hit, u0: u0, v0: v0, u1: u1, v1: v1 };
  } catch (e) {
    nerr('uvCoverageOf 失败: ' + (e && e.message));
    out = null;
  }
  _uvMaskCache.set(geo.uuid, out);
  return out;
}

/** 兼容旧名字（外部还有地方调用 uvBoundsOf）。 */
function uvBoundsOf(geo) {
  const cov = uvCoverageOf(geo);
  if (!cov) return null;
  return { u0: cov.u0, v0: cov.v0, u1: cov.u1, v1: cov.v1,
           hit: cov.mask, hits: cov.hit, G: cov.N };
}

/**
 * 取"该材质在贴图上真正用到的那几块区域"的平均色。
 * @param tex    THREE.Texture
 * @param uvinfo uvBoundsOf() 的返回值，或 null（null = 整张图）
 *
 * 权重 = alpha × (1 + 2.2·sat²)：高饱和像素话语权更大，避免主色被过渡色冲淡；
 * 保留 1.0 的保底权重，纯白/纯黑的部件（鞋袜）也能取到自己的颜色。
 */
function averageTextureColor(tex, uvinfo) {
  if (!tex) return null;
  const key = tex.uuid + '|' + (uvinfo
    ? (uvinfo.hit ? ('uv' + uvinfo.hits) : 'bb' + uvinfo.u0.toFixed(3) + uvinfo.v0.toFixed(3))
    : 'all') ;
  if (_texAvgCache.has(key)) return _texAvgCache.get(key);
  let out = null;
  try {
    const img = tex.image;
    if (!img || !(img.width || img.videoWidth)) {
      /* ★ 诊断：贴图没就绪时明确打出来，否则会静默退回黑色（踩过） */
      if (!averageTextureColor._imgWarned) {
        averageTextureColor._imgWarned = 1;
        nerr('描边取色: 贴图未就绪 image=' + (img ? (img.constructor && img.constructor.name) : 'null')
          + ' w=' + (img ? img.width : '?') + ' src=' + (tex && tex.source ? 'y' : 'n'));
      }
      return null;
    }
    const N = 128;
    const cv = document.createElement('canvas');
    cv.width = N; cv.height = N;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;
    ctx.clearRect(0, 0, N, N);
    ctx.drawImage(img, 0, 0, N, N);
    const d = ctx.getImageData(0, 0, N, N).data;

    /* ★★★ 精确按 UV 覆盖取色（2026-10-17）★★★
       uvinfo.hit 现在来自 uvCoverageOf() 的**三角形光栅化结果**（128×128）。
       每个格子代表 UV 空间的一小块，只有"材质三角形真的盖到"的格子才参与平均。
       ---- 坐标系 ----
       UV 的 v 朝上，canvas 的 y 朝下 → 必须翻转，
       否则会取到镜像位置的颜色（踩过一次，13 个材质全变黑）。 */
    const G = (uvinfo && uvinfo.N) ? uvinfo.N : 128;
    const mask = uvinfo ? uvinfo.hit : null;
    /* 无 mask 时退回包围盒矩形 */
    let bx0 = 0, by0 = 0, bx1 = N - 1, by1 = N - 1;
    if (uvinfo && !mask) {
      bx0 = Math.max(0, Math.floor(uvinfo.u0 * N));
      bx1 = Math.min(N - 1, Math.ceil(uvinfo.u1 * N));
      by0 = Math.max(0, Math.floor((1 - uvinfo.v1) * N));
      by1 = Math.min(N - 1, Math.ceil((1 - uvinfo.v0) * N));
    }
    /* mask 的分辨率可能和 canvas 不同（都是 128 时最省事） */
    const ratio = G / N;

    /* ★★★ 主色提取：取"最饱和的那批像素"的平均，而不是全域平均（2026-10-17 定稿）★★★
       ---- 事故复盘（实测"紫花的描边还是灰的"）----
       全材质清单实测后发现根因：
         #7  EyeMouth  px=9692  均色#c6abce(淡紫灰)  最艳#f574d9(S0.53)  艳占比19%
       这个材质里同时装了**眼睛、嘴、发饰（紫花）**等多个 island。
       紫花只占 19% 的像素，全域平均后被 81% 的淡色像素稀释成灰紫
       → 看起来"紫花描边是灰的"。
       ★ 关键认知：**一个材质只能有一个描边颜色**（描边 mesh 是整块外扩轮廓），
         所以"紫花一个色、眼睛一个色"在物理上做不到 —— 除非作者把它们分成不同材质。
         能做的是：让这个材质取到**它最有代表性的颜色**，而不是中间色。
       ---- 做法 ----
       收集覆盖区内所有像素的饱和度，**按饱和度降序取前 25%**，对这部分的 RGB 求平均。
         · 紫花材质 → 鲜艳紫粉主导（#f574d9 附近）
         · 白发材质 → 全都很淡，前 25% 仍是淡蓝紫（合理）
         · 肤色材质 → 肤色主导
       这也是"主色提取"（dominant color）的标准做法。
       ---- 兜底 ----
       若前 25% 里全是透明/近黑（无效像素），退回全域平均。 */
    const samples = [];      // {s, r, g, b, w}
    for (let py = by0; py <= by1; py++) {
      for (let px = bx0; px <= bx1; px++) {
        if (mask) {
          const vv = 1 - (py + 0.5) / N;              // y 朝下 → v 朝上
          const gx = Math.min(G - 1, Math.max(0, Math.floor((px + 0.5) / N * G)));
          const gy = Math.min(G - 1, Math.max(0, Math.floor(vv * G)));
          if (!mask[gy * G + gx]) continue;           // 不在该材质的三角形内 → 跳过
        }
        const i = (py * N + px) * 4;
        const a = d[i + 3];
        if (a < 40) continue;                         // 透明区
        const lum0 = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
        if (lum0 < 16) continue;                      // 近黑（atlas 空白/描边线）
        const mx = Math.max(d[i], d[i + 1], d[i + 2]);
        const mn = Math.min(d[i], d[i + 1], d[i + 2]);
        const sat = mx > 0 ? (mx - mn) / mx : 0;
        let cr = d[i] / 255, cg = d[i + 1] / 255, cb = d[i + 2] / 255;
        if (_gradeUniforms) {
          const sh = hsvShift([cr, cg, cb], _gradeUniforms.sat.value,
                              _gradeUniforms.hue.value);
          cr = sh[0]; cg = sh[1]; cb = sh[2];
        }
        samples.push({ s: sat, r: cr, g: cg, b: cb, w: a / 255 });
      }
    }
    let r = 0, g = 0, b = 0, acc = 0;
    if (samples.length) {
      samples.sort((p1, p2) => p2.s - p1.s);
      const keepN = Math.max(1, Math.floor(samples.length * 0.25));
      for (let k2 = 0; k2 < keepN; k2++) {
        const q = samples[k2];
        r += q.r * q.w; g += q.g * q.w; b += q.b * q.w; acc += q.w;
      }
      /* 兜底：前 25% 权重和过小（几乎全透明）→ 退回全域 */
      if (acc < 1e-3) {
        r = 0; g = 0; b = 0; acc = 0;
        for (const q of samples) { r += q.r * q.w; g += q.g * q.w; b += q.b * q.w; acc += q.w; }
      }
    }
    if (acc > 1e-3) out = [r / acc, g / acc, b / acc];   // 已经是 0~1（见上面逐像素归一化）
    /* ★ 诊断：把命中情况打出来（前 14 次），用于确认网格是否真的覆盖到像素 */
    if (window.__outlineDump && (averageTextureColor._dbg = (averageTextureColor._dbg || 0) + 1) <= 14) {
      nlog('取色: ' + (out ? (toHexColor(out)) : 'NULL')
        + ' acc=' + acc.toFixed(2)
        + ' hits=' + (uvinfo ? uvinfo.hits : -1)
        + ' grid=' + (uvinfo && uvinfo.hit ? 'y' : 'n')
        + ' img=' + img.width + 'x' + img.height);
    }
  } catch (e) {
    if (!averageTextureColor._warned) {
      averageTextureColor._warned = 1;
      nerr('描边取色不可用（' + (e && e.message) + '）→ 退回模型自带描边色');
    }
    out = null;
  }
  _texAvgCache.set(key, out);
  return out;
}

/* ============================================================
   ★ 把"贴图取色"压成描边色
   ------------------------------------------------------------
   ★★★ 事故记录（2026-10-17）：这两个函数被误删过一次 ★★★
   我用「整块重写」的方式替换取色代码时，把本段（outlineDepthFactor /
   toOutlineShade）一起切掉了，导致运行时
       `autoColor 异常: toOutlineShade is not defined`
   → 每个材质都走 catch → 回退 fallback → **13 个描边全黑**。
   而我当时误判成"UV 坐标翻转错了""网格覆盖错了"，白改了两版。
   ★ 教训：报错日志里明明有异常信息（`autoColor 异常: ... is not defined`），
     却因为我把诊断日志埋在 `catch(e){}` 里、且只查了"颜色值"没查"异常"，
     多绕了两轮。**catch 里必须打日志**，排查时先看异常、再看数值。
   ============================================================ */
/* （原本这里有一对 HSL 临时对象，改用 RGB 等比乘法后不再需要，见 toOutlineShade） */

/** 深度 → 压暗比例（0=不压暗，1=压到近黑）。线性，跨度最大。 */
function outlineDepthFactor(depth) {
  const d = isFinite(depth) ? depth : OUTLINE_DEPTH;
  return Math.max(0, Math.min(100, d)) / 100;
}

/**
 * ★★★ 让"取色"和"眼睛看到的"是同一个东西（2026-10-17 实测发现的关键问题）★★★
 *
 * ---- 用户原话 ----
 * "你计算的贴图是没有经过任何饱和度更改的贴图吗？我怎么感觉这个描边颜色跟贴图
 *   颜色差距很大？这个贴图本身颜色就挺淡的，我拉饱和度到三以上才会变得好看一点。"
 *
 * ---- 他说得完全对，这是我的逻辑漏洞 ----
 * 屏幕上模型的颜色 = **贴图原色 → 饱和度/色相后处理（shader）**，
 * 而描边取色读的是 `material.map` 的**原始像素**，完全绕过了后处理。
 * 实测这个模型的饱和度是 4.13（用户为了好看调上去的）：
 *     贴图 #e9eaf5（几乎白的浅蓝）  ×4.13 → 屏幕上是很明显的蓝
 *     描边却按 #e9eaf5 算 → 灰扑扑的，和屏幕上的蓝完全不是一回事
 * → 这才是"描边颜色和贴图颜色差距很大"的真正原因。
 *
 * ---- 修法 ----
 * 在取平均色**之前**，对每个像素先套一遍和 shader 完全相同的 HSV 变换：
 *     S = clamp(S × mmdSaturation, 0, 1)
 *     H = fract(H + mmdHueShift)
 * 公式逐字对应 GRADE_GLSL 里的 `mmd_rgb2hsv` / `mmd_hsv2rgb`（都写在注释里可核对），
 * 这样描边取到的就是"后处理之后、屏幕上那种颜色"。
 *
 * ★ 注意：shader 里那一步是在 sRGB 空间做的（注入点在 encodings_fragment 之后），
 *   而 canvas 读出来的 8bit 像素也是 sRGB → **两边空间一致，无需再做转换**。
 * ★ 饱和度/色相一变就要清缓存（见 applyColorGradeAll 里的 clearTextureColorCache）。
 */
function hsvShift(rgb, satMul, hueShift) {
  if (!rgb) return rgb;
  if (Math.abs(satMul - 1) < 0.001 && Math.abs(hueShift) < 0.0001) return rgb;
  const r = rgb[0], g = rgb[1], b = rgb[2];
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const d = mx - mn;
  let h = 0;
  if (d > 1e-12) {
    if (mx === r) h = (g - b) / d;
    else if (mx === g) h = 2 + (b - r) / d;
    else h = 4 + (r - g) / d;
    h = h / 6;
    h = h - Math.floor(h);
  }
  const s = (mx <= 1e-12) ? 0 : d / mx;
  const v = mx;
  /* ★ 先乘主饱和度（跟随屏幕），再用 cap 钳上限（描边自己的闸门） */
  /* ★ 只跟随主饱和度（跟随屏幕）—— 描边饱和度独立滑块已按设计上要求删除。 */
  let s2 = s * satMul;
  s2 = Math.max(0, Math.min(1, s2));
  const h2 = h + hueShift;
  const hh = h2 - Math.floor(h2);
  const i = Math.floor(hh * 6);
  const f = hh * 6 - i;
  const p = v * (1 - s2);
  const q = v * (1 - s2 * f);
  const t = v * (1 - s2 * (1 - f));
  switch (i % 6) {
    case 0: return [v, t, p];
    case 1: return [q, v, p];
    case 2: return [p, v, t];
    case 3: return [p, q, v];
    case 4: return [t, p, v];
    default: return [v, p, q];
  }
}

/**
 * 把贴图色压成"描边色"。
 *
 * ★★★ 为什么现在用「RGB 等比乘法」而不是 HSL（2026-10-17 第三次返工）★★★
 * ---- 事故复盘（实测"描边颜色跟贴图颜色并不是很像"）----
 * 之前是把颜色转到 HSL，保留色相、重构饱和度与明度：
 *     l   = 原亮度 × (1-k) + 0.05k
 *     sat = 原饱和度 × (1.25 + 0.35k)      ← 这一行是灾难
 * 实测对照（同一批 13 个材质）：
 *     贴图 #e9eaf5（浅蓝白） → 描边 #3334b3（**高饱和深蓝**）   ← 完全不像
 *     贴图 #faecce（米白）   → 描边 #d69305（**金黄**）         ← 完全不像
 *     贴图 #eeddd8（浅粉白） → 描边 #ab4e2f（**橙红**）         ← 完全不像
 * 原因：HSL 的饱和度在"明度接近 1 或 0"时公式分母极小，**数值虚高**。
 *       #e9eaf5 肉眼是浅灰蓝，但 S 算出来是 0.376，
 *       再乘 1.44 → 0.54，压暗后就变成鲜艳的靛蓝。
 *       HSL 本来就不适合做"保持观感"的颜色运算。
 *
 * ---- 正解：等比乘法 ----
 *     outline = 贴图色 × f        f = 1 - 0.75k
 * 乘法的性质：
 *   · RGB 三通道同比缩小 → **色相永远不变**
 *   · 饱和度（相对比值）也天然保持 → 浅色只会整体变暗，绝不会变艳
 *   · 深色会更深，但不会溢出成纯黑（k=1 时 f=0.25）
 * 实测（同样这 13 个材质，k=0.55 → f=0.5875）：
 *     #e9eaf5 → #898990（灰蓝，和贴图同一色系）
 *     #faecce → #938b79（暖灰，可见且不突兀）
 *     #c0a9c8 → #706376（深灰紫，紫花仍能看出是紫的）
 *
 * ---- 深度滑块 ----
 *   k = 深度/100，f = 1 - 0.75k
 *     0   → f=1.00（描边就是贴图原色）
 *     55  → f=0.59（默认）
 *     100 → f=0.25（很暗，但保留色相，不是死黑）
 *   ★ 不再"纠正"用户设的值（11 就该是 11），保底只在这里做。
 */
function toOutlineShade(rgb) {
  if (!rgb) return null;
  const k = outlineDepthFactor(OUTLINE_DEPTH);
  const f = 1 - 0.75 * k;
  let out = [rgb[0] * f, rgb[1] * f, rgb[2] * f];

  /* ★★★ 亮度上限：保证描边"看得见"（2026-10-17 定稿）★★★
     ---- 实测"你不觉得这些描边全都是灰白吗？" ----
     他说得对，而这不是 bug，是**取色的数学必然**：
       白发 / 白衣服 / 白翅膀的贴图明度 0.9+，S≈0.05。
       再套饱和度（S×4.13→0.20），明度还是 0.92 → 深度 9 时描边就是 #d6d6d6。
       白色里没有色相可取，"跟随贴图"对白部位永远得到白/浅灰。
     ---- 先试过"低饱和才压暗"，不够 ----
     用 `S < 0.12` 做阈值时：白发/纯白能压，但
       米白 #faecce（S=0.176）、蓝白 #c4c4f5（S=0.20）**被漏掉**，仍然很亮、
       在浅色任务栏上几乎看不见。而紫花 S=0.155 反而和它们同档 —— 用饱和度分不开。
     ---- 最终方案：直接限制【亮度上限】----
       任何颜色，只要压暗后的亮度超过 hi，就整体等比缩到 hi。
       等比缩放 = 色相不变、饱和度（相对比值）不变 → 白的变中灰、蓝的变深蓝，
       全都保持"同色系"，同时保证在浅背景上看得见。
         hi = 0.58 - 0.38k
           深度 0   → 0.58（最接近原色，但仍保证可见）
           深度 9   → 0.55
           深度 55  → 0.37
           深度 100 → 0.20（近黑）
     ★ 这是唯一一个"对所有部位都成立"的判据，不再按部位/饱和度分类。 */
  const kk = k;
  const lum = 0.3 * out[0] + 0.59 * out[1] + 0.11 * out[2];
  const hi = 0.58 - 0.38 * kk;
  if (lum > hi && lum > 1e-6) {
    const g = hi / lum;
    out = [out[0] * g, out[1] * g, out[2] * g];
  }
  return out;
}

/**
 * ★ 贴图描边模式下，把"深度/亮度上限"折算成一个整体染色倍数。
 *
 * ---- 为什么只能是一个标量 ----
 * 纯色方案可以对每个材质算出不同颜色；而贴图模式下颜色来自贴图本身，
 * 我们能做的只有"整体乘一个系数"。所以：
 *   · 色相 / 部位差异 → 由贴图天然提供（这正是方案 A 的价值）
