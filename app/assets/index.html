<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>MMD Test</title>
<style>
  /* ------------------------------------------------------------------
     TRANSPARENCY LAYER 3 of 3.
     body AND canvas MUST both be transparent, otherwise the WebView paints
     an opaque rectangle over whatever is behind the Activity window.
     ------------------------------------------------------------------ */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;          /* <-- critical */
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  canvas {
    display: block; width: 100%; height: 100%;
    background: transparent;          /* <-- critical */
    outline: none;
    touch-action: none;               /* stop scroll/zoom gestures */
  }
  #err {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 8px; margin: 0;
    font: 12px/1.4 monospace; color: #fff; background: rgba(180,0,0,.85);
    white-space: pre-wrap; word-break: break-all; z-index: 10;
  }
  #err[hidden] { display: none; }

  /* ===================== 调试控制面板 ===================== */
  #panelBtn {
    position: fixed; right: 8px; top: 8px; z-index: 30;
    width: 44px; height: 44px; line-height: 44px; text-align: center;
    font-size: 22px; color: #fff; background: rgba(0,0,0,.55);
    border-radius: 22px; border: 1px solid rgba(255,255,255,.25);
    user-select: none; -webkit-user-select: none;
    display: none;   /* 桌宠模式默认隐藏，可用 __showPanelBtn(true) 唤出 */
  }
  #panel {
    position: fixed; right: 0; top: 56px; z-index: 30;
    width: 268px; max-height: 78vh; overflow-y: auto;
    padding: 10px 12px; color: #eee; font: 12px/1.5 monospace;
    background: rgba(20,20,24,.90); border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px 0 0 10px;
    display: none;
  }
  #panel h4 { margin: 8px 0 4px; font-size: 11px; color: #7fd4ff; letter-spacing: .5px; }
  #panel label { display: block; margin: 5px 0 1px; }
  #panel .row { display: flex; align-items: center; gap: 6px; }
  #panel input[type=range] { flex: 1; height: 22px; accent-color: #4aa3ff; }
  #panel .val { width: 46px; text-align: right; color: #9fe08a; }
  #panel .diag { white-space: pre-wrap; color: #ffd479; font-size: 11px;
                 background: rgba(255,255,255,.05); padding: 5px; border-radius: 4px; }
  #panel button {
    width: 100%; margin-top: 5px; padding: 7px; font: 12px monospace;
    background: #2b6cb0; color: #fff; border: 0; border-radius: 5px;
  }
  #panel select { width: 100%; margin-top: 3px; padding: 4px;
                  background: #333; color: #eee; border: 0; border-radius: 4px; }
  #panel input[type=checkbox] { margin-right: 5px; }

</style>
</head>
<body>
<div id="err" hidden></div>

<button id="panelBtn">&#9881;</button>
<div id="panel">
  <h4>光照 / 曝光</h4>
  <label>主光 key<div class="row"><input id="sKey" type="range" min="0" max="3" step="0.02" value="1.00"><span class="val" id="vKey"></span></div></label>
  <label>补光 rim<div class="row"><input id="sRim" type="range" min="0" max="2" step="0.02" value="0.40"><span class="val" id="vRim"></span></div></label>
  <label>环境光<div class="row"><input id="sAmb" type="range" min="0" max="2" step="0.02" value="0.55"><span class="val" id="vAmb"></span></div></label>
  <label>曝光<div class="row"><input id="sExp" type="range" min="0.2" max="2" step="0.01" value="1.0"><span class="val" id="vExp"></span></div></label>
  <label>饱和度<div class="row"><input id="sSat" type="range" min="0" max="5" step="0.01" value="1.0"><span class="val" id="vSat"></span></div></label>
  <label>色相偏移<div class="row"><input id="sHue" type="range" min="-0.5" max="0.5" step="0.005" value="0"><span class="val" id="vHue"></span></div></label>

  <h4>材质</h4>
  <!-- ★★★ 三渲二 / 卡通渲染（2026-10-08 设计上要求）★★★
       ---- 这个开关解决什么 ----
       MMD 的 MMDToonMaterial 本来就是 toon 着色（gradientMap 分档），
       所以 MMD 看起来已经是"动漫感"的；
       而 **glTF 用的是 PBR（MeshStandardMaterial）** —— 高光/环境反射都在，
       观感是"写实 3D 模型"，和 bluearchive.wiki 上那种"3D 但像 2D"差很远。
       本开关做三件事：
         ① glTF：把 PBR 材质换成 MeshToonMaterial + 硬色阶 gradientMap
         ② MMD：把渐变换成更"硬"的色阶（对比更强、更扁平）
         ③ 两种模型都加一盏专用【边缘光】—— 动漫描边高光的标志
       ---- 为什么不做完整的"二值化光照"着色器 ----
       那需要重写 Material 的光照模型，风险高，且会和已有的
       toon gradient / 颜色分级 / 材质表情打架。用 three 自带的
       MeshToonMaterial 是"最低风险拿到 90% 观感"的做法。 -->
  <label><input id="cToon2D" type="checkbox"> 三渲二（卡通渲染）</label>
  <div style="font-size:11px;opacity:.6;margin:2px 0 10px 0">
    glTF 会从"写实 PBR"切换成"色阶着色 + 边缘光"；MMD 本来已是卡通着色，
    打开后色阶更硬、并加边缘光。关掉即完全恢复原样。
  </div>
  <!-- ★ 三渲二「程度」：越小阴影越深（立体感强），越大越扁平（接近 2D 立绘） -->
  <label>三渲二程度（越大越扁平）<div class="row"><input id="sToon2DLv" type="range" min="0" max="100" step="1" value="50"><span class="val" id="vToon2DLv"></span></div></label>
  <label>镜面反射<div class="row"><input id="sSpec" type="range" min="0" max="1" step="0.01" value="0.12"><span class="val" id="vSpec"></span></div></label>
  <label>暗部(第一档)<div class="row"><input id="sToon" type="range" min="0" max="255" step="1" value="128"><span class="val" id="vToon"></span></div></label>

  <h4>诊断</h4>
  <label><input id="cRestPose" type="checkbox"> 冻结为「绑定姿态」（排查用）</label>
  <div style="font-size:11px;opacity:.6;margin:2px 0 10px 0">
    勾上后停掉所有动画、骨骼回到模型原始姿态。<br>
    如果勾上后模型【正常】→ 是动画/驱动的锅；照样乱 → 是模型本身的问题。
  </div>

  <h4>描边 (Outline)</h4>
  <label><input id="cOutline" type="checkbox" checked> 启用描边</label>
  <label>描边宽度<div class="row"><input id="sOutline" type="range" min="0" max="100" step="1" value="50"><span class="val" id="vOutline"></span></div></label>

  <!-- ★ 描边透明度（2026-10-07 设计上要求）
       ---- 为什么需要 ----
       glTF 规范里【没有描边这个概念】（实测 extensionsUsed=[] ，
       材质字段只有 name/pbrMetallicRoughness/doubleSided/alphaMode/alphaCutoff）——
       所以 GLB 的描边颜色只能由我们定（写死黑）。
       而黑描边在深色头发/深色衣服上"糊成一片"，需要能调淡。
       ★ MMD 模型自带 per-material 的 edgeColor(RGBA)，这里的透明度会【再乘上去】，
         所以 MMD 那边是"在原色基础上整体调淡"，不会把模型声明的颜色丢掉。 -->
  <label>描边透明度<div class="row"><input id="sOutlineA" type="range" min="0" max="100" step="1" value="100"><span class="val" id="vOutlineA"></span></div></label>
  <label>描边颜色深度（跟随模型时：0=贴图原色，越大越深）<div class="row"><input id="sOutlineD" type="range" min="0" max="100" step="1" value="55"><span class="val" id="vOutlineD"></span></div></label>
  <!-- ★ 描边颜色（2026-10-07 设计上要求）
       ★★ 绝不用 <input type="color"> ★★
       它是【原生弹窗】，而本项目的 WebView 在设置页里可能拿不到有效的 window token
       （<select> 下拉弹不出来就是这个原因 —— 见坑 #46）。
       所以改用「十六进制输入框 + 色块」这种纯 DOM 方案，100% 可达。
       可填 #rrggbb / #rgb；填 auto 表示【跟随模型自带颜色】。
       预设色块直接点即可。 -->
  <label>描边颜色
    <div class="row">
      <input id="cOutlineColor" type="text" value="#000000" spellcheck="false"
             style="flex:1;min-width:0;font-family:monospace">
      <span id="swOutline" title="当前描边颜色"
            style="flex:0 0 auto;width:22px;height:22px;border-radius:5px;
                   border:1px solid #9a9aa2;background:#000000"></span>
    </div>
  </label>
  <div id="outlinePresets" class="row" style="flex-wrap:wrap;gap:6px;margin:0 0 8px 0"></div>

  <h4>相机 / 取景</h4>
  <label><input id="cLockView" type="checkbox"> 锁定缩放与相机距离</label>
  <label>取景填充度（1.0 = 尽量填满）<div class="row"><input id="sFit" type="range" min="0.5" max="1" step="0.01" value="0.96"><span class="val" id="vFit"></span></div></label>
  <label>缩放<div class="row"><input id="sScale" type="range" min="0.3" max="3" step="0.01" value="1"><span class="val" id="vScale"></span></div></label>
  <label>相机距离<div class="row"><input id="sDist" type="range" min="1.2" max="8" step="0.02" value="3.7"><span class="val" id="vDist"></span></div></label>
  <label>自转<div class="row"><input id="sSpin" type="range" min="0" max="2" step="0.02" value="0.35"><span class="val" id="vSpin"></span></div></label>

  <h4>模型 (可导入 .zip)</h4>
  <select id="selModel">
    <option value="">（未导入模型）</option>
  </select>
  <button id="btnPick">导入 .zip 模型包...</button>
  <button id="btnReload">重新加载当前模型</button>

  <h4>表情 (morph targets)</h4>
  <select id="selMorph"><option value="">— 无表情 —</option></select>
  <label>表情强度<div class="row"><input id="sMorph" type="range" min="0" max="1" step="0.01" value="1"><span class="val" id="vMorph"></span></div></label>
  <label><input id="cMorphLoop" type="checkbox"> 表情自动循环</label>

  <h4>眼动追踪 (眼球骨骼)</h4>
  <select id="selGaze">
    <option value="off">关闭</option>
    <option value="auto">自动扫视</option>
    <option value="touch">触摸跟随</option>
    <option value="blink">眨眼测试</option>
  </select>
  <label>眼动幅度<div class="row"><input id="sGaze" type="range" min="0" max="1.5" step="0.01" value="1.0"><span class="val" id="vGaze"></span></div></label>
  <label><input id="cGazeAll" type="checkbox" checked> 驱动全部眼球骨骼</label>
  <label><input id="cInvX" type="checkbox"> 翻转左右</label>
  <label><input id="cInvY" type="checkbox"> 翻转上下</label>

  <h4>物理 / 动画</h4>
  <label>环境风（头发/裙摆随风飘动）<div class="row"><input id="sWind" type="range" min="0" max="100" step="1" value="0"><span class="val" id="vWind"></span></div></label>
  <label><input id="cPhysics" type="checkbox"> 启用 MMDPhysics (ammo)</label>
  <label><input id="cSpinPhys" type="checkbox"> 自转时同步物理</label>
  <h4>材质</h4>
  <label><input id="cAlphaTest" type="checkbox" checked> 纹理镂空修复（修头发缺口）</label>
  <label>镂空阈值（越小留下的发丝越多）<div class="row"><input id="sAlphaTest" type="range" min="0.05" max="0.9" step="0.05" value="0.3"><span class="val" id="vAlphaTest"></span></div></label>
  <button id="btnDiag">刷新诊断</button>
  <button id="btnSave" style="background:#2f855a">💾 保存当前设置</button>
  <button id="btnReset" style="background:#9b2c2c">↺ 恢复默认</button>
  <label>色彩自检
    <select id="selGradeDbg">
      <option value="0">正常</option>
      <option value="1">显示饱和度(看HSV是否合理)</option>
      <option value="2">饱和度=1 (关掉处理看原色)</option>
    </select>
  </label>
  <div class="diag" id="diag">加载中...</div>
  <div class="diag" id="panelMsg" style="display:none"></div>
</div>


<script type="importmap">
{
  "imports": {
    "three": "./lib/three/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MMDLoader } from 'three/addons/loaders/MMDLoader.js';
import { MMDPhysics } from 'three/addons/animation/MMDPhysics.js';
/* ★ VMD 动作：借它的 IK(CCDIKSolver) 和 付与(grant) 解算。
   MMD 的走路/跑步动作腿骨是靠 足IK 算出来的，不跑 IK 会只有上半身动。
   物理仍旧由我们自己管（传 physics:false，见 14.2 的执行顺序）。 */
import { MMDAnimationHelper } from 'three/addons/animation/MMDAnimationHelper.js';
/* ★ MMDLoader 对 PMX 的【骨骼型表情】(morph.type === 2) 只有一句
   "// TODO: implement"，等于完全没有数据。但 MMDParser 其实把它完整解析了
   （elements[].index / position[3] / rotation[4] 四元数）。
   这里直接用 MMDParser 自己读一遍 PMX，拿到 morph → 骨骼的真实映射。 */
import { MMDParser } from 'three/addons/libs/mmdparser.module.js';
/* ★ glTF / GLB 模型支持。
   GLB 是自包含的单文件（几何 + 贴图 + **动作** 全在里面）。
   它自带的 animations 是标准 AnimationClip，
   正好可以当成"动作源"用（与 VMD 平级，绑同一套插槽）。
   r150 的 GLTFLoader 还依赖 utils/BufferGeometryUtils.js，两个文件都已放入 lib/three/examples/jsm/。 */
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ------------------------------------------------------------------ config
   MODEL_URL is relative to index.html, i.e. assets/models/<name>.pmx
   Texture paths INSIDE the .pmx are resolved relative to the .pmx too, so a
   pmx that references "textures\Foo.png" needs assets/models/textures/Foo.png
   (Chrome normalises the backslash to a slash for us).
--------------------------------------------------------------------------- */
/* ★★ MODEL_URL = '' ：本仓库不附带任何模型文件 ★★
   ---- 为什么留空而不是指向某个路径 ----
   这个项目是公开仓库，不包含任何 3D 模型（版权原因）。
   如果这里写死一个路径，首次启动会去加载一个不存在的文件，
   用户看到的就是"Failed to load ..."的红色报错条。
   留空后 boot() 会走"无模型"分支：只显示一句提示，
   等用户通过「3D 模型 → 导入」添加自己的模型。
   ★ 注意：URL 仍然必须是绝对路径格式（/models/... 或 /assets/...），
     这样"当前是哪个模型"的比较、保存/恢复才不会错乱。 */
const MODEL_URL = '';
const VMD_URL   = null;                 // set to './models/idle.vmd' to enable
const PHYSICS_DEFAULT = true;            // set false to skip ammo entirely
let PHYSICS = PHYSICS_DEFAULT;           // ★ 改为可变：性能卡片可实时开关

const errBox = document.getElementById('err');

/* 原生桥：addJavascriptInterface 暴露的 MmdBridge。
   比 console.log 可靠（部分 ROM 会丢 onConsoleMessage）。 */
const B = window.MmdBridge;
function nlog(m) { console.log('[mmd] ' + m); try { if (B) B.log(m); } catch (e) {} }
function nerr(m) { console.error('[mmd] ' + m); try { if (B) B.error(m); } catch (e) {} }

function showErr(msg) {
  errBox.hidden = false;
  errBox.textContent += msg + '\n';
  nerr(msg);
}
/**
 * 「还没有模型」提示（公开仓库版没有内置模型，首次启动就是这个状态）。
 *
 * ★ 与 showErr 的区别：这不是错误，不能红着吓人，也不该记 error 日志。
 *   文案要直接告诉用户去哪儿解决 —— 悬浮窗很小，只能放两行。
 */
function showNoModel() {
  errBox.hidden = false;
  errBox.style.background = 'rgba(24,64,64,.86)';
  errBox.textContent = '还没有 3D 模型\n请在 App 的「3D 模型管理」里导入 .pmx / .glb';
  nlog('no model: waiting for user to import');
}
function mark(step) {
  errBox.hidden = false;
  errBox.style.background = 'rgba(0,90,0,.85)';
  errBox.textContent = step;
  nlog('STEP ' + step);
}
/* 每一步都先清掉红条，模型出来后就只剩一个绿条（可再隐藏） */
function clearMark() { errBox.hidden = true; errBox.textContent = ''; }

window.addEventListener('error', e => showErr('onerror: ' + e.message + ' @' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => {
  /* ★ 只打 message 是不够的 —— 报错如 "reading 'bones'" 完全看不出在哪。
     这里把 reason.stack 的前几层也打出来，一次就能定位。 */
  const r = e.reason;
  const msg = (r && r.message) ? r.message : String(r);
  const stk = (r && r.stack) ? String(r.stack).split('\n').slice(1, 5)
        .map(l => l.trim().replace(/^at\s+/, '')).join(' | ') : '';
  showErr('unhandled: ' + msg);
  nerr('unhandled: ' + msg + '  ←  ' + stk);
});

/* --------------------------------------------------------------- renderer */
/* ============================================================
   GPU / 性能：硬件加速开关
   ------------------------------------------------------------
   ★ 为什么用 URL 参数而不是运行时改：
     WebGL 的 antialias / powerPreference 只能在【创建上下文时】决定，
     运行中改不了（要重建整个 renderer，风险大且会闪一下）。
     所以这里由原生在 URL 上带 ?gpu=0/1，切换时重载一次页面即可。
     （设置项很少改，重载代价可接受。）
   ★ 关掉"GPU 加速"会走 low-power + 开启 MSAA：
     更省电、兼容性更好；开则用 high-performance 并关掉 MSAA
     （我们已经有"超采样"档位做抗锯齿，MSAA 是重复开销）。
   ============================================================ */
const GPU_HIGH_PERF = new URLSearchParams(location.search).get('gpu') !== '0';

const renderer = new THREE.WebGLRenderer({
  alpha: true,                 // MUST be true -> transparent framebuffer
  antialias: !GPU_HIGH_PERF,   // 高性能模式关 MSAA（已有超采样 AA，MSAA 是重复开销）
  premultipliedAlpha: true,
  preserveDrawingBuffer: false,
  powerPreference: GPU_HIGH_PERF ? 'high-performance' : 'low-power'
});

/* ------------------------------------------------------------
   ★ GPU 状态诊断：把真实的 GL renderer 名字读出来。
     这是回答"到底有没有用 GPU"的唯一可靠办法 ——
     如果看到 SwiftShader / llvmpipe 之类的字样，说明走的是【软件渲染】，
     再好的参数都救不了性能。
   ------------------------------------------------------------ */
let glInfo = null;
function captureGlInfo() {
  try {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const rawRenderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '';
    const rawVendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : '';
    const name = rawRenderer || gl.getParameter(gl.RENDERER) || '';
    const vendor = rawVendor || gl.getParameter(gl.VENDOR) || '';
    const isWebGL2 = (typeof WebGL2RenderingContext !== 'undefined')
      && (gl instanceof WebGL2RenderingContext);
    const software = /swiftshader|llvmpipe|software|mesa offscreen|softpipe/i
      .test(name + ' ' + vendor);
    glInfo = {
      gpuAccel: GPU_HIGH_PERF,
      renderer: name,
      vendor: vendor,
      glVersion: String(gl.getParameter(gl.VERSION) || ''),
      webgl2: isWebGL2,
      software: software,
      maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
      floatVertexTextures: !!(renderer.capabilities && renderer.capabilities.floatVertexTextures)
    };
    nlog('GL renderer: "' + name + '" vendor="' + vendor + '"'
      + ' webgl2=' + isWebGL2 + ' software=' + software
      + ' accel=' + GPU_HIGH_PERF
      + ' floatVertexTex=' + glInfo.floatVertexTextures
      + ' maxTex=' + glInfo.maxTextureSize);
    if (software) {
      nerr('★ 检测到软件渲染（SwiftShader）：GPU 没被用上，性能会极差');
    }
  } catch (e) {
    nerr('glInfo failed: ' + (e && e.message));
  }
}
captureGlInfo();

/* ============================================================
   渲染分辨率 / 抗锯齿
   ------------------------------------------------------------
   渲染分辨率 = CSS 尺寸 x effectivePixelRatio()
      · 抗锯齿关闭时：min(devicePixelRatio, 2)  —— 够用且省电
      · 抗锯齿开启时：devicePixelRatio x SUPER_SAMPLE（默认 2）
        即以「显示大小的两倍分辨率」渲染，再降采样输出，
        边缘更平滑，代价是像素数 x4。
   注意：WebGL 的 MSAA(antialias) 需在创建时决定、无法运行时切换，
   因此这里用「超采样」实现可开关的抗锯齿。
   ============================================================ */
let AA_ENABLED = false;

/**
 * 渲染分辨率系数。
 *   AA 关闭：min(dpr, 2)          —— 与 WebView 显示 1:1，省电
 *   AA 开启：上一档 x2            —— 即"显示大小的两倍分辨率"
 *
 * 注意不要写成 dpr * 2：本机 dpr=2.75，那样会变成 5.5 倍，
 * 像素数是原来的 7.5 倍，过于激进（发热/掉帧）。
 * 这里以"当前显示倍率"为基准翻倍，最坏情况 2(封顶) x 2 = 4 倍像素。
 */
/**
 * 抗锯齿档位：
 *   关闭    -> min(dpr,2)            （与显示 1:1）
 *   2 倍    -> min(dpr,2) * 2        （4 倍像素）
 *   4 倍    -> min(dpr,2) * 4        （16 倍像素，仅小尺寸桌宠建议开启）
 * 用整数档位而非连续值，便于 UI 表达与功耗权衡。
 */
let AA_LEVEL = 0;   // 0 / 2 / 4

/* ============================================================
   性能控制（重模型优化的核心）
   ------------------------------------------------------------
   ★ 移动端 WebGL 的性能瓶颈几乎总是【填充率】（像素数），
     而不是三角形数量 —— 尤其 MMD 模型贴图大、材质多、还有物理。
     所以最有效的优化是【降渲染分辨率】，而不是去减模型面数。
   · RENDER_SCALE_SET 用户设定的渲染倍率（0.35~1.0，1.0 = 不降）
   · RENDER_SCALE     实际生效值（性能模式下由 FPS 自动上下浮动）
   · PERF_AUTO       动态分辨率开关：FPS 低就降、恢复了就慢慢升回来
   · FPS_CAP         帧率上限（0=不限），限制发热与耗电
   ============================================================ */
let RENDER_SCALE_SET = 1.0;
let RENDER_SCALE = 1.0;
let PERF_AUTO = false;
let FPS_CAP = 0;

function baselinePixelRatio() {
  return Math.min(window.devicePixelRatio || 1, 2);
}

/* ★ 像素预算：缓冲区总像素的上限。
   手机 WebGL 的瓶颈是【填充率】，而像素数是随窗口尺寸【平方】增长的：
   本机 dpr=2.75、capped 到 2，如果桌宠放大到接近全屏，
   缓冲会变成 2560x5544 ≈ 1400 万像素（正常窗口只有 35 万）→ 直接崩帧。
   这里给一个上限，超了就自动按比例压 pixelRatio，保证任何窗口尺寸下都不会失控。
   2.0M 像素在 Adreno 830 上是"清晰且流畅"的平衡点。 */
const MAX_BUFFER_PIXELS = 2000000;

function effectivePixelRatio() {
  const base = baselinePixelRatio();
  const aa = AA_LEVEL <= 0 ? 1 : AA_LEVEL;
  let pr = Math.max(0.3, base * aa * RENDER_SCALE);
  try {
    const w = window.innerWidth, h = window.innerHeight;
    if (w > 0 && h > 0) {
      const px = (w * pr) * (h * pr);
      if (px > MAX_BUFFER_PIXELS) {
        pr = Math.max(0.3, Math.sqrt(MAX_BUFFER_PIXELS / (w * h)));
      }
    }
  } catch (e) {}
  return pr;
}

function applyRenderScale(scale, silent) {
  RENDER_SCALE = Math.max(0.35, Math.min(2.0, scale));
  try { applyPixelRatio(); } catch (e) {}
  if (!silent) {
    nlog('renderScale -> ' + RENDER_SCALE.toFixed(2)
      + ' (effective pr=' + effectivePixelRatio().toFixed(2) + ')');
  }
}

function applyPixelRatio() {
  const pr = effectivePixelRatio();
  renderer.setPixelRatio(pr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  const w = renderer.domElement.width, h = renderer.domElement.height;
  const px = w * h;
  nlog('pixelRatio=' + pr.toFixed(2) + ' (aaLevel=' + AA_LEVEL
    + ' scale=' + RENDER_SCALE.toFixed(2) + ')'
    + ' canvas=' + w + 'x' + h + ' px=' + (px / 1000).toFixed(0) + 'k'
    + (px > MAX_BUFFER_PIXELS ? ' ★已触发像素预算' : ''));
}

applyPixelRatio();
renderer.setClearColor(0x000000, 0);   // fully transparent clear

/* ★ WebGL context lost 防护 —— "定格"的第三条可能路径。
   WebView 长时间运行 / 显存压力下会丢失 GL 上下文，
   此后 renderer.render() 不再往画布上画，画面定格且【永远不会自己恢复】。
   注意 e.preventDefault() 是必须的：不调用它，浏览器不会派发 restored 事件。 */
try {
  renderer.domElement.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    _ctxLost = true;                    // ★ 看门狗用它区分"循环停了"和"上下文丢了"
    nerr('WebGL context lost');
  }, false);
  renderer.domElement.addEventListener('webglcontextrestored', function () {
    _ctxLost = false;
    nlog('WebGL context restored -> rebuild');
    try {
      maskRT = null;                  // 离屏 target 已失效，下次用时自动重建
      applyPixelRatio();
      resetFit('context-restored');
    } catch (e) { nerr('context restore failed: ' + (e && e.message)); }
  }, false);
} catch (e) {
  nlog('context loss hooks unavailable');
}
/* ACESFilmic + 曝光 1.0：压住高光溢出，是"过曝"的主要修复手段。
   若不需要物理色调映射，可设 NoToneMapping 并把 exposure 调到 1.0~1.2。 */
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.id = 'mmd-canvas';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;                // never paint a solid backdrop

const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 5000);
camera.position.set(0, 0.8, 2.0);

/* 灯光强度是针对"归一化后 1.6 单位高"的模型调的。
   过曝 = 强度过高；这里用较低的主光 + 少量环境光，MMD toon 质感才正常。
   想更亮/更暗只调这三个数即可。 */
/* 灯光强度（针对归一化后 1.6 单位高的模型）
   ↓ 调这三个数即可整体变亮/变暗。

   ★ 本仓库默认模型 Arona 的贴图实测：Body.png 有 48.7% 像素接近纯白
     (RGB>235)，Hair.png 中位亮度 224、最暗才 205（几乎没有暗部）。
     也就是说"偏白"是该素材的固有属性，不是渲染 bug。
     所以这里的取值是"给高调白模压一档"，换成深色模型时应调亮。 */
const LIGHT_KEY     = 0.95;
const LIGHT_RIM     = 0.40;
const LIGHT_AMBIENT = 0.40;

/* 明暗分层档位（0-255，由暗到亮）。2 档=硬切，档位越多越柔和。 */
const TOON_STOPS = [128, 185, 225, 252];

/* 饱和度 / 色相（MMD 素材普遍偏淡，默认提一档） */
let SAT_VALUE = 1.0;   // 默认 1.0 = 不做处理；确认无副作用后再调高
/** 恢复设置期间为 true：此时滑块回调不应驱动相机（见 applySettings 的说明）。 */
let _suppressCamDist = false;
let HUE_VALUE = 0.0;

const key = new THREE.DirectionalLight(0xffffff, LIGHT_KEY);
key.position.set(0.8, 1.4, 1.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, LIGHT_RIM);
rim.position.set(-1.0, 0.9, -0.8);
scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, LIGHT_AMBIENT));

/* ------------------------------------------------------------------- ammo
   ammo.wasm.js is a CLASSIC script (not an ES module). It cannot be `import`ed;
   it must be injected with a <script> tag so it defines global `Ammo`, and it
   in turn fetches ammo.wasm.wasm from its own directory.
--------------------------------------------------------------------------- */
function loadAmmo() {
  return new Promise((resolve, reject) => {
    if (window.Ammo) return resolve(window.Ammo);
    const s = document.createElement('script');
    s.src = './lib/three/examples/jsm/libs/ammo.wasm.js';
    s.onload = () => {
      if (typeof Ammo === 'undefined') return reject(new Error('no global Ammo'));
      const ret = Ammo();
      // In the wasm build Ammo() returns a promise AND memoises itself onto
      // window.Ammo; handle both shapes.
      Promise.resolve(ret).then(v => { window.Ammo = v || window.Ammo; resolve(window.Ammo); },
                                e => reject(e));
    };
    s.onerror = () => reject(new Error('ammo.wasm.js failed to load'));
    document.head.appendChild(s);
  });
}

/* ---------------------------------------------------------------- loading */
const clock = new THREE.Clock();
let mixer = null, physics = null, model = null;
/* 自转速度与"自转时是否同步物理"（自转会带动刚体，物理没跟上会飘散） */
let SPIN_SPEED = 0.35;
let SPIN_WITH_PHYSICS = false;
/* normalizeModel 算出的原始缩放；面板上的"缩放"是在它之上的倍率 */
let baseModelScale = 1;

/* 相机距离覆盖（面板滑块用；null = 自动取景） */
/**
 * 相机距离。
 *
 * ★ 必须夹住最小距离 —— 否则相机会钻进模型内部，近裁剪面把模型"切开"，
 *   表现就是实测的"模型前面像被切掉一块、直接透视到里面"。
 *   原实现只把滑块下限设成 0.3，而模型归一化后高 1.6 单位、
 *   相机放在 (0, 0.8, d)：d=0.3 时相机几乎贴在模型表面甚至进去了。
 * ★ 这里按模型实际包围盒算下限（而不是再硬编码一个小值），
 *   这样换了更大/更小的模型也不会穿进去。
 */
/**
 * 计算"相机距模型的最小安全距离"（按模型实际包围盒）。
 * ★ 单独抽出这个函数，是为了让"同步滑块下限"不必调用 applyCamDist ——
 *   后者会把相机【重置成滑块值】，从而覆盖自动取景的结果。
 */
function computeCamDistMin() {
  let minD = 1.2;
  try {
    if (model) {
      const box = new THREE.Box3().setFromObject(model);
      if (!box.isEmpty()) {
        const sz = box.getSize(new THREE.Vector3());
        const cz = box.getCenter(new THREE.Vector3());
        /* 相机在正前方，要退到"模型前表面 + 余量"之外。
           用 x/z 里较大的那个当横向半径（头发/裙摆会往外扩）。 */
        const radius = Math.max(sz.x, sz.z) * 0.5;
        minD = Math.max(1.0, radius + Math.abs(cz.z) + 0.45);
      }
    }
  } catch (e) {}
  return minD;
}

function applyCamDist(d) {
  _szTrig('applyCamDist(' + d + ')');
  const size = new THREE.Vector3(1, 1.6, 1);
  const minD = computeCamDistMin();
  const dd = Math.max(minD, parseFloat(d) || minD);

  camera.position.set(0, size.y * 0.5, dd);
  camera.lookAt(0, size.y * 0.5, 0);
  /* near 取 dd 的千分之五，避免贴近观察时被近裁剪面切掉。 */
  camera.near = Math.max(0.01, dd * 0.005);
  camera.far = dd * 40;
  camera.updateProjectionMatrix();
  applyCamDist._min = minD;
  return dd;
}


/* ------------------------------------------------------------------
   fixOverExposure —— 修复 PMX 默认镜面反射过强导致的"过曝/死白"
   ------------------------------------------------------------------
   根因（已定位到 MMDLoader.js:1106-1108）：
     params.specular = new Color().fromArray(material.specular);   // PMX 里常接近纯白
     params.shininess = material.shininess;                         // 默认 50
     params.emissive  = new Color().fromArray(material.ambient);
   MMDToonMaterial 是 BlinnPhong 派生（见 shaders/MMDToonShader.js），
   近白 specular + 高 shininess 在主光下会把脸/皮肤直接烧成纯白，
   这是"看起来过曝"的主因，**不是灯光强度的问题**。

   对策：
     1) 把 specular 压到很低（MMD 二次元其实不需要强高光）
     2) shininess 降低，让高光更柔和
     3) emissive（PMX 的 ambient）本来会被 ×0.2，但仍然偏亮时一并压
   如果你的模型确实需要高光，改 SPECULAR_SCALE 即可（0 = 完全关闭）。
   ------------------------------------------------------------------ */
const SPECULAR_SCALE = 0.18;   // 0 = 无镜面；0.12 = 轻微高光（推荐）
const SHININESS_FIX   = 12;     // 降低到柔和范围
const EMISSIVE_SCALE  = 0.5;    // 进一步压暗环境项

/* ============================================================
   纹理 alpha 镂空修复（alphaTest）—— "头发被锯掉一块"的根因
   ------------------------------------------------------------
   ★ 问题现象：MMD 模型的头发/睫毛/裙摆出现【锯齿状黑色缺口】，
     像被刀切掉一块；缺口处看不到后面的头发或身体，只有背景色。
   ★ 根因（three.js MMDLoader 的已知缺陷）：
       params.opacity = material.diffuse[3];          // 只看 PMX 材质的 alpha
       params.transparent = params.opacity !== 1.0;   // 头发材质 = 1.0 → false
       而且 MMDLoader 全程【不设 alphaTest】。
     但 MMD 的头发是用【贴图 alpha】做镂空的 —— 实测 tex_Hair_Kei.png
     有 9% 完全透明 + 4.5% 半透明像素，这些镂空区：
       · 混合后颜色贡献为 0（于是显示成背景色）
       · 【但深度照样写入】→ 把后面的头发/身体挡住
     结果就是那些镂空区变成"锯掉的黑色缺口"。
   ★ 修法：给"不透明但有贴图"的材质设 alphaTest，
     让透明像素走 discard —— 既不写颜色也不写深度，就能正常透出后面。
   ============================================================ */
let ALPHA_TEST_ON = true;
/**
 * alphaTest 阈值。
 * ★ 这是"二值"判定：低于阈值直接 discard，高于阈值正常渲染并【写深度】。
 *   所以取值要权衡：
 *     · 取太大（如 0.5）→ 发丝边缘的半透明像素被丢 → 头发变细、出现缺口
 *     · 取太小（如 0.05）→ 保留了半透明像素，它们混合后接近背景色、
 *       又照样写深度 → 灰色缺口会回来
 *   0.3 是折中值：只丢"明显透明"的像素，尽量保住发丝。
 */
let ALPHA_TEST_VALUE = 0.3;

/**
 * ★ 只对【真正需要镂空】的材质加 alphaTest —— 这一条是修"鞋子/尾巴变透明"的关键。
 *
 * ---- 事故复盘（2026-10-05 实测"尾巴和鞋子变透明了，能看到身体"）----
 * 我第一版把 alphaTest 加到了【所有"不透明+带贴图"的材质】上，
 * 包括 靴（鞋子）、尻尾（尾巴）、衣服……
 * 但这些材质的贴图里本来就有低 alpha 像素（不一定是为了镂空），
 * 一旦被 discard 就变成"材质透明、看穿到下层身体"。
 * ★ 结论：alphaTest 是有副作用的"二值丢弃"，只能用在确实靠贴图 alpha
 *   做镂空的部件上 —— 头发、睫毛、以及部分裙摆/蕾丝。
 *   其余材质保持原样，靠 PMX 材质自带的 alpha + 深度来做正确遮挡。
 */
const ALPHA_TEST_NAME_RE =
  /髪|かみ|hair|毛|睫|まつげ|まばたき|スカート|skirt|フリル|frill|レース|lace|カーテン/i;

function applyAlphaTest(mesh, silent) {
  if (!mesh) return 0;
  let fixed = 0, skipped = 0, noDepthWrite = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (!m) continue;

      /* ---------- ① 半透明材质：关掉 depthWrite ----------
         ★★ 条件必须严格用【实际不透明度】(opacity < 0.99)，
            绝不能用 m.transparent 来判断！
         ---- 事故复盘（2026-10-05 曾出现"整个模型看着像透明的"）----
         MMDLoader 会把【参与材质表情(alpha morph)】的材质也标成 transparent=true，
         但它们的 opacity 仍然是 1.0（本身完全不透明）。
         对这些材质关掉 depthWrite → 它们【不再遮挡后面的东西】
         → 头发不遮头发、袜子不遮腿 → 整个模型看起来透明。
         实测数据：`44:髪 o=1.00 tr=1`、`54:靴下 o=1.00 tr=1` 都是这种"假透明"。
         ★ 只有真正半透明的（泪 0.7 / 眼影 0.35 / 汗 0.4 / 光环 0.8）才该关。 */
      if (m.opacity !== undefined && m.opacity < 0.99) {
        if (m.depthWrite !== false) { m.depthWrite = false; noDepthWrite++; }
        /* 半透明材质若【带贴图】，给一个按自身透明度折算的 alphaTest：
           贴图里完全透明的区域直接 discard，不会留下硬边。 */
        if (m.map && ALPHA_TEST_ON && !isGltfModel) {
          const at = Math.max(0.01, Math.min(0.9, m.opacity * 0.5));
          if (m.alphaTest !== at) { m.alphaTest = at; fixed++; }
        }
        m.needsUpdate = true;
        skipped++;
        continue;
      }
      /* 注：opacity=1.0 但 transparent=true 的材质，这里【不处理】——
         它们走下面的"不透明"分支，保留 depthWrite 正确遮挡。 */

      /* ---------- ② 不透明材质 + 贴图：加 alphaTest 修"发丝/毛皮镂空" ----------
         ★ 范围：所有"不透明 + 带贴图"的材质（广泛应用）。
           原因：MMD 里靠【贴图 alpha】做镂空的不只是头发 ——
           毛皮（狐耳/尾巴）、蕾丝、裙摆边缘都是。
           用户明确说过"耳朵和尾巴应该是毛茸茸材质"，那正是 alpha 镂空。
         ★ 注意：之前误以为"鞋子/尾巴变透明"是这里造成的，于是收窄成名字白名单；
           后来查清真正原因是【material morph 没还原 depthWrite】，
           与本段无关（见 captureMaterialBase 的说明），所以这里恢复广泛应用。 */
      if (!m.map || !ALPHA_TEST_ON) continue;
      /* ★★ glTF：绝不覆盖模型自带的 alphaTest ★★
         glTF 用 `alphaMode` + `alphaCutoff` **精确**表达"要不要镂空、阈值多少"，
         GLTFLoader 已经把它正确地设好了：
           · OPAQUE → 忽略贴图 alpha（alphaTest 应为 0）
           · MASK   → alphaTest = alphaCutoff（默认 0.5）  ← 这个模型的嘴/眼睛就是这类
           · BLEND  → 混合
         我们无条件把它改成 MMD 用的 ALPHA_TEST_VALUE 属于**越权**，
         而且面板上这个值还能被滑块改。glTF 模型的 alphaMode 才是权威。 */
      if (isGltfModel) continue;
      m.alphaTest = ALPHA_TEST_VALUE;
      m.needsUpdate = true;
      fixed++;
    }
  });
  if (!silent) {
    nlog('applyAlphaTest: alphaTest ' + fixed + ' 个 / 半透明关深度写 ' + noDepthWrite
      + ' 个（半透明共 ' + skipped + '）');
    /* 诊断：把每个材质的真实状态转储出来。
       "头发/光环偶尔穿模"这类问题必须看真实状态，不能靠推测
       （曾误判 depthWrite，实测它本来就是 false）。 */
    try {
      const rows = [];
      mesh.traverse(o => {
        const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
        mats.forEach((m, i) => {
          if (!m) return;
          rows.push(i + ':' + (m.name || '?')
            + ' o=' + (m.opacity === undefined ? '?' : m.opacity.toFixed(2))
            + ' tr=' + (m.transparent ? 1 : 0)
            + ' map=' + (m.map ? 1 : 0)
            + ' at=' + (m.alphaTest || 0).toFixed(2)
            + ' dw=' + (m.depthWrite ? 1 : 0)
            + ' ds=' + (m.side === 2 ? 'D' : (m.side === 1 ? 'B' : 'F')));
        });
      });
      nlog('MATDUMP ' + rows.join(' | '));
    } catch (e) {}
  }
  return fixed;
}

/** 开关纹理镂空修复（部分模型不需要时可关）。 */
window.__setAlphaTest = function (on, value) {
  ALPHA_TEST_ON = !!on;
  const v = parseFloat(value);
  if (isFinite(v) && v > 0 && v < 1) ALPHA_TEST_VALUE = v;
  const n = ALPHA_TEST_ON ? applyAlphaTest(model, true) : 0;
  if (!ALPHA_TEST_ON && model) {
    /* 关掉时要把之前设过的 alphaTest 还原，否则不生效 */
    model.traverse(o => {
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      for (const m of mats) {
        if (m && m.alphaTest) { m.alphaTest = 0; m.needsUpdate = true; }
      }
    });
  }
  nlog('alphaTest -> ' + ALPHA_TEST_ON + ' value=' + ALPHA_TEST_VALUE + ' (' + n + ' mat)');
  return ALPHA_TEST_ON ? n : 0;
};

/**
 * 诊断：统计"隐藏配饰"的物理情况。
 *
 * ★ 为什么查这个（实测"模型后有一条尾巴，没渲染出来，看着像穿模"）：
 *   本模型有 alpha=0 的隐藏配饰（きつね尻尾 / きつね耳 / 尻尾リボン 等）。
 *   它们的网格看不见，但【几何体和物理刚体依然存在】——
 *   如果这些刚体参与了物理，就会在"看不见的地方"推挤可见的头发/裙子 → 穿模。
 *   这里只做统计，不改动物理（先确认问题是否真实存在，再决定怎么修）。
 */
function reportHiddenPartPhysics(mesh) {
  try {
    const mats = Array.isArray(mesh.material)
      ? mesh.material : (mesh.material ? [mesh.material] : []);
    const hideMats = new Set();
    mats.forEach((m, i) => {
      if (m && ((m.opacity !== undefined && m.opacity < 0.02) || m.visible === false)) {
        hideMats.add(i);
      }
    });
    if (!hideMats.size) { nlog('hiddenPart: 无隐藏材质'); return; }

    const visBoneIdx = new Set(), hideBoneIdx = new Set();
    mesh.traverse(o => {
      if (!o.isSkinnedMesh || !o.geometry) return;
      const g = o.geometry;
      const si = g.attributes && g.attributes.skinIndex;
      const sw = g.attributes && g.attributes.skinWeight;
      if (!si || !sw || !g.groups || !g.groups.length) return;
      for (const grp of g.groups) {
        const isHide = hideMats.has(grp.materialIndex);
        const end = Math.min(grp.start + grp.count, si.count);
        for (let v = grp.start; v < end; v++) {
          for (let k = 0; k < 4; k++) {
            const w = sw.getComponent ? sw.getComponent(v, k) : 0;
            if (!(w > 0.001)) continue;
            const bi = si.getComponent(v, k);
            (isHide ? hideBoneIdx : visBoneIdx).add(bi);
          }
        }
      }
    });
    /* 只被隐藏材质使用的骨骼 = 隐藏材质用到、但可见材质完全没用到的 */
    const onlyHide = new Set();
    for (const bi of hideBoneIdx) if (!visBoneIdx.has(bi)) onlyHide.add(bi);

    /* 这些骨骼绑定了多少刚体（= 看不见却在推挤别人的刚体） */
    let hit = 0;
    const g0 = mesh.geometry || {};
    for (const rb of (g0.rigidBody || [])) {
      if (rb.boneIndex !== undefined && onlyHide.has(rb.boneIndex)) hit++;
    }
    nlog('hiddenPart: 隐藏材质 ' + hideMats.size + ' 个 | 隐藏骨骼 ' + hideBoneIdx.size
      + ' 根 | 其中专属隐藏的 ' + onlyHide.size + ' 根'
      + ' | 这些骨骼绑定的刚体 = ' + hit + ' / ' + (g0.rigidBody || []).length
      + (hit > 0 ? '  ← 可能在看不见的地方推挤头发' : ''));
  } catch (e) {
    nlog('hiddenPart 统计失败: ' + (e && e.message));
  }
}

/* ============================================================
   面部表情 vs 装备/姿态 分类
   ------------------------------------------------------------
   ★ 为什么必须区分（实测"开启循环播放动画时，穿模概率大幅上升"）：
     那个重模型有 189 个 morph，但绝大多数【不是面部表情】，而是
     装备开关与姿态调整，例如：
       ★ON_靴 / ★セットアップ / ★胸上げ / ★腕↑捻り / ★Up_しっぽ / OFFシャツ …
     它们会大幅改变【身体与装备的姿态】。而头发、裙子是由【物理】驱动的，
     物理跟不上这种突变 → 直接穿模。
     表情轮播如果把 189 个全播一遍，等于每 1.2 秒把身体姿态改一次
     → 穿模概率自然"大幅上升"。
   ★ 结论：轮播（以及 AI 选表情）只应针对【面部表情】。
   ============================================================ */
const FACE_MORPH_RE = /笑|smile|ウィンク|wink|まばたき|瞬き|blink|^あ2?$|^い$|^え$|^お$|^う$|^[aiueo]$|口|くち|目|め|eye|照|てれ|涙|なみだ|怒|おこ|悲|かな|にこ|なごみ|はぅ|びっくり|驚|おどろ|じと|にやり|む|ω|∀|＞＜|><|ハイライト|眉|まゆ|舌|歯|鼻/i;
/** 明显是"装备/姿态/配件"特征：★☆ 前缀、OFF_/ON_、身体部位、服饰配件。 */
const GEAR_MORPH_RE = /^[★☆]|OFF_|ON_|セットアップ|ポーズ|pose|↑|↓|腕|ひじ|肩|胸|足|あし|脚|靴|くつ|しっぽ|尻尾|尾|耳|みみ|髪|かみ|hair|スカート|シャツ|ジャケット|ネクタイ|靴下|ソックス|めがね|メガネ|リボン|ハート|ニプレス|ブラ|ぱんつ|バンド|上着|服|スーツ|手袋|マフラー|しわ|皺/i;

/** 每个 morph 影响的顶点数（用于兜底判断；null = 未计算）。 */
const _morphVertCount = new Map();

/** 统计某 morph 影响的顶点数（提前退出，避免大 morph 全量遍历）。 */
function countMorphVerts(mesh, idx, limit) {
  try {
    const g = mesh.geometry;
    const ma = g.morphAttributes && g.morphAttributes.position;
    const base = g.attributes && g.attributes.position;
    if (!ma || !ma[idx] || !base) return 0;
    const a = ma[idx];
    const n = Math.min(base.count, 20000);
    let cnt = 0;
    for (let v = 0; v < n; v++) {
      if (Math.abs(a.getX(v) - base.getX(v)) > 1e-4
       || Math.abs(a.getY(v) - base.getY(v)) > 1e-4
       || Math.abs(a.getZ(v) - base.getZ(v)) > 1e-4) {
        if (++cnt > limit) return cnt;      // 提前退出
      }
    }
    return cnt;
  } catch (e) { return 0; }
}

/**
 * 判断一个 morph 是否是"面部表情"（可以被轮播/AI 当作表情使用）。
 * 判定顺序：明确的装备特征 → 排除；明确的面部特征 → 通过；
 * 都不匹配则用【影响顶点数】兜底（面部表情只影响脸/眼/嘴附近，顶点数很少）。
 */
function isFaceMorph(name, mesh, idx) {
  if (!name) return false;
  if (GEAR_MORPH_RE.test(name)) return false;
  if (FACE_MORPH_RE.test(name)) return true;
  /* 数字编号（100.001 这类）通常是光环/装饰件 —— 算"可展示"但不是脸 */
  if (/^\d+(\.\d+)?$/.test(name)) return true;
  /* 兜底：按影响范围。阈值取总顶点数的 4%（面部表情远低于此）。 */
  if (mesh && idx !== undefined) {
    const total = (mesh.geometry.attributes.position || {}).count || 0;
    const c = countMorphVerts(mesh, idx, Math.max(300, Math.floor(total * 0.04)));
    return c <= Math.max(300, Math.floor(total * 0.04));
  }
  return true;
}

function fixOverExposure(mesh) {
  let fixed = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (!m) continue;
      if (m.specular && m.specular.isColor) {
        m.specular.multiplyScalar(SPECULAR_SCALE);
        fixed++;
      }
      if (typeof m.shininess === 'number' && m.shininess > 1) {
        m.shininess = SHININESS_FIX;
      }
      if (m.emissive && m.emissive.isColor) {
        // MMDLoader 已把 PMX ambient 放进 emissive 并 ×0.2，
        // 某些模型本身 ambient 就高，这里再压一档
        m.emissive.multiplyScalar(EMISSIVE_SCALE);
        if ('emissiveIntensity' in m) m.emissiveIntensity = 1.0;
      }
      if (m.needsUpdate !== undefined) m.needsUpdate = true;
    }
  });
  nlog('fixOverExposure: tuned ' + fixed + ' materials (specular×'
       + SPECULAR_SCALE + ', shininess=' + SHININESS_FIX + ')');
  return fixed;
}


/* ------------------------------------------------------------------
   makeToonGradient —— 给所有 MMDToonMaterial 挂一张 gradientMap。
   MMD 卡通渲染的"明暗分层"全靠它：
   - 2 段：硬切（经典 MMD 观感）
   - 4 段：柔和一点
   不挂的话 MMDToonMaterial 用的是连续渐变，在白模上很容易糊成一片白。
   纹理用 DataTexture，1 像素宽即可，无需外部文件。
   ------------------------------------------------------------------ */
let _toonGradient = null;
function makeToonGradient(stops) {
  // stops: 数组，值 0..255，由暗到亮
  const data = new Uint8Array(stops.length * 4);
  for (let i = 0; i < stops.length; i++) {
    const v = stops[i];
    data[i * 4] = v; data[i * 4 + 1] = v; data[i * 4 + 2] = v; data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, stops.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

function applyToonGradient(mesh, stops) {
  if (!_toonGradient) _toonGradient = makeToonGradient(stops);
  let n = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      // 只处理 MMD 材质（有 gradientMap 支持的）
      if (m && m.isShaderMaterial && m.type === 'MMDToonMaterial') {
        m.gradientMap = _toonGradient;
        m.needsUpdate = true;
        n++;
      }
    }
  });
  nlog('applyToonGradient: ' + n + ' MMDToonMaterial(s), stops=' + stops.join(','));
  return n;
}

/* ============================================================================
   ★★★ 三渲二 / 卡通渲染（2026-10-08）★★★
   ----------------------------------------------------------------------------
   用户诉求："预览模型的网站里的模型好像用了三渲二（3D 的模型但看起来像 2D），
             能不能加个开关实现一下？"

   ---- 现状 ----
   · MMD：MMDLoader 产出的是 `MMDToonMaterial` —— **本来就是 toon 着色**
          （靠 gradientMap 把光照分档），所以已经"动漫感"了。
   · glTF：GLTFLoader 产出的是 `MeshStandardMaterial`（PBR）——
          有金属度/粗糙度/环境反射，观感是"写实 3D"，和蔚蓝档案官方那种
          "3D 模型但像 2D 立绘"差得远。

   ---- 实现（最低风险拿 90% 观感）----
   ① glTF：把每个 MeshStandardMaterial **替换**成 MeshToonMaterial，
      并保留 map / color / alphaTest / transparent / opacity / side / alphaMap。
      ★ alphaTest 必须原样带过去 —— 这个模型的嘴/眼睛靠 MASK 镂空，
        丢了就会变成一整块色块（§25/§26 踩过）。
      ★ 原始材质存在 userData.__origStd，关掉开关时**原样换回**。
   ② MMD：把 gradientMap 换成"更硬"的色阶（3 档、对比更大）。
   ③ 两种模型都加一盏专用【边缘光】—— 动漫高光的标志。
   ============================================================================ */
let TOON2D_ON = false;
/**
 * ★★★ 三渲二「程度」0~100（2026-10-08 设计上要求）★★★
 *
 * ---- 用户诉求 ----
 *   给了 bluearchive.wiki 的截图做对比："左边是网站上的，右边是我们的" ——
 *   网站那版几乎**没有明暗过渡**（纯色块 + 描边，像 2D 立绘），
 *   我们这版阴影太重、立体感太强。用户要一个"控制三渲二程度"的滑块。
 *
 * ---- 这个滑块调的是什么 ----
 *   本质是**色阶暗部能有多暗**：
 *     · 程度低 → 暗部压得深（70）→ 明暗对比强、有立体感
 *     · 程度高 → 暗部抬到接近亮部（232）→ 几乎全是亮的 → **扁平、像 2D**
 *   这是拿 MeshToonMaterial 能做到"最接近网站那种观感"的唯一旋钮
 *   （真正把光照二值化要重写材质，风险太高，见 applyToon2D 的说明）。
 *   顺带：程度越高，专用边缘光越强（动漫高光更明显）。
 *
 *   对照表：
 *     程度   暗部   中间   亮部
 *       0     70    161    252     ← 强对比，接近普通卡通渲染
 *      50    151    202    252
 *     100    232    242    252     ← 几乎全亮，最扁平（接近网站观感）
 */
let TOON2D_LV = 50;
/** 换过材质 → 需要重新挂一次颜色分级（见 _stdToToon 里的长注释）。 */
let _pendingGradeReapply = false;
/** 三渲二用的"硬色阶"渐变（3 档，明暗分界清楚）。 */
let _toon2DHard = null;
/** 专用边缘光（只有开启时才加进场景，避免影响原有效果）。 */
let _toon2DRim = null;

/**
 * 按当前「程度」生成硬色阶渐变（3 档：暗部 / 中间 / 亮部）。
 * ★ 复用同一个 DataTexture，只改它的像素数据 ——
 *   这样已经挂上它的材质会**自动跟着变**，不用重建材质（也就不会
 *   触发颜色分级重挂、不会闪、不会把三渲二开关弄乱）。
 */
function toon2DGradient() {
  const L = Math.max(0, Math.min(100, TOON2D_LV)) / 100;
  const hi = 252;
  const lo = Math.round(70 + L * 162);                       // 70 → 232
  const mid = Math.round(lo + Math.max(8, (hi - lo) * 0.5)); // 保证递增
  const stops = [lo, Math.min(hi - 4, mid), hi];
  if (!_toon2DHard) {
    _toon2DHard = makeToonGradient(stops);
  } else {
    const d = _toon2DHard.image.data;
    if (d && d.length >= 12) {
      for (let i = 0; i < 3; i++) {
        const v = stops[i];
        d[i * 4] = v; d[i * 4 + 1] = v; d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
      }
      _toon2DHard.needsUpdate = true;
    }
  }
  return _toon2DHard;
}

/** 三渲二专用边缘光的强度（程度越高越亮）。 */
function toon2DRimIntensity() {
  return 0.25 + Math.max(0, Math.min(100, TOON2D_LV)) / 100 * 0.45;   // 0.25 → 0.70
}

/**
 * ★ 设置三渲二「程度」0~100 —— 实时生效，不重建材质。
 */
window.__setToon2DLevel = function (lv) {
  const v = parseFloat(lv);
  if (!isFinite(v)) return Math.round(TOON2D_LV);
  TOON2D_LV = Math.max(0, Math.min(100, Math.round(v)));
  /* 只更新渐变贴图的数据（材质引用的是同一个对象 → 自动跟着变） */
  toon2DGradient();
  /* 边缘光强度也跟着走 */
  try { if (_toon2DRim) _toon2DRim.intensity = toon2DRimIntensity(); } catch (e) {}
  /* 同步滑块 */
  try {
    const sl = $('sToon2DLv'), vl = $('vToon2DLv');
    if (sl && parseFloat(sl.value) !== TOON2D_LV) sl.value = String(TOON2D_LV);
    if (vl) vl.textContent = String(TOON2D_LV);
  } catch (e) {}
  nlog('三渲二程度 -> ' + TOON2D_LV);
  return TOON2D_LV;
};

/** 把 PBR 材质换成 MeshToonMaterial（保留所有关键属性）。 */
function _stdToToon(m, grad) {
  if (!m || m.userData.__origStd) return m;            // 已经是 toon 了
  const t = new THREE.MeshToonMaterial({
    color: m.color ? m.color.clone() : new THREE.Color(0xffffff),
    map: m.map || null,
    alphaMap: m.alphaMap || null,
    normalMap: m.normalMap || null,
    /* ★ 关键：alphaTest / transparent / opacity / side 必须原样带过去，
       否则嘴/眼的 MASK 镂空会失效（变成整块色块）。 */
    alphaTest: (m.alphaTest !== undefined) ? m.alphaTest : 0,
    transparent: !!m.transparent,
    opacity: (m.opacity !== undefined) ? m.opacity : 1,
    side: m.side,
    vertexColors: !!m.vertexColors,
    fog: m.fog,
    gradientMap: grad,
  });
  t.name = m.name;
  if (m.emissive && t.emissive) t.emissive.copy(m.emissive);
  t.userData = m.userData || {};
  t.userData.__origStd = m;                            // ★ 存原材质，供关掉时还原
  /* ★★★ 必须清掉"颜色分级已挂"的标记 ★★★
     ---- 事故复盘（曾出现"三渲二打开再关掉之后，不管怎么按都没反应了"）----
     `applyColorGrade()` 用一个守卫防重复注入：
         if (!mat.userData.__gradeHooked) { mat.userData.__gradeHooked = true; ...注入... }
     而我把 m.userData **整个引用**复制给了新材质 —— 于是标记"已挂"跟着过来了，
     但**真正注入的 shader 代码是挂在旧材质上的**：
       · 开三渲二：新 Toon 材质带着 `__gradeHooked=true` → 注入被跳过
         → 饱和度/色相在 toon 模型上完全失效
       · 关三渲二：还原成原来的 PBR 材质，那个材质也还带着 `__gradeHooked=true`
         → **它的注入同样被认定为"已经做过"** → 连原本能用的分级也失效了
     → 用户看到的就是"开关一按就再也回不去了"。
     ★ 正解：换材质时把标记清掉，让 applyColorGrade 在新材质上重新注入一次；
       还原时同理（原材质保留自己的真实状态）。
     ★ 注意 onBeforeCompile 本身也要重新设（新材质是全新的），
       所以这里连 __gradeHooked 一起清。 */
  delete t.userData.__gradeHooked;
  return t;
}

/** 应用 / 撤销三渲二。 */
function applyToon2D(on) {
  TOON2D_ON = !!on;
  if (!model) { nlog('三渲二: 还没有模型，稍后自动应用'); return 0; }
  const grad = toon2DGradient();
  let converted = 0, reverted = 0, tooned = 0;
  try {
    model.traverse(o => {
      const arr = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      for (let i = 0; i < arr.length; i++) {
        const m = arr[i];
        if (!m) continue;
        if (TOON2D_ON) {
          if (m.isMeshStandardMaterial && !m.userData.__origStd) {
            const t = _stdToToon(m, grad);
            if (Array.isArray(o.material)) o.material[i] = t; else o.material = t;
            converted++;
          } else if (m.isShaderMaterial && m.type === 'MMDToonMaterial') {
            m.gradientMap = grad;                 // MMD 已是 toon → 只把色阶换硬
            m.needsUpdate = true;
            tooned++;
          }
        } else {
          if (m.userData && m.userData.__origStd) {
            const orig = m.userData.__origStd;
            if (Array.isArray(o.material)) o.material[i] = orig; else o.material = orig;
            try { m.dispose(); } catch (e) {}
            /* ★ 原材质的 onBeforeCompile 注入还在，但它的 __gradeHooked 标记
               可能已经被换材质时清掉了 → 清掉重挂一次，保证"关掉后回到原样"。 */
            delete orig.userData.__gradeHooked;
            _pendingGradeReapply = true;
            reverted++;
          } else if (m.isShaderMaterial && m.type === 'MMDToonMaterial') {
            /* MMD：还原成用户设的色阶（sToon 滑块那套） */
            m.gradientMap = makeToonGradient(_toonStops.length ? _toonStops : TOON_STOPS);
            m.needsUpdate = true;
            tooned++;
          }
        }
      }
    });
  } catch (e) {
    nerr('三渲二应用失败: ' + (e && e.message));
  }

  /* ---- 专用边缘光 ---- */
  try {
    if (TOON2D_ON) {
      if (!_toon2DRim) {
        _toon2DRim = new THREE.DirectionalLight(0xbfe0ff, toon2DRimIntensity());
        /* 从侧后方打，才会在轮廓上形成一道亮边 */
        _toon2DRim.position.set(-1.2, 1.1, -1.4);
      }
      _toon2DRim.intensity = toon2DRimIntensity();
      if (!_toon2DRim.parent) scene.add(_toon2DRim);
    } else if (_toon2DRim && _toon2DRim.parent) {
      scene.remove(_toon2DRim);
    }
  } catch (e) {}

  /* ★ 换过材质 → 立刻把颜色分级重新挂一遍（否则饱和度/色相在新材质上失效） */
  if (_pendingGradeReapply || converted || reverted) {
    _pendingGradeReapply = false;
    try {
      const n = applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);
      nlog('三渲二：已重新挂颜色分级（' + n + ' 个材质）');
    } catch (e) { nerr('重新挂颜色分级失败: ' + (e && e.message)); }
  }

  nlog('三渲二 -> ' + (TOON2D_ON ? '开' : '关')
    + '（转 toon ' + converted + ' / 还原 ' + reverted
    + ' / MMD 色阶 ' + tooned + '）');
  return converted + reverted + tooned;
}

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------
   normalizeModel
   PMX 的原生单位不统一：有的模型高 1.6 单位（MMD 标准），有的高 31
   甚至 1600（1 单位=1mm）。如果直接用固定灯光/相机，所有非标准模型都会
   过曝或取景失败。
   这里统一缩放到 MMD 标准的 1.6 单位高并把底面移到 y=0，之后灯光和相机
   就可以用固定参数，对任何 .pmx 都成立。
   ------------------------------------------------------------------ */
const TARGET_HEIGHT = 1.6;

/* ============================================================
   ★★★ 尺寸诊断（2026-10-07）：定位"模型有时缩水" ★★★
   ------------------------------------------------------------
   症状（实测）："模型有时还是会缩水；在模型刚加载完后，拖拽模型会大幅提高概率"。
   已排除的：
     · tryCropMmdWindow —— 空实现（"故意留空"）
     · _syncDistMin    —— 已修（只同步滑块 min，不碰相机）
     · 漫游            —— 只改窗口 x/y，不改尺寸
     · resetFit(resize)—— 锁定取景时会被跳过（日志可见）
   剩下的嫌疑全在"相机距离 / 模型 scale / 画布尺寸 / 视口尺寸"这四个量里。
   做法：每 400ms 采样这四个量，**只在真的变了时**打印一行，
        并附上最近 8 条"可疑触发"（谁调了 resetFit / applyCamDist / setPerf / onResize…）
        —— 缩水发生的那一刻，日志里就能看到"是谁改的、从多少改到多少"。
   ★ 这就是本项目反复验证有效的"measure, don't guess"。
   ============================================================ */
const _szTriggers = [];
function _szTrig(tag) {
  try {
    const d = new Date();
    _szTriggers.push(String(d.getHours()).padStart(2, '0') + ':'
      + String(d.getMinutes()).padStart(2, '0') + ':'
      + String(d.getSeconds()).padStart(2, '0') + ' ' + tag);
    if (_szTriggers.length > 8) _szTriggers.shift();
  } catch (e) {}
}
window.__szTriggers = function () { return JSON.stringify(_szTriggers); };
let _szPrev = null;
setInterval(function () {
  try {
    if (!model) return;
    const cur = {
      camZ: +camera.position.z.toFixed(3),
      camY: +camera.position.y.toFixed(3),
      scale: +model.scale.x.toFixed(4),
      canvas: renderer.domElement.width + 'x' + renderer.domElement.height,
      inner: window.innerWidth + 'x' + window.innerHeight,
      aspect: +camera.aspect.toFixed(4),
    };
    if (_szPrev) {
      const diff = [];
      for (const k in cur) {
        if (String(cur[k]) !== String(_szPrev[k])) {
          diff.push(k + ' ' + _szPrev[k] + '→' + cur[k]);
        }
      }
      if (diff.length) {
        nlog('★尺寸变化: ' + diff.join(' | ')
          + '  ||最近触发: ' + (_szTriggers.slice(-4).join(' / ') || '-'));
      }
    }
    _szPrev = cur;
  } catch (e) {}
}, 400);

function normalizeModel(mesh) {
  _szTrig('normalizeModel');
  mesh.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(mesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const h = size.y || 1;

  const s = TARGET_HEIGHT / h;
  baseModelScale = s;
  mesh.scale.multiplyScalar(s);
  mesh.updateMatrixWorld(true);

  // 缩放后重新求包围盒，把模型摆到世界原点：x/z 居中，底面贴 y=0
  const b2 = new THREE.Box3().setFromObject(mesh);
  const c2 = b2.getCenter(new THREE.Vector3());
  const minY = b2.min.y;
  mesh.position.x -= c2.x;
  mesh.position.z -= c2.z;
  mesh.position.y -= minY;
  mesh.updateMatrixWorld(true);

  const finalSize = b2.getSize(new THREE.Vector3()).multiplyScalar(1);
  /* ★★★ 关掉所有 mesh 的视锥剔除（2026-10-07，根因修复）★★★
     ---- 事故复盘（曾出现"之前很细也能看见嘴，现在根本看不见"）----
     真机 A/B 诊断（照搬描边那次的手法）：
        `★嘴部 A/B: 带嘴 drawcall=33 隐藏后=33 差值=0 (嘴 mesh 数=14)`
        `★嘴材质状态: matVisible=true hasMap=true colorWrite=true
                     meshVisible=true layersMask=1 frustumCulled=true`
     材质与可见性**全部正常**，但 14 个嘴 mesh 一个都没进绘制。
     唯一可疑项就是 `frustumCulled=true`。

     ★ 根因：three.js 的视锥剔除用 `geometry.boundingSphere`，
       而它是按 **原始（未蒙皮）顶点** 算的。这个模型里
       `Mouth_*` 的原始位置是 y≈-0.09 / z≈0.645（建模空间），
       但**蒙皮后实际跑到 y≈-0.43**（差 0.34，模型总高才 1.6）——
       包围球落在相机视锥之外 → **被剔除 → 一个 drawcall 都不产生**。
       而相机距离/取景一变，球进出视锥 → 症状就是"**有时**看得见"。

     ★ 为什么描边一直没事：它的 mesh 显式设了 `frustumCulled = false`。
     ★ 为什么放这里：试过放在 __loadModel 里 `normalizeModel()` 之后，
       但实测那段根本没执行（日志不出现）—— 放进这个必定会跑的函数最保险。
     ★ 桌宠窗口永远把模型框在中间，视锥剔除这里**没有任何收益**，却会误杀蒙皮网格。 */
  try {
    let n = 0;
    mesh.traverse(o => {
      if ((o.isMesh || o.isSkinnedMesh) && o.frustumCulled) { o.frustumCulled = false; n++; }
    });
    nlog('已关闭 ' + n + ' 个 mesh 的视锥剔除（防蒙皮网格被误剔）');
  } catch (e) { nerr('关闭视锥剔除失败: ' + (e && e.message)); }

  nlog('normalized: raw h=' + h.toFixed(2) + ' scale=' + s.toFixed(4)
       + ' -> h=' + (b2.max.y - b2.min.y).toFixed(3)
       + ' size=' + finalSize.toArray().map(n => n.toFixed(2)).join(','));
  return b2;
}

/**
 * 计算模型包围盒（不再直接设置相机）。
 * ★ 取景统一由 fitCameraToBox + correctCameraFromMask 负责。
 *   之前这里也设置相机，且 onResize 会调用它，
 *   结果把取景结果覆盖掉（"双开关控制同一件事"，文档 §11.7）。
 */
function frameModel(mesh) {
  const box = new THREE.Box3().setFromObject(mesh);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const vFov = (camera.fov * Math.PI) / 180;
  const aspect = window.innerWidth / Math.max(1, window.innerHeight);

  // 竖屏按高度取景，留 8% 余量；横屏按最长边取景
  let dist = (aspect <= 1.2)
    ? (size.y * 0.58) / Math.tan(vFov / 2)
    : (Math.max(size.x, size.y, size.z) * 0.58) / Math.tan(vFov / 2);
  dist = Math.max(dist, 0.2);

  camera.position.set(center.x, center.y, center.z + dist);
  camera.lookAt(center.x, center.y, center.z);
  camera.near = Math.max(0.01, dist * 0.005);
  camera.far = dist * 40;
  camera.updateProjectionMatrix();

  nlog('framed size=' + size.toArray().map(n => n.toFixed(2)).join(',')
    + ' center=' + center.toArray().map(n => n.toFixed(2)).join(',')
    + ' dist=' + dist.toFixed(3));

  // 之后由 fitCameraToBox 接管精调
  _fitStage = 0;
  _fitDone = false;
  fitCameraToBox();
}

function loadWith(loader, url) {
  return new Promise((resolve, reject) => {
    loader.load(url, resolve, undefined,
      e => reject(e instanceof Error ? e : new Error(String((e && e.message) || e))));
  });
}

/* ============================================================
   glTF（.glb / .gltf）支持
   ------------------------------------------------------------
   ★ 与 MMD 的核心差别：
     · 没有 PMX 的骨骼索引 / 材质表情数据 / 刚体 / 付与
     · 动作是【自带的 AnimationClip】，用标准 AnimationMixer 播
       （不需要 MMDAnimationHelper 的 IK / grant）
     · 材质是 MeshStandardMaterial 等，而不是 MMDToonMaterial
   所以下面这些 MMD 专属步骤在 glTF 下必须【跳过】，
   否则要么报错、要么白跑：
     applyToonGradient / rebuildBoneIndex / loadMorphBoneMap /
     enableMorphSupport / reportHiddenPartPhysics / refreshMorphList
   ============================================================ */
let isGltfModel = false;
/** glTF 自带动作：名字 -> AnimationClip。 */
let glbClips = {};
/** 动作名（保持 GLB 内的原始顺序）。 */
let glbClipNames = [];

/**
 * GLB 动画：所有动作里【出现过】的目标节点名集合。
 * ★ 用它判断"某根骨骼被某些动作动过" —— 只有这种才需要补静止轨道。
 *   （从没被任何动作动过的节点不用管，它们一直是静止的。）
 */
let glbAnimTargets = new Set();
/** 诊断用：是否已冻结到绑定姿态。 */
let _glbFrozen = false;

/** 把所有骨骼写回 glbRestPose（诊断 / 复位用）。 */
function applyGlbRestPose() {
  try {
    if (!model) return;
    let cnt = 0;
    model.traverse(o => {
      if (!o.name) return;
      const r = glbRestPose[o.name];
      if (!r) return;
      o.position.fromArray(r.p);
      o.quaternion.fromArray(r.q);
      o.scale.fromArray(r.s);
      cnt++;
    });
    model.updateMatrixWorld(true);
    nlog('已写回静止姿态: ' + cnt + ' 个节点');
  } catch (e) {
    nerr('applyGlbRestPose failed: ' + (e && e.message));
  }
}

/**
 * 诊断开关：冻结到绑定姿态。
 * ★ 冻结后如果模型【正常】，说明是我们的动画/驱动弄乱的；
 *   如果【照样乱】，说明是模型本身或加载姿势的问题。一句话定性。
 */
window.__glbFreezeRestPose = function (on) {
  if (!isGltfModel) { nlog('诊断：当前不是 glTF 模型'); return 'not-gltf'; }
  _glbFrozen = !!on;
  try { if (vmd.mixer) vmd.mixer.stopAllAction(); } catch (e) {}
  if (on) {
    applyGlbRestPose();
    nlog('★ 诊断：已冻结为【绑定姿态】（所有动画停止）');
  } else {
    _glbFrozen = false;
    try { vmdRebuild('unfreeze'); } catch (e) {}
    nlog('★ 诊断：已恢复动画');
  }
  return _glbFrozen ? 'frozen' : 'resumed';
};

/** 节点名 → 静止姿态（加载模型时、任何动画播放之前采集）。 */
let glbRestPose = {};

/** glTF 表情映射：名字 → [{mesh, idx}]（每个 mesh 各有自己的 dictionary）。 */
let glbMorphMap = {};
/** 我们【自己设过】的 glTF morph 名 —— 复位时只动这些，
 *  绝不动 AnimationMixer 驱动的（见 setMorphGLB 的长注释）。 */
let _glbTouched = new Set();

/**
 * 收集 glTF 模型的 morph target（表情）。
 * ★ 不同 mesh 的 dictionary 不同，所以要按"名字 → 多个 (mesh, 下标)"存。
 */
function collectGlbMorphs(root) {
  glbMorphMap = {};
  let meshCnt = 0, total = 0;
  try {
    root.traverse(o => {
      const dict = o.morphTargetDictionary;
      const inf = o.morphTargetInfluences;
      if (!dict || !inf) return;
      meshCnt++;
      const keys = Object.keys(dict);
      /* ★ GLTFLoader 在导出器没给 targetNames 时，key 就是下标（"0"）——
           这种名字用户完全看不懂。此时改用【mesh 名字】，
           它通常是有意义的（本例是蔚蓝档案的 Mouth_200/205/300…）。
           名字里带 non-ASCII 时也一并展示不出来问题，保持原样即可。 */
      const allNumeric = keys.length > 0 && keys.every(k => /^[0-9]+$/.test(k));
      for (let k = 0; k < keys.length; k++) {
        const raw = keys[k];
        const idx = dict[raw];
        if (idx === undefined || idx === null) continue;
        let nm = raw;
        if (allNumeric) {
          const base = o.name || raw;
          nm = (keys.length > 1) ? (base + '#' + (k + 1)) : base;
        }
        if (!nm) continue;
        if (!glbMorphMap[nm]) { glbMorphMap[nm] = []; total++; }
        glbMorphMap[nm].push({ mesh: o, idx: idx });
      }
    });
  } catch (e) {
    nerr('collectGlbMorphs failed: ' + (e && e.message));
  }
  /* 喂给现有的"表情系统"，让下拉/AI 都能列出来 */
  const names = Object.keys(glbMorphMap);
  morphNames = names.slice();
  morphIndex = {};
  names.forEach((nm, i) => { morphIndex[nm] = i; });
  morphMeshes = [];
  try {
    root.traverse(o => { if (o.morphTargetInfluences && o.morphTargetInfluences.length) morphMeshes.push(o); });
  } catch (e) {}
  /* glTF 没有 MMD 的骨骼/材质型表情 → 清掉残留 */
  morphBoneMap = null;
  morphEffects = null;
  _userExpr = [];
  _glbTouched = new Set();          // 换模型：只复位我们自己设过的那些
  _blinkNames = [];
  _blinkExprsCache = null;
  _blinkExprsFor = null;
  nlog('GLB 表情: ' + names.length + ' 个名字 / ' + meshCnt + ' 个 mesh 有 morph target'
    + (names.length ? ('：' + names.slice(0, 10).join(', ') + (names.length > 10 ? ' …' : '')) : ''));

  /* ★ 刷新页面自己的表情下拉 + 通知原生重新拉取表情清单
     ---- 为什么必须主动通知 ----
     原生是在【页面 ready】时 queryExpressions 的，而 GLB 的动作/表情
     要等模型加载完才知道，那时 ready 早就过去了 →
     AI 表情控制会拿到空列表。这里补一次通知，让它重新拉。 */
  try { refreshMorphList(); } catch (e) {}
  /* ★★ 主动上报表情清单 ★★
     ---- 为什么必须主动（实测时序）----
     原生是在【页面 ready】时 queryExpressions 的，而 GLB 的表情要等
     模型加载完才知道 —— 两者差了 30ms，原生永远拿到空列表：
       19:02:46.797  CAP morph(0)        ← 页面还没收集
       19:02:46.846  expressions(0)      ← 原生问的时候确实是空的
     所以这里收集完直接推给原生。
     （MMD 模型是从 PMX 解析的，时机早，所以没暴露这个问题。） */
  try {
    if (B && B.expressions) B.expressions(JSON.stringify(names));
  } catch (e) {}
  return names;
}

/**
 * 应用 glTF 表情（顶点型）。
 * @param names 表情名（可传数组；多表情分别作用到自己的 morph target）
 * @param weight 0~1
 */
function setMorphGLB(names, weight) {
  const w = (weight === undefined) ? 1 : weight;
  const list = Array.isArray(names) ? names.filter(Boolean) : (names ? [names] : []);
  _userExpr = list;
  _userExprW = w;
  try {
    /* ★★★ 绝对不能"先把所有权重清零"！★★★
       ---- 事故复盘（2026-10-07 曾出现"看不见嘴巴的贴图"）----
       实测这个 GLB（蔚蓝档案导出）的 morph 语义非常反直觉：
       14 个 Mouth_* 各带 1 个 morph target，而它的 delta 是
       **"把全部顶点搬到同一个点"** —— 于是
           权重 = 1 → 嘴【塌缩成一个点 = 完全不可见】
           权重 = 0 → 嘴【保持原样 = 正常可见】
       （实测 `base + delta*1` 的包围盒尺寸 = 0,0,0，铁证。）
       而 Cafe_Idle 动画给 **13 个嘴的权重恒为 1、只留 Mouth_305 为 0**
       → 正常画面就是"只有 Mouth_305 这一个嘴形可见"。
       我们原来这里的"清零所有 glTF morph"会把那 13 个嘴全部展开到原位，
       而它们【base 包围盒完全相同】（完全重叠）→ 14 个嘴糊成一团，
       正确的那一个反而被盖住 → 用户看到的就是"嘴巴贴图不见了"。
       → 正解：**只复位【我们自己设过】的名字**，
         动画驱动的权重一律不碰（那是 AnimationMixer 的地盘）。 */
    for (const nm of _glbTouched) {
      const arr = glbMorphMap[nm];
      if (!arr) continue;
      for (const t of arr) {
        try { t.mesh.morphTargetInfluences[t.idx] = 0; } catch (e) {}
      }
    }
    const prevTouched = _glbTouched;
    _glbTouched = new Set();
    if (!list.length) {
      nlog('expr(glb) 清空：只复位我们设过的 ' + prevTouched.size
        + ' 个（动画驱动的权重保持不动）');
      return;
    }
    let applied = 0;
    for (const nm of list) {
      const arr = glbMorphMap[nm];
      if (!arr) continue;
      _glbTouched.add(nm);
      for (const t of arr) {
        try { t.mesh.morphTargetInfluences[t.idx] = w; applied++; } catch (e) {}
      }
    }
    nlog('expr(glb) [' + list.join(',') + '] w=' + w + ' -> 命中 ' + applied + ' 个 morph');
  } catch (e) {
    nerr('setMorphGLB failed: ' + (e && e.message));
  }
}

/** 这个 id/url 是不是"GLB 自带动作"。兼容两种写法：
    `glb:名字` 和 `/vmd/glb%3A名字`（早期版本会错误地 URL 编码一次）。
   ★ 兼容是必要的：用户已经存过配置，光修 Java 侧会让老配置失效。 */
function isGlbActionId(u) {
  if (!u) return false;
  return u.indexOf('glb:') === 0 || /^\/vmd\/glb(%3A|:)/i.test(u);
}

/** 从 id/url 里取出 GLB 动作名。 */
function glbClipNameOf(u) {
  if (!u) return null;
  if (u.indexOf('glb:') === 0) return u.slice(4);
  const m = /^\/vmd\/glb(?:%3A|:)(.*)$/i.exec(u);
  return m ? decodeURIComponent(m[1]) : null;
}

function isGltfUrl(url) {
  return !!url && /\.(glb|gltf)$/i.test(url);
}

/** 按扩展名加载模型：MMD 与 glTF 统一入口。 */
async function loadAnyModel(url) {
  if (isGltfUrl(url)) {
    const gltf = await new Promise((resolve, reject) => {
      new GLTFLoader().load(url, resolve, undefined,
        e => reject(e instanceof Error ? e : new Error(String((e && e.message) || e))));
    });
    isGltfModel = true;
    glbClips = {};
    glbClipNames = [];
    const anims = (gltf && gltf.animations) ? gltf.animations : [];

    /* ★★ 采集【静止姿态】★★
       必须在任何动画播放之前做 —— 之后骨骼就再也不是静止姿态了。
       用途：给"没覆盖某根骨骼"的动作补一条静止轨道，
       避免它保留上一个动作的姿态（头发乱飞的根因）。 */
    glbRestPose = {};
    glbAnimTargets = new Set();
    try {
      gltf.scene.traverse(o => {
        if (!o.name) return;
        glbRestPose[o.name] = {
          p: o.position.toArray(),
          q: o.quaternion.toArray(),
          s: o.scale.toArray(),
        };
      });
    } catch (e) {}

    for (const c of anims) {
      if (!c || !c.name) continue;
      glbClips[c.name] = c;
      glbClipNames.push(c.name);
      /* 收集"被动画过的节点名"，供 vmdRebuild 补轨道时判断 */
      try {
        for (const t of (c.tracks || [])) {
          const i = t.name.lastIndexOf('.');
          if (i > 0) glbAnimTargets.add(t.name.slice(0, i));
        }
      } catch (e) {}
    }
    nlog('GLB 静止姿态: ' + Object.keys(glbRestPose).length + ' 个节点；'
      + '被动画过: ' + glbAnimTargets.size + ' 个');
    nlog('GLB 加载完成：自带动作 ' + glbClipNames.length + ' 个'
      + (glbClipNames.length ? ('：' + glbClipNames.slice(0, 12).join(' / ')
         + (glbClipNames.length > 12 ? ' …' : '')) : '（没有动作）'));
    /* 上报给原生 —— 「VMD 动画」页的动作库要列出这些动作 */
    try {
      if (B && B.glbClips) B.glbClips(JSON.stringify(glbClipNames));
    } catch (e) {}
    /* ★ 收集 morph target（表情）—— 让表情下拉 / AI 表情控制能用 */
    try { collectGlbMorphs(gltf.scene); } catch (e) {}

    /* ★★ 隐藏"可选节点"（extras.optional）★★
       ---- 为什么 ----
       glTF 规范里没有 optional 字段，但蔚蓝档案的导出脚本用它标记**可拆道具**
       （本例 brush_01: {"optional":true,"prop0":true}）。
       这些道具在游戏里是要靠"是否装备"来显示/隐藏的，对我们这种桌宠场景
       没有意义，只会变成"身后多出个不知道什么东西"。
       GLTFLoader 会把 node 的 extras 合并进 object.userData，所以直接按 userData 判断。
       ★ 只隐藏 optional=true 的；武器(case/railgun)没有这个标记，属于模型本体，保留。 */
    try {
      let hidden = 0;
      const hid = [];
      gltf.scene.traverse(o => {
        if (o.userData && o.userData.optional === true && o.visible) {
          o.visible = false;
          hidden++;
          if (hid.length < 8) hid.push(o.name || '(无名)');
        }
      });
      if (hidden) nlog('GLB 隐藏 optional 节点: ' + hidden + ' 个' + (hid.length ? ('（' + hid.join(', ') + '）') : ''));
    } catch (e) {}

    return gltf.scene;
  }
  isGltfModel = false;
  glbClips = {};
  glbClipNames = [];
  glbMorphMap = {};
  /* 切回 MMD 模型 → 清掉上次 GLB 的动作名（否则动作库会显示过期的列表） */
  try {
    if (B && B.glbClips) B.glbClips('[]');
  } catch (e) {}
  return await loadWith(new MMDLoader(), url);
}

async function boot() {
  mark('boot: imports ok');

  mark('loading model...');
  /* ★ 优先加载"上次用的模型"，而不是先加载内置 arona 再切换。
     ---- 为什么（实测）----
     "加载模型的时候会先加载 arona(默认的)，然后 arona 消失，再加载 Kei"。
     原因：boot() 固定加载 MODEL_URL(arona)，700ms 后 applySettings 又切到存档模型。
     白白多解码一个 8MB 级模型、多占一次显存、还多一次 dispose，
     观感上也能看到"出现→消失→再出现"。
     ★ 这里直接读存档选目标模型；applySettings 之后会因
       currentModelUrl 一致而自动跳过重复加载。 */
  let bootTarget = MODEL_URL;
  try {
    const st0 = loadSettings();
    /* ★★★ 取景相关参数必须在这里就恢复 —— 必须在【第一次取景之前】★★★
       ---- 事故复盘（2026-10-07 曾出现"模型刚加载完会变小一次"）----
       真机日志（同一模型，两次取景、两个不同的目标值）：
         21:55:49  camFit: v=0.92 -> 采用 垂直（0.92），目标 0.96   ← 用【默认值 0.96】
         21:55:51  camFit: v=0.73 -> 采用 垂直（0.73），目标 0.74   ← 用【存档值 0.74】
       原因：`FIT_RATIO`（取景填充度）只在 applySettings 里恢复，而 applySettings
       是 700ms 后跑的 —— 那时第一次取景早就按默认值 0.96 做完并显示了。
       于是用户看到"先大后小"，就是那一次【变小】。
       （终端状态是对的 73%≈74%，错的只是过程。）
       → 这里提前恢复，让第一次取景就用用户的真实值，全程只有一次取景。
       `_userScale` 同理（它影响 model.scale，也就影响取景结果）。 */
    if (st0) {
      if (st0.fitRatio !== undefined) {
        const fr = parseFloat(st0.fitRatio);
        if (isFinite(fr) && fr >= 0.5 && fr <= 1.0) {
          FIT_RATIO = fr;
          const sf = $('sFit'), vf = $('vFit');
          if (sf) sf.value = String(fr);
          if (vf) vf.textContent = fr.toFixed(2);
          nlog('boot: 预恢复取景填充度 ' + fr + '（避免先用默认值取一次景）');
        }
      }
      if (st0.scale !== undefined) {
        const sc = parseFloat(st0.scale);
        if (isFinite(sc) && sc > 0) {
          _userScale = sc;
          const ss = $('sScale'), vs = $('vScale');
          if (ss) ss.value = String(sc);
          if (vs) vs.textContent = sc.toFixed(2);
          nlog('boot: 预恢复缩放 ' + sc);
        }
      }
    }
    if (st0 && st0.model && st0.model !== MODEL_URL
        && st0.model.indexOf('dir:') !== 0) {
      bootTarget = st0.model;
      nlog('boot: 使用存档模型启动，跳过内置默认模型: ' + bootTarget);
    }
  } catch (e) {}
  /* ★ 必须在 await【之前】就声明目标 URL：
     否则 700ms 后 applySettings 看到 currentModelUrl 还是旧值，
     会再触发一次 __loadModel —— 那就是上面的竞态崩溃。 */
  /* ★★ 没有模型 → 显示提示并中止 boot ★★
     ---- 为什么必须提前返回 ----
     后面整段都是"拿到 model 之后"的处理（normalizeModel / 物理 / 表情 / 取景…），
     没有 model 就会在 model.traverse 之类的地方抛异常。
     而且这不该被当成错误：用户只是还没导入模型。
     ★ 这里【不】调 B.ready()：页面确实还没准备好渲染，
       原生的 ready 等待有 10 秒上限，超时后会照常下发后续指令。 */
  if (!bootTarget) {
    showNoModel();
    nlog('boot: 没有模型，等待用户导入（不会加载内置模型）');
    return;
  }

  currentModelUrl = bootTarget;
  _loadingUrl = bootTarget;
  const mySeq = ++_loadSeq;

  try {
    const m0 = await loadAnyModel(bootTarget);
    /* 期间若有更新的加载启动，本次结果作废（避免覆盖新版/操作已释放的资源） */
    if (mySeq !== _loadSeq) {
      nlog('boot: 本次加载已被取代，放弃');
      try { disposeModel(m0); } catch (e) {}
      return;
    }
    model = m0;
  } catch (e) {
    if (mySeq !== _loadSeq) return;
    showErr('Failed to load ' + bootTarget + '\n' + e.message
      + '\n\n模型可能已被删除或移动。请在 App 里 ' +
        '「3D 模型 → 模型管理」重新导入 .pmx / .glb。');
    return;
  }
  if (!model) { nlog('boot: model 为空，中止'); return; }
  scene.add(model);
  nlog('model loaded, children=' + model.children.length);
  mark('pmx ok -> vmd/ammo');

  if (VMD_URL) {
    try {
      const vmd = await loadWith(loader, VMD_URL);
      mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(vmd.animations[0]).play();
      nlog('vmd playing');
    } catch (e) {
      nerr('vmd skipped: ' + e.message);
    }
  }

  /* 先归一化尺度（把模型变成 1.6 单位高），再建物理。
     顺序很重要：MMDPhysics._init 会临时把 mesh 变换重置为 0/identity/1，
     假设传入时是标准尺度；如果先建物理再缩放，刚体尺寸会和骨骼对不上。 */
  normalizeModel(model);
  fixColorSpace(model);
  fixOverExposure(model);
  /* ★ 纹理镂空修复：必须在材质就绪后立刻做，
     否则头发的透明区会写深度 → 出现"锯掉的黑色缺口" */
  applyAlphaTest(model);
  /* ---- 以下都是 MMD 专属（glTF 没有这些数据）---- */
  if (isGltfModel) {
    nlog('glTF 模型：跳过 toon 渐变 / 刚体诊断');
  } else {
    reportHiddenPartPhysics(model);   // 诊断：隐藏配饰的刚体是否在推挤可见部分
    /* TOON_STOPS 决定明暗分层：值越小暗部越暗、对比越强。 */
    applyToonGradient(model, TOON_STOPS);
  }

  const pd0 = mmdPhysicsDataOf(model);
  const hasRB = pd0.rigidBodies.length > 0;
  if (PHYSICS && hasRB) {
    try {
      snapshotPhysBones();
      await loadAmmo();
      const pf0 = filterPhysicsByPart(model, pd0.rigidBodies, pd0.constraints);
      applyNoCollide(pf0.rigidBodies);
      nlog('物理刚体筛选: 保留 ' + pf0.kept + ' / 排除 ' + pf0.dropped);
      physics = createPhysicsUnscaled(model, pf0.rigidBodies, pf0.constraints);
      /* ★ warmup：让约束先收敛，避免刚加载时头发乱抽
         ★ 必须在 scale=1 下跑（否则每步都走 isNonDefaultScale 分支） */
      warmupPhysicsUnscaled(model, physics, 60);
      nlog('physics on (' + pd0.rigidBodies.length + ' bodies / '
        + pd0.constraints.length + ' constraints)');
    } catch (e) {
      nerr('physics skipped: ' + e.message);
      physics = null;
    }
  } else {
    nlog('physics disabled (flag=' + PHYSICS + ' rigidBodies=' + pd0.rigidBodies.length + ')');
  }

  /* ★ 建骨骼索引 + 读 PMX 表情映射。
     必须放在 findEyeBones / refreshMorphList 之前 ——
     表情系统与眨眼都依赖 morphEffects。 */
  if (!isGltfModel) {
    rebuildBoneIndex();
    /* ★ 这里必须用【实际加载的】模型 URL（原来是写死的 MODEL_URL/arona），
       否则会解析错模型的 morph 数据 —— 表情/眨眼全都对不上。 */
    await loadMorphBoneMap(currentModelUrl);
    if (mySeq !== _loadSeq) { nlog('boot: 已被取代(2)，放弃'); return; }
  }
  /* 注：材质基础状态由 rebuildMorphMap() 末尾统一捕获（见那里的说明），
     不在这里调 —— 否则会被它清掉。 */

  onResize();
  nlog('framed + resized');

  // 探测眼动骨骼 + 填充诊断面板
  /* glTF 骨骼命名与 MMD 完全不同，找眼球骨骼没有意义 → 直接给空 */
  const g = isGltfModel ? { left: null, right: null, all: [], lids: [] }
                        : findEyeBones(model);
  // ★ 必须连 all 一起赋值！只赋 left/right 会让 gazeBones.all 永远为空，
  //   而 updateGaze 驱动的是 all -> 结果"找到 21 根眼骨但一根都不转"。
  gazeBones.left = g.left; gazeBones.right = g.right; gazeBones.all = g.all;
  lidBones = g.lids || [];
  nlog('eye bones: eyeball=' + g.all.length + ' lids=' + (g.lids || []).length
     + ' -> [' + g.all.map(b => b.name).join(',') + ']');
  bindPanel();
  // ★ 表情列表必须在这里也刷一次。之前只在 __loadModel() 里调，
  //   而启动走的是 boot()，导致表情下拉一直是空的
  //   （现象："重载模型后表情才出现"）。
  enableMorphSupport(model);
  fixColorSpace(model);
  applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);
  /* ★ 纹理镂空修复（同 boot 路径，换模型也要做） */
  applyAlphaTest(model);
  refreshMorphList();
  refreshModelList();
  /* ★ VMD 动作剪辑必须【按模型】构建（轨道按模型的骨骼/表情字典拟合），
     所以模型就绪后要重建一次。没有配动作时这个调用是空转，很便宜。 */
  vmdRebuild('boot');
  buildOutlines();          // 描边（要在材质处理完之后）
  try {
    nlog('描边状态: 开关=' + OUTLINE_ON + ' 颜色=' + (OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR)
      : 'auto(跟随贴图取色)') + ' 深度=' + OUTLINE_DEPTH + ' 宽度=' + OUTLINE_W
      + ' 材质数=' + outlineMats.length);
  } catch (e) {}
  {
    // 一次性把模型能力全部打到 logcat，交接时据此确认支持哪些功能
    const g = model.geometry || {};
    nlog('CAP morph(' + morphNames.length + '): ' + morphNames.join(','));
    const boneNames = [];
    model.traverse(o => { if (o.isBone && o.name) boneNames.push(o.name); });
    nlog('CAP bones(' + boneNames.length + ') ALL: ' + boneNames.join('|'));
    // 眼骨候选：任何名字里带 eye/目/眼/pupil/iris 的都列出来
    const eyeCand = boneNames.filter(n => /eye|目|眼|pupil|iris|ball/i.test(n));
    nlog('CAP eyeCandidates(' + eyeCand.length + '): ' + eyeCand.join('|'));
    // 逐个 mesh 打印形态信息，定位"为什么只有光环变"
    model.traverse(o => {
      if (!o.isMesh) return;
      const gm = o.geometry;
      const legacy = gm.morphTargets ? gm.morphTargets.length : 0;
      /* ★ GLB 的几何体可能有 morphAttributes 但【没有 position 槽】
           （只有 normal/tangent）→ 直接读 .position.length 会崩 */
      const attrs = (gm.morphAttributes && gm.morphAttributes.position)
              ? gm.morphAttributes.position.length : 0;
      const inf = o.morphTargetInfluences ? o.morphTargetInfluences.length : 0;
      nlog('MESH name=' + (o.name || '(unnamed)')
         + ' isSkinned=' + !!o.isSkinnedMesh
         + ' legacyMorphTargets=' + legacy
         + ' morphAttributes=' + attrs
         + ' influences=' + inf
         + ' mats=' + (Array.isArray(o.material) ? o.material.map(m=>m.type).join('+') : o.material.type));
    });
    nlog('CAP eyeBones(' + gazeBones.all.length + '): '
       + gazeBones.all.map(b => b.name).join(','));
    nlog('CAP rigidBody=' + (g.rigidBody ? g.rigidBody.length : 0)
       + ' constraint=' + (g.constraint ? g.constraint.length : 0));
  }
  setTimeout(refreshDiag, 300);

  // 启动时恢复上次保存的设置（延迟到各列表都建好）
  setTimeout(() => {
    refreshModelList();          // 先让下拉包含所有已导入模型
    const st = loadSettingsForModel(currentModelUrl);
    if (st) {
      nlog('restoring settings from ' + new Date(st.savedAt).toLocaleString()
         + ', model=' + st.model + ' (current=' + currentModelUrl + ')'
         + (isMmdModelUrl(currentModelUrl) ? ' [本模型专属]' : ' [全局]'));
      /* ★ 若存档模型与当前已加载的一致，不要再次 loadModel：
         重复加载会打断刚完成的切换与取景。 */
      if (st.model && currentModelUrl && st.model !== currentModelUrl) {
        nlog('setting model differs, will switch: ' + st.model);
      }
      applySettings(st);       // 内部会在完成后开放保存
    } else {
      /* ★ 没有存档 → 立刻开放保存，否则永远存不了 */
      _restoring = false;
      _canSave = true;
      nlog('无存档，直接开放保存');
    }
  }, 700);

  /* ★ 兜底：无论上面发生什么，4 秒后一定开放保存。
     避免任何异常路径导致"永远存不了配置"。 */
  setTimeout(function () {
    if (!_canSave) {
      _restoring = false;
      _canSave = true;
      nlog('保存闸门兜底开启（4s）');
    }
  }, 4000);

  // 任意控件变化后 800ms 自动保存（防抖，避免拖动时狂写）
  let _autoSaveTimer = null;
  document.addEventListener('input', () => {
    _userTouchedSettings = true;
    clearTimeout(_autoSaveTimer);
    _autoSaveTimer = setTimeout(() => saveSettings(true), 800);
  }, true);
  /* ★★ change 事件必须【立即保存】，不能防抖！
     ---- 事故复盘（实测"点完成后 webui 里的配置不会被保存"）----
     change 在"松开滑块 / 勾选复选框"时【立即】触发一次（不会连续触发），
     但原来这里也做了 800ms 防抖 —— 用户勾完马上点「完成」，
     Activity 被销毁，定时器还没到点，配置就丢了。
     → change 立即保存；只有 input（拖动过程中连续触发）才需要防抖。 */
  document.addEventListener('change', () => {
    _userTouchedSettings = true;
    clearTimeout(_autoSaveTimer);
    _autoSaveTimer = null;
    saveSettings(true);
  }, true);

  /* 供原生在「完成」前强制保存一次（双保险） */
  window.__flushSettings = function () {
    try {
      clearTimeout(_autoSaveTimer);
      _autoSaveTimer = null;
      saveSettings(false);
      return 'ok';
    } catch (e) { return 'err:' + e.message; }
  };

  if (B) { try { B.ready(); } catch (e) {} }
  if (window.MmdTest) { try { window.MmdTest.onReady(true); } catch (e) {} }

  /* 注：渲染循环已在模块顶层启动（见那里的说明），
     这里不再调用 setAnimationLoop —— 放在这里会被提前 return 跳过。 */
  setTimeout(clearMark, 1200);
  nlog('READY rendering');

  /* ★ 通知原生：boot 已完成，此后下发的 __loadModel 不会再被覆盖。
     之前原生在 onPageFinished 就切模型，会被 boot 里加载默认模型
     的后续逻辑盖掉 —— 表现是"导入成功但模型没换"。 */
  if (B && B.pageReady) {
    try { B.pageReady(); } catch (e) {}
  }
}

let SPIN = true;      // 由面板「自转」滑块控制（=0 即停）。调表情/眼动时可先拉到 0
let spinAngle = 0;

let _renderErrCount = 0;
let _lastRenderErrMsg = '';
let _lastRenderErrAt = 0;
/* ★ 渲染看门狗用的状态（见文件末尾的 setInterval） */
let _lastFrameAt = 0;        // 最近一次 render() 真的被调度到的时间
let _mouthDbgN = 0;          // 嘴部权重诊断的帧计数
let _mouthAbN = 0;           // 嘴部 A/B 实测的帧计数
let _physUpdN = 0;
window.__outlineWatch = false;          // 描边真值校验（排查用，默认关）
/** 物理固定步长（必须与 MMDPhysics.unitStep 一致，见那里的注释）。 */
const PHYS_STEP = 1 / 65;
/** 是否把物理结果回写 backupBones（对照实验用，见 renderInner 里的说明）。 */
let PHYS_BACKUP_SYNC = true;
let _physAccum = 0;          // 物理时间累积器
let _physStepsLast = 0;      // 上一帧步进了几次（诊断用）
let _physDynBones = null;    // 被刚体回写的骨骼（震荡检测用）
let _physPrevQ = null;
let _physDeltaSum = 0, _physDeltaWorst = 0, _physDeltaWorstName = '';
let _physWinSum = 0, _physWinN = 0, _physPeak = 0, _physPeakName = '';
let _physSig = '';           // 物理骨骼旋转的签名（只在变化时打印）
let _mouthDbgPrev = '';
let _mouthDbgAnyOne = false;
let _wdHits = 0;             // 看门狗救活次数
let _ctxLost = false;        // WebGL 上下文是否丢失中

/**
 * ★ 渲染循环必须包一层异常保护 —— "模型过一会儿定格"的第二条根因。
 *
 * three.js 的 WebGLRenderer.setAnimationLoop 内部实现是：
 *     function onAnimationFrame(time) {
 *       animationLoop(time, frame);
 *       requestId = context.requestAnimationFrame(onAnimationFrame);  // ← 抛异常就到不了这里
 *     }
 * 也就是说回调里【抛一次异常】，下一帧就不会被调度，渲染循环永久停止。
 * 这里只负责"别让循环死掉"，真正的渲染逻辑在 renderInner()。
 *
 * ★ 日志策略（踩过坑）：原来只打前 10 次，一旦前 10 次用完就【彻底静默】，
 *   结果"每帧都在抛异常"这种最严重的故障反而一条日志都看不到
 *   （表现为 heartbeat frames=0，完全查不出原因）。
 *   现改为：前 5 次 + 之后每 10 秒一次，保证任何时候都能拿到错误信息。
 */
/* ============================================================
   ★★★ 动态模糊（2026-10-07 设计上要求）★★★
   ------------------------------------------------------------
   做法：**时域累积（拖影）** —— 每帧把新画面与上一帧的累积结果按系数混合。
   这正是 three.js 官方 AfterimagePass 的原理；这里手写，因为
   assets 里只有 MMDLoader/GLTFLoader 等，**没有 postprocessing 那套 addon**。

   ★★★ 帧率无关（用户特别要求"低帧率下也要正常"）★★★
   时域累积的混合系数 k 是【每帧】的 —— 固定 k 会让"拖影时长"随帧率剧变：
     · 60fps 下 k=0.3 → 拖影约 7 帧 ≈ 0.12 秒
     · 20fps 下同样的 k → 也是约 7 帧，但那是 0.35 秒 → 又长又散
   所以这里 **按 dt 归一化**，让"衰减到一半所需的时间 T 恒定"：
        hist = mix(hist, cur, k),  且要求 (1-k)^(T/dt) = 0.5
     ⇒  k = 1 - 0.5^(dt / T)
   `dt` 取自 renderInner 里那个 `Math.min(clock.getDelta(), 0.1)`，
   它是"距上一次真正渲染"的间隔 —— 正好包含 FPS 上限跳帧的时间，
   所以在低帧率下 k 会自动变大（少累积、拖影不会变长）✓

   三个参数：
     · 开关
     · 长度 (0~100) → 拖影时间 T = len/100 × 0.8 秒
     · 质量 (0~100) → **内部缓冲分辨率**（0.35~1.0 倍 + 总像素上限）
                      越高越清晰越费 GPU（模糊是纯填充率开销，这是最有效的旋钮）

   渲染流程（3 个 render target）：
     ① scene → rtScene                       （正常渲染）
     ② mix(rtHistA, rtScene) → rtHistB        （累积）
     ③ rtHistB → 屏幕                         （NoBlending 直写）
     ④ 交换 rtHistA / rtHistB

   ★★ 透明窗口的关键：整条链路都用**预乘 alpha**，中间与最后一步都用
      `blending: NoBlending`（覆写而非再混），透明背景不会被弄脏。
      预乘色在 mix 下是线性正确的，所以拖影不会偏色。
   ★ 任何一步出错都自动退回普通渲染（MB_ON=false），绝不让模型变没。
   ★ MMD / glTF 的参数【分开存】（设计上要求），由原生下发。
   ============================================================ */
let MB_ON = false;
let MB_LEN = 35;
let MB_QUAL = 80;
/** 两套参数（MMD / glTF 分开）—— 由原生下发，见 window.__setMotionBlur。 */
let MB_ALL = null;

let _mbScene = null, _mbCam = null, _mbQuad = null, _mbMat = null;
let _mbRT = null, _mbSceneRT = null, _mbA = null, _mbB = null;
let _mbW = 0, _mbH = 0, _mbReset = true;

/** 懒创建模糊用的场景/材质/目标；尺寸或质量变了就重建。 */
function mbEnsure() {
  try {
    const bw = renderer.domElement.width, bh = renderer.domElement.height;
    if (bw <= 0 || bh <= 0) return false;
    /* ★ 质量 → 分辨率倍率 + 总像素上限（模糊是纯填充率开销，必须设上限） */
    const scale = 0.35 + Math.max(0, Math.min(100, MB_QUAL)) / 100 * 0.65;
    let tw = Math.max(64, Math.round(bw * scale));
    let th = Math.max(64, Math.round(bh * scale));
    const MAXP = 1400000;                     // 约 1.4M 像素封顶
    if (tw * th > MAXP) {
      const f = Math.sqrt(MAXP / (tw * th));
      tw = Math.max(64, Math.round(tw * f));
      th = Math.max(64, Math.round(th * f));
    }

    if (!_mbScene) {
      _mbScene = new THREE.Scene();
      _mbCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      _mbMat = new THREE.ShaderMaterial({
        uniforms: {
          tPrev: { value: null },
          tCur: { value: null },
          k: { value: 0.5 },
          passthru: { value: 0 },
        },
        vertexShader:
          'varying vec2 vUv;\n'
          + 'void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader:
          'uniform sampler2D tPrev;\n'
          + 'uniform sampler2D tCur;\n'
          + 'uniform float k;\n'
          + 'uniform int passthru;\n'
          + 'varying vec2 vUv;\n'
          + 'void main() {\n'
          + '  vec4 cur = texture2D(tCur, vUv);\n'
          + '  vec4 outCol = (passthru == 1) ? cur : mix(texture2D(tPrev, vUv), cur, k);\n'
          + '  gl_FragColor = outCol;\n'
          + '}',
        depthTest: false,
        depthWrite: false,
        /* ★ 必须 NoBlending：我们要"覆写"，不是再混一次（否则透明背景越混越脏） */
        blending: THREE.NoBlending,
      });
      _mbQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), _mbMat);
      _mbQuad.frustumCulled = false;
      _mbScene.add(_mbQuad);
    }
    if (!_mbRT || _mbW !== tw || _mbH !== th) {
      for (const t of [_mbRT, _mbSceneRT, _mbA, _mbB]) { try { if (t) t.dispose(); } catch (e) {} }
      const mk = () => new THREE.WebGLRenderTarget(tw, th, {
        minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
        depthBuffer: true, stencilBuffer: false,
      });
      _mbRT = mk(); _mbSceneRT = mk(); _mbA = mk(); _mbB = mk();
      _mbW = tw; _mbH = th;
      _mbReset = true;                 // 尺寸变了 → 历史无效，先清一次
      nlog('动模: 内部缓冲 ' + tw + 'x' + th + '（质量 ' + MB_QUAL + ' → ' + scale.toFixed(2) + 'x）');
    }
    return true;
  } catch (e) {
    nerr('动模初始化失败: ' + (e && e.message));
    return false;
  }
}

/**
 * 用累积法渲染一帧（失败自动退回普通渲染）。
 * @param dt 距上一次真正渲染的秒数（含 FPS 上限跳帧），由 renderInner 传入。
 */
function mbRender(dt) {
  try {
    if (!mbEnsure()) return false;
    /* ★★ 帧率无关的混合系数：T 秒内衰减到一半 ★★ */
    /* ★★ 长度→拖影时间 T：平方映射 + 上限 0.125 秒 ★★
       ---- 两次调整的原因 ----
       ① 线性映射下 len=50 就是 T=0.4 秒 —— "长长的残影尾巴"，太夸张。
          → 改成【平方映射】（低端精细、高端压缩）。
       ② 新版上限仍偏大（0.5 秒），设计上要求"上限调到当前的 1/4"
          → 上限收到 **0.125 秒**。
       现在的对照（len → T）：
           len=10 → 0.001s（等同关闭）
           len=25 → 0.008s（几乎察觉不到）
           len=50 → 0.031s（轻微、耐看　← 默认值所在区间）
           len=75 → 0.070s（明显）
           len=100→ 0.125s（最长：约 7 帧拖影，有动感但不糊） */
    const T = Math.max(0.002, Math.pow(Math.min(100, MB_LEN) / 100, 2) * 0.125);
    const d = (isFinite(dt) && dt > 0) ? Math.min(dt, 0.1) : 1 / 60;
    const k = 1 - Math.pow(0.5, d / T);

    /* ① 场景 → rtScene */
    renderer.setRenderTarget(_mbSceneRT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);

    /* 第一次（或尺寸刚变 / 刚从关闭切到开启）没有有效历史 → 当前帧直接当历史 */
    if (_mbReset) {
      _mbReset = false;
      _mbMat.uniforms.passthru.value = 1;
      _mbMat.uniforms.tCur.value = _mbSceneRT.texture;
      renderer.setRenderTarget(_mbA);
      renderer.render(_mbScene, _mbCam);
    }

    /* ② mix(历史, 当前) → 另一个历史 target */
    _mbMat.uniforms.passthru.value = 0;
    _mbMat.uniforms.k.value = k;
    _mbMat.uniforms.tPrev.value = _mbA.texture;
    _mbMat.uniforms.tCur.value = _mbSceneRT.texture;
    renderer.setRenderTarget(_mbB);
