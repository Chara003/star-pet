    renderer.render(_mbScene, _mbCam);

    /* ③ 累积结果 → 屏幕（NoBlending 直写，保持预乘 alpha） */
    _mbMat.uniforms.passthru.value = 1;
    _mbMat.uniforms.tCur.value = _mbB.texture;
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(_mbScene, _mbCam);

    /* ④ 交换：下一帧的"历史"就是这一帧的结果 */
    const t = _mbA; _mbA = _mbB; _mbB = t;
    return true;
  } catch (e) {
    nerr('动模渲染失败，已退回普通渲染: ' + (e && e.message));
    MB_ON = false;
    try { renderer.setRenderTarget(null); } catch (e2) {}
    return false;
  }
}

/**
 * ★ 原生下发动态模糊设置。
 * json 形如 {"mmd":{on,len,qual},"glb":{on,len,qual}} —— 本页按当前模型类型挑一套。
 */
window.__setMotionBlur = function (json) {
  let cfg = null;
  try { cfg = (typeof json === 'string') ? JSON.parse(json) : json; } catch (e) {}
  if (!cfg || typeof cfg !== 'object') return 'bad-json';
  MB_ALL = cfg;
  applyMotionBlurForModel();
  return JSON.stringify({ on: MB_ON, len: MB_LEN, qual: MB_QUAL });
};

/** 按当前模型类型挑出该用的那套参数（MMD / glTF 分开存）。 */
function applyMotionBlurForModel() {
  const key = isGltfModel ? 'glb' : 'mmd';
  const c = (MB_ALL && MB_ALL[key]) ? MB_ALL[key] : null;
  const wantOn = c ? !!c.on : false;
  const wantLen = c ? Math.max(0, Math.min(100, parseInt(c.len, 10) || 0)) : 35;
  const wantQual = c ? Math.max(0, Math.min(100, parseInt(c.qual, 10) || 0)) : 80;
  const qualChanged = (wantQual !== MB_QUAL);
  MB_ON = wantOn;
  MB_LEN = wantLen;
  MB_QUAL = wantQual;
  /* 质量变了会重建缓冲 → 历史无效；从关到开也重置一次（避免用很久以前的历史） */
  if (qualChanged || MB_ON) _mbReset = true;
  if (!MB_ON) { try { renderer.setRenderTarget(null); } catch (e) {} }
  nlog('动模[' + key + ']: on=' + MB_ON + ' len=' + MB_LEN + ' qual=' + MB_QUAL);
}

function render() {
  _lastFrameAt = Date.now();          // ★ 看门狗用：记录"最近一次真的被调度到"
  try {
    renderInner();
  } catch (e) {
    _renderErrCount++;
    _lastRenderErrMsg = (e && e.message) ? e.message : String(e);
    const now = Date.now();
    if (_renderErrCount <= 5 || (now - _lastRenderErrAt) > 10000) {
      _lastRenderErrAt = now;
      nerr('render #' + _renderErrCount + ': ' + _lastRenderErrMsg);
    }
    /* 连续出错时物理是第一嫌疑人：MMDPhysics 一旦算出 NaN 会持续污染骨骼，
       之后每帧都炸。直接停用物理自救，保证桌宠还能正常显示。 */
    if (_renderErrCount >= 3 && physics) {
      try { physics = null; } catch (e2) {}
      nerr('physics auto-disabled after repeated render errors');
    }
  }
}

/* ============================================================
   MMD 待机动作（呼吸 + 自动眨眼）
   ------------------------------------------------------------
   模型没有自带 VMD 动画时是【完全静止】的 —— 看起来就像"一张照片"。
   这里用骨骼做程序化微动，不需要任何外部动画文件：
     · 呼吸：上半身 / 胸 骨骼绕 X 轻微起伏（两个周期叠加，避免机械感）
     · 眨眼：随机间隔触发一次，用 PMX 的 ウィンク 骨骼型表情
   ★ 绝不能每帧 "rotation.x += ..." —— 那会无限累积、直接把模型拧飞。
     这里用【原始值 + 偏移】的幂等形式，每帧重算。
   ★ 与表情系统隔离：呼吸只碰 上半身/胸，表情碰的是嘴/眼，互不重叠。
   ============================================================ */
let IDLE_ANIM = true;          // 待机动作总开关
let _idleT = 0;
let _idleBones = { spine: [], chest: [] };
let _idleBonesFor = null;      // 上面这组骨骼是按哪个 model 收集的

function collectIdleBones() {
  _idleBones = { spine: [], chest: [] };
  if (!model) return;
  model.traverse(o => {
    if (!o.isBone || !o.name) return;
    const n = o.name;
    /* 上半身2 是"胸"，上半身 是"腰"。注意先判带 2 的，否则会被 上半身 抢走 */
    if (/上半身2|chest|Chest|spine1/i.test(n)) _idleBones.chest.push(o);
    else if (/上半身|spine|Spine/i.test(n)) _idleBones.spine.push(o);
  });
  _idleBonesFor = model;
  nlog('idleBones: spine=' + _idleBones.spine.length
    + ' chest=' + _idleBones.chest.length);
}

/**
 * ★★★ 取 MMD 模型的物理数据（2026-10-08，这是个存在很久的致命 bug）★★★
 *
 * ---- 事故复盘（设计上要求"自动识别头发和胸部加物理"）----
 * 我们原来这样判断有没有刚体：
 *     const hasRB = !!model.physicsSettings && !!g.rigidBody;
 * **但 MMDLoader 根本不设置 `physicsSettings` 这个字段**（全文件 grep 为 0 次）！
 * 它把刚体/约束放在 `geometry.userData.MMD` 里：
 *     geometry.userData.MMD = { bones, iks, grants, rigidBodies, constraints, format }
 *
 * → `hasRB` **永远是 false** → `physics` 永远不创建
 *   → 日志里那句 `physics disabled (flag=true rigidBodies=false)`
 *     而紧跟着的 `physBones: 248 根骨骼被刚体绑定（共 270 个刚体）` 明明有 270 个。
 *   → **这个模型的头发/胸部/裙子/领带物理，从来没生效过**（PMX 作者调好的全废着）。
 *
 * ★ 顺带说明用户的需求：PMX 的刚体 + 约束就是作者为"不穿模"调好的，
 *   用它比自己写弹簧骨骼可靠得多（自己写弹簧必然穿模，因为没有碰撞约束）。
 *   所以"自动识别头发和胸部加物理"的正确答案是：**把模型自带的刚体真正接上**。
 */
function mmdPhysicsDataOf(mesh) {
  const out = { rigidBodies: [], constraints: [], found: false };
  if (!mesh) return out;
  try {
    const take = (d) => {
      if (!d || !d.rigidBodies || !d.rigidBodies.length || out.found) return;
      out.rigidBodies = d.rigidBodies;
      out.constraints = d.constraints || [];
      out.found = true;
    };
    /* MMD 模型本身是 SkinnedMesh，数据在它自己的 geometry 上；用 traverse 兜底 */
    if (mesh.geometry && mesh.geometry.userData && mesh.geometry.userData.MMD) {
      take(mesh.geometry.userData.MMD);
    }
    if (!out.found) {
      mesh.traverse(o => {
        if (!out.found && o.geometry && o.geometry.userData && o.geometry.userData.MMD) {
          take(o.geometry.userData.MMD);
        }
      });
    }
  } catch (e) { nerr('mmdPhysicsDataOf failed: ' + (e && e.message)); }
  return out;
}

/**
 * ★ 把物理算完的骨骼姿势同步写回 MMDAnimationHelper 的 backupBones。
 *
 * ---- 为什么必须（见 renderInner 里 physics 段的说明）----
 * helper 每帧 `_restoreBones()` 会用 backupBones 覆盖所有骨骼，
 * 而 backupBones 是 `_saveBones()`（在物理【之前】）存的 ——
 * 所以物理结果每帧都被丢弃/倒退一帧，长链条（裙子/外套）会被反复拉扯到"炸开"。
 * 把物理结果写回去，物理状态就连续了。
 *
 * ★ 只写 rigidBodyType = 1/2 的骨骼（物理回写的那些）；
 *   type 0（动力学/跟随骨骼）和普通骨骼仍归动画管，不能碰。
 */
let _physBackupIdx = null;          // 缓存的"物理骨骼在 skeleton.bones 里的下标"
let _physBackupFor = null;          // 上面这组下标是按哪个 model 算的
let _syncDbgN = 0;

function syncPhysToBackupBones() {
  /* ★ 每个 return 分支都打一次日志（只打前 3 次）—— 否则"没生效"时完全不知道卡在哪 */
  if (!vmd.helper || !model || !physics) return 0;
  const objs = vmd.helper.objects.get(model);
  if (!objs) {
    if (_syncDbgN < 3) { _syncDbgN++; nlog('物理快照同步: 跳过（helper 里没有这个 model）'); }
    return 0;
  }
  if (!objs.backupBones) {
    if (_syncDbgN < 3) { _syncDbgN++; nlog('物理快照同步: 跳过（backupBones 还没建立）'); }
    return 0;
  }
  const sk = model.skeleton || findSkeletonOf(model);
  if (!sk || !sk.bones) return 0;
  const bones = sk.bones;

  if (_physBackupFor !== model) {
    _physBackupIdx = null;
    const mmd = model.geometry && model.geometry.userData && model.geometry.userData.MMD;
    if (!mmd || !mmd.bones) return 0;
    const nameSet = new Set();
    for (const b of mmd.bones) {
      if (b.rigidBodyType === 1 || b.rigidBodyType === 2) nameSet.add(b.name);
    }
    const idx = [];
    for (let i = 0; i < bones.length; i++) {
      if (bones[i] && nameSet.has(bones[i].name)) idx.push(i);
    }
    _physBackupIdx = idx;
    _physBackupFor = model;
    nlog('物理快照同步: ' + idx.length + ' 根骨骼会写回 backupBones');
  }
  if (!_physBackupIdx || !_physBackupIdx.length) return 0;

  const buf = objs.backupBones;
  let n = 0;
  for (const i of _physBackupIdx) {
    if (i * 7 + 7 > buf.length) continue;
    const b = bones[i];
    if (!b) continue;
    b.position.toArray(buf, i * 7);
    b.quaternion.toArray(buf, i * 7 + 3);
    n++;
  }
  return n;
}

/**
 * ★★★ 物理建在"未缩放"状态下 + 只保留需要的部位（2026-10-08）★★★
 *
 * ---- 问题 ----
 * 曾出现"外套/裙子直接炸了"。自加的震荡检测实测：平均每帧 Δq 33~116、
 * 峰值 3.9（≈单帧转 200°），最大震荡集中在 `上着X-X`（外套）。
 *
 * ---- 已排除 ----
 *  · 动画抢骨骼：`动画里有 0 条轨道在驱动它们` ✓ 无冲突
 *  · 碰撞组掩码：mmdparser 输出 groupIndex/groupTarget，与 MMDPhysics 期望的键名一致 ✓
 *  · 双重 update：全文件只有一处 physics.update，且由累积器限流 ✓
 *
 * ---- 本次两个改动 ----
 * ① **在 scale=(1,1,1) 下创建物理**：
 *    `MMDPhysics._init()` 用 `bone.matrixWorld`（含 mesh.scale≈1.31）算刚体初始位姿，
 *    而 `update()` 每帧又把 mesh 临时设成 scale=1 —— 初始化尺度 ≠ 运行尺度，
 *    弹簧静止长度与关节锚点全部错位 → 持续发散。
 * ② **只保留需求内的部位**（头发/胸/裙/尾/领带）：
 *    用户的需求本来就是"头发和胸部"。外套是宽大多层结构，最容易发散。
 *
 * ★ 刚体可过滤但**约束里存的是刚体下标**，必须重映射；引用被排除刚体的约束整条丢弃。
 * ★ `boneIndex` 是骨骼索引（不是刚体索引），保持不变。
 */
const PHYS_PART_RE = /hair|髪|胸|bust|skirt|スカート|しっぽ|尻尾|尾|ネクタイ|tie/i;

/* ★★★ 2026-10-17：筛选必须做【约束闭包】，否则整条裙子会自由落体 ★★★
   ---- 离线实证（node + ammo.wasm 复现，见 devscripts/phys/probe.mjs）----
   `过滤后 bodies=137 cons=193` 跑 3000 步：
       スカート*.P 的线速度 = 22.04 单位/s，骨骼局部位移 = 1013.6 单位  ← 曾提到的"无限拉长"
       而 `全部 270 刚体` 跑同样 3000 步：Δq≈1.3，峰値 0.36，最大位移 0.79  ← 完全正常
   App 里同时也实测到（run400 时）·COM|均=15.62 max=80.34·，同样是"刚体在飞"。

   ---- 为什么 ----
   PMX 里裙子的锚点是这样的：
       スカート1.P(type1) --约束 c#203--> 下半身(type0 运动学)
   而 `下半身` 不在部位白名单里 → 被砍掉 → 约束 c#203 整条丢弃
   → 裙子根部既不是运动学、又没有任何约束 → 只剩重力 → 自由落体
   → 一边下坠一边穿过後ろ髪（後ろ髪垂到 y≈3，裙子从 y≈10.8 落下）
   → 每帧对头发施加巨大碰撞冲量 → 头发反复被甩 ~180°（实测峰值 3.9）
   → 这就是"碰撞一开就震荡、一关就不震荡但裙子无限拉长"的同一个根因。

   ---- 修法（约束闭包）----
   ① 种子 = 部位白名单命中的刚体
   ② 迭代：只要约束的一端在集合里，就把另一端也拉进来（无向，最多 50 轮）
      本模型 137 → 142（多拉进来 上半身×2 / 下半身×1 / 髪_壁? 等锚点），代价可忽略
   ③ 闭包后再按"两端都在集合里"过滤约束并重映射下标 —— 此时**不会**丢锚点
   ★ 教训：任何"按名字砍刚体"的筛选都必须先求约束闭包。
     刚体不是独立的，砍掉一根就会被整条链拖着跑。 */
/* ★★★ 是否按【部位白名单】筛选刚体（默认 false）★★★
   ---- 当前策略（2026-10-17 定稿）----
   false = 除黑名单（外套）外，**全部刚体都参与物理**。
   这是用户想要的：头发 + 胸 + 裙子 + 尾巴 + 丝带都有物理。
   true  = 退回旧行为：只保留 hair/髪/胸/skirt/しっぽ/尾/ネクタイ 白名单部位。
   ★ 无论哪种模式，黑名单（PHYS_PART_BLOCK_RE）都会被强制剔除，
     且**筛选后必须做约束闭包**（见 filterPhysicsByPart 里的长注释）。 */
let PHYS_FILTER_BY_PART = false;

/* ★★★ 黑名单：这些刚体的**物理必须关掉**（2026-10-17 实测）★★★
 * ---- 为什么单独排外套，而不是整体筛选 ----
 * 把全部 270 刚体都装上（PHYS_FILTER_BY_PART=false）实测：
 *     启动窗口 #4~#6  Δq=119/109/118  worst=3.63(しっぽ4) / 2.90(上着3-5.R) / 3.25(上着3-4.L)
 *     稳态        Δq=20~80     位置偏差 均=0.37 最大=3.47
 *   → 又回到震荡，且最大抽搐全在 `上着X-X`（外套）。
 * 这与用户最早的判断一致："外套本来就穿模"。外套是 84 个**宽大盒状**动态刚体，
 * 彼此初始就大量重叠（离线统计：重叠对 894，最深 2.09），
 * Bullet 每帧施加巨大分离力 → 弹簧对抗 → 自激震荡。
 * ★ 这不是"初始化姿态错了"（那个已经修掉），而是**外套这套刚体本身在 MMD 里
 *   就依赖大量互相挤压来维持形状**，在 65Hz 定步长 + 没有 setParam 的 ammo.js 下
 *   稳不住。MMD 本体能稳住，靠的是它自己的约束参数（我们不支持）。
 * → 结论：外套不参与物理（用户已明确可以接受），
 *   其余（头发/胸/裙子/尾巴/丝带…）全部保留。
 */
const PHYS_PART_BLOCK_RE = /上着|jacket|coat|ジャケット/i;

function filterPhysicsByPart(mesh, rigidBodies, constraints) {
  try {
    /* ★ 统一流程：
         ① 取数据（骨骼名表）
         ② 种子：白名单命中（PHYS_FILTER_BY_PART=true）或全部（false），
            **并强制剔除黑名单（外套）**
         ③ 约束闭包：把锚点/相邻刚体拉进来（否则裙子会自由落体）
         ④ 闭包后再剔一次黑名单（防止被闭包拉回来）
         ⑤ 重映射约束下标，丢弃引用被剔刚体的约束 */
    const bodiesAll = rigidBodies || [];
    const consAll = constraints || [];
    if (!bodiesAll.length) {
      return { rigidBodies: bodiesAll, constraints: consAll, kept: 0, dropped: 0 };
    }
    const mmd = mesh && mesh.geometry && mesh.geometry.userData && mesh.geometry.userData.MMD;
    if (!mmd || !mmd.bones || !mmd.bones.length) {
      return { rigidBodies: bodiesAll, constraints: consAll, kept: bodiesAll.length, dropped: 0 };
    }
    const mmdBones = mmd.bones;
    const nmOf = (rb) => {
      const bi = rb && rb.boneIndex;
      return (bi >= 0 && bi < mmdBones.length) ? String(mmdBones[bi].name || '') : '';
    };

    /* ② 种子 + 黑名单 */
    const keep = new Set();
    let blocked = 0;
    for (let i = 0; i < bodiesAll.length; i++) {
      const nm = nmOf(bodiesAll[i]);
      if (PHYS_PART_BLOCK_RE.test(nm)) { blocked++; continue; }   // 外套等：物理关掉
      if (!PHYS_FILTER_BY_PART || PHYS_PART_RE.test(nm)) keep.add(i);
    }
    if (!keep.size) {
      /* 一个都没匹配（骨骼命名体系不同）→ 不过滤，保持原样，别把物理搞没 */
      return { rigidBodies: bodiesAll, constraints: consAll,
               kept: bodiesAll.length, dropped: 0, noMatch: true };
    }
    const seedN = keep.size;

    /* ③ 约束闭包 */
    let changed = true, rounds = 0;
    while (changed && rounds < 50) {
      changed = false; rounds++;
      for (const c of consAll) {
        const a = c.rigidBodyIndex1, b = c.rigidBodyIndex2;
        if (a === undefined || b === undefined) continue;
        if (keep.has(a) && !keep.has(b)) { keep.add(b); changed = true; }
        else if (keep.has(b) && !keep.has(a)) { keep.add(a); changed = true; }
      }
    }
    const afterClosure = keep.size;
    /* ④ 闭包可能把黑名单刚体拉回来 → 再剔一次 */
    for (let i = 0; i < bodiesAll.length; i++) {
      if (keep.has(i) && PHYS_PART_BLOCK_RE.test(nmOf(bodiesAll[i]))) keep.delete(i);
    }

    /* ⑤ 重映射 + 过滤约束 */
    const map = {};
    const outBodies = [];
    for (let i = 0; i < bodiesAll.length; i++) {
      if (!keep.has(i)) continue;
      map[i] = outBodies.length;
      outBodies.push(bodiesAll[i]);
    }
    const outCons = [];
    for (const c of consAll) {
      const a = map[c.rigidBodyIndex1], b = map[c.rigidBodyIndex2];
      if (a === undefined || b === undefined) continue;
      outCons.push(Object.assign({}, c, { rigidBodyIndex1: a, rigidBodyIndex2: b }));
    }
    nlog('刚体筛选: 种子 ' + seedN + ' → 闭包 ' + afterClosure
      + ' → 剔除黑名单(外套) ' + blocked + ' → 最终 ' + outBodies.length + ' / ' + bodiesAll.length
      + '，约束 ' + outCons.length + ' / ' + consAll.length);
    return { rigidBodies: outBodies, constraints: outCons,
             kept: outBodies.length, dropped: bodiesAll.length - outBodies.length };
  } catch (e) {
    nerr('刚体筛选失败（改用全部）: ' + (e && e.message));
    return { rigidBodies: rigidBodies || [], constraints: constraints || [], kept: 0, dropped: 0 };
  }
}

function createPhysicsUnscaled(mesh, rigidBodies, constraints) {
  const savedScale = mesh.scale.clone();
  let phys = null;
  try {
    /* ① 复位到 MMD 绑定姿态（★ 不要用 mesh.pose()，见 resetBonesToBindPose 的复盘） */
    try {
      const n = resetBonesToBindPose(mesh);
      nlog('物理初始化: 复位 ' + (n < 0 ? '跳过(非MMD)' : (n + ' 根骨骼'))
        + ' → MMD 绑定姿态');
    } catch (e) { nerr('物理初始化: 复位骨骼失败 ' + (e && e.message)); }

    /* ② 未缩放状态建物理（初始化尺度 == 运行时尺度） */
    mesh.scale.set(1, 1, 1);
    mesh.updateMatrixWorld(true);
    phys = new MMDPhysics(mesh, rigidBodies, constraints);
  } finally {
    mesh.scale.copy(savedScale);      // ★ 无论成败都恢复，否则模型会突然变大/变小
    mesh.updateMatrixWorld(true);
  }
  return phys;
}

/**
 * ★ 在 scale=1 下做 warmup（收敛约束），避免 MMDPhysics.update 反复走
 *   `isNonDefaultScale` 分支（那个分支会临时摘掉 mesh.parent 且恢复时不更新矩阵）。
 * ★ 必须在重力标定之后调用，保持原来"先标定再收敛"的顺序。
 */
function warmupPhysicsUnscaled(mesh, phys, cycles) {
  if (!phys || !mesh) return;
  const saved = mesh.scale.clone();
  const n = cycles || 60;
  try {
    mesh.scale.set(1, 1, 1);
    mesh.updateMatrixWorld(true);
    /* ★★★ 必须自己循环，不能直接 phys.warmup()（2026-10-17，曾出现"重启后头发飞到脸上，偏180度"）★★★
       ---- 为什么 ----
       `MMDPhysics.warmup()` 是 `for i<n: this.update(1/60)`，
       而 `update()` 里 `_updateBoneRotation()` 的算法是【增量式】的：
           thQ2 = inv(bone.matrixWorld) * 期望世界旋转
           bone.quaternion = thQ2 * bone.matrix 的旋转
       它依赖 `bone.matrixWorld` 与 `bone.quaternion` **严格同步**。
       而 update() 内部只对被写的那根骨骼调 `bone.updateMatrixWorld(true)`，
       且 **恢复缩放后不刷新整棵树** → 下一步读到的 matrixWorld 是过期的。
       于是 60 步里每步都带一点误差，**误差单调累积**：
           实测启动后头发姿态偏了约 180°（用户描述"像偏了180度"）
       而"随便做一个动作就好了"：VMD 重写了骨骼 quaternion，
       下一步 matrixWorld 重新同步，累积误差被清零 → 立刻恢复。
       ★ 这与之前修的"每帧多次 update 之间不刷矩阵"是同一个根因，
         只是那条在渲染循环里，这条在 warmup 里。
       ---- 修法 ----
       自己循环，每步前后都刷新整棵树。 */
    for (let i = 0; i < n; i++) {
      mesh.updateMatrixWorld(true);
      phys.update(1 / 60);
      mesh.updateMatrixWorld(true);
    }
  } catch (e) {
    nerr('物理 warmup 失败: ' + (e && e.message));
  } finally {
    mesh.scale.copy(saved);
    mesh.updateMatrixWorld(true);
  }
}

/**
 * ★ 可选：完全关掉刚体之间的碰撞（对照实验用，默认关）。
 * 用户猜测"外套本来就穿模 → 初始重叠 → Bullet 持续分离 → 震荡"。
 * 把 groupTarget 设 0 可验证这个假设：震荡消失 = 碰撞求解发散；还在 = 不是碰撞。
 */
/* ★ 对照实验已完成（关碰撞 → Δq 46~116 降到 1.8，证明震荡来自碰撞求解）。
   → 恢复碰撞；真正的修法是"在绑定姿态下初始化物理"（见 createPhysicsUnscaled）。
   ★ 保留这个开关：将来若再遇到"某个模型震荡"，把它设 true 可快速判断
     "是不是碰撞求解发散"。 */
let PHYS_NO_COLLIDE = false;
function applyNoCollide(bodies) {
  if (!PHYS_NO_COLLIDE || !bodies) return 0;
  let n = 0;
  for (const b of bodies) {
    if (b && b.groupTarget !== undefined) { b.groupTarget = 0; n++; }
  }
  nlog('物理：已关闭 ' + n + ' 个刚体的碰撞（对照实验）');
  return n;
}

/**
 * ★★★ 环境风（2026-10-17，需求）★★★
 *
 * ---- 做法 ----
 * 不复用重力（那是全局单向的，会让整体一直偏在一边，很假）。
 * 而是对**每个动态刚体**（params.type = 1/2）施加水平力，
 * 力的大小 = 风强度 × 刚体质量 × 每根骨骼的相位偏置 × 阵风包络。
 *
 * 三个关键设计：
 *  ① **按质量缩放**：Bullet 的 F = ma，若力不随质量缩放，
 *     轻的发梢会被吹飞、重的裙摆纹丝不动。乘 `weight` 后所有部件
 *     "加速度一致"，才像同一阵风吹过。
 *  ② **阵风包络**：两个低频正弦相乘 → 有"一阵一阵"的强弱变化；
 *     纯常数力会让头发僵在一边，像被冻住。
 *  ③ **每根骨骼相位错开**：用骨骼 Y 坐标做相位，发梢比发根晚一点动，
 *     看起来像"波浪"而不是"整块平移"。
 *
 * ★ 力必须施加在**每次 physics.update() 之前**，不能用渲染 dt ——
 *   否则风的力量与物理时间脱钩（低帧率时风变弱、高帧率时变强）。
 * ★ Ammo 对象必须回收（`Ammo.destroy`），否则每帧泄漏一个 btVector3。
 */
let WIND_STRENGTH = 0;        // 0~100，滑块控制
let _windT = 0;
let _windVec = null;           // 复用的 btVector3，避免每帧分配

function applyWindForces(phys, step) {
  if (!phys || !phys.bodies || !(WIND_STRENGTH > 0)) return;
  if (typeof Ammo === 'undefined' || !Ammo.btVector3) return;
  _windT += step;
  const t = _windT;
  /* ★★★ 必须是【往复摆动】，不能是单向持续力（2026-10-17 事故）★★★
     ---- 事故复盘（实测"长头发消失了，然后装备也消失了"）----
     第一版用的是**单向常力**（始终 +X），只是幅度随 gust 变化。
     结果：头发被一直往同一侧推，弹簧每步都拉不回来，
     位移与速度持续累积，几十秒后数值溢出成 **NaN**
     → 顶点坐标 NaN → 整个头部/装备不渲染（看起来就是"消失了"）。
     日志实锤：`★位置审计[run50]: 平均偏差 均=NaN`。
     ---- 修法 ----
     ① 力改成 sin 摆动，**时间平均为零**，头发来回飘而不会被推到极限；
     ② 三个不同频率叠加 → 看起来像自然阵风（不是机械摆动）；
     ③ 每次施力前做 NaN 防护：一旦刚体位置/速度出现 NaN，
        立刻让调用方 reset 物理并关掉风（见下面的 checkPhysicsNaN）。
     ★ 教训：任何"持续施加的力"都必须保证时间平均为零，或配有阻尼平衡，
       否则一定会累积到发散。物理引擎不会替你兜底。 */
  const amp = (WIND_STRENGTH / 100) * 260;          // 100 时 260（约 2.6 倍重力）
  const swing = Math.sin(t * 0.9) * 0.62 + Math.sin(t * 1.7 + 1.1) * 0.26
              + Math.sin(t * 0.31 + 2.4) * 0.12;
  if (!_windVec) _windVec = new Ammo.btVector3(0, 0, 0);
  for (const rb of phys.bodies) {
    const p = rb.params;
    if (!p || p.type === 0 || p.boneIndex === -1) continue;   // 运动学刚体不动
    const w = (p.weight && p.weight > 0 && isFinite(p.weight)) ? p.weight : 1;
    /* 相位：按骨骼高度错开，发梢滞后于发根 → 波浪感 */
    const by = (rb.bone && isFinite(rb.bone.position.y)) ? rb.bone.position.y : 0;
    const sway = 0.7 + 0.3 * Math.sin(t * 1.6 + by * 0.45);
    const f = amp * w * swing * sway;
    if (!isFinite(f)) continue;
    _windVec.setValue(f, f * 0.04, f * 0.12);   // 主要推 X，略带前倾
    rb.body.applyCentralForce(_windVec);
  }
}

/**
 * ★ 物理数值健康检查（2026-10-17）。
 * 一旦出现 NaN/Inf，立刻 physics.reset() 把刚体拉回骨骼姿态，
 * 并自动把风关掉 —— 保证"最坏情况是风停了"，而不是"模型消失"。
 * 这是上一轮 NaN 事故的兜底：宁可失去效果，不能失去模型。
 */
let _physNaNWarned = 0;
function checkPhysicsNaN(phys) {
  if (!phys || !phys.bodies) return false;
  for (const rb of phys.bodies) {
    if (!rb || !rb.bone) continue;
    const p = rb.bone.position;
    if (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.z)) {
      if (_physNaNWarned < 3) {
        _physNaNWarned++;
        nerr('★物理出现 NaN（' + (rb.bone.name || '?') + '）→ 复位物理并关掉风');
      }
      try { phys.reset(); } catch (e) {}
      WIND_STRENGTH = 0;
      try {
        const sw = document.getElementById('sWind'), vw = document.getElementById('vWind');
        if (sw) sw.value = '0';
        if (vw) vw.textContent = '0';
      } catch (e) {}
      return true;
    }
  }
  return false;
}

/**
 * ★★★ 按模型原生尺寸标定物理重力（2026-10-08）★★★
 *
 * ---- 为什么必须（曾出现"外套/裙子直接炸了"）----
 * `MMDPhysics` 的默认重力是 `new Vector3(0, -9.8 * 10, 0)` = **-98**。
 * 那个 -9.8*10 是按 **MMD 标准模型尺寸（约 20 单位高）** 标定的。
 * 而这个 PMX 的**原生高度只有 ~1.22 单位**（归一化到 1.6 是我们后来用
 * mesh.scale 做的，物理世界里仍是原生尺度）。
 *
 * 于是同一条 -98 的重力，对 1.22 单位高的模型相当于**放大约 16 倍** ——
 * 衣服/裙子/胸部的约束每帧都被极端重力猛拽，
 * 与"关节想要回到原位"的弹簧力互相拉扯 → **自激震荡**。
 * 实测（自己加的震荡检测）：单帧 quaternion 变化总和 80~289，
 * 最大单根 3.68（接近 180° 翻转），主要集中在 `上着X-X.R`（外套）。
 *
 * → 按 `H / 20` 折算重力（只往下调，不放大），让"相对落体时间"与
 *   MMD 标准模型一致。对 1.22 高的模型得到约 -6.0。
 */
function calibratePhysicsGravity(phys, mesh) {
  try {
    if (!phys || !mesh || !mesh.geometry || !mesh.geometry.attributes
        || !mesh.geometry.attributes.position) return null;
    const box = new THREE.Box3().setFromBufferAttribute(mesh.geometry.attributes.position);
    const hPhys = box.getSize(new THREE.Vector3()).y;
    if (!isFinite(hPhys) || hPhys <= 0.001) return null;
    const k = Math.min(1, hPhys / 20);        // 只可能往下调
    const g = -98 * k;
    phys.gravity.set(0, g, 0);
    nlog('物理重力标定: 模型原生高 ' + hPhys.toFixed(2) + ' 单位 → 重力 '
      + g.toFixed(2) + '（默认 -98 是按 20 单位高标定的）');
    return g;
  } catch (e) {
    nerr('物理重力标定失败: ' + (e && e.message));
    return null;
  }
}

/* ★★★ 一次性物理几何诊断（2026-10-17，§39.5 第一步）★★★
   ---- 为什么要它 ----
   离线用 node + ammo.wasm 复现了这个 PMX 的物理，结论：
     · 全部 270 刚体 + 缩放正确 → Δq≈1.2，完全正常
     · 只要刚体被"部位筛选"砍掉一半 → 裙子/披风失去锚点，以 22 单位/s 飞走
       （跑 3000 步后骨骼被拉到 1013 单位 = 用户看到的"无限拉长"）
   但 App 里 Δq 是 41~116，离线怎么都复现不出来 → 说明 App 里的**刚体位姿**
   与离线不同。这个函数就在运行时把三者摆出来对比：
     params.position(声明偏移) / body.CoM(实际) / bone.matrixWorld(骨骼世界)
   判据：
     · COM ≈ boneWorld(+偏移)  → 位姿正确，问题在别处
     · COM 明显比 boneWorld 小一个比例 → 初始化时 mesh 带着缩放（塌到原点）
     · 一堆动态刚体的 COM 挤在原点附近 → 就是上面那条，重叠是假的，分离力却真的 */
let PHYS_DUMP = false;
let _physBootWins = 0;
let PHYS_FREEZE_DRIVE = false;  // A/B #3 开关（false=正常；true=冻结所有骨骼驱动，仅物理）
let PHYS_TRACE = false;
let PHYS_TRACE_FROM = 2, PHYS_TRACE_N = 6;
const PHYS_TRACE_BONES = ['後ろ髪1-8.L', '後ろ髪1-1.L'];
let _physDumpN = 0;
function dumpPhysicsGeometry(tag) {
  if (!PHYS_DUMP || !model || !physics || !physics.bodies) return;
  try {
    const items = [];
    let sumCom = 0, sumBone = 0, nB = 0, minCom = 1e9, maxCom = 0;
    for (const rb of physics.bodies) {
      const p = rb.params;
      const o = rb.body.getCenterOfMassTransform().getOrigin();
      const com = new THREE.Vector3(o.x(), o.y(), o.z());
      const bw = rb.bone ? rb.bone.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3();
      let r = 0;
      if (p.shapeType === 0) r = p.width;
      else if (p.shapeType === 1) r = Math.max(p.width, p.height, p.depth);
      else r = p.width + p.height / 2;
      sumCom += com.length(); sumBone += bw.length(); nB++;
      minCom = Math.min(minCom, com.length()); maxCom = Math.max(maxCom, com.length());
      items.push({ i: items.length, com, bw, r, type: p.type, name: rb.bone ? rb.bone.name : '?',
                   d: com.distanceTo(bw) });
    }
    /* 重叠对：用"最大半轴当球半径"的保守判据（与离线 probe.mjs 完全一致） */
    let pairs = 0, worst = -1e9, wn = '';
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        if (a.type === 0 || b.type === 0) continue;
        const gap = a.com.distanceTo(b.com) - (a.r + b.r);
        if (gap < 0) { pairs++; if (-gap > worst) { worst = -gap; wn = a.name + '<->' + b.name; } }
      }
    }
    nlog('★物理几何[' + tag + ']: bodies=' + physics.bodies.length
      + ' cons=' + (physics.constraints ? physics.constraints.length : '?')
      + ' meshScale=' + model.scale.x.toFixed(4)
      + ' gravity=' + (physics.gravity ? physics.gravity.y.toFixed(1) : '?')
      + ' |COM|均=' + (sumCom / Math.max(1, nB)).toFixed(2)
      + ' min=' + minCom.toFixed(2) + ' max=' + maxCom.toFixed(2)
      + ' |boneW|均=' + (sumBone / Math.max(1, nB)).toFixed(2)
      + ' 重叠对=' + pairs + (pairs ? ' 最深=' + worst.toFixed(2) + '(' + wn + ')' : ''));
    let s = '';
    for (let k = 0; k < Math.min(items.length, 10); k++) {
      const it = items[k];
      s += '\n   #' + it.i + ' ' + it.name + ' t' + it.type + ' r=' + it.r.toFixed(2)
        + ' COM=' + it.com.toArray().map(n => n.toFixed(2)).join(',')
        + ' boneW=' + it.bw.toArray().map(n => n.toFixed(2)).join(',')
        + ' d=' + it.d.toFixed(2);
    }
    nlog('★物理几何明细:' + s);
  } catch (e) {
    nerr('物理几何诊断失败: ' + (e && e.message));
  }
}

/**
 * ★★★ 碰撞接触审计（2026-10-17）★★★
 * ---- 为什么要它 ----
 * 已确证：关碰撞 Δq=1.0（正常），开碰撞 Δq=43~70（震荡）。
 * 但离线用同一份 PMX / 同一份 MMDPhysics.js / 同一份 ammo.wasm 跑
 * 同样的 142 刚体 + 204 约束（碰撞开），Δq 只有 1.25。
 * → 说明 **App 里的刚体摆放与离线不同**，产生了离线没有的真实接触。
 * 这个函数直接从 Bullet 读接触流形(manifold)，把"谁在跟谁打架"打出来：
 *   · 有接触对 且 属于长链（髪/スカート/しっぽ）→ 作者本来就没让它们互相碰撞，
 *     说明刚体位置被搬错了
 *   · 接触对里有 type0 运动学刚体 → 动态刚体在往身体里钻
 * ★ 判据只看"接触对的名字"，不需要猜尺度。
 */
let _contactAuditN = 0;
function auditPhysicsContacts(tag) {
  if (!physics || !physics.world) return;
  try {
    const world = physics.world;
    const d = world.getDispatcher();
    const n = d.getNumManifolds();
    /* ptr → 名字，方便从 Ammo 的 body 反查 */
    /* ★ ammo 的 body.ptr 不可靠（所有对象读到同一个值），改用【坐标反查】：
       读 manifold 两端刚体的世界变换原点，在刚体 COM 列表里找最近的那个。 */
    const pts = physics.bodies.map(rb => {
      const o = rb.body.getCenterOfMassTransform().getOrigin();
      return { x: o.x(), y: o.y(), z: o.z(),
               nm: (rb.bone ? rb.bone.name : '?') + '(t' + (rb.params ? rb.params.type : '?') + ')' };
    });
    const nearest = (o) => {
      const x = o.x(), y = o.y(), z = o.z();
      let bi = -1, bd = 1e9;
      for (let k = 0; k < pts.length; k++) {
        const q = pts[k];
        const d = (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y) + (q.z - z) * (q.z - z);
        if (d < bd) { bd = d; bi = k; }
      }
      return { nm: bi >= 0 ? pts[bi].nm : '?', d2: bd };
    };
    let dynDyn = 0, dynKin = 0, kinKin = 0, far = 0;
    const detail = [];
    for (let i = 0; i < n; i++) {
      const m = d.getManifoldByIndexInternal(i);
      const a = nearest(m.getBody0().getWorldTransform().getOrigin());
      const b = nearest(m.getBody1().getWorldTransform().getOrigin());
      if (a.d2 > 4 || b.d2 > 4) far++;
      const aKin = /\(t0\)$/.test(a.nm), bKin = /\(t0\)$/.test(b.nm);
      if (aKin && bKin) kinKin++;
      else if (aKin || bKin) dynKin++;
      else dynDyn++;
      if (detail.length < 12) detail.push(a.nm + ' × ' + b.nm + ' c=' + m.getNumContacts());
    }
    /* ★ 探针：ammo 是否单实例 / helper 是否仍在覆盖骨骼 */
    try {
      const pts2 = physics.bodies;
      const p0 = pts2[0] && pts2[0].body ? pts2[0].body.ptr : 'undef';
      const p1 = pts2[1] && pts2[1].body ? pts2[1].body.ptr : 'undef';
      const wp = physics.world ? physics.world.ptr : 'undef';
      nlog('★探针: body0.ptr=' + p0 + ' body1.ptr=' + p1 + ' world.ptr=' + wp
        + ' 相同=' + (p0 === p1) + ' AmmoReady=' + (typeof Ammo)
        + ' helper=' + (vmd.helper ? 'y' : 'n')
        + ' helperPhysics=' + (vmd.helper ? vmd.helper.enabled.physics : '-')
        + ' mixer=' + (mixer ? 'y' : 'n')
        + ' freeze=' + PHYS_FREEZE_DRIVE);
    } catch (e) {}
    nlog('★接触审计[' + tag + ']: 流形=' + n + ' 动-动=' + dynDyn + ' 动-静=' + dynKin
      + ' 静-静=' + kinKin + ' 反查失配=' + far + ' 刚体数=' + physics.bodies.length
      + '\n    ' + detail.join('\n    '));
  } catch (e) {
    nerr('接触审计失败: ' + (e && e.message));
  }
}

/**
 * ★★★ 位置审计：头发等物理骨骼是否跑到了脸上（2026-10-17）★★★
 * ---- 为什么必须单独审位置 ----
 * 上一轮只盯着 Δq（四元数变化），它是**旋转**指标。
 * "头发卡脸上"是**位置**错误，Δq 完全可能很低（骨骼不转，只是被搬到脸上）。
 * 判据：
 *  ① 每根物理骨骼的局部位置 vs 绑定姿态位置（mmd.bones[i].pos）的最大偏差
 *  ② 头部包围球：以「頭」骨骼世界位置为球心、半径 ≈ 头高的一半，
 *     统计有多少根 hair 骨骼的世界位置落进去 → 落进去就是"穿脸/穿头"
 */
let _posAuditN = 0;
function auditPhysicsPositions(tag) {
  try {
    if (!model || !model.skeleton) return;
    const sk = model.skeleton;
    const mmd = model.geometry && model.geometry.userData && model.geometry.userData.MMD;
    if (!mmd || !mmd.bones) return;
    const bones = sk.bones, defs = mmd.bones;
    const byName = new Map();
    for (const d of defs) if (d && d.name) byName.set(String(d.name), d);

    let maxd = 0, maxName = '', sum = 0, cnt = 0;
    const bad = [];
    for (const b of bones) {
      if (!b) continue;
      const d = byName.get(String(b.name));
      if (!d || !d.pos) continue;
      /* 只审"物理骨骼"（会被刚体回写位置/旋转的那些） */
      if (d.rigidBodyType !== 1 && d.rigidBodyType !== 2) continue;
      const dx = b.position.x - d.pos[0];
      const dy = b.position.y - d.pos[1];
      const dz = b.position.z - d.pos[2];
      const dd = Math.sqrt(dx * dx + dy * dy + dz * dz);
      sum += dd; cnt++;
      if (dd > maxd) { maxd = dd; maxName = b.name; }
      if (dd > 1.0 && bad.length < 8) bad.push(b.name + '=' + dd.toFixed(2));
    }

    /* ② 头部包围球检测 */
    let headN = 0, headName = '', headR = 0, inHead = 0;
    const inNames = [];
    const headBone = bones.find(b => b && (b.name === '頭' || b.name === '头'));
    if (headBone) {
      headName = headBone.name;
      const hw = headBone.getWorldPosition(new THREE.Vector3());
      /* 头部半径：用「首」/「頭」到「上半身2」的距离估，取不到就用模型高 8% */
      const up2 = bones.find(b => b && (b.name === '上半身2' || b.name === '上半身3'));
      if (up2) {
        headR = hw.distanceTo(up2.getWorldPosition(new THREE.Vector3())) * 0.75;
      }
      if (!(headR > 1e-4)) headR = 1.5;
      for (const b of bones) {
        if (!b) continue;
        const nm = String(b.name);
        /* ★ 只看 world 空间里落在头球内的 hair 骨骼。
           ★★ 注意：头发在头【外】是正常的（刘海就在额头前面），
              所以判据要用"离头中心太近" —— 即穿进颅骨内部。 */
        if (!/髪|hair/.test(nm)) continue;
        if (/壁/.test(nm)) continue;              // 壁是刻意放在头里的挡板
        const wp = b.getWorldPosition(new THREE.Vector3());
        const dd = wp.distanceTo(hw);
        if (dd < headR * 0.55) {
          inHead++;
          if (inNames.length < 6) inNames.push(nm + '(' + dd.toFixed(2) + '/' + headR.toFixed(2) + ')');
        }
        headN++;
      }
    }

    nlog('★位置审计[' + tag + ']: 物理骨骼 ' + cnt + ' 根，与绑定姿态偏差 均='
      + (sum / Math.max(1, cnt)).toFixed(3) + ' 最大=' + maxd.toFixed(3) + '(' + maxName + ')'
      + (bad.length ? ' 超标[' + bad.join(' ') + ']' : '')
      + ' | 头球 r=' + headR.toFixed(2) + ' 头发 ' + headN + ' 根中穿进颅骨 ' + inHead
      + (inNames.length ? '[' + inNames.join(' ') + ']' : ''));
  } catch (e) {
    nerr('位置审计失败: ' + (e && e.message));
  }
}

/** 记录骨骼原始旋转，用于"原始值 + 偏移"的幂等驱动。 */
function idleBase(o) {
  let b = o.userData.__idleBase;
  if (!b) {
    b = { x: o.rotation.x, y: o.rotation.y, z: o.rotation.z };
    o.userData.__idleBase = b;
  }
  return b;
}

let _blinkTimer = 0;
let _blinkNextIn = 6.0;
let _blinkPhase = -1;          // -1 = 没在眨

/* 一次眨眼的时长分解（秒）。
   ★ 原来是匀速三角波、总长只有 0.16s（闭=睁），实测"太快了，像抽搐"。
     真人眨眼是「快闭 → 微停 → 慢睁」，总 300~400ms，起止平滑。 */
const BLINK_CLOSE_DUR = 0.10;  // 闭眼
const BLINK_HOLD_DUR  = 0.05;  // 全闭微停
const BLINK_OPEN_DUR  = 0.19;  // 睁眼（比闭略慢）
/* 两次眨眼之间的间隔（秒）。
   ★ 原来 2.6~5.6s —— 实测"间隔也太短了"（实测看着就是一直在眨）。
     放宽到 4~11s，并且随机范围拉大，避免出现规律感。
     另：偶尔来一次"连眨"更像真人（见 blinkQuickDouble 逻辑）。 */
const BLINK_GAP_MIN = 4.0;
const BLINK_GAP_MAX = 11.0;

function updateIdle(dt) {
  if (!model) return;
  if (_idleBonesFor !== model) collectIdleBones();

  /* ---------- 呼吸 ---------- */
  /* ★ 有 VMD 待机动作时不写程序化呼吸。
     原因：VMD 的通道里本来就有 上半身/胸 的旋转；
     我们再按「原始值 + 呼吸偏移」覆盖一次，会把动作姿态直接毁掉
     （表现是"播了动作但上半身是僵的/看着怪"）。
     ★ 没配 VMD（或 VMD 总开关关掉）时行为与以前完全一致。 */
  /* ★★ glTF 模型：关掉程序化呼吸 ★★
     ---- 为什么（2026-10-07）----
     呼吸每帧写 `o.rotation.x = base.x + breath`，而它的正则匹配在 GLB 上
     命中的是 `Bip001 Spine` / `Bip001 Spine1`（日志 idleBones: spine=1 chest=1）——
     正是**上半身的根**（头 / 双臂 / 头发全挂在 Spine1 之下）。
     而 AnimationMixer 同时在写同一根骨骼的 quaternion → 两个驱动源抢同一根骨骼，
     每帧顺序是「mixer 写 quaternion → 呼吸改 rotation.x 并重建 quaternion」，
     等于把 mixer 的姿态**部分覆盖**掉；再加上 `idleBase()` 记录的基准值
     取自"第一次被调用时"的欧拉角（可能来自复位后的姿态），基准一旦是错的，
     整个上半身会被持续拧向错误角度。
     glTF 的动作本来就是烘焙好的完整动画，不需要我们再叠呼吸。 */
  if (IDLE_ANIM && !isGltfModel && !vmdSlotReady('idle')) {
    _idleT += dt;
    /* 幅度调大到肉眼可辨（原来 0.012/0.006 太微弱，实测"看不出是呼吸"）。
       两个周期叠加：慢的是胸腔起伏，快的是轻微呼吸感。 */
    const breath = Math.sin(_idleT * 1.15) * 0.030
                 + Math.sin(_idleT * 0.47) * 0.014;
    for (const o of _idleBones.spine) {
      const b = idleBase(o);
      o.rotation.x = b.x + breath;
    }
    for (const o of _idleBones.chest) {
      const b = idleBase(o);
      o.rotation.x = b.x + breath * 1.4;
    }
  }

  /* ---------- 自动眨眼（双眼） ---------- */
  /* gazeMode === 'blink' 是面板上的"眨眼测试"，它自己会驱动眨眼；
     此时跳过自动眨眼，避免两边同时写同一个叠加层。
     ★ 不再因为 morphLoop（表情轮播）而禁用眨眼：
       以前眨眼走 setMorph，会和轮播抢表情、互相覆盖，所以只能二选一；
       现在眨眼是【独立的骨骼叠加层】（setBlinkMorph / _blinkNames），
       与用户表情完全隔离，可以共存。 */
  const canAutoBlink = IDLE_ANIM && gazeMode !== 'blink'
      && blinkExpressions().length > 0;

  if (!canAutoBlink) {
    /* ★ 眨眼被中途打断时必须清掉叠加层，否则会一直闭着眼
       （比如用户关掉待机动作、或打开表情轮播的那一瞬间）。 */
    if (_blinkPhase >= 0) {
      _blinkPhase = -1;
      setBlinkMorph([], 0);
    }
  } else if (_blinkPhase < 0) {
    _blinkTimer += dt;
    if (_blinkTimer >= _blinkNextIn) {
      _blinkTimer = 0;
      _blinkNextIn = BLINK_GAP_MIN
        + Math.random() * (BLINK_GAP_MAX - BLINK_GAP_MIN);
      _blinkPhase = 0;
    }
  }

  if (canAutoBlink && _blinkPhase >= 0) {
    _blinkPhase += dt;
    const total = BLINK_CLOSE_DUR + BLINK_HOLD_DUR + BLINK_OPEN_DUR;
    if (_blinkPhase >= total) {
      _blinkPhase = -1;
      setBlinkMorph([], 0);                      // 睁眼
    } else {
      applyBlink(blinkWeightAt(_blinkPhase));
    }
  }

  /* ★ 帧耗时监测：定位"每次眨眼都卡一下"。
     MMD 的骨骼动画只用少量骨骼，很便宜；但如果眨眼走的是【顶点型 morph】，
     three.js 在 morph 的"非零集合"发生变化时会重传整张 morph 贴图
     （本模型 152 个顶点 morph × 70378 顶点 ≈ 上百 MB），那就会卡一下。
     这里把慢帧打出来，就能确认卡顿到底在哪一环。 */
  _frameCostAcc += performance.now() - _frameT0;
  _frameCostN++;
  if (_frameCostN >= 40) {
    const avg = _frameCostAcc / _frameCostN;
    if (avg > 12) {
      nlog('slowFrames: 平均 CPU ' + avg.toFixed(1) + 'ms/帧'
        + '（>16ms 就会掉帧）exprCost=' + _lastExprCostMs.toFixed(1) + 'ms');
    }
    _frameCostAcc = 0; _frameCostN = 0;
  }
}

/**
 * 眨眼曲线：快闭 → 短暂全闭 → 慢睁。
 * ★ 原来是匀速三角波（闭=睁，总长 0.16s）—— 实测"太快了，像抽搐"。
 *   真人眨眼大约"快闭 100ms → 微停 → 慢睁 200ms"，总 300~400ms，
 *   而且起止是平滑的。这里用 smoothstep 让开合不突兀。
 */
function blinkWeightAt(t) {
  if (t < BLINK_CLOSE_DUR) return smooth01(t / BLINK_CLOSE_DUR);
  if (t < BLINK_CLOSE_DUR + BLINK_HOLD_DUR) return 1;
  return 1 - smooth01((t - BLINK_CLOSE_DUR - BLINK_HOLD_DUR) / BLINK_OPEN_DUR);
}

function smooth01(x) {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);                    // smoothstep
}

/* ============================================================
   心跳：用来区分"渲染循环死了"和"模型只是没有动作"
   ------------------------------------------------------------
   之前"模型像照片一样"有两种可能，日志却看不出是哪种：
     a) 渲染循环停死（画布不再更新）
     b) 循环好好的，只是模型真的没有任何动作
   每 20 秒报一次帧计数：帧数不涨 = 循环真的停了。
   ============================================================ */
let _frameCount = 0;
let _lastHbFrames = 0;
setInterval(function () {
  try {
    const d = _frameCount - _lastHbFrames;
    _lastHbFrames = _frameCount;
    nlog('heartbeat frames=' + d + '/20s (' + (d / 20).toFixed(1) + ' fps)'
      + ' model=' + (model ? 'y' : 'n') + ' idle=' + (IDLE_ANIM ? 'on' : 'off')
      + ' | blink timer=' + _blinkTimer.toFixed(1)
      + ' next=' + _blinkNextIn.toFixed(1)
      + ' phase=' + (_blinkPhase < 0 ? '-' : _blinkPhase.toFixed(2))
      + ' exprs=' + blinkExpressions().length
      + ' gaze=' + gazeMode
      + ' loop=' + (morphLoop ? 'y' : 'n')
      /* ★ 渲染故障诊断：帧数为 0 时，靠这几个值区分
         "循环停死" vs "每帧抛异常" vs "被 FPS 上限挡住" */
      + ' | errCount=' + _renderErrCount
      + ' fpsCap=' + FPS_CAP
      + ' lastErr=' + (_lastRenderErrMsg || '-')
      /* ★ 饱和度诊断：n=已注入 shader 数 / hasCode=代码是否真进 shader
         / satLive=uniform 的【实时】值（之前误用了注入时快照，没法判断） */
      + ' | grade: n=' + _gradeShaderN
      + ' hasCode=' + (_gradeHasCode ? 'Y' : 'N')
      + ' satSet=' + SAT_VALUE
      + ' satLive=' + _gradeUniforms.sat.value
      /* ★ 内存诊断：这个重模型的 morph 贴图约 152×70378×12B ≈ 128MB，
         是渲染进程被回收的主因。这里报出来确认。 */
      + ' | mem: geo=' + (renderer.info.memory.geometries)
      + ' tex=' + (renderer.info.memory.textures)
      + ' morphMeshes=' + morphMeshes.length
      + ' morphCount=' + morphNames.length
      + ' prog=' + (renderer.info.programs ? renderer.info.programs.length : -1));
  } catch (e) {}
}, 20000);

/**
 * 动态分辨率（性能模式）：按实际 FPS 自动升降渲染分辨率。
 *
 * ★ 为什么这是最有效的手段：手机 WebGL 的瓶颈是【填充率】，
 *   降分辨率能线性减少像素着色开销，比减面数有效得多。
 *   实测把它加在大模型上是唯一能明显改善流畅度的开关。
 * ★ 为什么要有"恢复"逻辑：只降不升的话，一旦卡过一次画质就永久变糊。
 *   这里低速上升（每 2 秒最多 +8%），避免升上去又立刻掉下来的抖动。
 */
let _perfWinStart = 0;
let _perfWinFrames = 0;
let _perfLowStreak = 0;

function updatePerfAuto() {
  const now = performance.now();
  if (_perfWinStart === 0) { _perfWinStart = now; _perfWinFrames = 0; return; }
  _perfWinFrames++;
  const elapsed = now - _perfWinStart;
  if (elapsed < 2000) return;

  const fps = _perfWinFrames / (elapsed / 1000);
  _perfWinStart = now;
  _perfWinFrames = 0;
  _fpsReport = fps;               // 始终上报（原生要显示）

  if (!PERF_AUTO) return;         // 只有开着性能模式才真正调分辨率

  const prev = RENDER_SCALE;
  if (fps < 24) {
    _perfLowStreak++;
    /* 连掉两次才动，避免偶发卡顿就降画质 */
    if (_perfLowStreak >= 2) RENDER_SCALE = Math.max(0.35, RENDER_SCALE * 0.82);
  } else if (fps > 52 && RENDER_SCALE < RENDER_SCALE_SET) {
    _perfLowStreak = 0;
    RENDER_SCALE = Math.min(RENDER_SCALE_SET, RENDER_SCALE * 1.08);
  } else {
    _perfLowStreak = 0;
  }
  if (Math.abs(RENDER_SCALE - prev) > 0.005) {
    try { applyPixelRatio(); } catch (e) {}
    nlog('perfAuto: fps=' + fps.toFixed(1) + ' scale '
      + prev.toFixed(2) + ' -> ' + RENDER_SCALE.toFixed(2));
  }

let _lastRenderAt = 0;

function renderInner(nowMs) {
  _frameT0 = performance.now();

     注意跳帧要放在 getDelta 之前，这样 clock 的 dt 会自然累计，动画不会变快。 */
  const nowT = (typeof nowMs === 'number' && nowMs > 0) ? nowMs : performance.now();
  if (FPS_CAP > 0 && _lastRenderAt > 0
      && (nowT - _lastRenderAt) < (1000 / FPS_CAP) - 1.0) {
    return;
  }
  _lastRenderAt = nowT;

  /* ★ dt 必须封顶。
     页面卡顿或被系统节流后恢复的那一帧，dt 可能是好几秒，
     直接喂给 MMDPhysics 会把它一步算飞（产生 NaN），
     污染骨骼后模型就畸形了 —— 用户看到的是"被拉伸变胖"，
     接着后续运算抛异常、渲染循环停止（"定格"）。 */
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mixer && !PHYS_FREEZE_DRIVE) mixer.update(dt);

     ★ 漫游转身（vmd.yawTarget）也在写 model.rotation.y，所以那种情况同样不自转
       （否则两个东西抢同一个值，表现是"走路时模型忽左忽右乱转"）。
     SPIN_SPEED 为 0 即静止。
     注意：矩阵更新已统一挪到物理之前（见下方），这里不再单独更新。 */
  if (model && !mixer && !PHYS_FREEZE_DRIVE && SPIN_SPEED > 0 && !(vmd.yawTarget > 0 || vmd.yawTarget < 0)) {

    model.position.x = Math.sin(spinAngle) * 0.12;
    model.rotation.y = spinAngle * 0.35;
  }

     ★ 位置很关键：必须在【程序化骨骼动画之前】、在【物理之前】。
       · 在物理之前：物理要读最新的骨骼矩阵（见下面的顺序说明）。
       · 在程序化之前：呼吸/眼动是"叠加层"，在动作之上生效；

        ...
        updateIdle(dt);       // 呼吸才转动 上半身（算完才动）

        · 呼吸转脊椎后，物理在下一帧才看到 → 迟一帧
        · 中间又没有 updateMatrixWorld，物理读到的是过期矩阵

         —— 单帧 quaternion 变化总和 80（215 根平均 0.37，最大 3.68 接近 180° 翻转）

         · `unitStep = 1/65 ≈ 0.01538s`，`maxStepNum = 3`
         · `_stepSimulation(delta)` 里：**`if (delta < unitStep) stepTime = unitStep`**

         → 衣服在 2.5 倍重力/速度下积分 → 约束求解发散 → 炸开。

         让"物理时间 = 真实时间"，与渲染帧率彻底解耦。

             matrixWorld.decompose(p, q, scale)   ← 用【当前】matrixWorld 判断缩放
             if (scale != 1) { 摘 parent; scale=1; updateMatrixWorld(); }
             ... _updateRigidBodies / _stepSimulation / _updateBones ...

         每次 update 前后都刷新 matrixWorld，让开头的 decompose 永远读到真实缩放。

          const d = Math.abs(o.mat.color.r - c[0]) + Math.abs(o.mat.color.g - c[1]) + Math.abs(o.mat.color.b - c[2]);

    if (PHYS_TRACE && _physUpdN >= PHYS_TRACE_FROM && _physUpdN < PHYS_TRACE_FROM + PHYS_TRACE_N) {
      try {
        for (const name of PHYS_TRACE_BONES) {

          if (!tb) continue;

            + ' W=(' + wq.x.toFixed(2) + ',' + wq.y.toFixed(2) + ',' + wq.z.toFixed(2) + ',' + wq.w.toFixed(2) + ')'
            + ' lp=(' + tb.position.x.toFixed(2) + ',' + tb.position.y.toFixed(2) + ',' + tb.position.z.toFixed(2) + ')'

    try {

            for (const b of mmd2.bones) {

          if (_physBootWins < 6) { _physBootWins++; nlog('★启动窗口#' + _physBootWins + ' Δq=' + sum.toFixed(1) + ' steps=' + _physStepsLast + ' worst=' + worst.toFixed(2) + '(' + worstName + ')'); }
          if (worst > _physPeak) { _physPeak = worst; _physPeakName = worstName; }

       ---- 为什么要它 ----
       物理对象建出来不等于"在动"：
         · update 有没有被每帧调用？
         · 刚体算完之后**有没有写回骨骼**？
         · 写回的骨骼下一帧会不会被 MMDAnimationHelper 的
           `_restoreBones()` 复位掉（它的顺序是 restore→mixer→save，
           而我们的 physics.update 在 save 之后 → 疑似被覆盖）？
       这里每 2 秒采样几根物理骨骼的旋转，**只在变化时打印**：
         变化 = 物理在起作用（那"看不见"就是幅度太小/位置不对）
         不变 = 物理没写回骨骼，或写回后被复位了。
       ---- 采样对象 ----
       优先取名字含 hair/髪/胸/bust/skirt/スカート 的骨骼（这些正是用户要的
       "头发和胸部"），并记录它是否被 VMD 动画驱动（被驱动的骨骼物理会打架）。 */
    if ((_physUpdN % 120) === 0) {
      try {
        /* ★ 采样【动态骨骼】（rigidBodyType 1/2）—— 之前选的是 髪P/胸親 这种
           type 0 的"跟随骨骼"，它们本来就不动，所以诊断什么也看不出来。 */
        const pick = [];
        const sk = model.skeleton || findSkeletonOf(model);
        if (sk && sk.bones) {
          const mmd1 = model.geometry && model.geometry.userData && model.geometry.userData.MMD;
          const dyn = new Set();
          if (mmd1 && mmd1.bones) {
            for (const b of mmd1.bones) {
              if (b.rigidBodyType === 1 || b.rigidBodyType === 2) dyn.add(b.name);
            }
          }
          for (const b of sk.bones) {
            const n = String(b.name || '');
            if (dyn.has(n) && /hair|髪|髪|skirt|スカート|jacket|ジャケット|coat|コート|裾|袖/i.test(n)) {
              pick.push(b);
              if (pick.length >= 4) break;
            }
          }
        }
        if (pick.length) {
          let sig = '';
          for (const b of pick) {
            const q = b.quaternion;
            sig += b.name + '(' + q.x.toFixed(3) + ',' + q.y.toFixed(3)
              + ',' + q.z.toFixed(3) + ',' + q.w.toFixed(3) + ') ';
          }
          /* ★ 每次都打（不只变化时）—— 因为要看"是否持续震荡"这个趋势 */
          /* ★ 用【窗口平均】而不是单帧采样 —— 单帧值在 0 和 300 之间跳，
             完全无法比较（之前就被它误导过）。 */
          const avg = _physWinN > 0 ? (_physWinSum / _physWinN) : 0;
          _physWinSum = 0; _physWinN = 0;
          nlog('★物理: 平均每帧Δq=' + avg.toFixed(2)
            + '（正常待机应 <0.5；>3 就是震荡）'
            + ' 单帧峰值=' + _physPeak.toFixed(3) + '(' + _physPeakName + ')'
            + ' 步数=' + _physStepsLast
            + ' 抖动骨骼=' + (window.__physHotN | 0) + '根[' + (window.__physHotTop || '') + ']'
            + ' | 采样 ' + sig.slice(0, 90));
          _physPeak = 0;
        } else {
          if (_physSig !== 'none') {
            _physSig = 'none';
            nlog('★物理骨骼: 找不到 hair/胸/skirt 命名的骨骼（模型骨骼名可能不同）');
          }
        }
      } catch (e) {}
    }
  }

  /* ★★★ 嘴部权重诊断（2026-10-07）★★★
     ---- 为什么需要 ----
     曾出现"嘴巴又不见了"。这个 GLB 的 morph 语义是
     **权重 1 = 塌缩成点（不可见）；权重 0 = 正常可见**（见 setMorphGLB 的长注释），
     而 `Cafe_Idle` 给 13 个嘴权重 1、只留 `Mouth_305` 为 0 ——
     也就是说**"看得见嘴"完全依赖动画每帧把那个 0 写进去**。
     一旦动画没跑 / 没覆盖 / 权重被别的值顶掉，14 个嘴就会全部塌缩
     → 表现就是"嘴巴完全不见了"。
     这里每 2 秒打一次 14 个嘴的权重 + mixer/action 状态（只在变化时打），
     一眼就能分清是"动画没跑"还是"权重被改"。 */
  _mouthDbgN++;
  if (isGltfModel && _mouthDbgN % 120 === 0) {
    try {
      const keys = Object.keys(glbMorphMap).sort();
      if (keys.length) {
        const parts = [];
        /* ★ 直接报"嘴 mesh 的实际包围盒尺寸"★
           ---- 为什么（曾出现"选了嘴型也看不见"）----
           只报权重不够：它只说明"我们写了什么"，不说明"实际渲染成什么"。
           而 morph 的语义（1=塌缩 / 0=可见）是我**推断**的，
           若推断方向反了，或"0.00"其实对应"不可见"，就会像现在这样 ——
           权重看着正常、画面上却什么都没有。
           → 直接把每个嘴 mesh 的 geometry 包围盒尺寸量出来（纯 CPU，不用截图）：
             塌缩的嘴尺寸会趋近 0；可见的嘴是正常的 0.083×0.056。
             这样"谁可见"就是**实测值**，不再是推断。 */
        let report = '';
        try {
          const ms = {};
          for (const nm of keys) {
            const t = glbMorphMap[nm][0];
            if (!t || !t.mesh || !t.mesh.geometry) continue;
            const g2 = t.mesh.geometry;
            if (!g2.boundingBox) g2.computeBoundingBox();
            const bb = g2.boundingBox;
            const w0 = bb.max.x - bb.min.x, h0 = bb.max.z - bb.min.z;
            /* 若该 morph 正在生效，把它的位移叠到包围盒上估算最终尺寸 */
            const inf = t.mesh.morphTargetInfluences ? t.mesh.morphTargetInfluences[t.idx] : 0;
            const ma = g2.morphAttributes && g2.morphAttributes.position
              ? g2.morphAttributes.position[t.idx] : null;
            /* ★★ 必须【逐顶点】算最终位置 = base + inf × delta ★★
               ---- 踩过的坑 ----
               第一版按分量取 min/max 拼包围盒（min(p, p + inf*dmin)），
               那**抓不到"所有顶点塌缩到同一点"** —— 它照样报出不小的面积，
               于是诊断显示"嘴很大"，而画面上什么都没有。
               逐顶点算才是 ground truth。 */
            const pAttr = g2.attributes && g2.attributes.position;
            if (!pAttr || !ma) { ms[nm.replace(/^Mouth_/, '')] = { inf: inf, w: -1, h: -1 }; continue; }
            const ar = ma.array, pa = pAttr.array;
            let mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
            const nv = Math.min(pAttr.count, ma.count);
            for (let i = 0; i < nv; i++) {
              const x = pa[i * 3] + inf * ar[i * 3];
              const z = pa[i * 3 + 2] + inf * ar[i * 3 + 2];
              if (x < mnx) mnx = x; if (x > mxx) mxx = x;
              if (z < mnz) mnz = z; if (z > mxz) mxz = z;
            }
            ms[nm.replace(/^Mouth_/, '')] = { inf: inf, w: mxx - mnx, h: mxz - mnz };
          }
          const parts2 = [];
          let visibleNow = [];
          for (const k2 in ms) {
            const m2 = ms[k2];
            const region = (m2.w < 0) ? -1 : m2.w * m2.h;
            if (region > 0.0015) visibleNow.push(k2);
            parts2.push(k2 + ':' + (region < 0 ? '?' : (region * 10000).toFixed(0)));
          }
          report = ' | 实际尺寸(×10⁻⁴): ' + parts2.join(' ')
            + ' | ★实际可见=' + (visibleNow.join(',') || '（无！）');
        } catch (e) { report = ' bboxFailed:' + (e && e.message); }

        let allOne = true, anyZero = false;
        for (const nm of keys) {
          const t = glbMorphMap[nm][0];
          const v = (t && t.mesh && t.mesh.morphTargetInfluences)
            ? (t.mesh.morphTargetInfluences[t.idx] || 0) : -1;
          parts.push(nm.replace(/^Mouth_/, '') + '=' + v.toFixed(2));
          if (v < 0.9) allOne = false;
          if (v < 0.1) anyZero = true;
        }
        const idleActs = vmdSlotActions('idle');
        const idleRun = idleActs.length ? idleActs.map(a => a.isRunning() ? 'Y' : 'n').join('') : '-';
        const info = '★嘴部权重: ' + parts.join(' ')
          + report
          + ' | mixer=' + (vmd.mixer ? 'y' : 'n')
          + ' idleAct=' + idleActs.length + '/' + idleRun
          + ' idleW=' + (idleActs.length ? idleActs[0].getEffectiveWeight().toFixed(2) : '-')
          + ' t=' + (idleActs.length ? idleActs[0].time.toFixed(2) : '-')
          + (allOne ? '  ★★ 全部塌缩(1) → 嘴不可见' : (anyZero ? '  ✓ 有 0（正常）' : ''));
        if (info !== _mouthDbgPrev) { _mouthDbgPrev = info; nlog(info); }
      } else if (_mouthDbgPrev !== 'none') {
        _mouthDbgPrev = 'none';
        nlog('★嘴部权重: glbMorphMap 为空（还没收集到 morph）');
      }
    } catch (e) {}
  }

  /* ★★★ 嘴部 A/B 实测（2026-10-07）：嘴到底有没有被【画出来】★★★
     ---- 为什么（实测"之前很细也能看见，现在根本看不见"）----
     前面已经用逐顶点算出 Mouth_305 是全尺寸（46）在渲染的，
     权重也对（305=0，其余=1）。几何层面完全正常 ——
     那问题只能出在"有没有真的进绘制"。这里照搬描边那次的 A/B 手法：
       手动渲染两帧（带嘴 / 隐藏所有嘴 mesh），比较 renderer.info.render.calls。
       差值 ≈ 14 → 在画（那"看不见"就是太淡/太细）
       差值 = 0   → 根本没进绘制（材质/可见性/剔除问题）
     顺便把每个嘴材质的真实状态转储出来，一眼看出被谁改坏了。
     ★ 只在自检的第 3 次跑一次，不影响主循环。 */
  if (isGltfModel) {
    _mouthAbN++;
    if (_mouthAbN === 150) {           // 约在启动 5 秒后
      try {
        const mouths2 = [];
        for (const nm in glbMorphMap) {
          if (!/^Mouth_/i.test(nm)) continue;
          for (const t of glbMorphMap[nm]) {
            if (t.mesh && mouths2.indexOf(t.mesh) < 0) mouths2.push(t.mesh);
          }
        }
        if (mouths2.length) {
          renderer.render(scene, camera);
          const withM = renderer.info.render.calls;
          const prevVis = mouths2.map(m => m.visible);
          for (const m of mouths2) m.visible = false;
          renderer.render(scene, camera);
          const without = renderer.info.render.calls;
          for (let i = 0; i < mouths2.length; i++) mouths2[i].visible = prevVis[i];
          nlog('★嘴部 A/B: 带嘴 drawcall=' + withM + ' 隐藏后=' + without
            + ' 差值=' + (withM - without) + ' (嘴 mesh 数=' + mouths2.length + ')');
          const m0 = mouths2[0];
          const mm = Array.isArray(m0.material) ? m0.material[0] : m0.material;
          nlog('★嘴材质状态: name=' + (m0.name || '?')
            + ' matVisible=' + mm.visible
            + ' transparent=' + mm.transparent
            + ' opacity=' + mm.opacity
            + ' alphaTest=' + mm.alphaTest
            + ' depthWrite=' + mm.depthWrite
            + ' depthTest=' + mm.depthTest
            + ' side=' + mm.side
            + ' hasMap=' + !!mm.map
            + ' colorWrite=' + mm.colorWrite
            + ' fog=' + mm.fog
            + ' meshVisible=' + m0.visible
            + ' layersMask=' + m0.layers.mask
            + ' frustumCulled=' + m0.frustumCulled
            + ' renderOrder=' + m0.renderOrder);
        }
      } catch (e) { nerr('嘴部 A/B failed: ' + (e && e.message)); }
    }
  }

  /* ★ 动态模糊：开启且长度>0 时走累积管线；否则完全按原样渲染（零开销）。
     ★ 把 dt 传进去 —— 它是"距上一次真正渲染"的间隔，
       所以低帧率/掉帧时 k 会自动变大，拖影时长保持恒定（帧率无关）。 */
  if (MB_ON && MB_LEN > 0) {
    if (!mbRender(dt)) renderer.render(scene, camera);
  } else {
    renderer.render(scene, camera);
  }
  _frameCount++;               // heartbeat
  updatePerfAuto();            // 动态分辨率
}

/**
 * 统一取景入口：按当前视口重新开始取景。
 *
 * ★ 为什么要统一入口（文档 §4.4 / 坑#48「双开关」）：
 *   之前 frameModel() 和 fitCameraToBox() 都在设置相机，
 *   前者用 0.58 系数、后者用 0.82，两边互相覆盖，
 *   表现就是"取景调好了又自己变回去"。
 *   现在取景只有这一条路径：resetFit → fitCameraToBox → correctCameraFromMask。
 */
/**
 * 取景统一入口（带去重）。
 *
 * ★ 为什么要去重：取景有两个触发源 ——
 *   ① 换模型（__loadModel 里 resetFit('new-model')）
 *   ② 窗口尺寸变化（onResize 的 debounce → resetFit('resize')）
 *   而窗口尺寸恰恰会在模型加载后被 applyAppearance() 改一次，
 *   于是两个触发源在很短时间里各跑一轮取景 → 用户看到"模型连着缩两次"
 *   （实测"模型会突然拉长，然后比例正常，但很快又连着缩水两次"）。
 *   → 用一个定时器把短时间内的多次请求合并成一次。
 */
let _fitTimer = null;
function scheduleFit(reason, delayMs) {
  _szTrig('scheduleFit(' + reason + ',' + delayMs + ')');
  if (_fitTimer) clearTimeout(_fitTimer);
  const d = (typeof delayMs === 'number') ? delayMs : 80;
  _fitTimer = setTimeout(function () {
    _fitTimer = null;
    resetFit(reason);
  }, d);
}

function resetFit(reason) {
  _szTrig('resetFit(' + reason + ')');
  if (!model || !camera) return;
  /* 锁定取景时：只允许"换模型"重新取景，窗口尺寸变化不再触发 ——
     那正是"加载好之后又被改小"的来源之一。 */
  if (VIEW_LOCKED && reason !== 'new-model') {
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    camera.updateProjectionMatrix();
    nlog('resetFit(' + reason + ') 已跳过（锁定取景）');
    return;
  }

  const hadGoodFit = (_fitStage === 2 && _fitDone);

  _fitDone = false;
  _fitPass = 0;
  camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
  camera.updateProjectionMatrix();

  if (hadGoodFit) {
    /* ★★ 已经取好过景 → 绝不套用 Box3 的粗略取景！
       ---- 事故复盘（实测"模型加载好之后又变小"）----
       fitCameraToBox 基于 Box3，算出的距离明显偏大（模型只占 ~55%，目标 82%），
       必须靠 correctCameraFromMask 才校正到位。
       而重取景时若掩码尚未就绪，correct 会失败，
       相机就【停在 Box3 那个偏小的状态】—— 掩码要等 700ms 才重新可用，
       所以这个"变小"状态会持续可见，用户当然觉得"变小了"。
       → 重取景时【保持相机不动】，等掩码就绪再一次性算准。
       这样全程都不会出现错误尺寸，也就没有"变大变小"的跳变。 */
    _fitStage = 1;
    if (!correctCameraFromMask()) _retryFitByMask(0);
  } else {
    /* 首次取景：还没有任何参考值，只能用 Box3 给个临时值 */
    _fitStage = 0;
    fitCameraToBox();
    if (_fitStage !== 2 && !correctCameraFromMask()) _retryFitByMask(0);
  }

  nlog('resetFit(' + reason + ') vp=' + window.innerWidth + 'x' + window.innerHeight
    + ' aspect=' + camera.aspect.toFixed(3) + ' fitStage=' + _fitStage
    + (hadGoodFit ? ' 保持原相机' : ' Box3初值'));
}

/**
 * 掩码还没就绪时的快速重试（逐帧），比死等 700ms 定时器快得多。
 * ★ 期间【相机保持不动】，所以用户看不到任何中间的错误尺寸。
 */
function _retryFitByMask(attempt) {
  if (attempt > 20) return;
  requestAnimationFrame(function () {
    if (_fitStage === 2) return;                 // 已完成
    if (correctCameraFromMask()) return;         // 这次成功
    _retryFitByMask(attempt + 1);
  });
}

let _lastVpW = 0, _lastVpH = 0, _refitTimer = null;
/**
 * ★ 跳过【下一次】resize 触发的重新取景（一次性）。
 * 由原生在"按模型宽高比改窗口宽度"之前调用 ——
 * 那次 resize 是【我们自己造成的】，不该让它重新取景
 * （否则窗口变窄 → 横向成为约束 → 相机后退 → 模型变小，见 onResize 的长注释）。
 */
let _skipResizeFitOnce = false;
window.__skipResizeFitOnce = function () {
  _skipResizeFitOnce = true;
  return true;
};

function onResize() {
  _szTrig('onResize(' + window.innerWidth + 'x' + window.innerHeight + ')');
  const w = window.innerWidth, h = window.innerHeight;

  /* ① 立刻让绘制缓冲跟上视口。
     ★ 必须立即做、不能等 debounce：WebView 只负责派发 resize，
       画布的绘制尺寸是我们自己 setSize 的；跟不上就会被横向拉伸
       （用户看到的就是"变胖"）。 */
  applyPixelRatio();
  /* WebView 派发 resize 时可能还没完成布局，此时 innerWidth/Height 还是旧值，
     setSize 之后画布与显示尺寸依然不符 → 依然拉伸。
     下一帧再补一次，拿到布局稳定后的真实尺寸。 */
  requestAnimationFrame(function () {
    try { applyPixelRatio(); } catch (e) {}
  });

  /* ★★ 立即同步 camera.aspect —— 修"模型被拉长"。
     ---- 事故复盘（实测"模型会突然拉长，然后比例正常，但很快又缩两次"）----
     原来 aspect 只在 resetFit 里更新，而 resetFit 被 debounce 了 250+60=310ms。
     这 310ms 内：canvas 已经按新尺寸重设（applyPixelRatio 立刻生效），
     但投影矩阵还是旧的 aspect → 画面被横向/纵向拉长。
     ★ aspect 是纯数学同步操作、极便宜，必须【立刻】跟着窗口走；
       需要延迟的只是"重新取景"（那要等掩码渲染）。 */
  try {
    const vpAspect = w / Math.max(1, h);
    if (isFinite(vpAspect) && vpAspect > 0.05
        && Math.abs(camera.aspect - vpAspect) > 0.005) {
      camera.aspect = vpAspect;
      camera.updateProjectionMatrix();
    }
  } catch (e) {}

  /* ② 视口没有真的变化就到此为止（WebView 有时会重复派发 resize） */
  if (w === _lastVpW && h === _lastVpH) return;
  _lastVpW = w; _lastVpH = h;

  /* ★★★ 原生"按模型宽高比调窗口形状"时，跳过这一次重新取景 ★★★
     ---- 事故复盘（2026-10-07 曾出现"模型有时会缩水，刚加载完拖拽更容易"）----
     真机诊断（★尺寸变化 日志）抓到的完整因果链：
         窗口 175x236（比例 0.74）
       → JS 在 camFit 末尾上报"模型真实宽高比 0.51"
       → 原生 maybeAdaptWindowAspect 把窗口改成 120x236（比例 0.51）
       → 触发 onResize → **重新取景** → 相机被迫后退 camZ 3.567→3.892
       → 用户看到的就是【缩水】
       → 而且新视口又上报一次比例 → 再改窗口 → 140x236 … **来回振荡**
         所以症状是"**有时**会缩水"；拖拽会引起窗口布局变化，从而提高概率。

     ★ 关键认识：那个改窗口的动作，本意是"去掉左右留白"，
       **不该改变模型的大小**。它之所以改变了大小，是因为窗口变窄后
       【横向反而成了取景约束】（模型 0.86 宽 × 1.6 高，窗口比例 0.51 时横向先顶住），
       取景算法只能把相机往后拉。
     ★ 正解：改窗口时把这一次 resize 的重取景【抑制】掉 ——
       相机距离原封不动（模型大小不变），只是视口变窄（留白消失）。
       camera.aspect 已在上面的 ① 里立刻同步，所以不会变形。 */
  if (_skipResizeFitOnce) {
    _skipResizeFitOnce = false;
    nlog('窗口形状适配引发的 resize：已跳过重取景（保持相机距离，模型大小不变）');
    return;
  }

  /* ③ 视口变了 → 之前按旧视口算出的 camera.aspect（内容贴合结果）
        和取景距离全部失效，继续沿用就会变形，所以重新取景。
        debounce 合并连续 resize，避免反复重取景导致抖动。
     ★ 这里【不再调用 frameModel()】：它会把取景状态机重置回 0，
       并用旧系数覆盖 fitCameraToBox 的结果 —— 那正是"变胖"的元凶。 */
  clearTimeout(_refitTimer);
  _refitTimer = setTimeout(function () {
    try {
      if (!model) return;
      /* ★ 用 scheduleFit 合并触发源：窗口尺寸变化与换模型往往紧接着发生，
         各自 resetFit 一次就会让用户看到"连着缩两次"。 */
      scheduleFit('resize', 60);
    } catch (e) { nlog('refit failed: ' + e.message); }
  }, 250);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 150));





/* ==================================================================
   表情（MMD morph target）
   PMX 的表情会解析成 morphTargetDictionary，key 就是表情名
   （本模型实测 16 个：笑い / ウィンク / あ / え / い / なごみ ...）。
   用法：morphTargetInfluences[索引] = 0..1
   ================================================================== */
let morphNames = [];      // 当前模型的表情名（顺序 = morphTargetInfluences 下标）
/** 仅供轮播使用的"面部表情"子集（排除装备/姿态类，见 isFaceMorph）。 */
let faceMorphNames = [];

/* ============================================================
   配件（装备）识别与管理
   ------------------------------------------------------------
   ★ 什么是"配件"：模型里那些【默认隐藏、靠材质表情开启】的部件。
     实测 Kei 有：きつね耳(狐耳) / きつね尻尾(狐尾) / 尻尾リボン / 靴_黒 / 靴_灰色 /
     各种上着(外套) / ネクタイ / めがね / ハートニプレス …
     它们的 PMX 基础 alpha 全是 0.00，必须靠材质表达式把 alpha 加成 1 才显示。
   ★ 为什么要和"表情"分开：
     表情（微笑/张嘴/闭眼）是【瞬时表演】，而配件是【长期开关状态】。
     混在一起会让下拉里塞满"ON_靴"之类，AI 也容易挑错
     （曾出现"AI 做的表情只有光环动、脸不动"）。
     → 配件单独成页、单独持久化、单独给 AI 一个工具。
   ============================================================ */
/* ============================================================
   配件识别
   ------------------------------------------------------------
   ★ 两条判据合起来用（单靠任一条都会漏）：
     ① 名字特征（装备/部件的常见命名）
     ② 【数据特征】—— 该 morph 是否"把默认隐藏的材质打开"
        这是配件最本质的语义：模型把 狐耳/尾巴/鞋 这些部件的材质
        基础 alpha 设为 0（隐藏），再用一个 morph 把 alpha 加成 1 来显示。
        而面部表情（Close/なごみ）是反过来的：把可见材质【关掉】。
   ============================================================ */
const ACCESSORY_MORPH_RE =
  /靴|くつ|しっぽ|尻尾|尾巴|耳|みみ|リボン|スカート|上着|ジャケット|ネクタイ|シャツ|ズボン|ぱんつ|ソックス|めがね|メガネ|ハート|ニプレス|ブラ|バンド|手袋|マフラー|髪飾|セットアップ|ON_|OFF|袖|そで|襟|えり|ポーズ|pose|直立|胸|腕|ひじ|肘|肩|足|あし|脚|もも|太もも|膝|ひざ|手首|指|爪|つめ|翼|つの|角|羽|はね|マント|ポンチョ|鎧|兜|帽子|ぼうし|しゃく|ベルト|with|装備|追加/i;

/** 当前模型的配件名列表（由 rebuildMorphMap 分类得出）。 */
let accessoryMorphNames = [];
/** 已启用的配件（来自持久化设置）。 */
let _accNames = [];

/**
 * ★ 面部特征：这些即使"把隐藏材质打开"也是【表情】，不是配件。
 * ---- 为什么必须有这条（2026-10-05 实测）----
 * 面部表情也可能实现为"亮出一个隐藏的脸部材质"，
 * 例如 口角上げ（亮出微笑嘴部）、ON_犬歯（亮出虎牙）、ハート目（心形眼）。
 * 只靠"是否打开隐藏材质"会把它们全误判成配件 ——
 * 实测误收进 72 个里混了 ハート目/口角上げ/OFF_舌/OFF_鼻線/照れ/赤面/
 * OFF_目_影/OFF_ハイライト/★ケイ混乱(表情) 等一堆面部项目。
 * → 面部特征一律排除，优先级高于其它所有判据。
 */
const FACE_FEATURE_RE =
  /目|眼|瞳|まなこ|口|くち|舌|歯|鼻|眉|まゆ|まつげ|睫毛|ハイライト|照れ|赤面|涙|なみだ|汗|表情|顔|かお|頬|ほほ|笑|にこ|怒|泣|ウィンク|wink|まばたき|閉じ/i;

/** 骨架修正类（手首補正/肩補正/尻ふともも補正…）：是装配辅助，不是给用户开关的部件。 */
const RIG_FIX_RE = /補正/i;

/** 判断一个 morph 是不是配件（装备/部件开关）。 */
function isAccessoryMorph(name) {
  return !!name && ACCESSORY_MORPH_RE.test(name);
}

/**
 * 数据判据：该 morph 是否"打开了默认隐藏的材质"（= 显示某个部件）。
 * 返回 true 表示"这是配件类"，false/undefined 表示"看不出来"。
 */
function isAccessoryByMaterial(name) {
  try {
    const eff = morphEffects && morphEffects[name];
    if (!eff || !eff.materials || !eff.materials.length || !_matBase) return null;
    let showsHidden = 0, hidesVisible = 0;
    for (const m of eff.materials) {
      const base = _matBase[m.index];
      if (!base) continue;
      const off = (m.diffuse && m.diffuse.length >= 4) ? m.diffuse[3] : 0;
      if (off > 0 && base.opacity < 0.02) showsHidden++;        // 把隐藏材质打开 → 配件
      else if (off < 0 && base.opacity > 0.98) hidesVisible++;  // 把可见材质关掉 → 表情
    }
    if (showsHidden > 0 && hidesVisible === 0) return true;
    if (hidesVisible > 0) return false;                         // 明确是"换脸"类表情
    return null;
  } catch (e) { return null; }
}

/** 综合判断：名字命中，或数据表明它在"显示隐藏部件"；面部特征/骨架修正一律排除。 */
function isAccessory(name) {
  if (!name) return false;
  /* ★ 排除优先级最高：面部特征 = 表情；骨架修正 = 装配辅助 */
  if (FACE_FEATURE_RE.test(name)) return false;
  if (RIG_FIX_RE.test(name)) return false;
  if (isAccessoryMorph(name)) return true;
  /* ★ 名字没命中时，用数据兜底 —— 免得像 ★胸上げ / 足ポーズ 这种漏掉 */
  return isAccessoryByMaterial(name) === true;
}

/**
 * 设置某个配件的开关。
 * 配件本质是"材质表达式"，所以直接走 reapplyExpressions 的材质通道。
 */
function setAccessory(name, on) {
  const nm = String(name || '').trim();
  if (!nm) return false;
  const i = _accNames.indexOf(nm);
  if (on && i < 0) _accNames.push(nm);
  else if (!on && i >= 0) _accNames.splice(i, 1);
  else return true;                       // 状态没变
  reapplyExpressions();
  nlog('accessory ' + nm + ' -> ' + (on ? 'ON' : 'OFF')
    + '（当前启用 ' + _accNames.length + ' 个）');
  return true;
}

/** 批量设置（启动时从持久化设置恢复用）。 */
window.__setAccessories = function (json) {
  try {
    let arr = json;
    if (typeof json === 'string') {
      const v = JSON.parse(json);
      if (Array.isArray(v)) arr = v;
    }
    _accNames = Array.isArray(arr) ? arr.map(x => String(x)).filter(Boolean) : [];
    _lastApplySig = '';                   // 强制重算
    reapplyExpressions();
    nlog('__setAccessories: ' + _accNames.length + ' 个 -> ' + _accNames.join(','));
    return _accNames.length;
  } catch (e) { return -1; }
};

window.__setAccessory = function (name, on) { return setAccessory(name, on); };

/** 当前已启用的配件（供原生持久化）。 */
window.__activeAccessories = function () {
  try { return JSON.stringify(_accNames); } catch (e) { return '[]'; }
};

/**
 * 配件的"种类"标签 —— 让用户知道该期待什么效果。
 * ★ 用户的观察：大多数装备是 ON_XXX（材质开关），少数是 ONXXX（顶点形状）。
 *   这两类观感差别很大，标注出来能避免"以为没生效"。
 */
function accessoryKind(name) {
  try {
    const eff = morphEffects && morphEffects[name];
    if (!eff) return '';
    const hasMat = eff.materials && eff.materials.length > 0;
    const hasBone = eff.bones && eff.bones.length > 0;
    const hasVtx = eff.vertex && eff.vertex.length > 0;
    if (hasMat) {
      const byMat = isAccessoryByMaterial(name);
      return byMat === false ? '闭眼换脸' : '显示部件';
    }
    if (hasBone) return '姿势/动作';
    if (hasVtx) return '形状变化';
    return '';
  } catch (e) { return ''; }
}

/**
 * 列出全部配件 + 当前开关状态（供配件页与 AI 工具使用）。
 * 输出 [{name, on, kind}]；没有任何配件时返回 []（原生据此**自动禁用**配件功能）。
 */
window.__listAccessories = function () {
  try {
    return JSON.stringify(accessoryMorphNames.map(n => ({
      name: n,
      on: _accNames.indexOf(n) >= 0,
      kind: accessoryKind(n)
    })));
  } catch (e) { return '[]'; }
};

let morphIndex = {};      // 表情名 -> 下标
let morphMeshes = [];     // 承载 morph 的 SkinnedMesh
let morphCur = '';        // 当前选中的表情
let morphLoop = false;
let morphLoopT = 0;

/**
 * 重建表情映射。
 *
 * ★ 关键坑（已实测确认）：
 *   PMX 的表情（MMD expression）不会出现在 morphTargetDictionary 上。
 *   那个属性是 three.js 在【首次访问 mesh.morphTargetInfluences 时才懒创建】的，
 *   MMDLoader 自己从不赋值（MMDLoader.js 里只有 geometry.morphTargets = ...）。
 *   所以 model.morphTargetDictionary 往往是 undefined，
 *   照着它判断会得出"模型没有表情"的错误结论。
 *
 *   正确来源是 MMDLoader 写入 geometry 的旧版 morphTargets 数组：
 *     MMDLoader.js:  morphTargets.push(params);  geometry.morphTargets = morphTargets;
 *   每个元素形如 { name: '笑い', ... }，其数组下标正好对应
 *   mesh.morphTargetInfluences 的下标。
 */

/* ==================================================================
   ★★★ 表情修复：给 MMDToonMaterial 打开 morph target 顶点位移 ★★★
   ------------------------------------------------------------------
   【已定位的根因，实测确认】
   MMDToonMaterial 继承自 ShaderMaterial，而 three.js 的 morph 顶点位移
   是靠 shader chunk + 一个编译期宏开启的：

     three.module.js:18820
       parameters.morphTargets ? '#define USE_MORPHTARGETS' : ''

     three.module.js:19522
       morphTargets: geometry.morphAttributes.position !== undefined

   内置材质（MeshToonMaterial 等）在 WebGLPrograms 里【自动】把
   parameters.morphTargets 设为 true；但 ShaderMaterial 分支不会，
   必须由材质自己声明。而 MMDToonMaterial 两个条件都不满足：

     1) examples/jsm/shaders/MMDToonShader.js 里
        grep morphtarget  ->  0 处命中
        顶点着色器既没有 #include <morphtarget_pars_vertex>
        也没有 #include <morphtarget_vertex>
     2) MMDToonMaterial 的 defines 里没有 morphTargets: true

   后果：人脸/身体/头发这些用 MMDToonMaterial 的部分，
        设了 morphTargetInfluences 也【完全没有顶点位移】。
        而光环之所以会变，是因为它是独立网格、走了别的材质路径。

   【本项目的修法】(不改 three 库文件，只在页面侧补)
   给每个 MMDToonMaterial：
     a) defines.USE_MORPHTARGETS = ''      打开编译宏
     b) 顶点着色器注入 morphtarget_pars_vertex + morphtarget_vertex
        （用 WebGLProgram 的 onBeforeCompile 或直接拼字符串）
   注：ShaderMaterial 可以通过 material.onBeforeCompile 改 shader，
       但更稳妥的是直接改 material.vertexShader 并 needsUpdate = true。
   ================================================================== */

/**
 * 为 MMDToonMaterial 开启 morph target 支持。
 * 必须对【每个材质实例】单独处理，并设置 needsUpdate 让 shader 重编译。
 */
function enableMorphOnMaterial(m) {
  if (!m || m.type !== 'MMDToonMaterial') return false;
  if (m.userData.__morphPatched) return true;
  m.userData.__morphPatched = true;

  // (a) 打开 three 的 morph 编译宏
  m.defines = m.defines || {};
  m.defines.USE_MORPHTARGETS = '';
  // r150 用 morphAttributes，纹理路径需要 MORPHTARGETS_COUNT 才能生成数组大小
  if (typeof m.morphTargets === 'undefined') m.morphTargets = true;

  // (b) 顶点着色器注入 chunk
  const vs = m.vertexShader || '';
  if (!vs.includes('morphtarget_pars_vertex')) {
    // pars 声明 uniform 与 getMorph()，放在 void main() 之前
    m.vertexShader = vs.replace(
      /void\s+main\s*\(\s*\)\s*\{/,
      '#include <morphtarget_pars_vertex>\nvoid main() {'
    );
  }
  if (!m.vertexShader.includes('morphtarget_vertex')) {
    // 真正的位移计算，必须在 begin_vertex 之后、project_vertex 之前
    m.vertexShader = m.vertexShader.replace(
      /#include <begin_vertex>/,
      '#include <begin_vertex>\n\t#include <morphtarget_vertex>'
    );
  }
  // 若原 shader 没有 begin_vertex，就退一步插在 main() 开头之后
  if (!m.vertexShader.includes('morphtarget_vertex')) {
    m.vertexShader = m.vertexShader.replace(
      /void\s+main\s*\(\s*\)\s*\{/,
      'void main() {\n\t#include <morphtarget_vertex>'
    );
  }
  m.needsUpdate = true;
  return true;
}

/** 遍历模型，对所有 MMDToonMaterial 开启 morph。 */

/* ==================================================================
   ★ 色彩空间修正（很关键，之前画面"偏暗"就是这里）
   ------------------------------------------------------------------
   r150 起 three 用 ColorManagement，默认 outputColorSpace = SRGBColorSpace，
   而【贴图输入】必须显式标成 SRGBColorSpace 才会做 sRGB->Linear 的解码。
   MMDLoader 全文件没有任何 colorSpace 处理（已 grep 确认），
   于是 PMX 引用的 PNG 被当成 Linear 数据直接用 -> 整体偏暗一档。
   正确做法：加载完后把所有 diffuse 贴图标成 SRGBColorSpace。
   ================================================================== */
function fixColorSpace(mesh) {
  let n = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (!m) continue;
      // 只标颜色贴图；alphaMap / normalMap 等是数据贴图，标错会引入错误
      for (const slot of ['map', 'emissiveMap']) {
        const t = m[slot];
        if (t && t.isTexture && t.colorSpace !== THREE.SRGBColorSpace) {
          t.colorSpace = THREE.SRGBColorSpace;
          t.needsUpdate = true;
          n++;
        }
      }
    }
  });
  nlog('fixColorSpace: tagged ' + n + ' texture(s) as sRGB');
  return n;
}


/* ==================================================================
   饱和度 / 色相调整
   ------------------------------------------------------------------
   MMD 贴图整体偏淡（尤其本模型大量接近纯白的像素），需要在渲染阶段
   提饱和。注意：改贴图本身会丢失 sRGB 编码信息，所以正确的位置是
   在【片元着色器输出之后、色彩空间转换之前】做一次 HSL 调整。
   three 的 phong 片元着色器尾部固定是:
       #include <tonemapping_fragment>
       #include <colorspace_fragment>       (r152+)
     或
       #include <encodings_fragment>          (r150)
   我们把 HSL 调整插在这两者【之前】——即在线性空间里调整亮度关系，
   这样和色调映射/色彩空间转换的顺序才是正确的。
   ================================================================== */
/**
 * 饱和度 / 色相：给 MMDToonMaterial 打补丁。
 *
 * ★ 为什么用 onBeforeCompile 而不是直接改 material.fragmentShader：
 *   直接改字符串一旦插错位置（放到 main() 外、或 include 展开后失效），
 *   GLSL 编译失败会让整个材质【完全不渲染】——现象是模型凭空消失，
 *   而且 console 里通常什么都看不到，非常难查。
 *   onBeforeCompile 是 three 官方留的扩展点：在 three 完成 include 展开
 *   之后、真正交给 GL 编译之前插入代码，位置由我们精确指定，出错概率最低。
 *
 * 注入点：#include <encodings_fragment> 之前
 *   three r150 的片元着色器尾部固定是
 *     #include <output_fragment>       // gl_FragColor = vec4(outgoingLight, a)
 *     #include <tonemapping_fragment>
 *     #include <encodings_fragment>    // linearToOutputTexel: linear -> sRGB
 *   在 linear 空间调整后再做编码转换，顺序才是正确的。
 */
let _gradeUniforms = { sat: { value: 1.0 }, hue: { value: 0.0 },
                       dbg: { value: 0.0 } };
/* 自检开关：0=正常, 1=显示饱和度, 2=强制饱和度1(不做任何处理)
   用来肉眼确认"当前 gl_FragColor 处于什么色彩空间"。 */
let GRADE_DEBUG = 0;

const GRADE_GLSL = `
  /* ★ 这两个函数是【教科书式逐分量实现】，不要改回 three.js 内部那种
     vec4 swizzle 写法（rgb2hsv(vec3) 那套）。
     踩过的坑：直接照抄 three 的 swizzle 版本，S 会算出 1.33 / 2.667 甚至
     6.6e9 这种超出 [0,1] 的值，clamp 之后画面直接全黑 —— 而且 GLSL 不报错，
     极难定位。此版本已在 JS 里做过往返验证（误差 ~1e-16）。 */
  vec3 mmd_rgb2hsv( vec3 c ) {
    float mx = max( c.r, max( c.g, c.b ) );
    float mn = min( c.r, min( c.g, c.b ) );
    float d  = mx - mn;
    float h  = 0.0;
    if ( d > 1e-12 ) {
      if ( mx == c.r )      h = ( c.g - c.b ) / d;
      else if ( mx == c.g ) h = 2.0 + ( c.b - c.r ) / d;
      else                  h = 4.0 + ( c.r - c.g ) / d;
      h = fract( h / 6.0 );
    }
    float s = ( mx <= 1e-12 ) ? 0.0 : d / mx;
    return vec3( h, s, mx );
  }

  vec3 mmd_hsv2rgb( vec3 c ) {
    float h = fract( c.x );
    float s = clamp( c.y, 0.0, 1.0 );
    float v = c.z;
    float i = floor( h * 6.0 );
    float f = h * 6.0 - i;
    float p = v * ( 1.0 - s );
    float q = v * ( 1.0 - s * f );
    float t = v * ( 1.0 - s * ( 1.0 - f ) );
    int k = int( mod( i, 6.0 ) );
    if ( k == 0 ) return vec3( v, t, p );
    if ( k == 1 ) return vec3( q, v, p );
    if ( k == 2 ) return vec3( p, v, t );
    if ( k == 3 ) return vec3( p, q, v );
    if ( k == 4 ) return vec3( t, p, v );
    return vec3( v, p, q );
  }
`;
const GRADE_APPLY = `
  {
    float _s = mmdSaturation;
    float _h = mmdHueShift;
    if ( abs( _s - 1.0 ) > 0.001 || abs( _h ) > 0.0001 ) {
      vec3 _before = gl_FragColor.rgb;
      vec3 _hsv = mmd_rgb2hsv( _before );
      _hsv.y = clamp( _hsv.y * _s, 0.0, 1.0 );   // S 必须在 [0,1]
      _hsv.x = fract( _hsv.x + _h );
      gl_FragColor.rgb = mmd_hsv2rgb( _hsv );
      // 自检：采样显示 处理前.r / 处理前亮度 / 处理后饱和度
      if ( mmdGradeDebug > 0.5 &&
           mod( float( gl_FragCoord.x ) + float( gl_FragCoord.y ), 600.0 ) < 1.0 ) {
        gl_FragColor.rgb = vec3( _before.r,
                                 dot( _before, vec3( 0.2126, 0.7152, 0.0722 ) ),
                                 _hsv.y );
      }
    }
  }
`;

let _gradeTypeSkip = 0;
let _gradeAnchorFail = 0;
let _gradeHooked = 0;
/* ★ 饱和度诊断：区分"注入没进去"和"注入进去了但 uniform 不生效"。
   实测"饱和度怎么调都一样"，这两者现象相同但修法完全不同。 */
let _gradeShaderN = 0;
let _gradeHasCode = false;
let _gradeHasSatDecl = false;
let _gradeUniformSeen = 'n/a';

function applyColorGrade(mat, satVal, hueVal) {
  if (!mat) return false;
  /* ★ 诊断：材料类型不匹配会让整个调色静默失效（曾误以为锚点问题）。
     这里计数，启动后会打出来，一眼看出是"没挂上"还是"挂上了但不生效"。 */
  /* ★★★ 支持 MeshToonMaterial（2026-10-08）★★★
     ---- 为什么（曾出现"我调的饱和度针对 glb 模型不会生效"）----
     这里原来只放行 `MMDToonMaterial` —— 那是 MMD 专用的材质类型。
     而 **glTF 用的是 `MeshStandardMaterial`（PBR）**，于是整个调色
     被这一行静默跳过（只累加 _gradeTypeSkip 计数，不报错）。
     → 用户的饱和度/色相滑块对 glb 模型完全没反应。

     现在把可调色的材质扩成三类：
       · MMDToonMaterial    —— MMD 原生
       · MeshToonMaterial   —— 开了"三渲二"之后的 glTF
       · MeshStandardMaterial —— glTF 原生（PBR）
     ★ 注入点用的是 `#include <encodings_fragment>` 之后的 gl_FragColor，
       这三种材质的片元着色器**都有这个 chunk**，所以同一套注入对三者都成立。 */
  const gradeable = (mat.type === 'MMDToonMaterial')
    || mat.isMeshToonMaterial
    || mat.isMeshStandardMaterial;
  if (!gradeable) { _gradeTypeSkip++; return false; }
  if (!mat.userData.__gradeHooked) {
    mat.userData.__gradeHooked = true;

    const prev = mat.onBeforeCompile;
    mat.onBeforeCompile = function (shader, renderer) {
      if (prev) prev.call(this, shader, renderer);

      shader.uniforms.mmdSaturation = _gradeUniforms.sat;
      shader.uniforms.mmdHueShift  = _gradeUniforms.hue;
      shader.uniforms.mmdGradeDebug = _gradeUniforms.dbg;

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        '#include <common>\nuniform float mmdSaturation;\nuniform float mmdHueShift;\n'
          + 'uniform float mmdGradeDebug;\n'
          + GRADE_GLSL
      );

      /* ★ 注入点：必须在编码转换 【之后】
         （即 gl_FragColor 已被 linearToOutputTexel() 转成 sRGB）
         之前错插在它【之前】——那时还是 linear 值，HSV 按 sRGB 公式处理会把暗部压到 0，
         现象是脸/裙子全黑。
         ★ three r150 用 encodings_fragment；r152+ 改名为 colorspace_fragment。
           两个都试，都找不到就【记录计数】并回退到 output_fragment（保证不静默失效）。 */
      let cut = -1, tail = '', anchor = '';
      const tryAnchor = (tag) => {
        const at = shader.fragmentShader.indexOf('#include <' + tag + '>');
        if (at < 0) return false;
        const endOfChunk = shader.fragmentShader.indexOf('\n', at) + 1;
        cut = endOfChunk;
        tail = shader.fragmentShader.slice(endOfChunk);
        anchor = tag;
        return true;
      };
      if (!tryAnchor('encodings_fragment')
          && !tryAnchor('colorspace_fragment')
          && !tryAnchor('output_fragment')) {
        /* 连 output_fragment 都没有 → 退而求其次插在 main() 的最后一个 } 之前 */
        const lastBrace = shader.fragmentShader.lastIndexOf('}');
        if (lastBrace > 0) {
          cut = lastBrace; tail = shader.fragmentShader.slice(lastBrace);
          anchor = 'lastBraceFallback';
        }
      }
      if (cut >= 0) {
        shader.fragmentShader = shader.fragmentShader.slice(0, cut)
          + GRADE_APPLY + tail;
        _gradeHooked++;
        /* ★ 诊断：确认注入的代码是否真的出现在最终 shader 文本里。
           如果 hasCode=false，说明 replace/slice 没生效（字符串没匹配上）；
           如果 hasCode=true 但画面不变，那问题在 uniform 上传。 */
        _gradeShaderN++;
        _gradeHasCode = shader.fragmentShader.indexOf('mmd_rgb2hsv') >= 0
                     && shader.fragmentShader.indexOf('mmdSaturation') >= 0
                     && shader.fragmentShader.indexOf('gl_FragColor.rgb = mmd_hsv2rgb') >= 0;
        _gradeHasSatDecl = shader.fragmentShader.indexOf('uniform float mmdSaturation;') >= 0;
        _gradeUniformSeen = shader.uniforms.mmdSaturation
          ? String(shader.uniforms.mmdSaturation.value) : 'MISSING';
        if (_gradeShaderN <= 2) {
          nlog('colorGrade 注入: anchor=' + anchor
            + ' hasCode=' + _gradeHasCode
            + ' hasSatDecl=' + _gradeHasSatDecl
            + ' satUniform=' + _gradeUniformSeen
            + ' shaderLen=' + shader.fragmentShader.length);
        }
      } else {
        _gradeAnchorFail++;
        nerr('colorGrade: 找不到任何注入锚点，饱和度/色相将失效');
      }
    };
    mat.needsUpdate = true;
  }
  return true;
}

function applyColorGradeAll(mesh, satVal, hueVal) {
  const satChanged = Math.abs(_gradeUniforms.sat.value - satVal) > 1e-4
                  || Math.abs(_gradeUniforms.hue.value - hueVal) > 1e-4;
  _gradeUniforms.sat.value = satVal;
  _gradeUniforms.hue.value = hueVal;
  /* ★ 饱和度/色相变了 → 贴图取色的缓存全部失效（描边要跟着屏幕上的颜色走） */
  if (satChanged) {
    try {
      clearTextureColorCache();
      if (typeof refreshAutoOutlineColors === 'function') refreshAutoOutlineColors('grade');
    } catch (e) {}
  }
  _gradeTypeSkip = 0; _gradeAnchorFail = 0; _gradeHooked = 0;
  let n = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if (applyColorGrade(m, satVal, hueVal)) n++;
  });
  nlog('colorGrade: 目标材质 ' + n + ' 个 | 类型不符跳过 ' + _gradeTypeSkip
    + ' | 锚点失败 ' + _gradeAnchorFail + ' | 注入成功 ' + _gradeHooked
    + ' | sat=' + satVal);
  return n;
}

/* ============================================================
   ★ 跨页面同步饱和度/色相
   ------------------------------------------------------------
   问题：`饱和度` 滑块在「MMD 参数调整」页，它改的是【那个页面自己的 WebView】；
   而桌宠悬浮窗是【另一个 WebView】，收不到 → 用户对着桌宠调，怎么调都一样。
   做法：滑块变化时通过 JS 桥上报给原生，原生再转发给桌宠的 WebView。
   （桌宠自己那条 WebView 也会上报，但 __setColorGrade 是幂等的，无副作用。）
   ============================================================ */
window.__setColorGrade = function (sat, hue) {
  try {
    const s = parseFloat(sat);
    const h = parseFloat(hue);
    if (isFinite(s)) SAT_VALUE = Math.max(0, Math.min(5, s));
    if (isFinite(h)) HUE_VALUE = Math.max(-0.5, Math.min(0.5, h));
    if (model) applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);
    /* 同步 UI 上的滑块，避免"值已改但界面没动" */
    const se = $('sSat'), he = $('sHue');
    if (se) se.value = String(SAT_VALUE);
    if (he) he.value = String(HUE_VALUE);
    const sv = $('vSat'), hv = $('vHue');
    if (sv) sv.textContent = SAT_VALUE.toFixed(2);
    if (hv) hv.textContent = HUE_VALUE.toFixed(3);
    return 'ok';
  } catch (e) { return 'err:' + e.message; }
};

/* ============================================================
   ★ 名称翻译（只改 UI 显示，不动任何实际数据）
   ------------------------------------------------------------
   配件/表情名都是日文（きつね耳 / ★胸上げ / まばたき），用户看不懂。
   原生把 {原名: 中文} 的译文表下发过来，这里只用于【显示标签】：
     · 下拉框 option 的显示文字
     · 各处提示
   ★ 绝不改动 morphNames / morphIndex / 配件名单里的真实名字 ——
     否则存下来的配件设置、AI 调用、PMX 索引全都会对不上。
   ============================================================ */
let _nameTrans = {};

window.__setNameTranslations = function (json) {
  try {
    let obj = json;
    if (typeof json === 'string') {
      const v = JSON.parse(json);
      if (v && typeof v === 'object') obj = v;
    }
    _nameTrans = (obj && typeof obj === 'object') ? obj : {};
    nlog('nameTranslations: ' + Object.keys(_nameTrans).length + ' 条');
    /* 刷新表情下拉的显示文字（不动值） */
    try { refreshMorphList(); } catch (e) {}
    return Object.keys(_nameTrans).length;
  } catch (e) { return -1; }
};

/** 取某名称的显示文字：有译文就「中文(原名)」，否则原名。 */
function dispName(name) {
  const t = _nameTrans[name];
  if (!t) return name;
  return t + '(' + name + ')';
}

/* ============================================================
   ★ 锁定取景（禁用「缩放」「相机距离」「显示大小」）
   ------------------------------------------------------------
   自动取景（fitCameraToBox + correctCameraFromMask）已经算好了最佳的
   相机距离，手动一调就会覆盖它、破坏取景（模型忽大忽小 / 大量留白）。
   调好后锁上可避免误触。
   ★ 同时把控件置灰，让用户一眼看出"现在是锁着的"。
   ============================================================ */
let VIEW_LOCKED = false;

window.__setFitRatio = function (v) {
  const x = parseFloat(v);
  if (isFinite(x) && x >= 0.5 && x <= 1.0) {
    FIT_RATIO = x;
    nlog('fitRatio -> ' + FIT_RATIO.toFixed(2) + '（重新取景）');
    /* 立刻按新填充度重新取景，让用户马上看到效果 */
    try { resetFit('fit-ratio'); } catch (e) {}
  }
  return FIT_RATIO;
};

window.__setViewLock = function (on) {
  try {
    VIEW_LOCKED = !!on;
    const cb = $('cLockView');
    if (cb) cb.checked = VIEW_LOCKED;
    const ids = ['sScale', 'sDist'];
    for (const id of ids) {
      const el = $(id);
      if (!el) continue;
      el.disabled = VIEW_LOCKED;
      /* 视觉上也要能看出来（禁用的 input 默认只是变灰，加个透明度更明显） */
      el.style.opacity = VIEW_LOCKED ? '0.45' : '';
      const row = el.parentElement;
      if (row) row.style.opacity = VIEW_LOCKED ? '0.45' : '';
    }
    nlog('viewLock -> ' + VIEW_LOCKED + '（缩放/相机距离已' + (VIEW_LOCKED ? '禁用' : '启用') + '）');
    /* ★ 上报原生：锁定后它会自动把窗口形状适配成模型宽高比（消除横向留白） */
    try {
      if (window.MmdBridge && MmdBridge.setViewLock) MmdBridge.setViewLock(VIEW_LOCKED);
    } catch (e) {}
    return VIEW_LOCKED;
  } catch (e) { return false; }
};

/* ============================================================
   ★ 外观参数跨页面同步
   ------------------------------------------------------------
   桌宠悬浮窗和「MMD 参数调整」页是【两个独立 WebView】，
   各自渲染一份模型。在设置页调曝光/光照/镜面/toon 时，
   桌宠那份不会跟着变 —— 用户看到的就是"两边不同步"。
   做法：设置页把变化上报原生，原生转发给桌宠 WebView 应用。
   （此前只同步了饱和度/色相，所以只有它俩是同步的。）
   ============================================================ */
/**
 * ★★★ 跨 WebView 同步（设置页 ↔ 桌宠）★★★
 *
 * ---- 事故复盘（实测"打开高级设置、调描边宽度时，桌宠的描边宽度被换成大模型那份"）----
 * 病因不只在描边，是**所有**外观参数都有的通病：
 *   面板的控件是 `hook(...)` 挂上去的，而 `hook` 在**挂载那一刻**会立刻
 *   `upd(null)` 跑一次（为了让标签显示初始值），此时 `isUser = false`。
 *   而各个 hook 里对 `syncAppearance()` 的调用是**无条件**的 →
 *   于是**一打开高级设置页，它就用"DOM 默认值"把参数推给桌宠**，
 *   把桌宠自己存档里的值覆盖掉（默认值 → 用户看不出为什么变了）。
 *   随后 `applySettings` 才恢复本页的值，但那时已经推过一次了。
 *
 * → 修法：同步只允许发生在【用户真的改了】+【本页配置已就绪】时。
 *   · `_canSave` 在 applySettings 跑完后才置 true（见它的说明）
 *   · `_restoring` 覆盖恢复过程中靠 dispatch 事件触发的回调
 * ※ 这不是"少同步"，而是"别用默认值去覆盖别人"。
 */
function syncAppearance(key, val) {
  try {
    /* ★★ 绝对不要在这里判断 _canSave / _restoring ★★
       ---- 事故复盘（实测"在高级设置里调的似乎不会同步"）----
       我第一版为了"别用默认值覆盖另一端"，在这里加了
           if (!_canSave || _restoring) return;
       这是错的，理由有三：
         · `_restoring` 由 applySettings 的 finally 里 **setTimeout 900ms** 才清掉，
           而设置页打开时还要先等 boot 的 700ms → 前 1.6 秒内的任何操作都被吞掉；
         · 任何 early-return 路径都可能让 _restoring 卡住 → 同步永久失效；
         · 更根本的是：**不该在这一层判时机**。
       ---- 真正的判据在调用方 ----
       所有 hook 已经在用 `if (isUser) syncAppearance(...)`：
         · 初始化时 hook 会 `upd(null)` → isUser=false → 不同步
         · applySettings 靠 dispatch 合成事件赋值 → isTrusted=false → isUser=false → 不同步
       也就是说"别用默认值覆盖别人"这件事，`isUser` 已经精确完成了。
       这里再加一道时间闸门只会把正常操作也挡掉。 */
    if (!window.MmdBridge || !MmdBridge.appearance) return;
    MmdBridge.appearance(key, String(val));
  } catch (e) {}
}

/** 由原生转发过来时调用：按 key 应用单个外观参数。 */
window.__applyAppearanceKV = function (key, val) {
  try {
    const n = parseFloat(val);
    switch (key) {
      case 'outlineW': {
        window.__setOutlineWidth(val);
        const so = $('sOutline'), vo = $('vOutline');
        if (so) so.value = String(OUTLINE_W);
        if (vo) vo.textContent = String(Math.round(OUTLINE_W));
        break;
      }
      case 'outline': {
        window.__setOutline(String(val) === '1' || String(val) === 'true');
        const co = $('cOutline');
        if (co) co.checked = OUTLINE_ON;
        break;
      }
      case 'toon2dlv': {
        window.__setToon2DLevel(val);
        break;
      }
      case 'wind': {
        WIND_STRENGTH = isFinite(n) ? n : 0;
        const sw = $('sWind'), vw = $('vWind');
        if (sw) sw.value = String(Math.round(WIND_STRENGTH));
        if (vw) vw.textContent = String(Math.round(WIND_STRENGTH));
        break;
      }
      case 'allbodies': {
        /* ★ 全量刚体开关需要重建物理才生效 —— 这里提示而不偷偷重建 */
        nlog('外观同步: allbodies=' + val + '（需重载模型才生效）');
        break;
      }
      case 'toon2d': {
        const want2 = (String(val) === '1' || String(val) === 'true');
        applyToon2D(want2);
        const c2 = $('cToon2D');
        if (c2) c2.checked = TOON2D_ON;
        break;
      }
      case 'outlineD2':
      case 'outlineD': {
        OUTLINE_DEPTH = isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : 60;
