        const sd = $('sOutlineD'), vd = $('vOutlineD');
        if (sd) sd.value = String(OUTLINE_DEPTH);
        if (vd) vd.textContent = String(OUTLINE_DEPTH);
        refreshAutoOutlineColors('sync');
        break;
      }
      case 'outlineA': {
        window.__setOutlineAlpha(val);
        const sa = $('sOutlineA'), va = $('vOutlineA');
        if (sa) sa.value = String(Math.round(OUTLINE_ALPHA * 100));
        if (va) va.textContent = Math.round(OUTLINE_ALPHA * 100) + '%';
        break;
      }
      case 'outlineC': {
        window.__setOutlineColor(val);
        break;
      }
      case 'physics': {
        const want = (String(val) === '1' || String(val) === 'true');
        window.__setPhysics(want);
        const cpb = $('cPhysics');
        if (cpb) cpb.checked = want;
        break;
      }
      case 'key': key.intensity = n; break;
      case 'rim': rim.intensity = n; break;
      case 'amb': {
        const a = scene.children.find(o => o.isAmbientLight);
        if (a) a.intensity = n;
        break;
      }
      case 'exp': renderer.toneMappingExposure = n; break;
      case 'sat': SAT_VALUE = n; if (model) applyColorGradeAll(model, SAT_VALUE, HUE_VALUE); break;
      case 'hue': HUE_VALUE = n; if (model) applyColorGradeAll(model, SAT_VALUE, HUE_VALUE); break;
      case 'spec':
        /* 与面板 hook 完全一致的算法：直接改材质的 specular */
        if (model) model.traverse(o => {
          const ms = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
          ms.forEach(m => { if (m && m.specular && m.specular.isColor) m.specular.setScalar(n); });
        });
        break;
      case 'toon':
        _toonStops = [n, Math.min(255, n + 57), Math.min(255, n + 97), 252].sort((a, b) => a - b);
        if (model) applyToonGradient(model, _toonStops);
        break;
      case 'gazeAmp': GAZE_AMP = n; break;
      default: return 'unknown-key';
    }
    /* 同步本页 UI（避免界面与实际不一致） */
    const map = { key: 'sKey', rim: 'sRim', amb: 'sAmb', exp: 'sExp', sat: 'sSat',
                  hue: 'sHue', spec: 'sSpec', toon: 'sToon', gazeAmp: 'sGaze' };
    const el = map[key] ? $(map[key]) : null;
    if (el && el.value !== String(val)) el.value = String(val);
    nlog('applyAppearanceKV ' + key + '=' + val);
    return 'ok';
  } catch (e) { return 'err:' + e.message; }
};

function enableMorphSupport(mesh) {
  let n = 0;
  mesh.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if (enableMorphOnMaterial(m)) n++;
  });
  nlog('enableMorphSupport: patched ' + n + ' MMDToonMaterial(s)');
  return n;
}

function rebuildMorphMap() {
  morphNames = [];
  morphIndex = {};
  morphMeshes = [];
  /* ★ 换模型必须清掉"上次应用过的表情"记录。
     否则 (a) 早退闸门会误判"内容没变"而跳过，
     (b) _activeExprBones 里还留着旧模型的 Bone 对象（已失效），
         复位时会对废弃对象操作。 */
  _lastApplySig = '';
  _lastVertexLog = '';
  _lastBoneLog = '';
  _userExpr = [];
  _blinkNames = [];
  _blinkW = 0;
  _blinkPhase = -1;
  _activeExprBones = [];
  _boneBackup = null;
  /* ★★ 绝不能在这里无条件清 _matBase！
     ---- 事故复盘（实测"耳朵/尾巴/鞋子关不掉"）----
     refreshMorphList() 会调用 rebuildMorphMap()，而下发翻译时
     （__setNameTranslations → refreshMorphList）配件往往【正开着】。
     原来这里 `_matBase = null` 后立刻重新捕获，
     结果把"配件开启状态（opacity=1）"当成了【基础值】，
     之后关闭配件时复位又设回 1 → 配件永远关不掉。
     → 改由 captureMaterialBase() 按"是否同一个模型"决定要不要重捕。 */
  /* ★ 必须同时清掉眨眼表情的缓存！
     ---- 事故复盘（2026-10-05，Kei 表现为"眨眼时眼珠往下沉"）----
     blinkExpressions() 有缓存，而它会被【心跳日志】在模型就绪前先调用一次，
     那时 morphIndex 还是空的 → 缓存下 []（空数组）。
     而 [] 是 truthy，于是之后永远返回空 → 找不到模型本来有的 まばたき，
     眨眼退化成"转眼球"（眼珠往下沉）。
     ★ 换模型时必须清掉，否则换了模型也一直用旧结果。 */
  _blinkExprsCache = null;
  _blinkExprsFor = null;
  if (!model) return;

  model.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const mt = o.geometry.morphTargets;
    if (!mt || !mt.length) return;
    if (!o.morphTargetInfluences || !o.morphTargetInfluences.length) return;

    morphMeshes.push(o);
    if (morphNames.length === 0) {
      mt.forEach((t, i) => {
        const nm = (t && t.name) || ('morph' + i);
        if (morphIndex[nm] === undefined) {
          morphIndex[nm] = i;
          morphNames.push(nm);
        }
      });
    }
  });
  // ★ 关键：必须先给材质打开 morph shader 支持，否则设了也不动
  if (model) enableMorphSupport(model);

  /* ★ 材质基础状态必须在【这里】捕获，不能放在模型加载的调用方。
     原因：本函数会把 _matBase 清空（换模型必须重置），
     而它在 boot/__loadModel 里的调用点【晚于】那些地方，
     所以放在外面捕获等于白做（会被这里清掉）。
     放在末尾可以保证"材质就绪"与"基础值记录"顺序永远正确。 */
  captureMaterialBase();

  /* ★ 骨骼快照必须在【这里】立即建立（模型刚加载完、物理还没跑过 update）。
     否则快照会在"第一次应用表情"时才建 —— 那时物理可能已经改动过骨骼，
     快照就会记录到"被污染的姿态"，之后每次复位都会把骨骼拉回那个错误值。 */
  snapshotBones();

  /* ★ 分类"面部表情"与"装备/动作类"。
     ★ 注意：这里【只用作 AI 选表情时的提示】，不限制轮播 ——
       用户明确表示那些动作/装备类 morph 正是他想要的（"奔着动作去的"）。
       穿模从根上解决：表情不复位被物理绑定的骨骼（physBoneNames）。 */
  faceMorphNames = [];
  const mesh0 = morphMeshes[0];
  if (mesh0) {
    for (const nm of morphNames) {
      if (isFaceMorph(nm, mesh0, morphIndex[nm])) faceMorphNames.push(nm);
    }
  }
  nlog('morph 分类（仅供参考，不限制轮播）: 共 ' + morphNames.length
    + ' 个，其中面部表情 ' + faceMorphNames.length + ' 个');

  /* ★ 配件分类：装备/部件开关单独成组。
     判据 = 名字特征 + 数据特征（是否在"打开默认隐藏的材质"），
     单靠名字会漏（★胸上げ / 足ポーズ / OFFシャツ 这类都漏过）。
     配件不进表情下拉、不进表情 MCP，改由"配件"页与配件工具管理。 */
  accessoryMorphNames = morphNames.filter(isAccessory);
  /* 清掉已启用列表里"这个模型没有"的项（换模型后不会残留无效状态） */
  _accNames = _accNames.filter(n => accessoryMorphNames.indexOf(n) >= 0);
  nlog('配件 ' + accessoryMorphNames.length + ' 个: '
    + accessoryMorphNames.slice(0, 12).join('/')
    + (accessoryMorphNames.length > 12 ? ' …' : ''));
  window.__faceMorphNames = faceMorphNames.slice();
  window.__gearMorphNames = morphNames.filter(n => faceMorphNames.indexOf(n) < 0);

  nlog('morph map: ' + morphNames.length + ' targets on '
     + morphMeshes.length + ' mesh(es)');
}

/** 设置某个表情的权重（0..1）。name 为空表示全部归零。 */
/* ==================================================================
   ★ 表情实现的两种类型（本项目最关键的一个认知）
   ------------------------------------------------------------------
   PMX 表情(expression)有两种实现方式，MMDLoader 把两者混在一起给我们，
   但必须分开处理：

   A)【顶点型】morph target 有真实位移数据
      做法：mesh.morphTargetInfluences[i] = 0..1
      本模型的 100.001~100.005（光环/头饰）属于这一类。

   B)【骨骼型】morph 的顶点位移【全为 0】，真实效果是驱动骨骼
      做法：按 PMX expression 的 bone 影响关系手动转骨骼。
      本模型的 笑い/ウィンク/なごみ/あ/え/い 全部属于这一类。

   实测证据（analyzeMorphs，21571 顶点）：
      100.001 : max=0.508, verts=543/21571 (2.5%)   <- 顶点型
      笑い    : max=0.000, verts=0/21571    (0.0%)   <- 骨骼型
   → 对骨骼型表情，光设 morphTargetInfluences 完全无效。
     这就是之前"表情只有光环变"的真正原因：不是 bug，是用错了机制。

   注意：MMDLoader 解析后没有暴露 expression 的骨骼映射
   （model.expressions 为 undefined），所以这里用【表情名->骨骼名】
   的语义约定来匹配模型实际骨骼名，兼容多种常见命名。
   ================================================================== */
/* 表情名 -> 应驱动的骨骼组。
   ★ 这里必须用【本模型实际存在的骨骼名】，否则一条都匹配不上（踩过）。
     本模型的嘴部骨骼实测为：
       UpL / UpC / UpR        上唇 左/中/右
       DownL / DownC / DownR  下唇 左/中/右
       TeethUp / TeethDown    上下牙
     加上通用命名(口/mouth)做兼容，换模型时一般也能命中。 */
const EXPR_BONE_RULES = [
  // 眨眼 —— 用眼睑骨骼（此时动眼睑是正确的）
  { expr: /ウィンク|blink|まばたき/i,
    bone: /EyeL[UD]|EyeR[UD]|まばたき|eyelid|lash/i, amp: 0.9, axis: 'lid' },

  // 笑 / 微笑：嘴角上扬 = 上唇上抬 + 下唇下压
  { expr: /笑い|smile|にっこり|なごみ/i,
    bone: /Up[LCR]|口|mouth|smile|笑/i, amp: 0.35, axis: 'up' },
  { expr: /笑い|smile|にっこり|なごみ/i,
    bone: /Down[LCR]/i, amp: -0.25, axis: 'down' },

  // 口型 あ/え/い/お：张嘴 / 咧嘴
  { expr: /^あ$|^a$|あ2/i, bone: /Up[LCR]|口|mouth/i,   amp:  0.30, axis: 'up' },
  { expr: /^あ$|^a$|あ2/i, bone: /Down[LCR]|TeethDown/i, amp: -0.40, axis: 'down' },
  { expr: /^え$|^e$/i,    bone: /Up[LCR]/i,             amp:  0.20, axis: 'up' },
  { expr: /^え$|^e$/i,    bone: /Down[LCR]/i,           amp: -0.25, axis: 'down' },
  { expr: /^い$|^i$/i,    bone: /Up[LCR]|Down[LCR]/i,   amp:  0.15, axis: 'up' },
  { expr: /^お$|^o$/i,    bone: /Up[LCR]/i,             amp: -0.25, axis: 'up' },
  { expr: /^お$|^o$/i,    bone: /Down[LCR]/i,           amp:  0.25, axis: 'down' },
];

function bonesForExpression(name) {
  const res = [];
  if (!model || !name) return res;
  // 一个表情可能对应多条规则（如上唇+下唇），全部收集
  const rules = EXPR_BONE_RULES.filter(r => r.expr.test(name));
  if (!rules.length) return res;
  const seen = new Set();
  for (const rule of rules) {
    model.traverse(o => {
      if (o.isBone && o.name && rule.bone.test(o.name) && !seen.has(o)) {
        seen.add(o);
        // amp 带符号：正值抬、负值压
        res.push({ bone: o, amp: rule.amp, axis: rule.axis });
      }
    });
  }
  return res;
}

/* ============================================================
   PMX 表情（morph）的真实解析
   ------------------------------------------------------------
   ★ 为什么必须这么做（这是"眨眼把眼眶拉得老高"的根因）：
     three.js 的 MMDLoader 对 morph.type === 2（bone morph）只有
     一句 "// TODO: implement" —— 骨骼型表情在 three.js 侧【完全没有数据】。
   ★ 更大的一课（2026-10-05 第三次踩坑）：
     同一个 PMX 里的 16 个表情分属【四种完全不同的类型】，
     只处理其中一种，就会表现为"有的表情能用、有的完全没反应"：
       type 1 vertex    100.001~100.005  光环      ← 本来就能用
       type 2 bone      あ/え/い/あ2/ウィンク/ウィンク右
       type 0 group     笑い（= ウィンク+ウィンク右 的组合）  ← 必须递归展开
       type 8 material  Close/Off/なごみ/はぅ（靠 alpha 换脸） ← 必须实现
     AI 通过 MCP 选到 material 类表情时，因为没实现 → 脸一动不动，
     而顶点类的光环照常变化 → 用户看到的正是"只有光环会动"。
   ★ 做法：加载模型时顺带 fetch 同一个 .pmx，用 MMDParser 解析一次，
     把 group 递归展开成三种可执行效果，缓存为 morphEffects。
   ============================================================ */
let morphBoneMap = null;      // 兼容旧引用：name -> 骨骼元素数组（已展开 group）
let morphEffects = null;      // name -> { vertex:[idx], bones:[...], materials:[...] }

/**
 * ★ 被物理刚体绑定的骨骼名集合。
 *
 * ---- 为什么需要排除它们（"走路/眨眼穿模"的根因，2026-10-05）----
 * 实测 Kei_Uniform：270 个刚体，其中 55 个 type=0（运动学，从骨骼读姿态）。
 * 而骨骼型表情驱动的 22 根骨骼里，有 5 根【同时】被物理刚体绑定：
 *     左胸支え / 右胸支え / しっぽ支 / 左ひじ / 右ひじ
 * 这些骨骼是尾巴、胸部、手臂物理链的【支撑点】。
 * 而 reapplyExpressions() 在每次切换表情时会 restoreBone() 把它们【瞬间拉回快照值】，
 * 物理链被猛拉 → 穿模。眨眼（每 3~11 秒）和表情轮播（每 1.2 秒）都会触发，
 * 所以表现为"眨眼/开轮播时穿模概率大幅上升"。
 * ★ 结论：这些骨骼归物理管，表情不要碰。
 */
let physBoneNames = new Set();
/** 物理接管【之前】被刚体绑定骨骼的姿态快照（关掉物理时恢复用）。 */
let _physBoneSnapshot = null;

/** 骨骼名 -> Bone 对象（模型加载后重建）。 */
let boneByName = new Map();
function rebuildBoneIndex() {
  boneByName = new Map();
  if (!model) return;
  model.traverse(o => {
    if (o.isBone && o.name && !boneByName.has(o.name)) boneByName.set(o.name, o);
  });
  nlog('boneIndex: ' + boneByName.size + ' bone(s)');
}

/**
 * 把 morph（含 group）递归展开成"可执行效果"。
 * group 的 elements 引用的是【其它 morph 的索引】+ ratio，
 * 需要按 ratio 带权展开，这是 MMD 的组合表情机制。
 */
function flattenMorph(morphs, bones, index, weight, out, depth) {
  if (depth > 6) return;                       // 防环
  const m = morphs[index];
  if (!m || !m.elements) return;

  if (m.type === 1) {                          // vertex
    /* ★★ 必须记【morph 索引】(index)，绝不是顶点索引 (e.index)！
       ---- 事故复盘（2026-10-05，实测"ONXXX 那些配件看不出效果"）----
       顶点型 morph 的 elements[].index 是"被改动的【顶点】编号"（0~7万），
       而 morphTargetInfluences 是按【morph】索引寻址的（本模型只有 189 个）。
       原来把顶点索引当 morph 索引用 → 几乎全部被 `i < inf.length` 过滤掉
       → 【所有顶点型表情/配件都失效】，包括：
         光环 100.001~005、ON_ハートニプレス、ON肌色ニプレス、ON_メガネ、ON上絆創膏…
       这与用户"那些 ONXXX 的看不出效果"完全吻合（它们恰好都是顶点型）。 */
    out.vertex.push({ morphIdx: index, w: weight });
    return;
  }
  if (m.type === 2) {                          // bone
    for (const e of m.elements) {
      const b = bones[e.index];
      if (!b) continue;
      out.bones.push({
        boneName: b.name,
        position: e.position || null,
        rotation: e.rotation || null,
        w: weight
      });
    }
    return;
  }
  if (m.type === 8) {                          // material
    for (const e of m.elements) {
      out.materials.push({
        index: e.index,
        op: e.type,                            // 0=乘算 1=加算
        diffuse: e.diffuse || null,
        w: weight
      });
    }
    return;
  }
  if (m.type === 0) {                          // group → 递归
    for (const e of m.elements) {
      const r = (e.ratio === undefined || e.ratio === null) ? 1 : e.ratio;
      flattenMorph(morphs, bones, e.index, weight * r, out, depth + 1);
    }
  }
}

async function loadMorphBoneMap(url) {
  morphBoneMap = null;
  morphEffects = null;
  if (!url || !/\.pmx$/i.test(url)) {
    nlog('morphEffects: skip (非 .pmx)');
    return null;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    const data = new MMDParser.Parser().parsePmx(buf, true);
    const bones = data.bones || [];
    const morphs = data.morphs || [];

    /* ★ 收集被物理刚体绑定的骨骼（见 physBoneNames 的说明）。
       这些骨骼归物理管，表情不能去复位它们，否则会拽断物理链导致穿模。 */
    physBoneNames = new Set();
    for (const rb of (data.rigidBodies || [])) {
      const bi = rb.boneIndex;
      if (bi === undefined || bi < 0 || !bones[bi]) continue;
      physBoneNames.add(bones[bi].name);
    }
    nlog('physBones: ' + physBoneNames.size + ' 根骨骼被刚体绑定'
      + '（共 ' + (data.rigidBodies || []).length + ' 个刚体）');

    const effects = {};
    const boneMap = {};
    const TYPE = { 0: 'group', 1: 'vertex', 2: 'bone', 3: 'uv', 8: 'material' };
    const byType = {};
    for (let i = 0; i < morphs.length; i++) {
      const t = morphs[i].type;
      byType[TYPE[t] || ('t' + t)] = (byType[TYPE[t] || ('t' + t)] || 0) + 1;
      const out = { vertex: [], bones: [], materials: [] };
      flattenMorph(morphs, bones, i, 1, out, 0);
      effects[morphs[i].name] = out;
      if (out.bones.length) boneMap[morphs[i].name] = out.bones;
    }
    morphEffects = effects;
    morphBoneMap = boneMap;

    const names = Object.keys(effects);
    nlog('morphEffects: ' + names.length + ' morph(s) 类型分布='
      + JSON.stringify(byType));
    /* 逐个说明它到底能驱动什么 —— 排查"某表情没反应"时看这一行 */
    for (const n of names) {
      const e = effects[n];
      if (!e.vertex.length && !e.bones.length && !e.materials.length) continue;
      nlog('  morph «' + n + '» vertex=' + e.vertex.length
        + ' bone=' + e.bones.length + ' material=' + e.materials.length);
    }
    return morphBoneMap;
  } catch (e) {
    nerr('morphEffects failed: ' + (e && e.message));
    morphBoneMap = null;
    morphEffects = null;
    return null;
  }
}

/* 骨骼原位备份，便于切换表情时复位。
   ★ 必须同时备份 position 和 quaternion：
     骨骼型表情既会平移骨骼也会旋转骨骼，而 PMX 给的是【四元数】。
     只备份 rotation 既复位不干净，又逼得后续用欧拉角硬加 ——
     这正是眼眶被越拉越高、表情映射错乱的原因之一。 */
let _boneBackup = null;
function snapshotBones() {
  if (_boneBackup) return;
  _boneBackup = new Map();
  model.traverse(o => {
    if (o.isBone) _boneBackup.set(o, {
      p: o.position.clone(),
      q: o.quaternion.clone()
    });
  });
}

/** 把某根骨骼复位到备份状态（position + 四元数一起还原）。 */
function restoreBone(b) {
  const s = _boneBackup && _boneBackup.get(b);
  if (!s) return;
  b.position.copy(s.p);
  b.quaternion.copy(s.q);
}

/* 记录每个表情是否"骨骼型"（顶点位移为 0） */
const _boneExprCache = new Map();
function isBoneExpression(name) {
  if (_boneExprCache.has(name)) return _boneExprCache.get(name);
  const idx = morphIndex[name];
  let bone = false;
  const geo = morphMeshes[0] && morphMeshes[0].geometry;
  const a = geo && geo.morphAttributes && geo.morphAttributes.position
              && geo.morphAttributes.position[idx];
  const base = geo && geo.attributes && geo.attributes.position;
  if (a && base) {
    const n = Math.min(2000, base.count);
    let moved = false;
    for (let v = 0; v < n; v++) {
      if (Math.abs(a.getX(v) - base.getX(v)) > 1e-6
        || Math.abs(a.getY(v) - base.getY(v)) > 1e-6
        || Math.abs(a.getZ(v) - base.getZ(v)) > 1e-6) { moved = true; break; }
    }
    bone = !moved;
  }
  _boneExprCache.set(name, bone);
  return bone;
}

let _activeExprBones = [];

/**
 * 应用表情：顶点型走 morphTargetInfluences，骨骼型手动转骨骼。
 * name 为空表示复位。
 */
/* ============================================================
   表情分层
   ------------------------------------------------------------
   ★ 这个分层是必须的，踩过一次：
     最初眨眼直接调 setMorph(['ウィンク','ウィンク右'], w)，
     而 setMorph 开头会把**所有顶点型 morph 清零** ——
     于是自动眨眼每几秒就抹一次用户表情，
     表现是"表情全用不了，连光环（顶点型）都不会变了"。
   ★ 现在拆成两层，互不干扰：
     · _userExpr   面板/AI 选的表情 —— 持久保留，眨眼不动它
     · _blinkNames 眨眼的骨骼叠加层 —— 只作用骨骼，且不碰顶点型
   ============================================================ */
let _userExpr = [];      // 用户当前表情（名数组）
let _userExprW = 1;      // 权重
let _blinkNames = [];    // 眨眼叠加（骨骼）
let _blinkW = 0;

function setMorph(name, weight) {
  /* ★ glTF：走独立的 morph target 路径（没有 MMD 的 morphEffects） */
  if (isGltfModel) { setMorphGLB(name, weight); return; }
  if (!morphMeshes.length) return;
  _userExpr = Array.isArray(name) ? name.filter(Boolean) : (name ? [name] : []);
  _userExprW = (weight === undefined) ? 1 : weight;
  reapplyExpressions();
}

/**
 * 记录"应用表情"的耗时。
 * ★ 只有超过 4ms 才打印 —— 正常应该 <1ms，打印出来的就是真问题。
 * 若这里显示很快、但用户仍感觉卡，那卡顿就在 three.js 内部
 * （morph 非零集合变化会导致整张 morph 贴图重传，见下面 renderInner 的帧计时）。
 */
let _exprCostLogged = 0;
let _lastExprCostMs = 0;
/** 帧耗时统计（用于定位"眨眼卡顿"）。 */
let _frameCostAcc = 0, _frameCostN = 0, _frameT0 = 0;
function _logExprCost(t0, nVtx, nBone, nMat) {
  const ms = performance.now() - t0;
  _lastExprCostMs = ms;
  if (ms > 4 || nVtx > 0 || nBone > 0 || nMat > 0) {
    if (_exprCostLogged++ < 30 || ms > 30) {
      nlog('exprApply ' + ms.toFixed(1) + 'ms  vertex=' + nVtx
        + ' bone=' + nBone + ' mat=' + nMat);
    }
  }
}

/** 按"用户表情 + 眨眼叠加"重新计算一次最终效果。 */
let _lastApplySig = '';
function reapplyExpressions() {
  if (!morphMeshes.length) return;

  /* ★ 幂等早退：眨眼/配件期间本函数会被频繁调用，
     而绝大多数帧的内容和上一帧完全一样 —— 没必要重算。
     ★★ 签名必须包含【配件】(_accNames)！
     ---- 事故复盘（实测"开关部件不会立即生效"）----
     原来签名只有 用户表情 + 眨眼，配件不在里面。
     于是"只切换配件"时签名不变 → 直接 return → 配件根本没被应用。
     表现为"点了开关没反应，要等其它操作触发重算才生效"。 */
  const sig = _userExpr.join('|') + '#' + _userExprW + '#' + _blinkNames.join('|') + '#' + _blinkW
    + '#' + _accNames.join('|');
  if (sig === _lastApplySig) return;
  _lastApplySig = sig;

  /* ★ 性能计时：实测"每次眨眼都卡一下"。
     这里量出"应用表情"本身耗时；如果它很快，那卡顿就在别处
     （例如 three.js 因 morph 非零集合变化而重传整张 morph 贴图）。 */
  const _t0 = performance.now();
  let _nVtx = 0, _nBone = 0, _nMat = 0;

  const jobs = [];
  for (const n of _userExpr) jobs.push({ n: n, w: _userExprW });
  for (const n of _blinkNames) jobs.push({ n: n, w: _blinkW });
  /* ★ 配件也一起合成 —— 它们是"长期开关"，权重固定 1。
     放在最后：这样配件自带的表情（如 ★セットアップ 组合表情）会覆盖同材质的其它来源。 */
  for (const n of _accNames) jobs.push({ n: n, w: 1 });

  /* ---------- 汇总三类效果（顶点 / 骨骼 / 材质） ----------
     ★ 必须三类都算：同一个 PMX 里 16 个表情分属四种类型，
       只处理一种就会出现"有的表情能用、有的完全没反应"。
       （AI 选到 material 类表情时"脸一动都不动"，就是这个原因。） */
  const vtx = new Map();       // morph 索引 -> 权重
  const boneJobs = [];
  const matJobs = [];
  const seenBone = new Set();
  let usedPmx = false;

  for (const job of jobs) {
    if (!job.n) continue;
    const eff = (morphEffects && morphEffects[job.n]) || null;
    if (eff) {
      usedPmx = true;
      for (const v of eff.vertex) {
        const w = v.w * job.w;
        /* ★ 用 morph 索引（morphIdx）；兼容旧字段 idx 以防缓存里是旧结构。
           （顶点索引在这里用是错的，见 flattenMorph 里的说明。） */
        const mi = (v.morphIdx !== undefined) ? v.morphIdx : v.idx;
        if (w > (vtx.get(mi) || 0)) vtx.set(mi, w);
      }
      for (const b of eff.bones) {
        /* 多表情驱动同一根骨骼时，先到先得（眨眼叠加不会被用户表情重复累加） */
        if (seenBone.has(b.boneName)) continue;
        seenBone.add(b.boneName);
        boneJobs.push({ boneName: b.boneName, position: b.position,
                        rotation: b.rotation, w: b.w * job.w });
      }
      for (const m of eff.materials) {
        matJobs.push({ index: m.index, op: m.op, diffuse: m.diffuse, w: m.w * job.w });
      }
    } else {
      /* 非 PMX（拿不到 morphEffects）时退回按名字索引顶点 morph */
      const i = morphIndex[job.n];
      if (i !== undefined) vtx.set(i, Math.max(vtx.get(i) || 0, job.w));
    }
  }

  /* ---------- ① 顶点型 ---------- */
  for (const m of morphMeshes) {
    const inf = m.morphTargetInfluences;
    if (!inf) continue;
    for (let i = 0; i < inf.length; i++) inf[i] = 0;
    for (const [i, w] of vtx) if (i < inf.length) inf[i] = w;
  }
  /* 顶点型诊断：确认光环这类表情真的被写进去了（之前"表情全失效"就是这里没生效）。
     ★ 判重键【不含眨眼权重】：眨眼时 _blinkW 每帧都变，
       若把它算进键里，眨眼期间会每帧打一条日志（实测刷屏）。 */
  const userSig = _userExpr.join(',') + '#' + _userExprW;
  if (_lastVertexLog !== userSig) {
    _lastVertexLog = userSig;
    nlog('expr(vertex) [' + _userExpr.join(',') + '] w=' + _userExprW
      + ' -> idx=[' + Array.from(vtx.keys()).join(',') + '] meshes=' + morphMeshes.length);
  }

  /* ---------- ② 骨骼型 ---------- */
  for (const b of _activeExprBones) restoreBone(b);
  _activeExprBones = [];
  if (boneJobs.length) {
    snapshotBones();
    for (const j of boneJobs) applyBoneMorph([j], j.w);
  }

  /* ---------- ③ 材质型（Close/Off/なごみ/はぅ 这类"换脸"表情靠 alpha） ---------- */
  applyMaterialMorphs(matJobs);

  if (boneJobs.length || matJobs.length) {
    /* ★ 判重键同样不含眨眼权重，否则眨眼期间每帧一条日志 */
    const tag = _userExpr.join('+')
      + (_blinkNames.length ? ' [blink:' + _blinkNames.join('+') + ']' : '');
    if (_lastBoneLog !== tag) {
      _lastBoneLog = tag;
      nlog('expr(pmx) ' + tag + ' -> bone=' + boneJobs.length
        + ' material=' + matJobs.length
        + (boneJobs.length ? ' [' + boneJobs.slice(0, 4).map(x => x.boneName).join(',') + ']' : '')
        + (matJobs.length ? ' [mat:' + matJobs.map(x => x.index).join(',') + ']' : ''));
    }
    _logExprCost(_t0, vtx.size, boneJobs.length, matJobs.length);
    return;
  }

  /* ---------- 兜底：只在【完全拿不到 PMX 数据】时才用"猜骨骼名"的老办法 ----------
     ★ 有 morphEffects 就绝不用猜：否则 material 类表情（如 なごみ）
       会被正则误匹配到嘴部骨骼，做出完全错误的效果。
     ★ 先算 targets 再决定要不要动：没有匹配规则就什么都不做。
       原来无条件进这个分支并打印日志，导致顶点型表情（如光环 100.002）
       每帧都白跑一遍全模型遍历，日志也被刷爆。 */
  if (usedPmx) return;
  const fallbackName = _userExpr[0];
  if (!fallbackName || !isBoneExpression(fallbackName)) return;
  const targets = bonesForExpression(fallbackName);
  if (!targets.length) return;              // 没有匹配到骨骼 → 静默跳过
  snapshotBones();
  for (const t of targets) {
    /* ★ 兜底是"猜骨骼名"，更容易误中物理骨骼 —— 同样要跳过 */
    if (physBoneNames.has(t.bone.name)) continue;
    /* 按部位用不同的旋转轴：
       up/down（唇）—— 主要绕 X（张口方向）
       lid（眼睑）  —— 主要绕 X（闭眼方向） */
    const a = t.amp * _userExprW;
    if (t.axis === 'lid') {
      t.bone.rotation.x += a;
    } else {
      t.bone.rotation.x += a * 0.8;
      t.bone.rotation.z += a * 0.3;
    }
    _activeExprBones.push(t.bone);
  }
  nlog('expr(bone/fallback) ' + fallbackName + ' -> ' + targets.length + ' bone(s): '
    + targets.slice(0, 5).map(t => t.bone.name).join(','));
}

/* ============================================================
   材质表情（PMX morph type 8）
   ------------------------------------------------------------
   机制：按 alpha 在多个材质之间"换脸"。
     实测 arona：材质 1(Face)/2(Eye) 基础 alpha=1（睁眼，可见），
                 材质 3(FaceBase)/5~8(新規材質) 基础 alpha=0（隐藏）。
     Close  = 把 1,2 的 alpha 偏移 -1 → 藏掉睁眼；把 3,8 偏移 +1 → 亮出闭眼
     なごみ = 同理亮出材质 7（腮红）
   ★ 运算规则（PMX 的 isAdd 语义，op 就是 PMX 存的那个字段）：
       op=0（乘算）: new = base * (1 + w * offset)
       op=1（加算）: new = base + w * offset
     验证：Close 对材质1 是 base=1, offset=-1, op=1(加算) → 1+1*(-1)=0 ✓ 藏掉
           对材质 8 是 base=0, offset=+1, op=1(加算) → 0+1*1=1 ✓ 亮出
   ============================================================ */
/** 材质基础状态（模型加载时记录；材质表情都是在这个基础上加/乘）。 */
let _matBase = null;
/** 上面这份基础值是为【哪个模型对象】记录的（换模型要重捕、同模型要保留）。 */
let _matBaseFor = null;

function captureMaterialBase() {
  if (!model) { _matBase = null; _matBaseFor = null; return; }
  const mats = Array.isArray(model.material)
    ? model.material : (model.material ? [model.material] : []);

  /* ★★ 同一个模型已经捕获过就【直接保留】，绝不重新捕获！
     ---- 事故复盘（实测"耳朵/尾巴/鞋子关不掉"）----
     captureMaterialBase() 会经由 refreshMorphList → rebuildMorphMap 被反复调用，
     而下发翻译时（__setNameTranslations → refreshMorphList）配件往往【正开着】。
     若此时重捕，会把"开启状态（opacity=1）"记成【基础值】，
     之后关闭配件时复位又设回 1 → 配件永远关不掉（用户看到的就是"点了没反应"）。
     ★ 只有换了模型对象（材质数也可能不同）才需要重新记录。 */
  if (_matBase && _matBaseFor === model && _matBase.length === mats.length) {
    return;
  }

  _matBase = mats.map(m => ({
    opacity: m.opacity,
    transparent: m.transparent,
    visible: m.visible,
    /* ★ 必须一起记录 depthWrite！
       之前这里没记 depthWrite，而 applyMaterialMorphs 里有一句
       "变透明就 depthWrite = false"。于是任何一次材质表情把材质变透明，
       depthWrite 就被永久写成 false —— 之后即使恢复完全不透明也不再写深度，
       表现为"透明、能看穿到身体"。 */
    depthWrite: m.depthWrite,
    alphaTest: m.alphaTest
  }));
  _matBaseFor = model;
  nlog('matBase: ' + mats.length + ' material(s), alpha='
    + _matBase.map(b => b.opacity.toFixed(2)).join(','));
}

/** 上次是否真的应用过材质表情（用于跳过无意义的复位）。 */
let _matApplied = false;

/**
 * 按需转储材质状态（诊断"某部件透明/看不见"用）。
 * 会标出：不透明但 depthWrite=false 的材质（= 会"透出下层"的元凶）。
 */
window.__dumpMats = function (filter) {
  try {
    if (!model) return 'no-model';
    const mats = Array.isArray(model.material)
      ? model.material : (model.material ? [model.material] : []);
    const re = filter ? new RegExp(filter, 'i') : null;
    const rows = [];
    let suspicious = 0;
    mats.forEach((m, i) => {
      if (!m) return;
      const nm = m.name || ('mat' + i);
      if (re && !re.test(nm)) return;
      const op = m.opacity === undefined ? 1 : m.opacity;
      /* ★ 可疑：不透明却没有深度写 → 会透出下层 */
      const bad = (!m.transparent && op > 0.99 && m.depthWrite === false);
      if (bad) suspicious++;
      rows.push(i + ':' + nm
        + ' o=' + op.toFixed(2)
        + ' tr=' + (m.transparent ? 1 : 0)
        + ' dw=' + (m.depthWrite === false ? 0 : 1)
        + ' at=' + (m.alphaTest || 0).toFixed(2)
        + ' vis=' + (m.visible ? 1 : 0)
        + ' map=' + (m.map ? 1 : 0)
        + (bad ? ' ★不透明却不写深度' : ''));
    });
    const msg = 'MATDUMP' + (filter ? '(' + filter + ')' : '')
      + ' 可疑=' + suspicious + ' | ' + rows.join(' | ');
    nlog(msg);
    return msg;
  } catch (e) { return 'err:' + (e && e.message); }
};

function applyMaterialMorphs(jobs) {
  if (!_matBase || !model) return;
  /* ★ 安全闸：基础值必须属于【当前这个模型对象】。
     换模型时 _matBase 可能还留着旧模型的值，
     用它去复位会把材质设成完全错误的透明度。 */
  if (_matBaseFor !== model) return;

  /* ★★ 快速返回 —— 修"每次眨眼都卡一下"。
     ---- 事故复盘（实测"眨眼都会卡一下，然后有透视效果"）----
     眨眼是【骨骼】表情，不涉及任何材质，所以 jobs 是空数组。
     但原来的代码在 jobs 为空时【仍然】遍历全部材质做复位，
     并且对【每一个】材质设 needsUpdate = true。
     本模型有 57 个材质 → 眨眼期间【每一帧】都让 57 个材质需要重算，
     而眨眼持续 0.34 秒 ≈ 20~50 帧 → 直接卡顿。
     ★ 正确做法：没有材质表情、且上次也没应用过 → 什么都不用做，立即返回。 */
  if (!jobs.length && !_matApplied) return;

  const mats = Array.isArray(model.material)
    ? model.material : (model.material ? [model.material] : []);

  /* 复位到基础状态（只有值真的变了才写 + needsUpdate，避免无谓的开销） */
  for (let i = 0; i < mats.length; i++) {
    const m = mats[i], b = _matBase[i];
    if (!b || !m) continue;
    /* ★ 同样按【base 的透明度】推导，而不是直接还原 b.transparent/b.depthWrite。
       原因：隐藏材质(alpha=0)在加载时被 applyAlphaTest 设过 depthWrite=false，
       若直接还原，它"被显示"时仍会带着那个 false（见下面的说明）。 */
    const bHidden = (b.opacity < 0.02);
    const wantTransparent = bHidden ? (b.opacity < 0.999) : b.transparent;
    const wantDepthWrite = (b.opacity < 0.99) ? false : (bHidden ? true : b.depthWrite);
    let ch = false;
    if (m.opacity !== b.opacity) { m.opacity = b.opacity; ch = true; }
    if (m.transparent !== wantTransparent) { m.transparent = wantTransparent; ch = true; }
    if (m.visible !== b.visible) { m.visible = b.visible; ch = true; }
    if (m.depthWrite !== wantDepthWrite) { m.depthWrite = wantDepthWrite; ch = true; }
    if (ch) m.needsUpdate = true;
  }
  _matApplied = jobs.length > 0;
  if (!jobs.length) return;

  for (const j of jobs) {
    const m = mats[j.index];
    const b = _matBase[j.index];
    if (!m || !b) continue;
    const off = (j.diffuse && j.diffuse.length >= 4) ? j.diffuse[3] : 0;
    let a = (j.op === 1) ? (b.opacity + j.w * off)
                         : (b.opacity * (1 + j.w * off));
    a = Math.max(0, Math.min(1, a));

    /* ★★ 开启"默认隐藏的部件"时，必须按【当前透明度】重算 transparent / depthWrite。
       ---- 事故复盘（实测"耳朵和靴子怎么是半透明的"）----
       狐耳/狐尾/鞋子这类配件在 PMX 里基础 alpha = 0（隐藏），
       于是加载时 applyAlphaTest 把它们的 depthWrite 设成了 false。
       而原来这里写的是 `m.depthWrite = (a<0.99) ? false : b.depthWrite` ——
       a 变成 1（显示）时读到的仍是 b.depthWrite = false（隐藏时的值）
       → 明明已经不透明了却【不写深度】→ 看起来半透明、能透出下层。
       transparent 同理（`b.transparent || ...` 恒为 true）。
       ★ 正确做法：本来就是隐藏(bHidden)的材质，显示后应当【完全按不透明材质处理】。 */
    const bHidden = (b.opacity < 0.02);
    m.opacity = a;
    m.transparent = bHidden ? (a < 0.999) : (b.transparent || a < 0.999);
    m.depthWrite = (a < 0.99) ? false : (bHidden ? true : b.depthWrite);
    m.visible = a > 0.01;
    m.needsUpdate = true;
  }
}
let _lastVertexLog = '';
/** 骨骼型表情日志判重（同样不含眨眼权重，否则眨眼期间每帧一条）。 */
let _lastBoneLog = '';

/** 眨眼叠加层：只驱动骨骼，不影响用户表情的顶点部分。 */
function setBlinkMorph(names, w) {
  _blinkNames = (w > 0 && Array.isArray(names)) ? names : [];
  _blinkW = w;
  reapplyExpressions();
}

/* ============================================================
   眨眼表情集合
   ------------------------------------------------------------
   ★ MMD 惯例里「ウィンク」是【单眼】（左眼 wink），
     「ウィンク右」才是右眼，「まばたき」才是双眼眨眼。
     之前只应用 ウィンク，结果用户看到的就是"只有一只眼睛在眨"。
   ★ 正确做法：能用双眼的 まばたき 就单用它；否则把所有单眼 wink 变体
     （ウィンク + ウィンク右）【一起】应用。
   ============================================================ */
let _blinkExprsCache = null;
let _blinkExprsFor = null;

function blinkExpressions() {
  if (_blinkExprsFor === model && _blinkExprsCache) return _blinkExprsCache;
  /* ★★ 没有任何 MMD 表情（glTF 就是这样）时直接返回空 ★★
     ---- 为什么要提前返回 ----
     原实现在这种模型上会走完整套"找闭眼表情"的逻辑，
     末尾打一条 `blinkExprs: none（候选 0 个）` —— 而本函数被【每帧】调用，
     于是 logcat 被这条日志刷爆（实测每秒 30 条），
     把真正有用的日志全冲掉了。 */
  if (!morphIndex || Object.keys(morphIndex).length === 0) {
    _blinkExprsFor = model;
    _blinkExprsCache = [];
    return _blinkExprsCache;
  }
  const names = Object.keys(morphIndex || {});
  let out = [];

  /* ============================================================
     ★★ 眨眼必须用"真正的闭眼表情"，绝不能用转动眼球来模拟。
     ---- 事故复盘（实测"眨眼时眼睛往下动，而不是闭眼"）----
     原来的兜底逻辑在没有眼睑骨骼时，会退化成【旋转眼球骨骼】
     （lidBones 为空 → 用 gazeTargets()，再 rotation.set(v,0,0)），
     现象就是眼珠往下沉 —— 看着完全不像眨眼。
     ★ MMD 模型里本来就有现成的闭眼表情，直接用它们才对：
       · Close       —— 【材质表情】藏起睁眼材质、亮出"闭眼"材质 ✓ 最适合眨眼
       · まばたき / 瞬き / blink —— 【顶点表情】直接位移眼睑顶点 ✓
     ★★ 但【绝对不能用 Off】！—— 实测它是"眼睛整个消失"（把眼部材质整个藏掉），
        用它眨眼会变成眼睛凭空不见（用户实测反馈）。
     ============================================================ */
  const isHardClose = (n) => /^Close$/i.test(n)
    || /まばたき|瞬き|blink|目閉じ|目を閉じ|閉じ目|闭眼|眼閉/i.test(n);
  const hard = names.filter(isHardClose);
  if (hard.length) {
    /* Close 优先（材质换脸，最干净），其次 まばたき 类（顶点位移） */
    const closeFirst = hard.filter(n => /^Close$/i.test(n));
    out = closeFirst.length ? [closeFirst[0]] : [hard[0]];
  } else {
    /* 没有真闭眼表情时，才退而用单眼 wink 变体（至少是眼睑在动） */
    out = names.filter(n => /ウィンク|wink|睫毛|eyelid/i.test(n));
  }
  _blinkExprsCache = out;
  /* ★ 只在"确实拿到了表情名"时才缓存。
     若此时 morphIndex 还是空的（模型未就绪），缓存空数组会导致
     之后永远找不到眨眼表情（见 rebuildMorphMap 里的说明）。 */
  _blinkExprsFor = (names.length > 0) ? model : null;
  nlog('blinkExprs: ' + (out.length ? out.join(' + ') : 'none')
    + '（候选 ' + names.length + ' 个）');

  /* 诊断：打印所选眨眼表情的真实驱动方式（顶点 / 骨骼 / 材质） */
  try {
    for (const n of out) {
      const eff = morphEffects && morphEffects[n];
      if (eff) {
        nlog('blinkExpr «' + n + '» vertex=' + eff.vertex.length
          + ' bone=' + eff.bones.length + ' material=' + eff.materials.length
          + (eff.materials.length ? ' [mat:' + eff.materials.map(x => x.index).join(',') + ']' : '')
          + (eff.vertex.length ? ' [vtx]' : ''));
      } else {
        nlog('blinkExpr «' + n + '» 无 PMX 数据(将按名字索引顶点型)');
      }
    }
  } catch (e) {}

  return out;
}

/** 应用一次眨眼（w=0 睁开，1 全闭）。返回是否成功。
 *  ★ 走 setBlinkMorph（叠加层），不能用 setMorph —— 后者会重置用户表情。 */
function applyBlink(w) {
  const list = blinkExpressions();
  if (!list.length) return false;
  setBlinkMorph(list, w);
  return true;
}

/* 表情日志去重（眨眼会每帧调用，不能每帧都打日志） */

/**
 * 按 PMX 的真实数据应用骨骼型表情。
 * ★ 旋转必须走四元数：PMX 存的是 quaternion(x,y,z,w)，
 *   直接往欧拉角上 "+=" 是错的（轴顺序、量纲、插值方式全不对）——
 *   那正是"眨一下眼，眼眶被拉得老高"的来源。
 */
const _qId = new THREE.Quaternion();
const _qTgt = new THREE.Quaternion();
const _qW = new THREE.Quaternion();
function applyBoneMorph(elements, w) {
  const cw = Math.max(0, Math.min(1, w));
  for (const e of elements) {
    /* ★ 跳过被物理刚体绑定的骨骼（否则会拽断物理链 → 穿模）。
       详见 physBoneNames 的说明。 */
    if (physBoneNames.has(e.boneName)) continue;
    const bone = boneByName.get(e.boneName);
    if (!bone) continue;
    if (e.position) {
      bone.position.x += e.position[0] * cw;
      bone.position.y += e.position[1] * cw;
      bone.position.z += e.position[2] * cw;
    }
    if (e.rotation) {
      const rx = e.rotation[0], ry = e.rotation[1], rz = e.rotation[2], rw = e.rotation[3];
      /* ★ 必须排除退化四元数 (0,0,0,0)。
         实测 ウィンク 的 EyeLD3、ウィンク右 的 EyePR1 就是 (0,0,0,0)，
         对零长度四元数做 slerp 会产生 NaN，污染骨骼后整个模型会畸形。
         先判长度平方，再决定要不要转。 */
      const len2 = rx * rx + ry * ry + rz * rz + rw * rw;
      if (len2 > 1e-12 && (rx || ry || rz || rw - 1)) {
        _qTgt.set(rx, ry, rz, rw);
        _qW.copy(_qId).slerp(_qTgt, cw);
        bone.quaternion.multiply(_qW);
      }
    }
    _activeExprBones.push(bone);
  }
}


function refreshMorphList() {
  const sel = $('selMorph');
  if (!sel) return;

  // 从 geometry.morphTargets 重建映射（见 rebuildMorphMap 的注释）
  rebuildMorphMap();

  const usable = morphNames.length > 0 && morphMeshes.length > 0;

  sel.innerHTML = '';
  if (!usable) {
    const o = document.createElement('option');
    o.value = '';
    o.textContent = morphNames.length
      ? ('表情不可用: 名称有 ' + morphNames.length + ' 个，但没找到 morphTargetInfluences')
      : '该模型没有表情';
    sel.appendChild(o);
    sel.disabled = true;
    const sm = $('sMorph'); if (sm) sm.disabled = true;
    return;
  }

  sel.disabled = false;
  const sm = $('sMorph'); if (sm) sm.disabled = false;
  const none = document.createElement('option');
  none.value = '';
  none.textContent = '— 无表情 —';
  sel.appendChild(none);
  morphNames.forEach(n => {
    /* ★ 配件不进表情列表（它们改由"配件"页管理）。
       混在一起会让下拉塞满 ON_靴 之类，AI 也容易挑错。 */
    if (isAccessory(n)) return;
    const o = document.createElement('option');
    /* ★ value 必须是【真实名字】（供 setMorph / 存储 / AI 用），
       只有显示文字用译文。绝不能把译文写进 value，否则一切对不上。 */
    o.value = n;
    o.textContent = dispName(n);
    sel.appendChild(o);
  });
  MORPH_HAS_WINK = morphNames.indexOf(WINK_NAME) >= 0;
  // 重建后把当前选中的表情重新应用（换模型会清空 influences）
  if (morphCur && morphIndex[morphCur] !== undefined) {
    sel.value = morphCur;
    setMorph(morphCur, sm ? parseFloat(sm.value) : 1);
  }
  nlog('morph list(' + morphNames.length + '): ' + morphNames.join(','));
  analyzeMorphs();
}


function updateMorph(dt) {
  /* ★ 轮播遍历【全部】 morph —— 不要把装备/姿态类排除掉。
     ---- 为什么改回来（实测"我下这个模型也是奔着动作去的"）----
     这个模型里那些 ★ON_靴 / ★胸上げ / ★腕↑捻り / ★Up_しっぽ / ★セットアップ
     正是【动作/装备展示】，是用户想要的功能，排除掉就等于砍功能。
     ---- 那穿模怎么办？----
     不再靠"少播东西"来回避，而是从根上断掉打架的那条路径：
     表情系统【不再复位被物理刚体绑定的骨骼】（见 physBoneNames / applyBoneMorph）。
     这些骨骼的姿态本来就每帧由物理决定，表情去动它们既无效、又会把物理链拽断。
     所以这里可以放心遍历全部 morph。 */
  if (!model || !morphLoop || !morphNames.length) return;
  morphLoopT += dt;
  const i = Math.floor(morphLoopT / 1.2) % morphNames.length;
  const n = morphNames[i];
  if (n !== morphCur) {
    morphCur = n;
    const sel = $('selMorph');
    if (sel) sel.value = n;
    setMorph(n, parseFloat($('sMorph') ? $('sMorph').value : 1));
  }
}

/* ==================================================================
   模型切换
   - 内置模型走 ./models/arona.pmx（assets 里）
   - 导入的模型走 /models/<dir>/<file>.pmx（app 私有目录，由原生解压）
   两者都由 MMDLoader 正常解析；切换时会销毁旧场景，避免显存泄漏。
   ================================================================== */
let currentModelUrl = MODEL_URL;
/** 正在加载中的模型 URL（用于拦截重复请求，见 __loadModel）。 */
let _loadingUrl = '';

/**
 * ★ 加载序号：防止两次加载"串不上下"互相踩踏。
 *
 * ---- 事故复盘（2026-10-05）----
 * 现象：加载 Kei 时报 `Cannot read properties of null (reading 'traverse')`。
 * 时间线：
 *   t=0    boot() 开始加载存档模型（8.5MB，需 1~2 秒），await 中
 *   t=700  applySettings 触发；此时 boot 还没恢复执行，
 *          currentModelUrl 仍是 arona → 判定"模型不同" → 又调一次 __loadModel
 *   __loadModel 里会先 `model = null`（准备换模型）
 *   → boot 恢复后拿到 model === null，继续 normalizeModel(model) → null.traverse 崩溃
 * ★ 修法：每次加载领取一个序号，await 回来后若序号已被更新的加载取代，就自我放弃。
 */
let _loadSeq = 0;

/** 彻底销毁旧模型（几何/材质/纹理都要显式 dispose，否则切几次就 OOM） */
function disposeModel(m) {
  if (!m) return;
  m.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const mm of mats) {
      if (!mm) continue;
      for (const k in mm) {
        const v = mm[k];
        if (v && v.isTexture) v.dispose();
      }
      mm.dispose();
    }
  });
}

async function __loadModel(url) {
  /* ★★ 重复加载守卫 —— 修"先加载一次、再被取代重载一次"的折腾。
     ---- 为什么会有两次（2026-10-05 查清）----
     · boot() 会主动加载【存档里的模型】（为了不再先加载 arona 再切换）
     · 而悬浮窗服务 PetOverlayService 启动时【也会】调 mmdView.loadModel(存档模型)
     两次请求同一个 URL：第二次会把第一次"取代"掉，
     白白多解码一个 8MB 级模型、多占一次显存和 morph 贴图（约 128MB），
     还容易触发渲染进程被系统回收（→ 画面透明）。
     ★ 这里直接拦截：同一个 URL 正在加载或已经加载好，就跳过。 */
  if (url === currentModelUrl && (model || _loadingUrl === url)) {
    nlog('__loadModel: 同一模型已在加载/已加载，跳过重复请求: ' + url);
    return;
  }
  nlog('switch model -> ' + url);
  /* ★ 换模型之前先把【当前模型】的配置落盘 ★
     ---- 为什么 ----
     切换模型会重建 WebView（restartOverlay）。旧页面最后 800ms 内的改动
     （自动保存是防抖的）可能还没写进 localStorage 就随页面一起销毁了。
     这里在切走之前强制存一次 —— 此时 currentModelUrl 还是旧模型，
     所以存进的是【旧模型自己那份】，不会串到新模型上。 */
  try {
    if (_canSave && !_restoring) saveSettings(true);
  } catch (e) {}
  _loadingUrl = url;
  /* ★ 立即把目标模型记进 localStorage。
     否则 boot() 延迟 700ms 的 applySettings 会用存档里的旧模型
     把刚切换的模型覆盖掉 —— 表现是"重载了但没切换"（文档 §18c）。 */
  try {
    const cur = loadSettings();
    if (cur) {
      cur.model = url;
      cur.savedAt = Date.now();
      localStorage.setItem(LS_KEY, JSON.stringify(cur));
      nlog('__loadModel: persisted model=' + url);
    }
  } catch (e) {}
  mark('loading ' + url.split('/').pop() + '...');

  /* ★ 领取加载序号：并发加载时，旧的那次会在 await 回来后自动放弃，
     避免"旧加载把新模型置空/覆盖"（见 _loadSeq 的说明）。 */
  const mySeq = ++_loadSeq;

  // 拆掉旧的
  if (mixer)    { mixer.stopAllAction(); mixer = null; }
  if (physics)  { physics = null; }          // 旧物理对象随 mesh 一起丢
  if (model) {
    scene.remove(model);
    disposeModel(model);
    model = null;
  }
  gazeBones.left = gazeBones.right = null; gazeBones.all = []; lidBones = [];
  gazeMode = 'touch';
  currentModelUrl = url;
  _fitStage = 0;      // 新模型需要重新取景
  _fitDone = false;
  _fitPass = 0;

  try {
    const m = await loadAnyModel(url);
    /* ★ 模型类型可能刚变了（MMD ↔ glTF）→ 动态模糊换成对应那一套参数。
       必须在 renderer 开始用它之前应用，否则会沿用上一个模型的设置。 */
    try { applyMotionBlurForModel(); } catch (e) {}
    /* ★ 三渲二要在材质就绪后重新应用（新模型的材质是全新的 PBR/Toon） */
    try { if (TOON2D_ON) applyToon2D(true); } catch (e) {}
    /* ★ 并发守卫：如果期间又启动了新的加载，本次结果作废。
       否则会把新模型覆盖掉，或对已释放的资源继续操作。 */
    if (mySeq !== _loadSeq) {
      nlog('__loadModel: 本次加载已被取代，放弃 ' + url);
      try { disposeModel(m); } catch (e) {}
      return;
    }
    model = m;
    scene.add(model);
    nlog('model loaded, children=' + m.children.length);

    normalizeModel(model);
    /* ★★★ 关掉模型所有 mesh 的视锥剔除（2026-10-07，根因修复）★★★
       ---- 事故复盘（曾出现"之前很细也能看见嘴，现在根本看不见"）----
       真机 A/B 诊断（照搬描边那次的手法）：
         `★嘴部 A/B: 带嘴 drawcall=33 隐藏后=33 差值=0 (嘴 mesh 数=14)`
         `★嘴材质状态: matVisible=true hasMap=true colorWrite=true
                      meshVisible=true layersMask=1 frustumCulled=true`
       材质与可见性**全部正常**，但 14 个嘴 mesh 一个都没进绘制。
       唯一可疑项就是 `frustumCulled=true`。

       ★ 根因：three.js 的视锥剔除用 `geometry.boundingSphere`，
         而它是按 **原始（未蒙皮）顶点** 算的。这个模型里
         `Mouth_*` 的原始位置是 y≈-0.09 / z≈0.645（建模空间），
         但**蒙皮后实际跑到 y≈-0.43**（差 0.34，模型总高才 1.6）——
         包围球落在相机视锥之外 → **被剔除 → 一个 drawcall 都不产生**。
         而相机距离/取景一变，球进出视锥 → 症状就是"**有时**看得见"。

       ★ 为什么描边一直没事：它的 mesh 我显式设了 `frustumCulled = false`。
       ★ 为什么 MMD 模型没暴露：MMDLoader 的骨骼与顶点空间接近，误差小。

       → 桌宠窗口永远是把模型框在中间的，视锥剔除在这里**没有任何收益**，
         却会误杀蒙皮网格。直接全关。
         （glTF 与 MMD 都受益 —— 这是 three.js 对 SkinnedMesh 的已知局限。） */
    /* 注：视锥剔除的关闭已挪进 normalizeModel() 内部 —— 见那里的说明
       （放这里时实测日志没出现，说明这段没被执行；挪进去最保险）。 */
    fixOverExposure(model);
    if (!isGltfModel) {
      applyToonGradient(model, _toonStops.length ? _toonStops : TOON_STOPS);
    }
    applyColorGradeAll(model, SAT_VALUE, HUE_VALUE);

    // 物理：只有 MMD 模型自带刚体时才建（glTF 没有 MMD 刚体，跳过）
    /* ★ 从 geometry.userData.MMD 取（见 mmdPhysicsDataOf 的说明） */
    const pd = isGltfModel ? { rigidBodies: [], constraints: [] } : mmdPhysicsDataOf(m);
    const hasRB = pd.rigidBodies.length > 0;
    if (PHYSICS && hasRB) {
      try {
        await loadAmmo();
        snapshotPhysBones();
        const pf1 = filterPhysicsByPart(m, pd.rigidBodies, pd.constraints);
        applyNoCollide(pf1.rigidBodies);
        physics = createPhysicsUnscaled(m, pf1.rigidBodies, pf1.constraints);
        nlog('物理刚体筛选: 保留 ' + pf1.kept + ' / 排除 ' + pf1.dropped
          + ' → 实际装入 ' + (physics.bodies ? physics.bodies.length : '?') + ' 个刚体');
        _physAccum = 0;   // 新建物理 → 累积器归零（别把旧时间补算进去）
        calibratePhysicsGravity(physics, m);
        warmupPhysicsUnscaled(m, physics, 60);      // 同上，先收敛再渲染（scale=1 内跑）
        nlog('physics on (' + pd.rigidBodies.length + ' bodies / '
          + pd.constraints.length + ' constraints)');
      } catch (e) { nerr('physics skipped: ' + e.message); physics = null; }
    } else {
      nlog('no rigid bodies -> physics off（检测到 ' + pd.rigidBodies.length + ' 个刚体）');
    }

    if (!isGltfModel) {
      /* ★ 建骨骼索引 + 读 PMX 表情映射（表情系统与眨眼都依赖它） */
      rebuildBoneIndex();
      await loadMorphBoneMap(url);
      if (mySeq !== _loadSeq) { nlog('__loadModel: 已被取代(2)，放弃'); return; }
    }
    /* 注：材质基础状态由 rebuildMorphMap() 末尾统一捕获 */

    // 眼球骨骼（glTF 命名不同，跳过）
    const gz = isGltfModel ? { left: null, right: null, all: [], lids: [] }
                           : findEyeBones(m);
    gazeBones.left = gz.left; gazeBones.right = gz.right; gazeBones.all = gz.all;
    lidBones = gz.lids || [];
    nlog('eye bones: L=' + (gz.left ? gz.left.name : 'none')
       + ' R=' + (gz.right ? gz.right.name : 'none'));

    // 面板里的缩放是相对 baseModelScale 的倍率，重新套用
    if (_userScale !== 1) model.scale.setScalar(baseModelScale * _userScale);

    onResize();
    /* ★ 换模型必须显式重新取景。
       上面的 onResize 在视口没变化时会直接 return（那是防抖逻辑），
       但新模型的内容宽高比与旧模型不同，沿用上一轮算出的 camera.aspect
       会让模型变形（"变胖"）。 */
    /* ★ 用 scheduleFit 合并触发源（换模型后窗口尺寸往往紧接着被改一次，
       两个触发源各跑一轮取景 → 用户看到"连着缩两次"）。 */
    scheduleFit('new-model', 80);
    /* ★★ 换模型：切换成【新模型自己的】相机/缩放设置 ★★
       必须在取景之前做，否则会用上一个模型的距离去框新模型（必然框错）。 */
    loadViewForModel(url);
    if (_userScale !== 1 && model) model.scale.setScalar(baseModelScale * _userScale);
    /* ★ 只有【用户主动调过】距离才应用它。
       否则滑块默认值 3.7 会被恢复流程填进 _userDist，
       换模型时把自动取景的构图覆盖掉（模型被裁/缩水）。 */
    if (_distCustom && _userDist != null) applyCamDist(_userDist);
    /* 换模型后同步相机距离下限（大模型需要退得更远） */
    if (window.__syncDistMin) { try { window.__syncDistMin(); } catch (e) {} }

    // 表情随模型变化，必须重新拉取并清空所有缓存
    morphNames = []; morphCur = ''; morphLoop = false;
    _boneExprCache.clear();
    _activeExprBones = [];
    _boneBackup = null;
    bindPanel();                 // 内部会 refreshModelList()，保留当前选中
    refreshMorphList();
    // ★ 双保险：把下拉显式指向刚加载的模型，避免界面与实际不一致
    {
      const selM2 = $('selModel');
      if (selM2 && url) {
        if (!Array.from(selM2.options).some(o => o.value === url)) {
          const o = document.createElement('option');
          o.value = url; o.textContent = '📦 ' + url.split('/').pop();
          selM2.appendChild(o);
        }
        selM2.value = url;
      }
    }
    setTimeout(refreshDiag, 250);
    setTimeout(clearMark, 900);
    /* ★ 换模型后必须重建 VMD 剪辑（轨道是按模型骨骼名拟合的）。 */
    vmdRebuild('new-model');
    /* ★ 换模型也要重建描边（材质/几何都换了） */
    buildOutlines();
    nlog('model READY');
    if (B) { try { B.ready(); } catch (e) {} }
  } catch (e) {
    showErr('加载失败 ' + url + '\n' + e.message);
  }
}

/* 原生 import 完成后回调：msg 人类可读，url 非空表示成功 */
/* ============================================================
   模型屏幕包围盒上报（供原生做命中测试）
   ------------------------------------------------------------
   桌宠悬浮窗是个矩形窗口，若整块都响应触摸，用户点到模型旁边的
   空白处也会触发互动/三击。这里把模型投影到屏幕空间算出真实
   包围盒，上报给 Java，由它做命中判定。
   归一化坐标 0..1（左上角为原点）。
   ============================================================ */
window.__modelBounds = function () {
  try {
    if (!model || !camera) return null;
    const box = new THREE.Box3().setFromObject(model);
    if (box.isEmpty()) return null;
    const min = box.min, max = box.max;
    /* 8 个角点全部投影，取屏幕空间的包围盒（比只投中心更准） */
    const corners = [
      [min.x, min.y, min.z], [max.x, min.y, min.z],
      [min.x, max.y, min.z], [max.x, max.y, min.z],
      [min.x, min.y, max.z], [max.x, min.y, max.z],
      [min.x, max.y, max.z], [max.x, max.y, max.z]
    ];
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of corners) {
      const v = new THREE.Vector3(c[0], c[1], c[2]).project(camera);
      if (!isFinite(v.x) || !isFinite(v.y)) continue;
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
      y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
    if (!isFinite(x0) || !isFinite(y0)) return null;
    /* NDC(-1..1) -> 归一化(0..1)；y 轴翻转（NDC 向上为正，屏幕向下为正） */
    return {
      x0: (x0 + 1) / 2, x1: (x1 + 1) / 2,
      y0: (1 - y1) / 2, y1: (1 - y0) / 2
    };
  } catch (e) { return null; }
};

/* ============================================================
   轮廓命中掩码（比矩形包围盒精确得多）
   ------------------------------------------------------------
   把场景离屏渲染到 64x64 的 render target，读取 alpha 通道，
   alpha > 阈值 记为"该格有模型"。上报给 Java 做命中测试。
   这样人形模型四角的空白区域不会被误判为可点击。
   ============================================================ */
const MASK_N = 64;
let maskRT = null;
let maskBuf = new Uint8Array(MASK_N * MASK_N * 4);
/** 掩码构建失败计数（仅用于日志限流：本函数每 700ms 调一次）。 */
let _maskBuildFails = 0;

/**
 * 从掩码缓冲量出内容边界（top-down 行序）。
 * 用途：相机取景校正、内容裁剪判断。
 * 注意 maskBuf 的 y 是 bottom-up（readRenderTargetPixels 的约定），
 * 这里统一翻转成 top-down 返回。
 */
function measureMaskContent() {
  let firstRow = -1, lastRow = -1, firstCol = -1, lastCol = -1;
  for (let ny = 0; ny < MASK_N; ny++) {
    for (let nx = 0; nx < MASK_N; nx++) {
      const srcY = MASK_N - 1 - ny;
      if (maskBuf[(srcY * MASK_N + nx) * 4 + 3] > 16) {
        if (firstRow < 0) firstRow = ny;
        lastRow = ny;
        if (firstCol < 0 || nx < firstCol) firstCol = nx;
        if (nx > lastCol) lastCol = nx;
      }
    }
  }
  if (firstRow < 0) return null;
  return { firstRow, lastRow, firstCol, lastCol };
}

function buildHitMask() {
  if (!model || !camera) return null;

  /* ★★ 渲染状态恢复必须走 finally —— 这是"模型过一会儿就定格"的根因。
     ---- 事故复盘 ----
     readRenderTargetPixels() 在部分驱动 / 上下文异常时会抛错，
     而原来的写法是 catch (e) { return null; }，异常路径【完全没有恢复状态】：
       · renderer 的 renderTarget 永久停在 64x64 的离屏目标上
       · 非模型对象（灯光等）永久保持 visible = false
     于是主渲染循环继续把画面画进离屏 buffer，
     WebView 的画布再也不会被更新 → 定格在最后一帧（用户描述"像照片一样"）。
     因为这些变量要在 finally 里用到，所以必须声明在 try 之外。 */
  const prevTarget = renderer.getRenderTarget();
  const prevClearAlpha = renderer.getClearAlpha();
  const prevClearColor = new THREE.Color();
  renderer.getClearColor(prevClearColor);
  const hidden = [];

  try {
    if (!maskRT) maskRT = new THREE.WebGLRenderTarget(MASK_N, MASK_N);

    /* 临时隐藏非模型对象（灯光不影响 alpha，但保守起见）
       注意：只渲染模型，避免其他物体污染掩码 */
    scene.children.forEach(o => {
      if (o !== model && o.visible) { hidden.push(o); o.visible = false; }
    });

    renderer.setRenderTarget(maskRT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.readRenderTargetPixels(maskRT, 0, 0, MASK_N, MASK_N, maskBuf);

    /* 注意：状态恢复统一由下面的 finally 负责，这里不要再放一份，
       否则异常路径仍然会漏掉（这正是之前的 bug）。 */

    /* 打包成十六进制位串：每像素 1 bit，按【从上到下】行序，
       方便 Java 侧用 idx = ny*N + nx 直接索引 */
    const bytes = new Uint8Array(Math.ceil(MASK_N * MASK_N / 8));
    for (let ny = 0; ny < MASK_N; ny++) {
      for (let nx = 0; nx < MASK_N; nx++) {
        /* readRenderTargetPixels 返回的是 bottom-up（OpenGL 约定），
           这里翻转 y 得到 top-down 行序 */
        const srcY = MASK_N - 1 - ny;
        const alpha = maskBuf[(srcY * MASK_N + nx) * 4 + 3];
        if (alpha > 16) {
          const bit = ny * MASK_N + nx;
          bytes[bit >> 3] |= (1 << (bit & 7));
        }
      }
    }
    /* 诊断：算出掩码里实际有内容的行/列范围，定位空白来源 */
    let firstRow = -1, lastRow = -1, firstCol = -1, lastCol = -1;
    for (let ny = 0; ny < MASK_N; ny++) {
      for (let nx = 0; nx < MASK_N; nx++) {
        const srcY = MASK_N - 1 - ny;
        if (maskBuf[(srcY * MASK_N + nx) * 4 + 3] > 16) {
          if (firstRow < 0) firstRow = ny;
          lastRow = ny;
          if (firstCol < 0 || nx < firstCol) firstCol = nx;
          if (nx > lastCol) lastCol = nx;
        }
      }
    }
    if (firstRow >= 0) {
      const msg = 'mask rows=' + firstRow + '..' + lastRow + ' cols=' + firstCol + '..' + lastCol
        + ' (H=' + (lastRow - firstRow + 1) + '/' + MASK_N + ')';
      /* ★ 节流到每 30 秒一条 —— 这个值每 700ms 就变，原来会刷爆 logcat
         缓冲区，导致真正的诊断信息（MATDUMP / 错误）被冲掉读不到。 */
      const _nowMaskLog = performance.now();
      if (msg !== window.__lastMaskDiag
          && (_nowMaskLog - (window.__lastMaskLogAt || 0) > 30000)) {
        window.__lastMaskDiag = msg;
        window.__lastMaskLogAt = _nowMaskLog;
        nlog(msg);
      }
    }

    let hex = '';
    for (let i = 0; i < bytes.length; i++) {
      hex += bytes[i].toString(16).padStart(2, '0');
    }
    return hex;
  } catch (e) {
    /* 日志限流：本函数每 700ms 被调用一次，稳定失败会刷屏 */
    if (++_maskBuildFails <= 3) {
      nlog('hit mask build failed (' + _maskBuildFails + '): ' + (e && e.message));
    }
    return null;
  } finally {
    /* ★ 无论成功还是失败，都必须把渲染状态放回去。
       绝不能把 renderTarget 留在 64x64 的离屏目标上：
       主渲染循环会继续往那个 buffer 里画，WebView 画布永不更新，
       屏幕就定格成一张照片。 */
    try {
      hidden.forEach(o => { o.visible = true; });
      renderer.setRenderTarget(prevTarget);
      renderer.setClearColor(prevClearColor, prevClearAlpha);
    } catch (e2) {}
  }
}

/* 定时上报（与包围盒同频） */
let maskFailCount = 0;
setInterval(function () {
  try {
    if (!window.MmdBridge || !window.MmdBridge.setHitMask) return;
    const hex = buildHitMask();
    if (hex) {
      maskFailCount = 0;
      window.MmdBridge.setHitMask(hex, MASK_N);
      if (_fitStage === 0) fitCameraToBox();
      else if (_fitStage === 1) correctCameraFromMask();
    } else {
      maskFailCount++;
      if (maskFailCount === 3) nlog('hit mask: build failed (model 未就绪?)');
    }
  } catch (e) {}
}, 700);

/* 定时上报包围盒（节流，避免每帧跨进程调用） */
setInterval(function () {
  try {
    if (!window.MmdBridge || !window.MmdBridge.setModelBounds) return;
    const b = window.__modelBounds();
    if (b) window.MmdBridge.setModelBounds(b.x0, b.y0, b.x1, b.y1);
  } catch (e) {}
}, 600);

/* ============================================================
   表情编排（供 AI 通过 MCP 调用）
   ------------------------------------------------------------
   playExpression(name, seconds):
     1) 暂停自转
     2) 转向正前方（面向屏幕）
     3) 播放表情
     4) 到时恢复原来的自转状态与朝向
   注意：SPIN_SPEED 是用户配置（面板滑块），这里只临时接管 SPIN 与朝向，
   结束后必须【原样恢复】，不能改动用户设置。
   ============================================================ */
let _exprTimer = null;

window.__playExpression = function (name, seconds) {
  try {
    if (!model) return 'no-model';
    /* 持续时长：0.5 ~ 10 秒（AI 可通过 MCP 指定，上限 10 秒） */
    const dur = Math.max(0.5, Math.min(10, parseFloat(seconds) || 3));

    // 清掉上一个定时器，避免叠加
    if (_exprTimer) { clearTimeout(_exprTimer); _exprTimer = null; }

    // 记住当前状态
    const prevSpin = SPIN;
    const prevSpeed = SPIN_SPEED;
    const prevRotY = model.rotation.y;
    const prevPosX = model.position.x;

    // 暂停自转 + 面向屏幕
    SPIN = false;
    SPIN_SPEED = 0;
    model.rotation.y = 0;
    model.position.x = 0;
    if (physics) model.updateMatrixWorld(true);

    // 播放表情
    setMorph(name, 1);

    nlog('expr play: ' + name + ' for ' + dur + 's (spin was ' + prevSpin + ')');

    _exprTimer = setTimeout(function () {
      _exprTimer = null;
      // 复位表情
      try { setMorph('', 0); } catch (e) {}
      // 恢复自转与朝向
      SPIN = prevSpin;
      SPIN_SPEED = prevSpeed;
      spinAngle = prevRotY / 0.35;      // 让角度连续，避免跳变
      model.rotation.y = prevRotY;
      model.position.x = prevPosX;
      if (physics) model.updateMatrixWorld(true);
      nlog('expr done, spin restored to ' + SPIN + ' speed=' + SPIN_SPEED);
    }, dur * 1000);

    return 'ok';
  } catch (e) {
    return 'err:' + e.message;
  }
};

/**
 * 当前模型是否有可驱动的眼球骨骼。
 * 没有的话（很多静态模型 / 无眼骨模型），眼动功能应当禁用 ——
 * 否则用户开了也看不到任何效果，白耗电。
 */
window.__hasEyeBones = function () {
  try {
    return !!(gazeBones && gazeBones.all && gazeBones.all.length > 0);
  } catch (e) { return false; }
};

/** 眼球骨骼名列表（诊断/展示用）。 */
window.__eyeBonesInfo = function () {
  try {
    if (!gazeBones || !gazeBones.all) return '[]';
    return JSON.stringify(gazeBones.all.map(b => b.name));
  } catch (e) { return '[]'; }
};

/* 可用表情列表（供 MCP 工具描述与校验） */
window.__listExpressions = function () {
  try {
    const names = [];
    for (const k in morphIndex) {
      /* ★ 配件不算"表情" —— 从 AI 的表情可选列表里剔除，
         否则 AI 会挑到 ON_靴 这类部件开关，看起来像"表情没反应"。 */
      if (isAccessory(k)) continue;
      names.push(k);
    }
    return JSON.stringify(names);
  } catch (e) { return '[]'; }
};

/* ============================================================
   相机自适应：让模型内容贴合视窗（消除过大的上下留白）
   ------------------------------------------------------------
   之前用「裁剪窗口」来去掉留白，但裁剪会改变窗口尺寸 →
   WebView 触发 resize → frameModel 重新取景 → 留白又回来，
   而且坐标映射会叠加错乱（点击头顶空白仍命中模型）。
   这里改为【一次性微调相机】，窗口尺寸保持不动。
   仅在模型加载后短时间内生效，不会与用户的「相机距离」滑块打架。
   ============================================================ */
/** 取景阶段：0=未做 1=Box3 初值已设 2=mask 校正完成 */
let _fitStage = 0;
let _fitDone = false;
/** 相机注视点。 */
const _fitLookAt = new THREE.Vector3();

/** 目标：内容占视窗高度比例。留余量避免头顶/脚下贴边被裁。 */
/**
 * 目标：内容占视窗的比例（"填充度"）。
 *
 * ★ 原来固定 0.82（为了留余量防裁切），但实测"显小"。
 *   实测日志 `v=0.83 h=0.47` —— 垂直只填 83%、横向只填 47%，
 *   所以整个模型看着很小。
 * ★ 现在默认 0.96：把【限制维度】填到 96%，几乎占满窗口，
 *   只留 4% 余量避免贴边被裁。可在面板里用「取景填充度」微调。
 * ★ 注意：窗口宽高比是固定的 1:1.35，而模型内容往往是 1:2.4 这种细长比例，
 *   所以【横向】必然留白 —— 那是窗口形状决定的，不是取景没做好。
 *   想彻底消除横向留白只能把窗口改窄（或改窗口宽高比）。
 */
let FIT_RATIO = 0.96;

/**
 * 用包围盒给出取景初值。
 * 注意：Box3.setFromObject 对 skinned mesh 用的是绑定姿势包围盒，
 * 与最终渲染会有偏差（实测只占 61%，目标是 78%），
 * 所以这里只是初值，随后由 correctCameraFromMask() 用实际渲染校正。
 */
function fitCameraToBox() {
  _szTrig('fitCameraToBox');
  if (_fitStage >= 1 || !model || !camera) return;
  try {
    const box = new THREE.Box3().setFromObject(model);
    if (box.isEmpty()) return;
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    if (size.y <= 0.001) return;

    const vFov = (camera.fov * Math.PI) / 180;
    const dist = size.y / (FIT_RATIO * 2 * Math.tan(vFov / 2));
    if (!isFinite(dist) || dist <= 0) return;

    _fitLookAt.copy(center);
    camera.position.set(center.x, center.y, center.z + dist);
    camera.lookAt(center.x, center.y, center.z);
    camera.near = Math.max(0.01, dist * 0.005);
    camera.far = dist * 40;
    camera.updateProjectionMatrix();

    _fitStage = 1;
    nlog('fitBox: size.y=' + size.y.toFixed(3) + ' dist=' + dist.toFixed(3));
  } catch (e) {
    nlog('fitBox failed: ' + e.message);
  }
}

/**
 * 用轮廓掩码（实际渲染结果）做一次校正。
 *
 * ★ 为什么必须校正：
 *   Box3 的包围盒来自绑定姿势，与实际渲染不一致；
 *   而掩码是真实的 GPU 渲染输出，才是 ground truth。
 * ★ 为什么只做一次：
 *   迭代会震荡（缩放与平移互相影响），单次确定性调整最稳。
 * ★ 为什么掩码的行范围可信：
 *   渲染到 64x64 target 时水平会形变（aspect 差异），
 *   但【垂直方向】始终对应相机 fov，行范围是准确的。
 */
let _fitPass = 0;
/** 取景诊断日志判重（避免每 700ms 刷屏）。 */
let _lastFitDiag = '';
const MAX_FIT_PASS = 5;

/**
 * 用轮廓掩码（真实渲染结果）校正取景。
 *
 * ★ 为什么不能只靠 Box3：
 *   Box3 统计的是几何体包围盒，MMD 模型含不可见骨骼/辅助点，
 *   size.y 明显大于实际可见内容（实测按 1.6 取景，可见内容只占 58%）。
 *   掩码是 GPU 真实输出，才是 ground truth。
 *
 * ★ 为什么分两阶段：
 *   同时调「距离」和「平移」会互相干扰导致震荡。
 *   先只用距离把占比调到目标，最后再单独做一次垂直居中。
 */
/**
 * 单轮「测占比 → 调相机距离」。
 *
 * ★ 为什么要拆出来：原来 `correctCameraFromMask` 依赖【每 700ms 一次的掩码定时器】
 *   来推进，每轮只调一次距离（最多 3 轮）。
 *   于是用户会看到模型**连续缩几次**（每次间隔 700ms），
 *   而且多个触发源（新模型 + 窗口 resize）叠加后会**过冲、最终偏小**。
 *   （实测"模型会突然拉长，然后比例正常，但很快又连着缩水两次"）
 *   → 现在把一轮封装成函数，由 correctCameraFromMask 在一帧内循环调用直到收敛。
 */
function _fitPassOnce() {
  let hex = null;
  try {
    hex = buildHitMask();          // 同步离屏渲染 + 读回像素
  } catch (e) { return { ok: false }; }
  if (!hex) return { ok: false };

  let c = null;
  try { c = measureMaskContent(); } catch (e) { return { ok: false }; }
  if (!c) return { ok: false };

  const rows = c.lastRow - c.firstRow + 1;
  const cols = c.lastCol - c.firstCol + 1;
  if (rows < 4) return { ok: false };

  /* ★ 取景必须同时满足【垂直】和【水平】。
     窗口是固定的 1:1.35，若模型较宽（长发散开/裙摆/配饰伸出），
     只看垂直会让横向溢出窗口被切掉（看起来像头发"插进背景"）。
     掩码虽然渲染到 64x64 方形 target，但投影用的是 camera.aspect
     （= 视口真实宽高比），所以 cols/N 就是"占视口宽度比例"、
     rows/N 是"占视口高度比例"，量纲一致，取 max 即可保证两边都不越界。 */
  const measuredV = rows / MASK_N;
  const measuredH = cols / MASK_N;
  const measured = Math.max(measuredV, measuredH);
  const target = FIT_RATIO;
  /* ★★ 收敛判定必须"只允许等于或略小于目标"，不能两边对称 ★★
     ---- 事故（实测"取景填充度似乎有点小问题"，拉到大了会贴边被裁）----
     原来写 |measured - target| <= 0.03，于是 measured 比目标【大 3%】也算收敛
     → 模型比目标大 3% → 边缘被裁。掩码又是 64×64（量化步长 1/64≈1.56%），
     踩到的概率很高，尤其填充度拉到 0.96~1.0 时。
     现在只接受 measured <= target + 0.004（即最多超 0.4%）。 */
  const conv = (measured <= target + 0.004) && (measured >= target - 0.04);

  if (!conv) {
    let factor = measured / target;
    factor = Math.max(0.75, Math.min(1.35, factor));   // 阻尼，防震荡
    const dist = camera.position.distanceTo(_fitLookAt);
    if (isFinite(dist) && dist >= 0.05) {
      const newDist = Math.max(0.2, dist * factor);
      camera.position.set(_fitLookAt.x, _fitLookAt.y, _fitLookAt.z + newDist);
      camera.lookAt(_fitLookAt.x, _fitLookAt.y, _fitLookAt.z);
      camera.near = Math.max(0.01, newDist * 0.005);
      camera.far = newDist * 40;
      camera.updateProjectionMatrix();
    }
  }
  return { ok: true, conv, measured, measuredV, measuredH, c, rows, cols };
}

function correctCameraFromMask() {
  _szTrig('correctCameraFromMask');
  if (_fitStage !== 1) return false;
  const vFov = (camera.fov * Math.PI) / 180;

  /* ---------- 一帧内同步收敛（最多 4 轮）----------
     ★ 每轮都重新做一次离屏渲染拿最新掩码，所以同一帧内就能迭代到位，
       用户看不到中间过程。收敛就提前退出，避免无谓开销。 */
  let last = null;
  for (let i = 0; i < 4; i++) {
    const r = _fitPassOnce();
    if (!r.ok) return false;      // ★ 掩码没就绪 —— 返回 false，让调用方保持相机不动
    last = r;
    if (r.conv) break;
  }
  if (!last || !last.ok) return false;

  const c = last.c;
  const measured = last.measured;
  const target = FIT_RATIO;
  if (_lastFitDiag !== (last.rows + 'x' + last.cols)) {
    _lastFitDiag = last.rows + 'x' + last.cols;
    nlog('camFit: v=' + last.measuredV.toFixed(2) + ' h=' + last.measuredH.toFixed(2)
      + ' -> 采用 ' + (measured === last.measuredV ? '垂直' : '水平')
      + '（' + measured.toFixed(2) + '），目标 ' + target);
  }

  /* ---------- 横向宽高比必须等于视口，否则几何一定变形 ----------
     camera.aspect 一旦 ≠ 视口宽高比，投影矩阵就会把几何横向拉伸
     （曾实测被设成 0.272 而真实视口是 0.741 → 模型被拉宽 2.7 倍）。
     要减少两侧留白应该改【窗口】宽高比，而不是改投影矩阵。 */
  try {
    const vpAspect = window.innerWidth / Math.max(1, window.innerHeight);
    if (isFinite(vpAspect) && vpAspect > 0.05
        && Math.abs(camera.aspect - vpAspect) > 0.01) {
      camera.aspect = vpAspect;
      camera.updateProjectionMatrix();
    }
  } catch (e) {}

  /* ---------- 阶段 B：垂直居中 ---------- */
  const dist = camera.position.distanceTo(_fitLookAt);
  if (!isFinite(dist) || dist < 0.05) return true;   // 相机异常，但不再重试
  const visH = 2 * dist * Math.tan(vFov / 2);
  const topNdc = 1 - (c.firstRow / MASK_N) * 2;
  const botNdc = 1 - ((c.lastRow + 1) / MASK_N) * 2;
  const midNdc = (topNdc + botNdc) / 2;

  if (Math.abs(midNdc) > 0.03) {
    const shiftY = midNdc * visH / 2;
    _fitLookAt.y += shiftY;
    camera.position.set(_fitLookAt.x, _fitLookAt.y, _fitLookAt.z + dist);
    camera.lookAt(_fitLookAt.x, _fitLookAt.y, _fitLookAt.z);
    camera.updateProjectionMatrix();
  }

  nlog('camFit done: ' + (measured * 100).toFixed(0) + '% (target '
    + (target * 100).toFixed(0) + '%) mid=' + midNdc.toFixed(3));
  _fitStage = 2;
  _fitDone = true;

  /* ★★ 用户明确调过相机距离 → 取景算完后应用它，让"用户设定"始终赢 ★★
     否则一旦缩放/窗口变化触发重取景，用户调好的构图就丢了
     （表现为"设置里刚刚好，保存后被裁掉一块"）。 */
  if (_distCustom && _userDist != null && !_suppressCamDist) {
    const got = applyCamDist(_userDist);
    if (Math.abs(got - _userDist) > 0.02) {
      nlog('用户相机距离 ' + _userDist.toFixed(2) + ' 被安全下限夹到 ' + got.toFixed(2));
    }
  }

  /* ★ 上报"模型的真实宽高比"，供原生把窗口形状调成和模型一致
     —— 这样横向留白才会消失（否则窗口固定 1:1.35，模型 1:1.86，必然左右留白）。

     ★★★ 必须优先用【包围盒】而不是轮廓掩码（2026-10-07）★★★
     ---- 事故复盘（曾出现"模型有时会缩水"）----
     掩码是 **64×64** 的，而视口 175×236：
        横向每格 = 175/64 ≈ 2.7px、纵向每格 = 236/64 ≈ 3.7px
     → **横向的量化误差更大**，边界格子更容易被判成空 → colsN 系统性偏小。
     实测掩码算出 0.498，而模型真实比例是 0.86/1.6 = 0.5375。
     窗口被按 0.498 定宽 → **比模型还窄** → 横向反而成了取景约束
     → 取景只能把相机往后拉 → 用户看到的就是【缩水】。

     ★ 夹取策略：不能比掩码小（那等于允许切掉模型），也不能比掩码大太多
       （否则武器/光环这类旁支会把窗口撑得很宽、留白反而变大）。 */
  try {
    const colsN = c.lastCol - c.firstCol + 1;
    const rowsN = c.lastRow - c.firstRow + 1;
    const vpAspect = window.innerWidth / Math.max(1, window.innerHeight);
    const maskAspect = (colsN >= 4 && rowsN >= 4) ? (colsN / rowsN) * vpAspect : 0;
    let realAspect = maskAspect;
    try {
      if (model) {
        const sz = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
        if (sz.y > 0.01) {
          const boxAspect = sz.x / sz.y;
          if (isFinite(boxAspect) && boxAspect > 0.05) {
            /* 下限 = 掩码比例（别切模型）；上限 = 掩码 ×1.3（别被旁支撑爆） */
            realAspect = (maskAspect > 0.05)
              ? Math.max(maskAspect, Math.min(boxAspect, maskAspect * 1.3))
              : boxAspect;
            nlog('宽高比: 掩码=' + maskAspect.toFixed(4) + ' 包围盒=' + boxAspect.toFixed(4)
              + ' -> 采用 ' + realAspect.toFixed(4));
          }
        }
      }
    } catch (e) {}
    if (isFinite(realAspect) && realAspect > 0.05) {
      if (window.MmdBridge && MmdBridge.setContentAspect) {
        MmdBridge.setContentAspect(realAspect);
      }
    }
  } catch (e) {}

  return true;   // ★ 告诉调用方：取景真的完成了（相机已按掩码算准）
}


/* 抗锯齿开关（分辨率超采样）。由原生调用，也持久化到设置里 */
/* 设置抗锯齿档位：0=关，2=两倍，4=四倍 */
window.__setAntiAliasLevel = function (level) {
  var lv = parseInt(level, 10);
  if (lv !== 2 && lv !== 4) lv = 0;
  AA_LEVEL = lv;
  try { applyPixelRatio(); } catch (e) {}
  nlog('antialias level -> ' + AA_LEVEL);
  return AA_LEVEL;
};
window.__getAntiAliasLevel = function () { return AA_LEVEL; };
/* 兼容旧接口 */
window.__setAntiAlias = function (on) { return window.__setAntiAliasLevel(on ? 2 : 0); };
window.__getAntiAlias = function () { return AA_LEVEL > 0; };

/* ============================================================
   性能设置（供原生下发）
   · scale : 渲染倍率 0.35~1.0（1.0 = 按设备像素比原生渲染）
   · auto  : 动态分辨率（FPS 低就自动降、恢复后慢慢升回来）
   · fpsCap: 帧率上限（0=不限 / 30 / 20）
   ============================================================ */
window.__setPerf = function (scale, auto, fpsCap) {
  _szTrig('setPerf(' + scale + ',' + auto + ',' + fpsCap + ')');
  try {
    const s = parseFloat(scale);
    if (isFinite(s) && s > 0) RENDER_SCALE_SET = Math.max(0.35, Math.min(1.0, s));
    PERF_AUTO = !!auto;
    const f = parseInt(fpsCap, 10);
    /* ★ 原来的白名单是 `(f === 30 || f === 20) ? f : 0`
       —— 改成滑块（20~90）之后那样会把绝大多数值静默变成"不限帧"。
       现在接受任意 1..240 的整数；0 / NaN / 负数 = 不限。 */
    FPS_CAP = (isFinite(f) && f > 0) ? Math.min(240, Math.max(1, f)) : 0;
    RENDER_SCALE = RENDER_SCALE_SET;      // 重置到用户设定值
    _perfWinStart = 0; _perfWinFrames = 0; _perfLowStreak = 0;
    applyPixelRatio();
    nlog('perf: scale=' + RENDER_SCALE_SET.toFixed(2) + ' auto=' + PERF_AUTO
      + ' fpsCap=' + FPS_CAP + ' -> pr=' + effectivePixelRatio().toFixed(2)
      + ' buffer=' + renderer.domElement.width + 'x' + renderer.domElement.height);
    return 'ok';
  } catch (e) { return 'err:' + e.message; }
};

/* ============================================================
   物理开关（重模型的 CPU 大头）
   ------------------------------------------------------------
   实测 Kei_Uniform 这类模型有 270 个刚体 + 372 个关节，
   每帧要在 ammo(wasm) 里解算 642 个约束 —— 全是 CPU 开销，
   而且是"看不见的开销"（体积雾/褶皱等细节）。
   关掉后头发/裙子不再摆动，但帧率通常能明显改善。
   ★ 关掉只是把 physics 置 null，骨骼保持当前姿态，
     待机呼吸/眨眼仍然工作（那部分是骨骼级别的）。
   ============================================================ */
/**
 * 快照"被刚体绑定的骨骼"的当前姿态。
 * ★ 只在【从未快照过】时记 —— 必须是"物理接管之前"的姿态，
 *   不能每次开关都重记（否则会把物理产生的乱姿态也记进去）。
 */
function snapshotPhysBones() {
  if (_physBoneSnapshot) return;
  try {
    if (!model || !model.skeleton) return;
    const names = physBoneNames && physBoneNames.size ? physBoneNames : null;
    if (!names) return;
    const bones = model.skeleton.bones;
    const buf = {};
    let cnt = 0;
    for (const b of bones) {
      if (!names.has(b.name)) continue;
      buf[b.name] = {
        p: b.position.toArray(),
        q: b.quaternion.toArray(),
      };
      cnt++;
    }
    if (cnt > 0) {
      _physBoneSnapshot = buf;
      nlog('物理骨骼快照: ' + cnt + ' 根（关掉物理时用来复位）');
    }
  } catch (e) {
    nerr('snapshotPhysBones failed: ' + (e && e.message));
  }
}

/** 把物理骨骼恢复到快照姿态（关掉物理时调用，避免"头发炸开"）。 */
function restorePhysBones() {
  try {
    if (!_physBoneSnapshot || !model || !model.skeleton) return;
    const bones = model.skeleton.bones;
    let cnt = 0;
    for (const b of bones) {
      const v = _physBoneSnapshot[b.name];
      if (!v) continue;
      b.position.fromArray(v.p);
      b.quaternion.fromArray(v.q);
      cnt++;
    }
    if (cnt) nlog('物理关掉：已复位 ' + cnt + ' 根物理骨骼（避免停在乱姿态）');
  } catch (e) {}
}

window.__setPhysics = async function (on) {
  const want = !!on;
  PHYSICS = want;
  try {
    if (!want) {
      if (physics) {
        physics = null;
        /* ★ 关掉后物理骨骼没有驱动源，会停在最后的物理姿态
             （看起来像"头发炸开/穿模"，用户会以为开关坏了）→ 复位到接管前的姿态。 */
        restorePhysBones();
        /* 复位后立刻更新矩阵，避免这一帧还按旧矩阵渲染 */
        try { model.updateMatrixWorld(true); } catch (e) {}
      } else {
        physics = null;
      }
      nlog('physics -> off（跳过刚体解算）');
      vmdOptimizeIK();          // 物理关了，IK 链接全都可以启用
      return 'off';
    }
    if (!model) return 'no-model';
    /* ★★ glTF：明确拒绝，而不是"试了发现没刚体" ★★
       实测这个 GLB 每个动作都带 23 根 hair + 24 根 skirt 的轨道 ——
       头发/裙子是【烘焙动画】驱动的。给它套 MMDPhysics 只会
       用刚体解算覆盖掉动画姿态（表现就是"头发衣服不正常"）。
       用户之前正是因为"以为要给 GLB 开物理"才觉得开关怪。 */
    if (isGltfModel) {
      nlog('physics: glTF 模型的头发/衣服由自带动画驱动，不需要 MMDPhysics（已忽略）');
      physics = null;
      return 'gltf-not-needed';
    }
    const pd = mmdPhysicsDataOf(model);
    if (!pd.rigidBodies.length) {
      nlog('physics: 该模型无刚体，跳过');
      return 'no-rigid-bodies';
    }
    if (physics) return 'already-on';
    /* ★ 建物理【之前】先快照物理骨骼 —— 此刻的姿态才是"干净"的
         （晚一步就已被物理改过，快照就失去意义）。 */
    snapshotPhysBones();
    await loadAmmo();
    const pf2 = filterPhysicsByPart(model, pd.rigidBodies, pd.constraints);
    applyNoCollide(pf2.rigidBodies);
    physics = createPhysicsUnscaled(model, pf2.rigidBodies, pf2.constraints);
    nlog('物理刚体筛选: 保留 ' + pf2.kept + ' / 排除 ' + pf2.dropped
      + ' → 实际装入 ' + (physics.bodies ? physics.bodies.length : '?') + ' 个刚体');
        _physAccum = 0;   // 新建物理 → 累积器归零（别把旧时间补算进去）
    calibratePhysicsGravity(physics, model);
    nlog('physics: 接入 ' + pd.rigidBodies.length + ' 个刚体 / '
      + pd.constraints.length + ' 个约束（模型自带，不会穿模）');
    /* ★★ 必须 warmup ★★
       MMDPhysics 的约束求解是迭代的，不预热就渲染会出现前几十帧的
       "头发乱抽/抖动"（反复开关物理时尤其明显）。
       MMDAnimationHelper 内部也是 physics.warmup(60)。 */
    try {
      try { physics.reset(); nlog('physics reset 完成'); } catch (e) {}
      warmupPhysicsUnscaled(model, physics, 60);
      nlog('physics warmup 完成（scale=1 内）');
    } catch (e) {
      nlog('physics warmup 跳过: ' + (e && e.message));
    }
    /* ★ 这里原来写的是 g.rigidBody —— 而 `g` 已经不存在了（上面改成用 pd），
       于是抛 `g is not defined` → 被 catch 抓住 → **physics = null**，
       刚建好的物理立刻被销毁。
       日志实锤：`physics on (270 bodies / 372 constraints)` 紧跟着
                 `E [js] setPhysics failed: g is not defined`
                 → 用户看到"启动时头发被拉长一下（warmup）然后就不动了"。
       ★ 教训：改局部变量名/重构时，函数里**所有**引用都要跟着改；
         而这种错误会被 try/catch 吞掉，只在日志里留一行 —— 必须主动去 grep。 */
    nlog('physics -> on (' + pd.rigidBodies.length + ' bodies, '
      + pd.constraints.length + ' constraints)');
    /* ★ 物理开了：被刚体绑定的骨骼不能再让 IK 写（两者会互相抢）。
       这一步 MMDAnimationHelper 的 enable('physics') 也会做，但我们不走它那条路。 */
    vmdOptimizeIK();
    return 'on';
  } catch (e) {
    /* ★ 失败时**不要**把已建好的物理丢掉 —— 那会让"一个小笔误"变成
       "物理完全不工作"（本次就是这么坏的）。只在真的是创建阶段失败时置空。 */
    nerr('setPhysics failed: ' + (e && e.message) + '（已创建的物理保留）');
    return 'err:' + e.message;
  }
};

/* 初始化模型下拉 */
function refreshModelList(keepValue) {
  const sel = $('selModel');
  if (!sel) return;

  /* ★ 重建列表前先记住当前选中值，重建后恢复。
     踩过的坑：这里直接 sel.innerHTML = '...' 会把选中项重置为第一项（默认模型），
     而 bindPanel() 的幂等分支每次切模型后都会调本函数，
     于是"实际加载的是导入模型、下拉却显示默认模型"。
     现在：优先用传入的 keepValue，其次用重建前的旧值。 */
  /* 取值优先级：
       keepValue（显式传入） > currentModelUrl（实际加载的模型，最权威） > sel.value（界面旧值） */
  const prev = (keepValue !== undefined && keepValue !== null)
    ? keepValue
    : (currentModelUrl || sel.value);

  sel.innerHTML = '';
  /* ★ 只有 MODEL_URL 非空时才放"内置模型"选项（本仓库为空 → 跳过）。
     空列表时给一个禁用占位项，否则 select 会显示成一块空白。 */
  if (MODEL_URL) {
    const d = document.createElement('option');
    d.value = MODEL_URL;
    d.textContent = '内置模型 (' + MODEL_URL.split('/').pop() + ')';
    sel.appendChild(d);
  }

  try {
    const raw = String(window.MmdBridge.listModels());
    /* Java 侧 listModels() 返回 "<webUrl>\t<显示名>"，外层是 ArrayList.toString() 的 "[...]" */
    const body = raw.replace(/^\s*\[|\]\s*$/g, '');
    const items = body.length ? body.split(',').map(t => t.trim()).filter(Boolean) : [];
    for (const item of items) {
      const tab = item.indexOf('\t');
      const url  = tab >= 0 ? item.slice(0, tab).trim() : '';
      const name = tab >= 0 ? item.slice(tab + 1).trim() : item;
      const opt = document.createElement('option');
      opt.value = url || ('dir:' + name);
      opt.textContent = '📦 ' + name;
      sel.appendChild(opt);
    }
    nlog('model list: ' + items.length + ' item(s), keep=' + (prev || 'none'));
  } catch (e) { /* 桥还没就绪，忽略 */ }

  // 恢复选中项；若它不在列表里就补一个（比如中途导入的模型）
  if (prev) {
    let hit = Array.from(sel.options).some(o => o.value === prev);
    if (!hit && prev.indexOf('dir:') !== 0) {
      const o = document.createElement('option');
      o.value = prev;
      o.textContent = '📦 ' + prev.split('/').pop();
      sel.appendChild(o);
      hit = true;
    }
    if (hit) sel.value = prev;
  }
}


/**
 * 分析每个 morph target 的实际位移量。
 * 这是判定"顶点型 / 骨骼型"表情的依据（见 §7）。
 * 输出形如: MORPH-ANALYSIS 笑い:max=0.000,verts=0/21571(0.0%) || 100.001:max=0.5...
 */
function analyzeMorphs() {
  if (!morphMeshes.length) return;
  const geo = morphMeshes[0].geometry;
  const attrs = geo.morphAttributes && geo.morphAttributes.position;
  const base = geo.attributes && geo.attributes.position;
  if (!attrs || !base) { nlog('morph analyze: no morphAttributes'); return; }

  const out = [];
  const N = Math.min(4000, base.count);
  for (let i = 0; i < attrs.length; i++) {
    const a = attrs[i];
    let max = 0, moved = 0;
    for (let v = 0; v < N; v++) {
      const dx = a.getX(v) - base.getX(v);
      const dy = a.getY(v) - base.getY(v);
      const dz = a.getZ(v) - base.getZ(v);
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d > 1e-6) moved++;
      if (d > max) max = d;
    }
    out.push(morphNames[i] + ':max=' + max.toFixed(3)
             + ',verts=' + moved + '/' + N
             + (max > 1e-6 ? '(顶点型)' : '(骨骼型)'));
  }
  nlog('MORPH-ANALYSIS ' + out.join(' || '));
}


/* ==================================================================
   设置持久化（localStorage）
   ------------------------------------------------------------------
   WebView 侧已开启 setDomStorageEnabled(true)，所以 localStorage 可用。
   保存内容：所有滑块值 + 眼动模式/幅度/方向 + 表情 + 模型 URL。
   注意：只存"用户可调的参数"，不存运行时对象。
   ================================================================== */
const LS_KEY = 'mmdtest.settings.v1';
/**
 * ★★★ 每个 MMD 模型各自一份配置（2026-10-08 设计上要求）★★★
 *   结构：{ "<模型 webUrl>": { ...collectSettings() 的结果... } }
 *
 * ---- 为什么（用户的两个反馈）----
 *  ① "用完 glb 模型后，切换 mmd 模型必须要打开一次高级设置才能加载 mmd 的配置"
 *     根因：MMD 与 glTF **共用一份全局配置**。在 glb 上调过的光照/饱和度/
 *           描边/三渲二/相机… 会存进同一个 key，切回 mmd 时读到的是被污染的那份。
 *  ② "能不能给所有的 mmd 模型的配置全部都分离保存（Glb 模型还是跟原来一样）？"
 *
 * ---- 规则 ----
 *   · MMD 模型（.pmx/.pmd）→ 读/写【自己那份】；同时仍写一份全局（兼容旧存档 /
 *     给"其它"用途），但**读取时以自己那份为准**
 *   · glTF 模型（.glb/.gltf）→ **完全按原样**，只用全局那份
 *   · 某 MMD 模型第一次用（没有自己那份）→ 回落到全局（避免"配置突然全变默认"）
 */
const LS_KEY_PER = 'mmdtest.settings.perModel';

/** 是不是 MMD 模型（按扩展名判断，带 query/hash 也能认）。 */
function isMmdModelUrl(url) {
  if (!url) return false;
  const u = String(url).split('?')[0].split('#')[0].toLowerCase();
  return u.endsWith('.pmx') || u.endsWith('.pmd');
}

/** 读全部 per-model 存档。 */
function loadPerModelStore() {
  try {
    const raw = localStorage.getItem(LS_KEY_PER);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

/** 写全部 per-model 存档（失败不抛，配置存不下不该让页面崩）。 */
function savePerModelStore(all) {
  try { localStorage.setItem(LS_KEY_PER, JSON.stringify(all)); return true; }
  catch (e) { nerr('perModel 存档失败: ' + (e && e.message)); return false; }
}

/** 收集当前所有设置 */
function collectSettings() {
  const v = id => { const el = $(id); return el ? el.value : undefined; };
  const c = id => { const el = $(id); return el ? el.checked : undefined; };
  return {
    key: v('sKey'), rim: v('sRim'), amb: v('sAmb'), exp: v('sExp'),
    sat: v('sSat'), hue: v('sHue'), spec: v('sSpec'), toon: v('sToon'),
    /* ★ 相机/缩放【按模型】存整表（见 _perModelView 的说明）。
       仍然保留扁平的 scale/dist 字段做兼容（旧存档读得到）。 */
    perModelView: (function () { saveViewForModel(); return _perModelView; })(),
    scale: v('sScale'), dist: v('sDist'), spin: v('sSpin'),
    /* ★ 是否"用户主动调过"相机距离 —— 恢复时据此决定要不要在自动取景后重新应用。
       只存 dist 数值不够：滑块默认值 3.7 也会被存进去，无法区分。 */
    distCustom: _distCustom,
    gaze: v('selGaze'), gazeAmp: v('sGaze'),
    invertX: c('cInvX'), invertY: c('cInvY'),
    /* ★ morph 写空值：表情不持久化（瞬时表演，见 applySettings 里的说明）。
       这里显式写空串还有个附带作用：把历史存档里遗留的表情名覆盖掉，
       否则老存档里的 なごみ/Close 会在每次启动时被重新应用（导致闭眼）。 */
    morph: '', morphW: v('sMorph'), morphLoop: c('cMorphLoop'),
    /* ★ 锁定缩放与相机距离 —— 纳入统一保存路径。
       之前用的是"读旧存档 + 只改 lockView"的特殊写法，会和自动保存互相覆盖。 */
    lockView: c('cLockView'),
    /* ★ 取景填充度（之前漏了，所以调完不保存） */
    fitRatio: FIT_RATIO,
    /* ★ 描边设置（开关 + 0~100 宽度） */
    toon2d: TOON2D_ON,
    toon2dlv: TOON2D_LV,
    wind: Math.round(WIND_STRENGTH),
    outline: OUTLINE_ON, outlineW: OUTLINE_W,
    outlineA: Math.round(OUTLINE_ALPHA * 100),
    outlineD2: OUTLINE_DEPTH,
    outlineC: OUTLINE_COLOR ? toHexColor(OUTLINE_COLOR) : 'auto',
    model: currentModelUrl,
    savedAt: Date.now()
  };
}

/**
 * ★★ 是否允许保存。两个时机必须禁止，否则会把配置写坏：
 *   ① 页面刚加载、applySettings 还没跑完 —— 此时 DOM 全是默认值
 *   ② applySettings 恢复过程中 —— 它靠 dispatch 事件设置控件，
 *      而事件会触发保存；此时【还没恢复到的字段】读到的仍是默认值
 * ---- 事故复盘（实测"更新配置后打开 web UI 就全丢了，曝光之类"）----
 *   原来 change 事件会立即保存，于是恢复过程中每设一个控件就存一次，
 *   把还没恢复到的字段用默认值覆盖掉 → 配置被逐字段重置。
 *   桌宠同时刷新时两边抢写同一个 localStorage，问题更明显。
 */
let _canSave = false;
let _restoring = false;

function saveSettings(silent) {
  try {
    /* ★★ 两个时机禁止保存（详见 _canSave 的说明）：
       ① 页面刚加载、applySettings 还没跑完 → DOM 全是默认值
       ② applySettings 恢复过程中 → 还没恢复到的字段是默认值
       否则会把好配置用默认值覆盖掉（实测的"配置全丢"就是这个）。 */
    if (!_canSave || _restoring) {
      if (!silent) nlog('saveSettings 已跳过（' + (_restoring ? '恢复设置中' : '尚未就绪') + '）');
      return false;
    }
    const st = collectSettings();
    /* 全局那份始终写（glTF 用它，也当旧存档兼容） */
    localStorage.setItem(LS_KEY, JSON.stringify(st));
    /* ★ MMD 模型：另外写【自己那份】
       ★★ 但不要"凭空生成"：若本次启动是从全局回落的、且用户还没改过任何设置，
         就不要把回落的（可能属于别的模型的）配置写成本模型专属 ——
         否则下次切回这个模型会继承一堆不属于它的设置
         （用户实测："我自转都没开过，怎么开始转起来了"）。 */
    if (_userTouchedSettings) _loadedFromOwnStore = true;
    if (isMmdModelUrl(currentModelUrl) && _loadedFromOwnStore) {
      const all = loadPerModelStore();
      all[currentModelUrl] = st;
      savePerModelStore(all);
    }
    if (!silent) nlog('settings saved' + (isMmdModelUrl(currentModelUrl) ? '（含本模型专属）' : ''));
    return true;
  } catch (e) { nerr('save failed: ' + e.message); return false; }
}

/** 应用一组设置到 UI（会触发各滑块自己的 input 事件） */
function applySettings(st) {
  if (!st) return;
  /* ★★ 整个恢复过程都要禁止保存 ——
     它靠 dispatch 事件给控件赋值，而事件会触发保存；
     此时【还没恢复到的字段】读到的仍是默认值，一存就把配置写坏。
     用 try/finally 保证任何异常都会解除保护。 */
  _restoring = true;
  try {
    _applySettingsInner(st);
  } finally {
    /* 延后一点再解除：applySettings 里有 setTimeout(400ms) 的延迟恢复，
       那段也在 dispatch 事件，必须一并覆盖。 */
    setTimeout(function () {
      _restoring = false;
      _canSave = true;
      nlog('applySettings 完成，已开放保存');
    }, 900);
  }
}

function _applySettingsInner(st) {
  const setV = (id, val) => {
    const el = $(id);
    if (el && val !== undefined && val !== null && val !== '') {
      el.value = val;
      /* ★ 恢复设置期间【不要让滑块事件去驱动相机】。
         "相机距离"滑块的回调里有 applyCamDist()，会把相机重置成滑块值，
         从而覆盖掉自动取景算出的距离（表现为"模型加载好后突然缩水"）。
         恢复设置只是把 UI 值填回去，不该动相机。 */
      _suppressCamDist = true;
      try {
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
      } finally {
        _suppressCamDist = false;
      }
    }
  };
  const setC = (id, val) => {
    const el = $(id);
    if (el && val !== undefined) {
      el.checked = !!val;
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }
  };
  // 顺序：先光/材质，再模型相关
  setV('sKey', st.key); setV('sRim', st.rim); setV('sAmb', st.amb);
  setV('sExp', st.exp); setV('sSat', st.sat); setV('sHue', st.hue);
  setV('sSpec', st.spec); setV('sToon', st.toon);
  /* ★ 先还原"用户是否调过距离"，再填值（顺序不能反） */
  /* ★ 恢复"按模型的相机表"；没有就把旧存档的扁平字段迁移进当前模型 */
  if (st.perModelView && typeof st.perModelView === 'object') {
    _perModelView = st.perModelView;
  }
  const _k0 = st.model || currentModelUrl || '';
  if (_k0 && !_perModelView[_k0]) {
    _perModelView[_k0] = {
      scale: (st.scale !== undefined && st.scale !== '') ? parseFloat(st.scale) : 1,
      dist: (st.dist !== undefined && st.dist !== '') ? parseFloat(st.dist) : null,
      distCustom: !!st.distCustom,
    };
    nlog('已把旧存档的相机设置迁移到该模型: ' + _k0);
  }
  loadViewForModel(_k0);
  setV('sSpin', st.spin);
  if (st.wind !== undefined) setV('sWind', st.wind);
  setV('sGaze', st.gazeAmp);
  setC('cInvX', st.invertX); setC('cInvY', st.invertY);
  setV('sMorph', st.morphW); setC('cMorphLoop', st.morphLoop);
  // ★ 恢复"上次用的模型"：之前只存了 model 字段却从没用过，
  //   导致重启后永远回到默认模型。
  /*
   * ★ 恢复模型前先比对 currentModelUrl：
   *   如果当前已加载的就是存档里的模型，不要重复 __loadModel ——
   *   重复加载会打断刚完成的切换（而且 boot 的 700ms 延迟恢复
   *   会用旧存档覆盖用户刚切的新模型，表现为"重载了但没切换"）。
   */
  const modelAlreadyLoaded = (st.model && currentModelUrl
      && st.model === currentModelUrl);
  if (modelAlreadyLoaded) {
    nlog('applySettings: model already loaded, skip: ' + st.model);
  } else if (st.model && st.model !== MODEL_URL && st.model.indexOf('dir:') !== 0) {
    const sel = $('selModel');
    if (sel && !Array.from(sel.options).some(o => o.value === st.model)) {
      const o = document.createElement('option');
      o.value = st.model;
      o.textContent = '📦 ' + st.model.split('/').pop();
      sel.appendChild(o);
    }
    if (sel) sel.value = st.model;
    __loadModel(st.model);
  }

  // 表情和眼动模式要在列表重建之后才能设
  setTimeout(() => {
    if (st.gaze) setV('selGaze', st.gaze);
    /* ★ 恢复"锁定缩放与相机距离" */
    if (st.lockView !== undefined) {
      try { window.__setViewLock(!!st.lockView); } catch (e) {}
    }
    /* ★ 只改了缩放、没有自定义相机距离 → 按【新的缩放】重新取景。
       否则自动取景是按默认缩放算的，模型被放大后就会溢出窗口被裁。

       ★★ 但 `_userScale === 1`（用户没调过缩放）时【必须跳过】★★
       ---- 事故复盘（2026-10-07 曾出现"模型刚加载完会变小一次"）----
       此时压根没有"新的缩放"要生效，重新取景纯属多余；
       而它偏偏排在"窗口形状适配"之后 → 又用窄视口重算一遍相机距离，
       实测 camZ 2.639→3.456 → 用户看到的就是那一次【变小】。
       （日志触发链：onResize(117x236) → resetFit(restore-scale) → camZ 变大） */
    if (!_distCustom && _userScale !== 1) {
      setTimeout(function () {
        try { resetFit('restore-scale'); } catch (e) {}
      }, 350);
